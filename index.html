function DebtCollectionDashboard({ allClients, debtSnapshots, isA, sb, onDebtReload, collectorName }) {
  const [refreshing, setRefreshing] = useState(false);
  const [actions, setActions] = useState([]);
  const [actionModal, setActionModal] = useState(null);
  const [emailModal, setEmailModal] = useState(null);
  const [printData, setPrintData] = useState(null);
  
  // 🆕 בורר תאריך לדוח גלובלי
  const [globalReportDate, setGlobalReportDate] = useState('');
  const [showGlobalReport, setShowGlobalReport] = useState(false);

  if (!isA) return null;

  useEffect(() => {
    if (!sb) return;
    sb('debt_actions?order=created_at.desc&limit=500')
      .then(data => setActions(data || []))
      .catch(() => setActions([]));
  }, [sb]);

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayMs = today.getTime();

  // מפת לקוחות
  const clientsMap = useMemo(() => {
    const map = new Map();
    for (const c of (allClients || [])) {
      if (c.bina_customer_id) map.set(String(c.bina_customer_id), c);
    }
    return map;
  }, [allClients]);

  // בניית רשימת לקוחות עם חשבוניות + תאריכי פירעון מחושבים
  const clientsWithInvoices = useMemo(() => {
    const map = new Map();
    for (const d of (debtSnapshots || [])) {
      if (!d.bina_customer_id || !d.doc_balance || d.doc_balance <= 0) continue;
      const key = String(d.bina_customer_id);
      const client = clientsMap.get(key);
      
      if (!map.has(key)) {
        map.set(key, {
          bina_customer_id: key,
          name: client?.name || d.customer_name || `לקוח #${key}`,
          client_name: client?.name || d.customer_name || `לקוח #${key}`,
          payment_terms: client?.payment_terms || '',
          contact_name: client?.contact_name || '',
          phone: client?.phone || '',
          email: client?.email || '',
          collection_email_primary: client?.collection_email_primary || '',
          collection_email_secondary: client?.collection_email_secondary || '',
          client_id: client?.id || null,
          total_debt: 0,
          invoices: [],
        });
      }
      const c = map.get(key);
      const calculatedDueDate = c.payment_terms 
        ? calculateDueDate(d.doc_date, c.payment_terms)
        : (d.doc_payment_date ? new Date(d.doc_payment_date) : null);
      
      c.invoices.push({ ...d, calculated_due_date: calculatedDueDate });
      c.total_debt += Number(d.doc_balance);
    }
    
    for (const c of map.values()) {
      c.invoices.sort((a, b) => {
        const da = a.calculated_due_date ? a.calculated_due_date.getTime() : 0;
        const db = b.calculated_due_date ? b.calculated_due_date.getTime() : 0;
        return da - db;
      });
    }

    for (const c of map.values()) {
      c.actions = (actions || []).filter((a) =>
        String(a.bina_customer_id) === c.bina_customer_id
      ).sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
    }

    return Array.from(map.values());
  }, [debtSnapshots, clientsMap, actions]);

  const brokenPromises = useMemo(() => {
    const list = [];
    for (const client of clientsWithInvoices) {
      const promises = (client.actions || []).filter((a) =>
        a.action_type === 'promised_to_pay' &&
        a.promised_date &&
        !isPromiseFulfilled(a, client.actions)
      );

      for (const promise of promises) {
        const promiseDate = new Date(promise.promised_date);
        promiseDate.setHours(0, 0, 0, 0);
        if (promiseDate.getTime() < todayMs) {
          const daysLate = Math.floor((todayMs - promiseDate.getTime()) / 86400000);
          list.push({ client, promise, daysLate, promiseDate });
        }
      }
    }
    return list.sort((a, b) => b.daysLate - a.daysLate);
  }, [clientsWithInvoices, todayMs]);

  // קטגוריזציה
  const categorizeInvoice = (inv) => {
    if (!inv.calculated_due_date) return { type: 'future', daysAway: 999 };
    const dueDate = new Date(inv.calculated_due_date);
    dueDate.setHours(0, 0, 0, 0);
    const dueMs = dueDate.getTime();
    const daysFromToday = Math.floor((dueMs - todayMs) / 86400000);
    if (daysFromToday < 0) return { type: 'overdue', month: dueDate, daysOverdue: -daysFromToday };
    if (daysFromToday <= 7) return { type: 'thisWeek', daysAway: daysFromToday };
    if (daysFromToday <= 30) return { type: 'thisMonth', daysAway: daysFromToday };
    if (daysFromToday <= 90) return { type: 'soon', daysAway: daysFromToday };
    return { type: 'future', daysAway: daysFromToday };
  };

  // 🆕 קיבוץ עבר לפי חודש - **מאוחד לפי לקוח**
  const overdueByMonth = useMemo(() => {
    const monthMap = new Map();
    
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type !== 'overdue') continue;
        
        const monthKey = `${cat.month.getFullYear()}-${String(cat.month.getMonth() + 1).padStart(2, '0')}`;
        if (!monthMap.has(monthKey)) {
          monthMap.set(monthKey, {
            key: monthKey,
            label: cat.month.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' }),
            year: cat.month.getFullYear(),
            month: cat.month.getMonth(),
            clientsMap: new Map(), // לקוח -> { ...client, invoices: [], total }
            total: 0,
            invoicesCount: 0,
            sortKey: cat.month.getTime(),
          });
        }
        const m = monthMap.get(monthKey);
        
        // איחוד תחת לקוח
        if (!m.clientsMap.has(client.bina_customer_id)) {
          m.clientsMap.set(client.bina_customer_id, {
            ...client,
            invoices: [],
            total: 0,
            maxDaysOverdue: 0,
          });
        }
        const c = m.clientsMap.get(client.bina_customer_id);
        c.invoices.push({ ...inv, daysOverdue: cat.daysOverdue });
        c.total += Number(inv.doc_balance);
        c.maxDaysOverdue = Math.max(c.maxDaysOverdue, cat.daysOverdue);
        
        m.total += Number(inv.doc_balance);
        m.invoicesCount += 1;
      }
    }
    
    // המרה למערך עם clients ממוין לפי גודל
    return Array.from(monthMap.values())
      .map(m => ({
        ...m,
        clients: Array.from(m.clientsMap.values()).sort((a, b) => b.total - a.total),
      }))
      .sort((a, b) => a.sortKey - b.sortKey);
  }, [clientsWithInvoices]);

  // 🆕 קיבוץ "השבוע" / "החודש" / "בקרוב" - גם לפי לקוח
  const groupInvoicesByClient = (invoicesWithCat) => {
    const clientMap = new Map();
    for (const item of invoicesWithCat) {
      const key = item.client.bina_customer_id;
      if (!clientMap.has(key)) {
        clientMap.set(key, {
          ...item.client,
          invoices: [],
          total: 0,
          minDaysAway: 999,
        });
      }
      const c = clientMap.get(key);
      c.invoices.push({ ...item.inv, daysAway: item.daysAway });
      c.total += Number(item.inv.doc_balance);
      c.minDaysAway = Math.min(c.minDaysAway, item.daysAway);
    }
    return Array.from(clientMap.values()).sort((a, b) => b.total - a.total);
  };

  const thisWeekClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'thisWeek') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  const thisMonthClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'thisMonth') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  const soonClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'soon') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  // 🆕 דוח גלובלי "עד תאריך X"
  const globalReport = useMemo(() => {
    if (!globalReportDate) return null;
    const targetDate = new Date(globalReportDate);
    targetDate.setHours(23, 59, 59, 999);
    const targetMs = targetDate.getTime();
    
    const clientMap = new Map();
    let grandTotal = 0;
    let totalInvoices = 0;
    
    for (const client of clientsWithInvoices) {
      const relevantInvoices = client.invoices.filter(inv => {
        if (!inv.calculated_due_date) return false;
        return inv.calculated_due_date.getTime() <= targetMs;
      });
      
      if (relevantInvoices.length === 0) continue;
      
      const clientTotal = relevantInvoices.reduce((s, i) => s + Number(i.doc_balance), 0);
      clientMap.set(client.bina_customer_id, {
        ...client,
        invoices: relevantInvoices.map(inv => {
          const days = Math.floor((todayMs - inv.calculated_due_date.getTime()) / 86400000);
          return { ...inv, daysOverdue: Math.max(0, days) };
        }),
        total: clientTotal,
      });
      grandTotal += clientTotal;
      totalInvoices += relevantInvoices.length;
    }
    
    return {
      targetDate: globalReportDate,
      clients: Array.from(clientMap.values()).sort((a, b) => b.total - a.total),
      grandTotal,
      totalInvoices,
      clientsCount: clientMap.size,
    };
  }, [clientsWithInvoices, globalReportDate]);

  const totalOverdue = overdueByMonth.reduce((s, m) => s + m.total, 0);
  const totalThisWeek = thisWeekClients.reduce((s, c) => s + c.total, 0);
  const totalThisMonth = thisMonthClients.reduce((s, c) => s + c.total, 0);
  const totalClients = clientsWithInvoices.length;

  // פעולות
  const handleRefresh = async () => {
    setRefreshing(true);
    try {
      const { error } = await supabaseClient.functions.invoke('bina-fetch-debt-report', { body: {} });
      if (error) throw error;
      await new Promise((r) => setTimeout(r, 1500));
      if (onDebtReload) await onDebtReload();
    } catch (e) {
      alert("שגיאה ברענון: " + (e && e.message ? e.message : String(e)));
    } finally {
      setRefreshing(false);
    }
  };

  const handleSendEmail = (client, emailType) => {
    setEmailModal({ client, mode: 'confirmSend', emailType });
  };

  // 🆕 שליחת מייל חכמה - לפי סוג מסננת חשבוניות
  const sendEmail = async (client, emailType, billingOpts={}) => {
    const recipient=billingOpts.recipient?String(billingOpts.recipient).trim().toLowerCase():null;
    try {
      // סינון חשבוניות לפי סוג המייל:
      // reminder = רק חשבוניות עתידיות (לא באיחור)
      // inquiry = רק חשבוניות באיחור
      const filteredInvoices = client.invoices.filter(inv => {
        if (!inv.calculated_due_date) return false;
        const dueMs = inv.calculated_due_date.getTime();
        const isOverdue = dueMs < todayMs;
        return emailType === 'inquiry' ? isOverdue : !isOverdue;
      });
      
      if (filteredInvoices.length === 0) {
        alert(emailType === 'inquiry' 
          ? '✅ אין חשבוניות באיחור ללקוח זה'
          : '✅ אין חשבוניות לתשלום עתידי ללקוח זה');
        return false;
      }
      
      const invoicesForEmail = filteredInvoices.map((inv) => {
        const dueMs = inv.calculated_due_date ? inv.calculated_due_date.getTime() : 0;
        const dOver = dueMs ? Math.max(0, Math.floor((todayMs - dueMs) / 86400000)) : 0;
        return {
        doc_num: inv.doc_num,
        doc_balance: inv.doc_balance,
        doc_date: inv.doc_date,
        doc_payment_date: inv.calculated_due_date
          ? inv.calculated_due_date.toISOString().split("T")[0]
          : inv.doc_payment_date,
        days_overdue: dOver,
        };
      });
      
      const { data, error } = await supabaseClient.functions.invoke('send-collection-email', {
        body: {
          bina_customer_id: client.bina_customer_id,
          email_type: emailType,
          invoices: invoicesForEmail,
          to_emails: recipient?[recipient]:undefined,
        },
      });
      
      if (error || !data?.success) {
        alert(`❌ שגיאה: ${data?.error || error?.message || 'לא ידוע'}`);
        return false;
      }
      
      alert(`✅ נשלח ל-${data.sent_to.join(', ')}\n${filteredInvoices.length} חשבוניות · סכום: ₪${Number(data.total_amount).toLocaleString('he-IL')}`);
      return true;
    } catch (e) {
      alert('שגיאה: ' + e.message);
      return false;
    }
  };

  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
  const formatDate = (d) => {
    if (!d) return '';
    const date = d instanceof Date ? d : new Date(d);
    if (isNaN(date.getTime())) return '';
    return date.toLocaleDateString('he-IL');
  };

  const wrapStyle = { direction: 'rtl', padding: 16, background: '#f8fafa', minHeight: 'calc(100vh - 56px)' };
  const titleStyle = { fontSize: 24, fontWeight: 800, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 10 };
  const headerStyle = { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 };
  const kpisRow = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12, marginBottom: 20 };
  const kpiCard = (color, bg) => ({ background: bg, padding: 16, borderRadius: 12, border: `1px solid ${color}30` });
  const kpiValue = (color) => ({ fontSize: 26, fontWeight: 800, color, lineHeight: 1.1, marginBottom: 4 });
  const kpiLabel = { fontSize: 12, color: '#6b7280', fontWeight: 600 };
  const sectionCard = { background: '#fff', padding: 0, borderRadius: 12, marginBottom: 16, border: '1px solid #e5e7eb', overflow: 'hidden' };
  const sectionHeaderStyle = (bg, color) => ({
    padding: '16px 20px', background: bg, color: color || '#1E3A52',
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    fontSize: 15, fontWeight: 700, gap: 10, flexWrap: 'wrap',
  });
  const miniBtn = (color) => ({
    padding: '6px 10px', border: `1px solid ${color}40`,
    borderRadius: 6, background: '#fff', color, cursor: 'pointer',
    fontSize: 13, fontFamily: 'inherit', transition: 'all 0.15s',
  });

  const renderClientActions = (client) => {
    if (!client.actions || client.actions.length === 0) return null;

    const actionTypeInfo = (type) => DEBT_ACTION_TYPES[type] || { emoji: '📌', label: type, color: '#6b7280' };

    const formatDateTime = (d) => {
      if (!d) return '';
      const date = new Date(d);
      return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    };

    return (
      <div style={{
        marginTop: 10,
        padding: '10px 14px',
        background: '#f8fafa',
        borderRadius: 6,
        border: '1px solid #e5e7eb',
      }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: '#1E3A52', marginBottom: 8 }}>
          📜 היסטוריית פעולות ({client.actions.length}):
        </div>

        {client.actions.map((action, idx) => {
          const info = actionTypeInfo(action.action_type);
          return (
            <div key={action.id || idx} style={{
              padding: '6px 8px',
              marginBottom: 4,
              background: '#fff',
              borderRadius: 4,
              borderRight: `3px solid ${info.color}`,
              fontSize: 12,
              lineHeight: 1.5,
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontSize: 14 }}>{info.emoji}</span>
                  <strong style={{ color: info.color }}>{info.label}</strong>
                  {action.amount && (
                    <span style={{ color: '#1E3A52', fontWeight: 700, marginInlineStart: 4 }}>
                      ₪{Number(action.amount).toLocaleString('he-IL')}
                    </span>
                  )}
                  {action.promised_date && (
                    <span style={{ background: '#fef3c7', color: '#92400e', padding: '1px 6px', borderRadius: 4, fontSize: 11 }}>
                      📅 {new Date(action.promised_date).toLocaleDateString('he-IL')}
                    </span>
                  )}
                </div>
                <div style={{ fontSize: 11, color: '#6b7280' }}>
                  {formatDateTime(action.created_at)} · {action.created_by || 'admin'}
                </div>
              </div>
              {action.notes && (
                <div style={{ marginTop: 4, color: '#4b5563', fontSize: 12 }}>
                  {action.notes}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // 🆕 רינדור כרטיס לקוח עם חשבוניות מאוחדות
  const renderClientCard = (client, mode) => {
    const isOverdue = mode === 'overdue' || (client.maxDaysOverdue && client.maxDaysOverdue > 0);
    
    return (
      <div key={client.bina_customer_id} style={{ padding: 14, borderBottom: '1px solid #f1f5f9' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
          <div style={{ flex: 1, minWidth: 240 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: '#1E3A52' }}>
              {client.name}
              {client.payment_terms && (
                <span style={{ marginInlineStart: 8, fontSize: 11, color: '#6b7280', fontWeight: 500 }}>
                  ({client.payment_terms})
                </span>
              )}
              {client.contact_name && (
                <span style={{ marginInlineStart: 8, fontSize: 11, color: '#3b82f6', fontWeight: 500 }}>
                  · {client.contact_name}
                </span>
              )}
              {client.phone && (
                <span style={{ marginInlineStart: 6, fontSize: 11, color: '#6b7280' }}>
                  · {client.phone}
                </span>
              )}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: '#1E3A52' }}>
              {fmtCurrency(client.total)}
            </div>
            <div style={{ display: 'flex', gap: 4 }}>
              <button onClick={() => setActionModal({ customer: client, type: 'called' })} title="התקשרתי" style={miniBtn('#3b82f6')}>📞</button>
              <button onClick={() => handleSendEmail(client, isOverdue ? 'inquiry' : 'reminder')} 
                title={isOverdue ? 'בקש בירור' : 'תזכורת'} style={miniBtn(isOverdue ? '#dc2626' : '#8b5cf6')}>📧</button>
              <button onClick={() => setActionModal({ customer: client, type: 'promised_to_pay' })} title="הבטיח לשלם" style={miniBtn('#f59e0b')}>🤝</button>
              <button onClick={() => setActionModal({ customer: client, type: 'paid_transfer' })} title="שולם הכל" style={miniBtn('#10b981')}>💰</button>
            </div>
          </div>
        </div>
        
        {/* 🆕 פירוט חשבוניות בקו אחד */}
        <div style={{ fontSize: 12, color: '#4b5563', paddingInlineStart: 4, lineHeight: 1.8 }}>
          <strong style={{ color: '#1E3A52' }}>📋 {client.invoices.length} חשבוניות:</strong>{' '}
          {client.invoices.map((inv, idx) => (
            <span key={inv.doc_num} style={{ display: 'inline-block', marginInlineEnd: 8 }}>
              <button
                onClick={() => setActionModal({ customer: client, type: 'paid_transfer', specificInvoice: inv })}
                title={`סמן חשבונית ${inv.doc_num} כשולמה`}
                style={{
                  background: inv.daysOverdue > 0 ? '#fef2f2' : '#f0fdfa',
                  border: `1px solid ${inv.daysOverdue > 0 ? '#fecaca' : '#a7f3d0'}`,
                  borderRadius: 4, padding: '2px 6px', cursor: 'pointer',
                  color: '#1E3A52', fontSize: 12, fontFamily: 'inherit',
                }}
              >
                #{inv.doc_num} ({fmtCurrency(inv.doc_balance)})
                {inv.daysOverdue > 0 && <span style={{ color: '#dc2626', marginInlineStart: 4 }}>⏰{inv.daysOverdue}י'</span>}
              </button>
            </span>
          ))}
        </div>
        {client.client_id&&<div style={{
            marginTop: 8, padding: '6px 10px', background: '#fef3c7',
            borderRadius: 4, fontSize: 12, color: '#78350f',
            display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap',
          }}>
            <span>💼</span>
            {(client.collection_email_primary||client.collection_email_secondary)?<span style={{ direction: 'ltr', color: '#1E3A52' }}>
              {client.collection_email_primary}
              {client.collection_email_secondary&&<span style={{ marginInlineStart: 6, color: '#6b7280' }}>+ {client.collection_email_secondary}</span>}
            </span>:<span style={{ color: '#6b7280' }}>מאגר מיילי גבייה</span>}
            <button type="button" onClick={()=>setEmailModal({ client, mode: 'editEmail' })} style={{
                marginInlineStart: 'auto', background: 'transparent', border: '1px solid #92400e',
                color: '#92400e', borderRadius: 4, padding: '2px 8px', cursor: 'pointer',
                fontSize: 11, fontFamily: 'inherit',
              }}>✏️ נהל מיילים</button>
          </div>}
        {renderClientActions(client)}
      </div>
    );
  };

  return (
    <div style={wrapStyle}>
      <div style={headerStyle}>
        <div style={titleStyle}>💰 דשבורד גבייה</div>
        <button onClick={handleRefresh} disabled={refreshing} style={{
          padding: '8px 14px', borderRadius: 8, fontSize: 13, fontWeight: 600,
          background: '#fff', color: '#3DB5B1', border: '1px solid #e5e7eb',
          cursor: refreshing ? 'wait' : 'pointer', fontFamily: 'inherit',
          opacity: refreshing ? 0.6 : 1,
        }}>
          {refreshing ? '⏳ מרענן...' : '🔄 רענן דוח'}
        </button>
      </div>

      {/* KPIs */}
      <div style={kpisRow}>
        <div style={kpiCard('#dc2626', '#fef2f2')}>
          <div style={kpiValue('#dc2626')}>{fmtCurrency(totalOverdue)}</div>
          <div style={kpiLabel}>🔥 חוב בעבר</div>
        </div>
        <div style={kpiCard('#f59e0b', '#fffbeb')}>
          <div style={kpiValue('#f59e0b')}>{fmtCurrency(totalThisWeek)}</div>
          <div style={kpiLabel}>📅 השבוע</div>
        </div>
        <div style={kpiCard('#3b82f6', '#eff6ff')}>
          <div style={kpiValue('#3b82f6')}>{fmtCurrency(totalThisMonth)}</div>
          <div style={kpiLabel}>📆 החודש</div>
        </div>
        <div style={kpiCard('#9333ea', '#faf5ff')}>
          <div style={kpiValue('#9333ea')}>{totalClients}</div>
          <div style={kpiLabel}>👥 לקוחות חייבים</div>
        </div>
      </div>

      <BrokenPromisesAlert brokenPromises={brokenPromises} />

      <MoranMonthlyReport clientsWithInvoices={clientsWithInvoices} />

      {/* 🆕 בורר תאריך לדוח גלובלי */}
      <div style={{
        background: 'linear-gradient(135deg, #faf5ff, #fff)',
        padding: 16, borderRadius: 12, marginBottom: 20,
        border: '2px solid #9333ea30',
        display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap',
      }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 6 }}>
          📊 דוח גבייה כולל עד תאריך:
        </div>
        <input
          type="date"
          value={globalReportDate}
          onChange={e => setGlobalReportDate(e.target.value)}
          style={{
            padding: '8px 12px', fontSize: 14, border: '1px solid #d8b4fe',
            borderRadius: 6, fontFamily: 'inherit', direction: 'ltr',
          }}
        />
        {globalReport && (
          <>
            <span style={{ color: '#6b7280', fontSize: 13 }}>
              ({globalReport.clientsCount} לקוחות · {globalReport.totalInvoices} חשבוניות · {fmtCurrency(globalReport.grandTotal)})
            </span>
            <button onClick={() => setShowGlobalReport(!showGlobalReport)} style={{
              padding: '6px 14px', background: '#9333ea', color: '#fff',
              border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              {showGlobalReport ? '🔼 הסתר' : '🔽 הצג דוח'}
            </button>
            <button onClick={() => setPrintData({ 
              type: 'global', 
              title: `דוח גבייה עד ${formatDate(globalReportDate)}`,
              data: globalReport,
            })} style={{
              padding: '6px 14px', background: '#fff', color: '#9333ea',
              border: '1px solid #9333ea', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              🖨️ הדפס
            </button>
            <button onClick={() => { void exportToExcel(globalReport, `דוח_גביה_עד_${globalReportDate}.xlsx`, `דוח גבייה עד ${formatDate(globalReportDate)}`); }} style={{
              padding: '6px 14px', background: '#fff', color: '#10b981',
              border: '1px solid #10b981', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              📊 Excel
            </button>
          </>
        )}
      </div>

      {/* תצוגת דוח גלובלי */}
      {showGlobalReport && globalReport && (
        <div style={{ ...sectionCard, border: '2px solid #9333ea' }}>
          <div style={{ ...sectionHeaderStyle('linear-gradient(135deg, #faf5ff, #fff)') }}>
            <span style={{ fontSize: 16 }}>📊 דוח גבייה עד {formatDate(globalReportDate)}</span>
            <span style={{ color: '#9333ea', fontWeight: 700 }}>{fmtCurrency(globalReport.grandTotal)}</span>
          </div>
          {globalReport.clients.map(c => renderClientCard(c, 'overdue'))}
        </div>
      )}

      {/* חוב באיחור - לפי חודש */}
      {overdueByMonth.length > 0 && (
        <div>
          <h3 style={{ fontSize: 18, fontWeight: 700, color: '#dc2626', margin: '24px 0 12px' }}>
            🔥 דחוף - חוב באיחור (לפי חודש פירעון)
          </h3>
          {overdueByMonth.map((month, idx) => (
            <details key={month.key} style={sectionCard} open={idx < 2}>
              <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #fef2f2, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ fontSize: 16 }}>📅 {month.label}</span>
                  <span style={{ background: '#dc2626', color: '#fff', padding: '2px 10px', borderRadius: 12, fontSize: 12, fontWeight: 700 }}>
                    {month.clients.length} לקוחות · {month.invoicesCount} חשבוניות
                  </span>
                  <span style={{ color: '#dc2626', fontWeight: 700 }}>{fmtCurrency(month.total)}</span>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button onClick={(e) => { 
                    e.preventDefault(); 
                    void exportToExcel({ clients: month.clients, grandTotal: month.total }, `רשימת_גביה_${month.label.replace(/\s+/g, '_')}.xlsx`, `רשימת גבייה - ${month.label}`); 
                  }} 
                    style={{ padding: '6px 12px', background: '#fff', border: '1px solid #10b981', borderRadius: 6, color: '#10b981', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
                    📊 Excel
                  </button>
                  <button onClick={(e) => { 
                    e.preventDefault(); 
                    setPrintData({ type: 'month', title: `רשימת גבייה - ${month.label}`, data: month });
                  }} 
                    style={{ padding: '6px 12px', background: '#fff', border: '1px solid #dc2626', borderRadius: 6, color: '#dc2626', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
                    🖨️ הדפס
                  </button>
                </div>
              </summary>
              <div>{month.clients.map(c => renderClientCard(c, 'overdue'))}</div>
            </details>
          ))}
        </div>
      )}

      {/* השבוע */}
      {thisWeekClients.length > 0 && (
        <div>
          <h3 style={{ fontSize: 18, fontWeight: 700, color: '#f59e0b', margin: '24px 0 12px' }}>
            📅 השבוע - 7 ימים הקרובים
          </h3>
          <div style={sectionCard}>
            <div style={sectionHeaderStyle('linear-gradient(135deg, #fffbeb, #fff)')}>
              <span>{thisWeekClients.length} לקוחות לפירעון</span>
              <span style={{ color: '#f59e0b', fontWeight: 700 }}>{fmtCurrency(totalThisWeek)}</span>
            </div>
            {thisWeekClients.map(c => renderClientCard(c, 'thisWeek'))}
          </div>
        </div>
      )}

      {/* החודש */}
      {thisMonthClients.length > 0 && (
        <details style={{ ...sectionCard, marginTop: 24 }}>
          <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #eff6ff, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>📆 החודש (8-30 ימים)</span>
            <span style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <span style={{ color: '#3b82f6' }}>{thisMonthClients.length} לקוחות</span>
              <span style={{ color: '#3b82f6', fontWeight: 700 }}>{fmtCurrency(totalThisMonth)}</span>
            </span>
          </summary>
          <div>{thisMonthClients.map(c => renderClientCard(c, 'thisMonth'))}</div>
        </details>
      )}

      {/* בקרוב */}
      {soonClients.length > 0 && (
        <details style={{ ...sectionCard, marginTop: 12 }}>
          <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #f0fdf4, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>🟢 בקרוב (30-90 ימים)</span>
            <span style={{ color: '#22c55e' }}>{soonClients.length} לקוחות · {fmtCurrency(soonClients.reduce((s,c)=>s+c.total,0))}</span>
          </summary>
          <div>{soonClients.map(c => renderClientCard(c, 'soon'))}</div>
        </details>
      )}

      {clientsWithInvoices.length === 0 && (
        <div style={{ background: '#fff', padding: 40, borderRadius: 12, textAlign: 'center', color: '#9ca3af', border: '1px dashed #e5e7eb' }}>
          🎉 אין לקוחות חייבים כרגע!
        </div>
      )}

      {/* Modals */}
      {actionModal && (
        <DebtActionModal
          customer={actionModal.customer}
          actionType={actionModal.type}
          specificInvoice={actionModal.specificInvoice}
          onClose={() => setActionModal(null)}
          onSuccess={(newAction) => {
            setActions((prev) => [newAction, ...prev]);
            setActionModal(null);
            if (onDebtReload) onDebtReload();
          }}
          sb={sb}
          collectorName={collectorName}
        />
      )}

      {emailModal && (
        <EmailModal
          client={emailModal.client}
          mode={emailModal.mode}
          emailType={emailModal.emailType}
          onClose={() => setEmailModal(null)}
          onSendEmail={sendEmail}
          sb={sb}
          createdBy={collectorName}
        />
      )}

      {printData && (
        <PrintReport data={printData} onClose={() => setPrintData(null)} />
      )}
    </div>
  );
}

// Modal לניהול מיילים + שליחה
// ========================================
function EmailModal({ client, mode, emailType, onClose, onSendEmail, sb, createdBy }) {
  const [savedEmails, setSavedEmails] = useState([]);
  const [emailMode, setEmailMode] = useState('loading');
  const [selectedEmailId, setSelectedEmailId] = useState(null);
  const [recipient, setRecipient] = useState('');
  const [showAddNew, setShowAddNew] = useState(false);
  const [newEmail, setNewEmail] = useState('');
  const [newLabel, setNewLabel] = useState('');
  const [saving, setSaving] = useState(false);
  const prevEmailIdRef = useRef(null);
  const clientId = client?.client_id || null;
  const isEditMode = mode === 'editEmail';
  const isConfirmMode = mode === 'confirmSend';
  const overlayStyle = { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 };
  const modalStyle = { background: '#fff', borderRadius: 16, maxWidth: 520, width: '100%', direction: 'rtl', overflow: 'hidden', maxHeight: '90vh', display: 'flex', flexDirection: 'column' };
  const inputStyle = { width: '100%', padding: '10px 12px', fontSize: 14, border: '1px solid #e5e7eb', borderRadius: 8, fontFamily: 'inherit', boxSizing: 'border-box', direction: 'ltr', textAlign: 'left' };
  const handleSelectEmail = (em) => { setSelectedEmailId(em.id); setRecipient(em.email); setShowAddNew(false); };
  const handleStartAddNew = () => {
    if (selectedEmailId) prevEmailIdRef.current = selectedEmailId;
    setSelectedEmailId(null); setRecipient(''); setNewEmail(''); setNewLabel(''); setShowAddNew(true);
  };
  const handleSaveNewEmail = async () => {
    if (!newEmail.trim() || !newEmail.includes('@')) { window.alert('כתובת מייל לא תקינה'); return; }
    if (!clientId) { window.alert('שגיאה: לא ניתן לזהות את הלקוח'); return; }
    try {
      const result = await sb('client_billing_emails', { method: 'POST', body: JSON.stringify({
        client_id: clientId, email: newEmail.trim().toLowerCase(), label: newLabel.trim() || null,
        is_default: savedEmails.length === 0, usage_count: 0, created_by: createdBy || 'unknown',
      }) });
      const newE = Array.isArray(result) ? result[0] : result;
      if (newE) {
        setSavedEmails((prev) => [...prev, newE]);
        setSelectedEmailId(newE.id); setRecipient(newE.email);
        setShowAddNew(false); setEmailMode('pick'); setNewEmail(''); setNewLabel('');
      }
    } catch (e) {
      const msg = e.message || String(e);
      if (msg.includes('duplicate') || msg.includes('23505')) window.alert('כתובת מייל זו כבר קיימת במאגר');
      else window.alert('שגיאה: ' + msg);
    }
  };
  const incrementUsage = async () => {
    if (!selectedEmailId) return;
    const em = savedEmails.find((e) => e.id === selectedEmailId);
    if (!em) return;
    try {
      await sb(`client_billing_emails?id=eq.${selectedEmailId}`, { method: 'PATCH', body: JSON.stringify({
        usage_count: (em.usage_count || 0) + 1, last_used_at: new Date().toISOString(),
      }) });
    } catch (_) {}
  };
  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      setEmailMode('loading');
      if (!clientId) {
        if (!cancelled) {
          setSavedEmails([]);
          setEmailMode('addFirst');
          if (client.collection_email_primary) {
            setRecipient(client.collection_email_primary);
            setNewEmail(client.collection_email_primary);
          }
        }
        return;
      }
      try {
        const data = await loadClientBillingEmailPool(clientId);
        if (cancelled) return;
        setSavedEmails(data);
        if (data.length > 0) {
          setEmailMode('pick');
          const def = data.find((e) => e.is_default) || data[0];
          setSelectedEmailId(def.id);
          setRecipient(def.email);
        } else {
          setEmailMode('addFirst');
          if (client.collection_email_primary) {
            setRecipient(client.collection_email_primary);
            setNewEmail(client.collection_email_primary);
          }
        }
      } catch (e) {
        console.error(e);
        if (!cancelled) setEmailMode('addFirst');
      }
    };
    load();
    return () => { cancelled = true; };
  }, [clientId, client.collection_email_primary]);
  const billingPickerUi = <>
    <div style={{ marginBottom: 15 }}>
      <label style={{ display: 'block', marginBottom: 6, fontWeight: 600, fontSize: 14 }}>💼 מייל הנה"ח / גבייה:</label>
      {emailMode === 'loading' && <div style={{ padding: 12, background: '#f9fafb', borderRadius: 6, color: '#6b7280', fontSize: 13, textAlign: 'center' }}>טוען מיילים שמורים...</div>}
      {emailMode === 'pick' && !showAddNew && <>
        <div style={{ background: '#fef3c7', padding: 12, borderRadius: 8, border: '1px solid #fde68a', marginBottom: 8 }}>
          <div style={{ fontSize: 12, color: '#78350f', marginBottom: 8, fontWeight: 600 }}>💼 מיילים שמורים ללקוח ({savedEmails.length})</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 220, overflowY: 'auto' }}>
            {savedEmails.map((em) => <button type="button" key={em.id} onClick={() => handleSelectEmail(em)} style={{ padding: 10, textAlign: 'right', background: selectedEmailId === em.id ? '#92400e' : 'white', color: selectedEmailId === em.id ? 'white' : '#374151', border: `1px solid ${selectedEmailId === em.id ? '#92400e' : '#d1d5db'}`, borderRadius: 6, cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: 'inherit' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, direction: 'ltr', textAlign: 'right', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: 600 }}>{em.is_default && '⭐ '}{em.email}</div>
                {em.label && <div style={{ fontSize: 11, color: selectedEmailId === em.id ? 'rgba(255,255,255,0.85)' : '#6b7280', marginTop: 2 }}>🏷️ {em.label}</div>}
              </div>
              {em.usage_count > 0 && <div style={{ fontSize: 11, marginRight: 8, color: selectedEmailId === em.id ? 'rgba(255,255,255,0.7)' : '#9ca3af', whiteSpace: 'nowrap' }}>{em.usage_count}×</div>}
            </button>)}
          </div>
        </div>
        <button type="button" onClick={handleStartAddNew} style={{ width: '100%', padding: 10, background: 'transparent', border: '2px dashed #d1d5db', borderRadius: 8, cursor: 'pointer', color: '#6b7280', fontSize: 13, fontFamily: 'inherit' }}>➕ הוסף מייל גבייה נוסף</button>
      </>}
      {(emailMode === 'addFirst' || showAddNew) && <div style={{ background: '#fefce8', padding: 12, borderRadius: 8, border: '2px solid #fde68a' }}>
        {emailMode === 'addFirst' && <div style={{ fontSize: 12, color: '#78350f', marginBottom: 10 }}>ℹ️ אין מיילי גבייה שמורים ללקוח - הוסף את הראשון</div>}
        <div style={{ marginBottom: 8 }}><input type="email" value={showAddNew ? newEmail : (newEmail || recipient)} onChange={(e) => { const v = e.target.value; setNewEmail(v); if (emailMode === 'addFirst') setRecipient(v); }} placeholder="email@company.co.il *" style={inputStyle} autoFocus /></div>
        <div style={{ marginBottom: emailMode === 'pick' && showAddNew ? 10 : 0 }}><input type="text" value={newLabel} onChange={(e) => setNewLabel(e.target.value)} placeholder='תווית (אופציונלי) - "הנה"ח", "גבייה"...' style={{ ...inputStyle, direction: 'rtl', textAlign: 'right' }} /></div>
        {emailMode === 'pick' && showAddNew && <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
          <button type="button" onClick={() => { setShowAddNew(false); const prevId = prevEmailIdRef.current; if (prevId) { const prev = savedEmails.find((e) => e.id === prevId); if (prev) { setSelectedEmailId(prev.id); setRecipient(prev.email); } } }} style={{ flex: 1, padding: 8, fontSize: 12, background: '#f3f4f6', border: '1px solid #d1d5db', borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit' }}>ביטול</button>
          <button type="button" onClick={handleSaveNewEmail} style={{ flex: 2, padding: 8, fontSize: 12, background: '#92400e', color: 'white', border: 'none', borderRadius: 6, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>💾 שמור והשתמש</button>
        </div>}
        {emailMode === 'addFirst' && <div style={{ fontSize: 11, color: '#6b7280', marginTop: 8, textAlign: 'center' }}>💡 המייל יישמר אוטומטית כשתשלח</div>}
      </div>}
    </div>
  </>;
  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={modalStyle} onClick={(e) => e.stopPropagation()}>

function fmtCurrencySimple(n) {
  return `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
}

/** משימות לפי מחלקה: legacy לפי tasks.dept, או הזמנות עם task_items לפי department של הפריט */
function tasksForDepartment(allTasks, taskItems, targetDept) {
  const list = Array.isArray(allTasks) ? allTasks : [];
  const items = Array.isArray(taskItems) ? taskItems : [];
  if (!targetDept) return list;
  const taskIdsFromItems = new Set(
    items.filter((i) => i.department === targetDept && i.status !== "ארכיון").map((i) => i.task_id),
  );
  return list.filter((t) => {
    if (!t.has_items) return t.dept === targetDept;
    return taskIdsFromItems.has(t.id);
  });
}

const generateSignupToken=()=>{
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let token="";
  for(let i=0;i<16;i++)token+=chars[Math.floor(Math.random()*chars.length)];
  return token;
};
const parseBillingAddressForBina=(addr)=>{
  const t=String(addr||"").trim();
  if(!t)return{custCity:"תל אביב",custAddress:""};
  const parts=t.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2)return{custCity:parts[parts.length-1],custAddress:parts.slice(0,-1).join(", ")};
  return{custCity:"תל אביב",custAddress:t};
};

async function createBinaFromSignupForm(form,user){
  const custName=(form.business_name||form.full_name||"").trim();
  const custTz=signupPhoneDigits(form.business_id||form.personal_id);
  if(custTz.length!==9)throw new Error("ח.פ/ת.ז חייבים 9 ספרות");
  const {custCity,custAddress}=parseBillingAddressForBina(form.billing_address);
  if(!custAddress.trim())throw new Error("כתובת חיוב חסרה");
  const tel=signupPhoneDigits(form.phone);
  if(tel.length<9||tel.length>10)throw new Error("טלפון לא תקין (9–10 ספרות)");
  const em=String(form.orders_email||form.email||"").trim();
  if(!em||!em.includes("@"))throw new Error("מייל לא תקין");
  const body={
    custName,
    custTz,
    custCity,
    custAddress,
    custGroup:form.client_type==="private"?"פרטי":"ישראל",
    custTel:tel,
    custCel:tel,
    custEmail:em,
    termsofPayment:(form.payment_terms||"").trim()||"שוטף + 30"
  };
  const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-customer",{body});
  if(invE)throw new Error(invE.message||"שגיאה בבינה");
  let resRow=data;
  if(typeof data==="string"){try{resRow=JSON.parse(data)}catch{resRow=null}}
  resRow=Array.isArray(resRow)?resRow[0]:resRow;
  if(!resRow)throw new Error("תשובה לא צפויה מבינה");
  const rc=resRow.ResCode;
  if(rc===0||rc==="0"){
    const code=resRow.kuponId??resRow.requestId??resRow.KuponId??resRow.custId??resRow.docId??"—";
    const binaId=code!=="—"&&code!=null&&String(code).trim()!==""?String(code):null;
    const addrLine=`${custCity}, ${custAddress}`;
    const notesParts=[form.notes?.trim(),form.shipping_address?`משלוחים: ${form.shipping_address}`:null,form.contact_name?`איש קשר: ${form.contact_name}`:null,`ת.ז./ח.פ.: ${custTz}`].filter(Boolean);
    await sb("clients",{method:"POST",body:JSON.stringify({
      name:custName,
      phone:form.phone,
      email:em,
      address:addrLine,
      payment_terms:body.termsofPayment,
      contact_name:form.contact_name||null,
      notes:notesParts.length?notesParts.join("\n"):null,
      bina_customer_id:binaId,
    })});
    await sb(`client_signup_forms?id=eq.${form.id}`,{
      method:"PATCH",
      body:JSON.stringify({
        bina_customer_id:binaId,
        bina_synced_at:new Date().toISOString(),
        status:"approved",
        reviewed_at:new Date().toISOString(),
        reviewed_by:user?.name||"unknown"
      })
    });
    return binaId||code;
  }
  if(rc===-5||rc==="-5")throw new Error("ת.ז./ח.פ. כבר קיים במערכת");
  throw new Error(resRow.ResMsg||resRow.ResMsgHe||"שגיאה ביצירה בבינה");
}

  const [reasonNotes,setReasonNotes]=useState("");
  const [submitting,setSubmitting]=useState(false);
  const canvasRef=useRef(null);
  const padRef=useRef(null);
  useEffect(()=>{
    let cancelled=false;
    sb(`vacation_form_config?form_slug=eq.${encodeURIComponent(slug)}&is_active=eq.true&limit=1`).then(r=>{
      if(cancelled)return;
      if(!r?.length){setError("הטופס לא נמצא");setLoading(false);return;}
      setLoading(false);
    }).catch(()=>{if(!cancelled){setError("שגיאה בטעינה");setLoading(false);}});
    return()=>{cancelled=true};
  },[slug]);
  const initPad=()=>{
    if(!canvasRef.current||!window.SignaturePad)return;
    const canvas=canvasRef.current;
    const rect=canvas.parentElement?.getBoundingClientRect();
    canvas.width=rect?Math.max(300,rect.width-4):550;
    canvas.height=180;
    padRef.current=new window.SignaturePad(canvas,{backgroundColor:"rgb(255,255,255)",penColor:"rgb(0,0,0)"});
  };
  useEffect(()=>{
    if(step!=="form")return;
    ensureSignaturePadLoaded(initPad);
    return()=>{padRef.current=null;};
  },[step]);
  const handleIdentify=async()=>{
    if(!employeeName.trim()){alert("יש למלא שם מלא");return;}
    if(!/^\d{4}$/.test(idLast4)){alert("יש להזין 4 ספרות אחרונות של ת.ז");return;}
    try{
      const r=await sb(`vacation_requests?employee_name=eq.${encodeURIComponent(employeeName.trim())}&employee_id_last4=eq.${idLast4}&order=submitted_at.desc&limit=10`);
      setHistory(r||[]);
    }catch{setHistory([]);}
    setStep("form");
  };
  const handleSubmit=async()=>{
    if(!startDate||!endDate){alert("יש למלא תאריכי התחלה וסיום");return;}
    if(new Date(startDate)>new Date(endDate)){alert("תאריך התחלה חייב להיות לפני תאריך סיום");return;}
    if(reasonType==="other"&&!reasonNotes.trim()){alert('יש למלא פירוט לסיבה "אחר"');return;}
    if(!padRef.current||padRef.current.isEmpty()){alert("יש לחתום בטופס");return;}
    setSubmitting(true);
    try{
      const signature=padRef.current.toDataURL("image/png");
      const days=calcVacationDays(startDate,endDate);
      await sb("vacation_requests",{method:"POST",body:JSON.stringify({
        employee_name:employeeName.trim(),employee_id_last4:idLast4,
        start_date:startDate,end_date:endDate,total_days:days,
        reason_type:reasonType,reason_notes:reasonNotes.trim()||null,
        signature_data:signature,status:"pending",
        user_agent:typeof navigator!=="undefined"?navigator.userAgent:null
      })});
      try{
        await sendEmail({
          to:ADMIN_NOTIFY_EMAIL,
          subject:`📅 בקשת חופש חדשה - ${employeeName.trim()} (${VACATION_REASON_EMAIL[reasonType]})`,
          from:"דפוס נטלי <orders@natalie-print.com>",
          html:buildVacationManagerEmail(employeeName.trim(),idLast4,startDate,endDate,days,VACATION_REASON_EMAIL[reasonType],reasonNotes.trim(),signature)
        });
      }catch(e){console.warn("vacation email failed",e);}
      setStep("submitted");
    }catch(e){alert("שגיאה בשליחה: "+(e.message||String(e)));}
    finally{setSubmitting(false);}
  };
  if(loading)return<div style={{textAlign:"center",padding:50,direction:"rtl"}}>טוען...</div>;
  if(error)return<div style={{maxWidth:500,margin:"50px auto",padding:30,textAlign:"center",direction:"rtl"}}><h2 style={{color:"#991b1b"}}>{error}</h2></div>;
  const dayPreview=startDate&&endDate?calcVacationDays(startDate,endDate):0;
  return<div style={{minHeight:"100vh",background:"#f8fafc",padding:"20px 10px",direction:"rtl",fontFamily:"Segoe UI,Arial,sans-serif"}}>
    <div style={{maxWidth:600,margin:"0 auto",background:"white",borderRadius:12,overflow:"hidden",boxShadow:"0 4px 6px rgba(0,0,0,0.1)"}}>
      <div style={{padding:25,textAlign:"center"}}><div style={{fontSize:32,fontWeight:700,color:"#0d9488",letterSpacing:2}}>NATALIE</div><div style={{color:"#134e4a",marginTop:4}}>פתרונות הדפסה</div></div>
      <div style={{height:4,background:"linear-gradient(90deg,#2dd4bf,#0d9488)"}}/>
      <div style={{padding:30}}>
        <h1 style={{margin:"0 0 8px",color:"#0d9488",fontSize:24}}>📅 בקשת חופש / היעדרות</h1>
        {step==="identify"&&<>
          <p style={{color:"#64748b",marginBottom:20}}>אנא הזן את פרטיך כדי להתחיל</p>
          <SignupFormField label="שם מלא *" value={employeeName} onChange={setEmployeeName} placeholder="שם פרטי ושם משפחה"/>
          <label style={{display:"block",marginBottom:4,fontWeight:600,color:"#134e4a"}}>4 ספרות אחרונות של ת.ז *</label>
          <input value={idLast4} onChange={e=>setIdLast4(e.target.value.replace(/\D/g,"").slice(0,4))} maxLength={4} placeholder="1234" style={{width:"100%",padding:12,borderRadius:6,border:"1px solid #d1d5db",direction:"ltr",fontSize:18,textAlign:"center",letterSpacing:8,fontFamily:"monospace",marginBottom:16}}/>
          <button type="button" onClick={handleIdentify} style={{width:"100%",padding:14,background:"#0d9488",color:"white",border:"none",borderRadius:8,fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>המשך ➜</button>
        </>}
        {step==="form"&&<>
          <div style={{background:"#f0fdfa",padding:12,borderRadius:8,marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:600,color:"#0d9488"}}>{employeeName}</div><div style={{fontSize:12,color:"#64748b",direction:"ltr"}}>ת.ז: ••••{idLast4}</div></div>
            <button type="button" onClick={()=>{setStep("identify");padRef.current=null;}} style={{background:"none",border:"none",color:"#0d9488",cursor:"pointer",fontFamily:"inherit"}}>שינוי</button>
          </div>
          {history.length>0&&<details style={{marginBottom:20,background:"#fafafa",padding:12,borderRadius:8}}><summary style={{cursor:"pointer",fontWeight:600,color:"#0d9488"}}>📋 הבקשות הקודמות שלי ({history.length})</summary>
            <div style={{marginTop:10,display:"grid",gap:6}}>{history.map(h=><div key={h.id} style={{padding:10,background:"white",borderRadius:6,fontSize:13,border:"1px solid #e5e7eb"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span>{new Date(h.start_date).toLocaleDateString("he-IL")} - {new Date(h.end_date).toLocaleDateString("he-IL")}</span><span style={{fontSize:11}}>{h.status==="approved"?"✅":h.status==="rejected"?"❌":"⏳"}</span></div>
              <div style={{color:"#6b7280",marginTop:4}}>{h.total_days} ימים · {VACATION_REASON_EMAIL[h.reason_type]}</div>
            </div>)}</div>
          </details>}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:15}}>
            <div><label style={{fontWeight:600,fontSize:14}}>מתאריך *</label><input type="date" value={startDate} onChange={e=>setStartDate(e.target.value)} style={{width:"100%",padding:10,borderRadius:6,border:"1px solid #d1d5db"}}/></div>
            <div><label style={{fontWeight:600,fontSize:14}}>עד תאריך *</label><input type="date" value={endDate} onChange={e=>setEndDate(e.target.value)} min={startDate} style={{width:"100%",padding:10,borderRadius:6,border:"1px solid #d1d5db"}}/></div>
          </div>
          {dayPreview>0&&<div style={{marginBottom:15,padding:8,background:"#f0fdfa",borderRadius:6,color:"#0d9488",textAlign:"center"}}>📊 סה״כ: {dayPreview} ימים</div>}
          <label style={{display:"block",marginBottom:8,fontWeight:600}}>סיבת ההיעדרות *</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:15}}>
            {[{value:"vacation",label:"🏖️ חופשה"},{value:"sick",label:"🤒 מחלה"},{value:"reserve",label:"⚔️ מילואים"},{value:"other",label:"📋 אחר"}].map(opt=>
              <button key={opt.value} type="button" onClick={()=>setReasonType(opt.value)} style={{padding:10,background:reasonType===opt.value?"#0d9488":"white",color:reasonType===opt.value?"white":"#134e4a",border:`2px solid ${reasonType===opt.value?"#0d9488":"#d1d5db"}`,borderRadius:6,cursor:"pointer",fontWeight:600,fontFamily:"inherit"}}>{opt.label}</button>
            )}
          </div>
          <SignupFormField label={reasonType==="other"?"פירוט נוסף *":"פירוט נוסף"} value={reasonNotes} onChange={setReasonNotes} textarea placeholder="הערות..."/>
          <label style={{display:"block",marginBottom:8,fontWeight:600}}>✍️ חתימה דיגיטלית *</label>
          <div style={{border:"2px solid #d1d5db",borderRadius:8,overflow:"hidden",marginBottom:8}}><canvas ref={canvasRef} style={{display:"block",width:"100%",height:180,touchAction:"none"}}/></div>
          <button type="button" onClick={()=>padRef.current?.clear()} style={{marginBottom:16,padding:"6px 12px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ נקה חתימה</button>
          <button type="button" onClick={handleSubmit} disabled={submitting} style={{width:"100%",padding:16,background:"#0d9488",color:"white",border:"none",borderRadius:8,fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>{submitting?"⏳ שולח...":"✅ שלח בקשה"}</button>
        </>}
        {step==="submitted"&&<div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:64,marginBottom:15}}>✅</div>
          <h2 style={{color:"#0d9488"}}>הבקשה נשלחה!</h2>
          <p style={{color:"#64748b"}}>ההנהלה תקבל את הבקשה ותחזור אליך בהקדם.</p>
          <button type="button" onClick={()=>{setStep("identify");setEmployeeName("");setIdLast4("");setStartDate("");setEndDate("");setReasonNotes("");setReasonType("vacation");padRef.current=null;}} style={{marginTop:20,padding:12,background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>📝 הגש בקשה נוספת</button>
        </div>}
      </div>
      <div style={{background:"#f8fafc",padding:15,textAlign:"center",fontSize:12,color:"#64748b"}}>natalie-print.com · 03-6815703</div>
    </div>
  </div>;
}

function VacationReviewModal({request,user,onClose,onUpdate}){
  const [reviewNotes,setReviewNotes]=useState(request.reviewer_notes||"");
  const handleApprove=async()=>{
    await sb(`vacation_requests?id=eq.${request.id}`,{method:"PATCH",body:JSON.stringify({status:"approved",reviewed_at:new Date().toISOString(),reviewed_by:user?.name||"unknown",reviewer_notes:reviewNotes.trim()||null})});
    onUpdate?.();onClose();
  };
  const handleReject=async()=>{
    if(!reviewNotes.trim()){alert("יש לכתוב סיבת דחייה בהערות");return;}
    if(!confirm("לדחות את הבקשה?"))return;
    await sb(`vacation_requests?id=eq.${request.id}`,{method:"PATCH",body:JSON.stringify({status:"rejected",reviewed_at:new Date().toISOString(),reviewed_by:user?.name||"unknown",reviewer_notes:reviewNotes.trim()})});
    onUpdate?.();onClose();
  };
  return<div onClick={onClose} style={SIGNUP_MODAL_OVERLAY}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:600,maxHeight:"90vh",overflowY:"auto",direction:"rtl"}}>
      <h2 style={{color:"#0d9488"}}>📋 בקשת חופש — {request.employee_name}</h2>
      <SignupDetailRow label="סוג" value={VACATION_REASON_LABELS[request.reason_type]}/>
      <SignupDetailRow label="תאריכים" value={`${new Date(request.start_date).toLocaleDateString("he-IL")} - ${new Date(request.end_date).toLocaleDateString("he-IL")} (${request.total_days} ימים)`}/>
      {request.reason_notes&&<SignupDetailRow label="פירוט" value={request.reason_notes}/>}
      <img src={request.signature_data} alt="חתימה" style={{maxHeight:120,maxWidth:"100%",display:"block",margin:"12px auto"}}/>
      {request.status==="pending"?<>
        <textarea value={reviewNotes} onChange={e=>setReviewNotes(e.target.value)} placeholder="הערות מנהל..." style={{width:"100%",minHeight:60,padding:8,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit",margin:"12px 0"}}/>
        <div style={{display:"flex",gap:10}}>
          <button type="button" onClick={handleReject} style={{flex:1,padding:12,background:"#ef4444",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>❌ דחה</button>
          <button type="button" onClick={handleApprove} style={{flex:2,padding:12,background:"#10b981",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>✅ אשר</button>
        </div>
      </>:<div style={{padding:12,background:request.status==="approved"?"#d1fae5":"#fee2e2",borderRadius:6,marginTop:12}}>{request.status==="approved"?"✅ אושר":"❌ נדחה"} {request.reviewer_notes&&" — "+request.reviewer_notes}</div>}
      <button type="button" onClick={onClose} style={{width:"100%",padding:10,marginTop:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>סגור</button>
    </div>
  </div>;
}

function VacationFormManager({user}){
  const [config,setConfig]=useState(null);
  const [requests,setRequests]=useState([]);
  const [filter,setFilter]=useState("pending");
  const [copied,setCopied]=useState(false);
  const loadData=async()=>{
    try{
      const cfg=await sb("vacation_form_config?id=eq.1&limit=1");
      setConfig(cfg?.[0]||null);
      const reqs=await sb("vacation_requests?order=submitted_at.desc&limit=100");
      setRequests(reqs||[]);
    }catch(e){console.warn(e);}
  };
  useEffect(()=>{loadData();const t=setInterval(loadData,30000);return()=>clearInterval(t);},[]);
  if(!config)return<div>טוען...</div>;
  const formUrl=`${window.location.origin}${window.location.pathname||""}${window.location.search||""}#vacation-form/${config.form_slug}`;
  const filtered=requests.filter(r=>filter==="all"||r.status===filter);
  const pendingN=requests.filter(r=>r.status==="pending").length;
  return<div>
    <h1 style={{fontSize:22,fontWeight:800,margin:"0 0 20px"}}>📅 ניהול חופשות עובדים</h1>
    <div style={{background:"linear-gradient(135deg,#f0fdfa,#fff)",padding:20,borderRadius:10,marginBottom:20,border:"2px solid #2dd4bf"}}>
      <h3 style={{color:"#0d9488",margin:"0 0 10px"}}>🔗 קישור קבוע לטופס חופש</h3>
      <div style={{background:"white",padding:12,borderRadius:6,direction:"ltr",fontSize:13,wordBreak:"break-all",fontFamily:"monospace",marginBottom:10,border:"1px solid #e5e7eb"}}>{formUrl}</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <button type="button" onClick={async()=>{try{await navigator.clipboard.writeText(formUrl);setCopied(true);setTimeout(()=>setCopied(false),2000);}catch{}}} style={{padding:10,background:copied?"#10b981":"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>{copied?"✅ הועתק":"📋 העתק"}</button>
        <button type="button" onClick={()=>window.open(`https://wa.me/?text=${encodeURIComponent("קישור לבקשת חופש בדפוס נטלי:\n"+formUrl)}`,"_blank")} style={{padding:10,background:"#25d366",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>📱 WhatsApp</button>
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:15,flexWrap:"wrap"}}>
      <button type="button" onClick={()=>setFilter("pending")} style={vacationTabStyle(filter==="pending")}>⏳ ממתינות ({pendingN})</button>
      <button type="button" onClick={()=>setFilter("approved")} style={vacationTabStyle(filter==="approved")}>✅ מאושרות</button>
      <button type="button" onClick={()=>setFilter("rejected")} style={vacationTabStyle(filter==="rejected")}>❌ נדחו</button>
      <button type="button" onClick={()=>setFilter("all")} style={vacationTabStyle(filter==="all")}>הכל</button>
    </div>
    {filtered.length===0?<div style={{textAlign:"center",padding:40,color:"#9ca3af"}}>אין בקשות</div>:
    <div style={{display:"grid",gap:10}}>{filtered.map(r=><VacationRequestCard key={r.id} request={r} user={user} onUpdate={loadData}/>)}</div>}
  </div>;
}

  const BCF_DEFAULT=()=>({custName:"",custTz:"",custCity:"",custAddress:"",custGroup:"ישראל",custTel:"",custCel:"",custEmail:"",termsofPayment:"שוטף + 30",notes:""});

  useEffect(()=>{

  const validateBcf=()=>{
    const er={};
    const t=s=>String(s||"").trim();
    if(!t(bcf.custName))er.custName="שדה חובה";
    if(bcfDigits(bcf.custTz).length!==9)er.custTz="נדרשות בדיוק 9 ספרות";
    if(!t(bcf.custCity))er.custCity="שדה חובה";
    if(!t(bcf.custAddress))er.custAddress="שדה חובה";
    if(!t(bcf.custGroup))er.custGroup="שדה חובה";
    const tel=bcfDigits(bcf.custTel);
    if(tel.length<9||tel.length>10)er.custTel="9–10 ספרות";
    const cel=bcfDigits(bcf.custCel);
    if(cel.length<9||cel.length>10)er.custCel="9–10 ספרות";

          {bcfErr.custCel&&<div style={{color:"#DC2626",fontSize:11,marginTop:4,fontWeight:600}}>{bcfErr.custCel}</div>}</div>

        <div><label style={LS}>הערות (אופציונלי — רק PrintOS)</label><textarea style={{...IS,minHeight:72,resize:"vertical"}} value={bcf.notes} onChange={e=>setBcf(p=>({...p,notes:e.target.value}))} placeholder="לא נשלח לבינה"/></div>
        <div style={{display:"flex",gap:10,marginTop:8,flexWrap:"wrap"}}>
          <button type="button" disabled={binaClientSaving} onClick={submitBinaCustomer} style={{flex:1,minWidth:140,padding:"11px",borderRadius:10,border:"none",background:binaClientSaving?"var(--bg3)":"var(--green)",color:"#fff",fontWeight:700,fontSize:14,cursor:binaClientSaving?"wait":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>

          </button>
          <button type="button" disabled={binaClientSaving} onClick={()=>setBinaClientOpen(false)} style={{padding:"11px 18px",borderRadius:10,border:"1px solid var(--border)",background:"var(--bg2)",color:"var(--text2)",fontWeight:600,fontSize:14,cursor:binaClientSaving?"not-allowed":"pointer",fontFamily:"inherit"}}>ביטול</button>
        </div>
      </div>

  }
  
  .label {
    width: 10cm;
    height: 10cm;
    border: 2px dashed #d1d5db;
    padding: 8mm;
    background: #fff;
    display: flex;
    flex-direction: column;
    page-break-inside: avoid;
    position: relative;
    overflow: hidden;
  }
  
  /* ===== LABEL WITH LOGO ===== */
  .label.with-logo .logo-area {
    text-align: center;
    padding-bottom: 4mm;
    border-bottom: 2px solid #3DB5B1;
    margin-bottom: 4mm;
  }
  .label.with-logo .logo-text {
    font-size: 22px;
    font-weight: 900;
    color: #1E3A52;
    letter-spacing: 1.5px;
    line-height: 1;
  }
  .label.with-logo .logo-sub {
    font-size: 10px;
    color: #3DB5B1;
    font-weight: 600;
    margin-top: 2px;
  }
  
  /* ===== LABEL CONTENT ===== */
  .label .client {
    font-size: 16px;
    font-weight: 700;
    color: #1E3A52;
    margin-bottom: 3mm;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
  }
  
  .label .order-title {
    font-size: 14px;
    font-weight: 700;
    color: #1E3A52;
    margin-bottom: 2mm;
    line-height: 1.3;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  
  .label .order-details {
    font-size: 12px;
    color: #6b7280;
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    flex: 1;
  }
  
  .label .footer {
    border-top: 1px solid #e5e7eb;
    padding-top: 3mm;
    margin-top: auto;
    font-size: 11px;
    color: #6b7280;
    display: flex;
    justify-content: space-between;
  }
  
  .label.with-logo .footer .company-info {
    font-weight: 600;
    color: #3DB5B1;
  }
  
  /* ===== PRINT STYLES ===== */
  @media print {
    body {
      background: #fff;
      padding: 0;
      margin: 0;
    }
    
    @page {
      size: A4;
      margin: 0;
    }
    
    .toolbar { display: none !important; }
    
    .label-area {
      box-shadow: none;
      padding: 0;
      min-height: 0;
      background: #fff;
      display: block;
      width: 21cm;
      height: 29.7cm;
      page-break-after: avoid;
    }
    
    .label {
      border: none;
      margin: 6cm auto 0 auto;  /* מרכוז במידת A4 */
      page-break-inside: avoid;
    }
  }
</style>
</head>
<body>

<div class="container">
  
  <!-- TOOLBAR -->
  <div class="toolbar no-print">
    <h1>🏷️ הדפסת מדבקת אריזה</h1>
    
    <div class="actions">
      <button class="btn btn-type" id="btn-with-logo" onclick="setLabelType('with-logo')">
        🎯 עם לוגו (ללקוח סופי)
      </button>
      <button class="btn btn-type" id="btn-no-logo" onclick="setLabelType('no-logo')">
        🏢 ללא לוגו (לבית דפוס)
      </button>
    </div>
    
    <div style="margin-top: 16px;">
      <button class="btn btn-print" onclick="window.print()" id="btn-print" disabled>
        🖨️ הדפס / שמור כ-PDF
      </button>
      <button class="btn btn-close" onclick="window.close()">✕ סגור</button>
    </div>
    
    <div style="margin-top: 12px; font-size: 12px; color: #9ca3af;">
      מידה: 10×10 ס"מ · ממורכז ב-A4
    </div>
  </div>
  
  <!-- LABEL PREVIEW -->
  <div class="label-area" id="label-container">
    <div style="color: #9ca3af; text-align: center;">
      👆 בחר סוג מדבקה למעלה
    </div>
  </div>
  
</div>

<script>
  const taskData = {
    orderTitle: ${JSON.stringify(orderTitle)},
    orderDetails: ${JSON.stringify(orderDetails)},
    clientName: ${JSON.stringify(clientName)},
    contactName: ${JSON.stringify(contactName)},
    orderNumber: ${JSON.stringify(orderNumber)},
    orderDate: ${JSON.stringify(orderDate)},
  };
  
  function escapeHtml(unsafe) {
    return String(unsafe || '')
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  
  function setLabelType(type) {
    document.getElementById('btn-with-logo').classList.toggle('active', type === 'with-logo');
    document.getElementById('btn-no-logo').classList.toggle('active', type === 'no-logo');
    document.getElementById('btn-print').disabled = false;
    
    const container = document.getElementById('label-container');
    
    if (type === 'with-logo') {
      // ===== מדבקה עם לוגו - כל הפרטים =====
      container.innerHTML = \`
        <div class="label with-logo">
          <div class="logo-area">
            <div class="logo-text">NATALIE</div>
            <div class="logo-sub">פתרונות הדפסה</div>
          </div>
          
          \${taskData.clientName ? '<div class="client">לכבוד: ' + escapeHtml(taskData.clientName) + '</div>' : ''}
          
          <div class="order-title">\${escapeHtml(taskData.orderTitle)}</div>
          
          \${taskData.orderDetails ? '<div class="order-details">' + escapeHtml(taskData.orderDetails) + '</div>' : ''}
          
          <div class="footer">
            <div>
              \${taskData.orderNumber ? 'הזמנה #' + escapeHtml(taskData.orderNumber) : ''}
              \${taskData.orderDate ? '<br>' + escapeHtml(taskData.orderDate) : ''}
              \${taskData.contactName ? '<br>לידי: ' + escapeHtml(taskData.contactName) : ''}
            </div>
            <div class="company-info">
              📞 03-6815703
            </div>
          </div>
        </div>
      \`;
    } else {
      // ===== מדבקה ללא לוגו - רק כותרת + פירוט =====
      container.innerHTML = \`
        <div class="label">
          <div class="order-title" style="font-size: 18px; margin-bottom: 4mm; -webkit-line-clamp: 3;">
            \${escapeHtml(taskData.orderTitle)}
          </div>
          
          \${taskData.orderDetails ? '<div class="order-details" style="font-size: 13px; -webkit-line-clamp: 8;">' + escapeHtml(taskData.orderDetails) + '</div>' : ''}
          
          \${taskData.orderNumber ? '<div class="footer" style="border-top: 1px dashed #d1d5db;"><div>#' + escapeHtml(taskData.orderNumber) + '</div></div>' : ''}
        </div>
      \`;
    }
  }
<\/script>

</body>
</html>`;

  const win = window.open('', '_blank', 'width=900,height=900');
  if (!win) {
    alert('הדפדפן חסם פתיחת חלון. אנא אשר חלונות קופצים לאתר זה.');
    return;
  }
  win.document.write(html);
  win.document.close();
};

</script>
</body>
</html>
