<style>
:root{
  --bg:#F8FAFC;
  --bg2:#F1F5F9;
  --bg3:#E2E8F0;
  --surface:#FFFFFF;
  --border:#E2E8F0;
  --border2:#CBD5E1;
  --text:#0F172A;
  --text2:#475569;
  --text3:#94A3B8;
  --blue:#2563EB;
  --blue-light:#EFF6FF;
  --blue-mid:#BFDBFE;
  --green:#16A34A;
  --green-light:#F0FDF4;
  --red:#DC2626;
  --red-light:#FEF2F2;
  --amber:#D97706;
  --amber-light:#FFFBEB;
  --purple:#7C3AED;
  --shadow:0 1px 3px rgba(0,0,0,0.06),0 1px 2px rgba(0,0,0,0.04);
  --shadow-md:0 4px 12px rgba(0,0,0,0.08),0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:0 10px 40px rgba(0,0,0,0.12);
  --radius:12px;
  --sidebar:240px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Heebo',sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}
select option{background:#fff;color:var(--text)}
input[type="date"]::-webkit-calendar-picker-indicator{opacity:0.5}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.5;transform:scale(1.2)}}
@media(max-width:768px){
  .sd{display:none!important}
  .sm{display:block!important}
  .tm{display:flex!important}
  .bn{display:block!important}
  .ma{margin-right:0!important;padding:16px 16px 90px!important}
  .kg4{grid-template-columns:repeat(2,1fr)!important}
  .kg3{grid-template-columns:repeat(2,1fr)!important}
  .mg{grid-template-columns:1fr!important}
  .login-grid{grid-template-columns:repeat(2,1fr)!important}
}
@media(max-width:420px){
  .login-grid{grid-template-columns:1fr!important}
  .kg4{grid-template-columns:repeat(2,1fr)!important}
}

.quick-city-cancel{background:#f3f4f6;color:#6b7280}

.debt-date-filters{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.debt-date-filter{display:flex;flex-direction:column;gap:4px;position:relative}
.debt-date-filter label{font-size:13px;color:#6b7280;font-weight:600}
.debt-date-filter input[type="date"]{padding:8px 12px;border:1px solid #d8b4fe;border-radius:6px;font-family:inherit;font-size:14px;direction:ltr}
.debt-clear-date{position:absolute;left:4px;top:26px;background:#f3f4f6;border:none;width:24px;height:24px;border-radius:4px;cursor:pointer;font-size:12px}

.debt-summary-card{padding:20px;border-radius:12px;color:#fff}
.debt-overdue-card{background:linear-gradient(135deg,#dc2626 0%,#b91c1c 100%)}
.debt-future-card{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%)}
.debt-total-card{background:linear-gradient(135deg,#0d9488 0%,#14b8a6 100%)}
.debt-summary-label{font-size:14px;opacity:.9;margin-bottom:8px}

.debt-aging-title{font-size:16px;font-weight:700;color:#0d9488;margin-bottom:16px}

.debt-aging-value{font-size:20px;font-weight:700;color:#1f2937}

const STORAGE_BUCKET="printos-files";
async function uploadFileToStorage(file,folder="misc"){
  const timestamp=Date.now();
  const ext=file.name.includes(".")?"."+file.name.split(".").pop():"";
  const baseName=file.name.replace(ext,"").replace(/[^a-zA-Z0-9._-]/g,"_").substring(0,50);
  const safeFilename=baseName+ext;
  const path=`${folder}/${timestamp}_${safeFilename}`;
  const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
  if(error)throw error;
  return{path,name:file.name,size:file.size,type:file.type};
}
async function getSignedUrl(filePath,expiresIn=3600){
  try{
    const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(filePath,expiresIn);
    if(error)throw error;
    return data?.signedUrl||null;
  }catch(e){console.error("Sign URL error:",e);return null;}
}
async function deleteFileFromStorage(filePath){
  try{
    const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
    return !error;
  }catch(e){console.error("Delete error:",e);return false;}
}
function formatFileSize(bytes){
  if(!bytes)return "";
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";
  if(bytes<1024*1024*1024)return(bytes/1024/1024).toFixed(1)+" MB";
  return(bytes/1024/1024/1024).toFixed(1)+" GB";
}
function getFileIcon(fileType,fileName){
  if(!fileType&&fileName){
    const ext=fileName.split(".").pop().toLowerCase();
    if(["pdf"].includes(ext))return "📄";
    if(["doc","docx"].includes(ext))return "📝";
    if(["xls","xlsx","csv"].includes(ext))return "📊";
    if(["ppt","pptx"].includes(ext))return "📊";
    if(["jpg","jpeg","png","gif","webp","svg"].includes(ext))return "🖼️";
    if(["zip","rar","7z"].includes(ext))return "🗜️";
    if(["mp4","avi","mov"].includes(ext))return "🎥";
    if(["mp3","wav"].includes(ext))return "🎵";
    return "📎";
  }
  if(fileType?.startsWith("image/"))return "🖼️";
  if(fileType==="application/pdf")return "📄";
  if(fileType?.includes("word"))return "📝";
  if(fileType?.includes("excel")||fileType?.includes("spreadsheet"))return "📊";
  if(fileType?.includes("zip"))return "🗜️";
  if(fileType?.startsWith("video/"))return "🎥";
  if(fileType?.startsWith("audio/"))return "🎵";
  return "📎";
}

function calculateAge(birthDate){
  if(!birthDate)return null;
  const today=new Date();
  const birth=new Date(birthDate);
  let age=today.getFullYear()-birth.getFullYear();
  const monthDiff=today.getMonth()-birth.getMonth();
  if(monthDiff<0||(monthDiff===0&&today.getDate()<birth.getDate()))age--;
  return age;
}
function daysUntilBirthday(birthDate){
  if(!birthDate)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const birth=new Date(birthDate);
  const nextBirthday=new Date(today.getFullYear(),birth.getMonth(),birth.getDate());
  if(nextBirthday<today)nextBirthday.setFullYear(today.getFullYear()+1);
  return Math.floor((nextBirthday-today)/(1000*60*60*24));
}

const taskSchedDateKey=t=>t.scheduled_for_date?String(t.scheduled_for_date).split("T")[0]:null;
const taskPriorityBorderColor=p=>p==="דחוף"?"#ef4444":p==="גבוהה"?"#f59e0b":"#6b7280";
const parseYmdDate=s=>{const [y,m,d]=String(s).split("T")[0].split("-").map(Number);return new Date(y,m-1,d);};
function groupTasksByScheduledDate(tasks){
  const groups={past:[],byDate:{},unscheduled:[]};
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=toLocalDateStr(today);
  (tasks||[]).forEach(task=>{
    const key=taskSchedDateKey(task);
    if(!key){groups.unscheduled.push(task);return;}
    if(key<todayStr)groups.past.push(task);
    else{(groups.byDate[key]=groups.byDate[key]||[]).push(task);}
  });
  const result=[];
  if(groups.past.length)result.push({key:"past",label:"⚠️ משימות מהעבר",tasks:groups.past,isHighlight:false,isPast:true});
  Object.keys(groups.byDate).sort().forEach(dateStr=>{
    const d=parseYmdDate(dateStr);
    const isToday=dateStr===todayStr;
    const diffDays=Math.floor((d-today)/(86400000));
    let prefix="";
    if(diffDays===0)prefix="היום · ";
    else if(diffDays===1)prefix="מחר · ";
    const dayName=d.toLocaleDateString("he-IL",{weekday:"long"});
    const dateLabel=d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
    result.push({key:dateStr,label:`📅 ${prefix}${dayName}, ${dateLabel}`,tasks:groups.byDate[dateStr],isHighlight:isToday,isPast:false});
  });
  if(groups.unscheduled.length)result.push({key:"unscheduled",label:"📋 לא מתוזמן",tasks:groups.unscheduled,isHighlight:false,isPast:false});
  return result;
}

}
function ClientNotificationModal({task,notificationType,clients,user,onClose,onSent}){

    try{
      const isFirst=savedEmails.length===0;
      await sb("client_notification_emails",{method:"POST",body:JSON.stringify({client_id:client.id,email:newEmail.trim(),label:newLabel.trim()||null,is_default:isFirst,created_by:user?.name||"unknown"})});
      const email=newEmail.trim();

        if(cancelled)return;

        let pool=[];

        const cc=[];

        setCcEmails(cc);
        if(pool.length===0){
          if(!clientData){setError("לא נמצא לקוח מקושר למשימה זו. יש להגדיר לקוח קודם.");setStep("error");}
          else setStep("addFirstEmail");
        }else setStep("pickEmail");
      }catch(e){if(!cancelled){setError("שגיאה בטעינה: "+(e.message||String(e)));setStep("error");}}

function RefreshFromBinaButton({task,compact,onUpdate}){
  const [refreshing,setRefreshing]=useState(false);
  const [result,setResult]=useState(null);
  if(!task?.bina_order_id)return null;
  const handleRefresh=async e=>{
    e?.stopPropagation();
    setRefreshing(true);
    setResult(null);
    const r=await refreshTaskFromBina(task);
    setResult(r);
    setRefreshing(false);
    if(r.success&&r.changes&&r.changes.length>0)onUpdate?.();

  </>;
}

function useLongPress(callback,delay=500){
  const timeoutRef=useRef(null);
  const start=e=>{
    if(e.type==="touchstart")e.stopPropagation();
    const target=e.currentTarget;
    timeoutRef.current=setTimeout(()=>{
      if(navigator.vibrate)try{navigator.vibrate(50);}catch(_){}
      callback({currentTarget:target,clientX:e.touches?.[0]?.clientX,clientY:e.touches?.[0]?.clientY});
    },delay);
  };
  const clear=()=>{
    if(timeoutRef.current){clearTimeout(timeoutRef.current);timeoutRef.current=null;}
  };
  return{onTouchStart:start,onTouchEnd:clear,onTouchMove:clear,onTouchCancel:clear};
}

function generateNextWorkingDays(count=5){
  const days=[];
  const today=new Date();today.setHours(0,0,0,0);
  const dayNames=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];
  for(let i=0;i<21&&days.length<count;i++){
    const d=new Date(today);d.setDate(today.getDate()+i);
    const dow=d.getDay();
    if(dow===5||dow===6)continue;
    let label;
    if(i===0)label="היום";
    else if(i===1)label="מחר";
    else label=dayNames[dow];
    days.push({date:toLocalDateStr(d),label,dayNumber:d.getDate(),monthName:d.toLocaleDateString("he-IL",{month:"short"}),dateStr:`${d.getDate()}/${d.getMonth()+1}`});
  }
  return days;
}

function useScheduleMenu(){
  const [menu,setMenu]=useState(null);
  const openMenu=(e,task)=>{
    if(e&&typeof e.preventDefault==="function"){e.preventDefault();e.stopPropagation();}
    const x=e?.clientX??(typeof window!=="undefined"?window.innerWidth/2:0);
    const y=e?.clientY??100;
    setMenu({task,x,y});
  };
  const openMenuAt=(task,rect)=>{
    const x=rect?(rect.left||0): (typeof window!=="undefined"?window.innerWidth/2:0);
    const y=rect?(rect.bottom||rect.top||100):100;
    setMenu({task,x,y});
  };
  const closeMenu=()=>setMenu(null);
  return{menu,openMenu,openMenuAt,closeMenu};
}

function WeeklyTasksView({allTasks,onUpdate,onScheduleMenu,onScheduleAt}){
  const [weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;});
  const [draggedTask,setDraggedTask]=useState(null);
  const weekDays=useMemo(()=>{
    const days=[];
    for(let i=0;i<5;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);days.push(d);}
    return days;
  },[weekStart]);
  const tasksByDate=useMemo(()=>{
    const groups={_unscheduled:[]};
    weekDays.forEach(d=>{groups[toLocalDateStr(d)]=[];});
    allTasks.forEach(t=>{
      const key=taskSchedDateKey(t);
      if(!key){groups._unscheduled.push(t);return;}
      if(groups[key]!==undefined)groups[key].push(t);
    });
    Object.keys(groups).forEach(k=>{groups[k].sort((a,b)=>(a.scheduled_order||0)-(b.scheduled_order||0));});
    return groups;
  },[allTasks,weekDays]);
  const handleDrop=async targetDate=>{
    if(!draggedTask)return;
    const isUnsched=targetDate==="_unscheduled";
    const patch=isUnsched?{scheduled_for_date:null,scheduled_order:null}:{scheduled_for_date:targetDate,scheduled_order:(tasksByDate[targetDate]?.length||0)+1};
    try{
      await sb(`tasks?id=eq.${draggedTask.id}`,{method:"PATCH",body:JSON.stringify(patch)});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    setDraggedTask(null);
  };
  const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);};
  const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);};
  const goToday=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWeekStart(d);};
  const todayStr=toLocalDateStr(new Date());
  const unsched=tasksByDate._unscheduled||[];
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:15,padding:"10px 15px",background:"#f9fafb",borderRadius:8,flexWrap:"wrap",gap:8}}>
      <button type="button" onClick={prevWeek} style={{padding:"6px 12px",background:"#fff",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← שבוע קודם</button>
      <div style={{fontWeight:600,fontSize:15,textAlign:"center"}}>
        {weekStart.toLocaleDateString("he-IL",{day:"numeric",month:"long"})} – {weekDays[4].toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})}
        <button type="button" onClick={goToday} style={{display:"block",margin:"4px auto 0",fontSize:12,background:"none",border:"none",color:"#0d9488",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>היום</button>
      </div>

    </div>
    {unsched.length>0&&<div onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop("_unscheduled")} style={{background:"#fef3c7",padding:15,borderRadius:8,marginBottom:15,border:"2px dashed #f59e0b"}}>
      <h3 style={{margin:"0 0 10px",color:"#78350f",fontSize:14}}>📋 לא מתוזמן ({unsched.length})</h3>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {unsched.slice(0,20).map(t=><TaskScheduleCard key={t.id} task={t} onDragStart={()=>setDraggedTask(t)} onContextMenu={onScheduleMenu} onScheduleAt={onScheduleAt}/>)}
        {unsched.length>20&&<div style={{padding:8,fontSize:12,color:"#78350f",alignSelf:"center"}}>+{unsched.length-20} נוספות</div>}
      </div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
      {weekDays.map(date=>{
        const dateKey=toLocalDateStr(date);
        const tasksForDay=tasksByDate[dateKey]||[];
        const isCurrentDay=dateKey===todayStr;
        return<div key={dateKey} onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop(dateKey)} style={{background:isCurrentDay?"#f0fdfa":"#f9fafb",border:`2px solid ${isCurrentDay?"#2dd4bf":"#e5e7eb"}`,borderRadius:8,padding:10,minHeight:360}}>
          <div style={{textAlign:"center",marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${isCurrentDay?"#2dd4bf":"#e5e7eb"}`}}>
            <div style={{fontWeight:600,color:isCurrentDay?"#0d9488":"#374151"}}>{date.toLocaleDateString("he-IL",{weekday:"long"})}</div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{date.getDate()}/{date.getMonth()+1}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{tasksForDay.length} משימות</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {tasksForDay.map(t=><TaskScheduleCard key={t.id} task={t} onDragStart={()=>setDraggedTask(t)} onContextMenu={onScheduleMenu} onScheduleAt={onScheduleAt}/>)}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

const DAY_COLORS=[
  {bg:"#f0fdfa",border:"#a7f3d0"},
  {bg:"#faf5ff",border:"#e9d5ff"},
  {bg:"#fef3f2",border:"#fecaca"},
  {bg:"#fffbeb",border:"#fde68a"},
  {bg:"#eff6ff",border:"#bfdbfe"},
  {bg:"#f0fdf4",border:"#bbf7d0"},
  {bg:"#fdf2f8",border:"#fbcfe8"},
];
function getDayColor(group,index){
  if(group.isPast)return{bg:"#fefce8",border:"#fde68a"};
  if(group.key==="unscheduled")return{bg:"#f9fafb",border:"#e5e7eb"};
  if(group.isHighlight)return{bg:"#ccfbf1",border:"#5eead4"};
  return DAY_COLORS[index%DAY_COLORS.length];
}

function FileUploadField({folder,onUploaded,currentFile,label="העלאת קובץ",accept}){
  const [uploading,setUploading]=useState(false);
  const [dragOver,setDragOver]=useState(false);
  const fileInputRef=useRef(null);
  const handleFile=async file=>{
    if(!file)return;
    if(file.size>50*1024*1024){
      if(!window.confirm(`הקובץ גדול (${formatFileSize(file.size)}). להמשיך?`))return;
    }
    setUploading(true);
    try{
      const result=await uploadFileToStorage(file,folder);
      onUploaded?.(result);
    }catch(e){window.alert("שגיאה בהעלאה: "+(e.message||String(e)));}
    finally{setUploading(false);}
  };
  const handleDrop=e=>{
    e.preventDefault();
    setDragOver(false);
    const file=e.dataTransfer.files[0];
    handleFile(file);
  };
  return<div>
    <input ref={fileInputRef} type="file" accept={accept} style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
    {currentFile?<div style={{padding:12,background:"#f0fdfa",borderRadius:8,border:"1px solid #2dd4bf",display:"flex",alignItems:"center",gap:10}}>
      <div style={{fontSize:24}}>{getFileIcon(currentFile.type,currentFile.name)}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentFile.name}</div>
        <div style={{fontSize:11,color:"#6b7280"}}>{formatFileSize(currentFile.size)}</div>
      </div>
      <button type="button" onClick={()=>fileInputRef.current?.click()} style={{padding:"6px 10px",background:"#fff",color:"#0d9488",border:"1px solid #0d9488",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>🔄 החלף</button>
    </div>:<div onClick={()=>!uploading&&fileInputRef.current?.click()} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop} style={{padding:25,textAlign:"center",background:dragOver?"#f0fdfa":"#f9fafb",border:`2px dashed ${dragOver?"#2dd4bf":"#d1d5db"}`,borderRadius:8,cursor:uploading?"wait":"pointer",transition:"all 0.2s"}}>
      {uploading?<><div style={{fontSize:32,marginBottom:8}}>⏳</div><div style={{color:"#6b7280"}}>מעלה...</div></>:<><div style={{fontSize:32,marginBottom:8}}>📤</div><div style={{fontWeight:600,color:"#374151"}}>{label}</div><div style={{fontSize:12,color:"#6b7280",marginTop:4}}>לחץ או גרור לכאן כל סוג קובץ</div></>}
    </div>}
  </div>;
}

function DocumentRow({doc,onUpdate}){
  const [showDetails,setShowDetails]=useState(false);
  let expiryStatus=null;
  if(doc.expires_at){
    const now=new Date();now.setHours(0,0,0,0);
    const exp=new Date(doc.expires_at);
    const diffDays=Math.floor((exp-now)/(1000*60*60*24));
    if(diffDays<0)expiryStatus={text:`פג לפני ${Math.abs(diffDays)} ימים`,color:"#dc2626",icon:"🔴"};
    else if(diffDays===0)expiryStatus={text:"פג היום",color:"#dc2626",icon:"🔴"};
    else if(diffDays<=7)expiryStatus={text:`יפוג בעוד ${diffDays} ימים`,color:"#ea580c",icon:"🟠"};
    else if(diffDays<=30)expiryStatus={text:`יפוג בעוד ${diffDays} ימים`,color:"#ca8a04",icon:"🟡"};
    else expiryStatus={text:`תוקף עד ${new Date(doc.expires_at).toLocaleDateString("he-IL")}`,color:"#10b981",icon:"🟢"};
  }
  return<>

function DocumentsDashboard({user}){
  const [view,setView]=useState("categories");
  const [selectedCategory,setSelectedCategory]=useState(null);
  const [searchQuery,setSearchQuery]=useState("");
  const [allDocs,setAllDocs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showUpload,setShowUpload]=useState(false);
  const loadDocs=async()=>{
    try{
      const data=await sb("documents?employee_id=is.null&order=uploaded_at.desc&limit=500");
      setAllDocs(data||[]);
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };
  useEffect(()=>{
    loadDocs();
    const interval=setInterval(loadDocs,60000);
    return()=>clearInterval(interval);
  },[]);
  const expiringDocs=useMemo(()=>{
    const now=new Date();now.setHours(0,0,0,0);
    return allDocs.filter(d=>d.expires_at).map(d=>{
      const exp=new Date(d.expires_at);
      const diffDays=Math.floor((exp-now)/(1000*60*60*24));
      return{...d,diffDays};
    }).filter(d=>d.diffDays<=30).sort((a,b)=>a.diffDays-b.diffDays);
  },[allDocs]);
  const countsByCategory=useMemo(()=>{
    const counts={};
    DOCUMENT_CATEGORIES.forEach(c=>{counts[c.id]=0;});
    allDocs.forEach(d=>{if(d.category&&counts[d.category]!==undefined)counts[d.category]++;});
    return counts;
  },[allDocs]);
  const searchResults=useMemo(()=>{
    if(!searchQuery.trim())return [];
    const q=searchQuery.trim().toLowerCase();
    return allDocs.filter(d=>(d.title||"").toLowerCase().includes(q)||(d.description||"").toLowerCase().includes(q)||(d.file_name||"").toLowerCase().includes(q)||(d.tags||[]).some(t=>String(t).toLowerCase().includes(q)));
  },[allDocs,searchQuery]);
  if(loading)return<div style={{padding:30,textAlign:"center"}}>טוען...</div>;
  return<div style={{padding:20}}>
    <h2 style={{margin:"0 0 5px"}}>📁 מסמכי החברה</h2>
    <p style={{margin:"0 0 20px",color:"#6b7280",fontSize:14}}>כל המסמכים החשובים במקום אחד - עם תזכורות לתפוגה</p>
    {expiringDocs.length>0&&<ExpiringDocsBanner docs={expiringDocs} onClickDoc={doc=>{const cat=DOCUMENT_CATEGORIES.find(c=>c.id===doc.category);if(cat){setSelectedCategory(cat);setView("category");}}}/>}
    <div style={{display:"flex",gap:10,marginBottom:20}}>
      <input type="text" value={searchQuery} onChange={e=>{setSearchQuery(e.target.value);setView(e.target.value?"search":"categories");}} placeholder="🔍 חיפוש מסמכים..." style={{flex:1,padding:12,borderRadius:8,border:"1px solid #d1d5db",fontSize:14,fontFamily:"inherit"}}/>
      <button type="button" onClick={()=>setShowUpload(true)} style={{padding:"12px 20px",background:"#0d9488",color:"white",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>➕ העלה מסמך</button>
    </div>
    {view==="categories"&&<CategoriesGrid counts={countsByCategory} onSelect={cat=>{setSelectedCategory(cat);setView("category");}}/>}
    {view==="category"&&selectedCategory&&<CategoryView category={selectedCategory} docs={allDocs.filter(d=>d.category===selectedCategory.id)} onBack={()=>{setSelectedCategory(null);setView("categories");}} onUpdate={loadDocs}/>}
    {view==="search"&&<SearchResults query={searchQuery} results={searchResults} onUpdate={loadDocs}/>}
    {showUpload&&<UploadDocumentModal user={user} onClose={()=>setShowUpload(false)} onUploaded={()=>{loadDocs();setShowUpload(false);}} defaultCategory={selectedCategory?.id}/>}
  </div>;
}

    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  if(editing)return<div>
    <EmployeeFormSectionTitle>📋 פרטים אישיים</EmployeeFormSectionTitle>
    <div style={grid2}>
      <div><label style={{fontWeight:600,fontSize:13}}>שם מלא *:</label><input value={fullName} onChange={e=>setFullName(e.target.value)} style={inp}/></div>
      {hasHr&&<div><label style={{fontWeight:600,fontSize:13}}>תעודת זהות:</label><input value={idNumber} onChange={e=>setIdNumber(e.target.value)} placeholder="9 ספרות" style={{...inp,direction:"ltr"}}/></div>}
      <div><label style={{fontWeight:600,fontSize:13}}>טלפון:</label><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="050-1234567" style={{...inp,direction:"ltr"}}/></div>
      {hasHr&&<div><label style={{fontWeight:600,fontSize:13}}>מייל:</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} style={{...inp,direction:"ltr"}}/></div>}
      {hasHr&&<div style={{gridColumn:"1 / -1"}}><label style={{fontWeight:600,fontSize:13}}>כתובת מגורים:</label><input value={address} onChange={e=>setAddress(e.target.value)} placeholder="רחוב, מספר, עיר" style={inp}/></div>}
      <div><label style={{fontWeight:600,fontSize:13}}>תאריך לידה:</label><input type="date" value={birthDate} onChange={e=>setBirthDate(e.target.value)} style={inp}/></div>
    </div>
    {hasHr&&<>
      <EmployeeFormSectionTitle>💼 תפקיד ותנאים</EmployeeFormSectionTitle>
      <div style={grid2}>
        <div><label style={{fontWeight:600,fontSize:13}}>תפקיד:</label><input value={roleTitle} onChange={e=>setRoleTitle(e.target.value)} style={inp}/></div>
        <div><label style={{fontWeight:600,fontSize:13}}>תאריך תחילת עבודה:</label><input type="date" value={workStartDate} onChange={e=>setWorkStartDate(e.target.value)} style={inp}/></div>
        <div><label style={{fontWeight:600,fontSize:13}}>סוג העסקה:</label><select value={employmentType} onChange={e=>setEmploymentType(e.target.value)} style={inp}>
          <option value="employee">עובד/ת</option><option value="shareholder">בעל/ת מניות</option><option value="contractor">קבלן/ית</option>
        </select></div>
        <div><label style={{fontWeight:600,fontSize:13}}>סוג שכר:</label><select value={salaryType} onChange={e=>setSalaryType(e.target.value)} style={inp}>
          <option value="monthly">חודשי רגיל</option><option value="monthly_global">חודשי גלובלי</option><option value="hourly">שעתי</option>
        </select></div>
        <div><label style={{fontWeight:600,fontSize:13}}>שכר בסיס ({salaryType==="hourly"?'ש"ח לשעה':'ש"ח לחודש'}):</label><input type="number" value={baseSalary} onChange={e=>setBaseSalary(e.target.value)} style={{...inp,direction:"ltr"}}/></div>
      </div>
      <EmployeeFormSectionTitle>🏦 פנסיה וסוציאלי</EmployeeFormSectionTitle>
      <div style={grid2}>
        <div><label style={{fontWeight:600,fontSize:13}}>קרן פנסיה / קופה:</label><input value={pensionProvider} onChange={e=>setPensionProvider(e.target.value)} placeholder="למשל: הפניקס" style={inp}/></div>
        <div><label style={{fontWeight:600,fontSize:13}}>מעמד סעיף 14:</label><select value={section14Status} onChange={e=>setSection14Status(e.target.value)} style={inp}>
          <option value="">-- בחר --</option><option value="yes_full">כן - מלא</option><option value="yes_cap">כן - עד תקרה</option><option value="no">לא</option><option value="pending">ממתין</option>
        </select></div>
      </div>
    </>}
    {!hasHr&&<div style={{marginTop:12,padding:10,background:"#fef3c7",borderRadius:6,fontSize:12,color:"#92400e"}}>⚠️ שדות HR מורחבים (ת.ז, תפקיד, שכר, פנסיה) יופיעו אחרי הרצת מיגרציית ה-SQL של שדרוג העובדים.</div>}
    <div style={{marginTop:12,marginBottom:15}}><label style={{fontWeight:600,fontSize:13}}>הערות:</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} style={{...inp,minHeight:60}}/></div>
    <div style={{display:"flex",gap:10}}>
      <button type="button" onClick={()=>setEditing(false)} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
      <button type="button" onClick={handleSave} style={{flex:2,padding:10,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור</button>
    </div>
  </div>;
  const seniority=employee.work_start_date?Math.floor((Date.now()-new Date(employee.work_start_date).getTime())/(365.25*24*3600*1000)):null;
  return<div>
    <div style={{display:"grid",gap:12,marginBottom:20}}>
      {employee.role_title&&<DetailItem icon="💼" label="תפקיד" value={`${employee.role_title}${employee.employment_type?` · ${EMPLOYMENT_TYPE_LABELS[employee.employment_type]||employee.employment_type}`:""}`}/>}
      {employee.id_number&&<DetailItem icon="🪪" label="תעודת זהות" value={employee.id_number} ltr/>}
      <DetailItem icon="📞" label="טלפון" value={employee.phone||"—"} ltr={!!employee.phone}/>
      {employee.email&&<DetailItem icon="📧" label="מייל" value={employee.email} ltr/>}
      {employee.address&&<DetailItem icon="🏠" label="כתובת" value={employee.address}/>}
      <DetailItem icon="🎂" label="תאריך לידה" value={employee.birth_date?`${new Date(employee.birth_date).toLocaleDateString("he-IL")} (גיל ${age})`:"—"}/>
      {daysUntil!==null&&<DetailItem icon="⭐" label="ימים עד יום הולדת הבא" value={daysUntil===0?"🎉 היום!":`${daysUntil} ימים`} highlight={daysUntil<=7}/>}
      {employee.work_start_date&&<DetailItem icon="📅" label="תחילת עבודה" value={`${new Date(employee.work_start_date).toLocaleDateString("he-IL")}${seniority!==null?` (ותק ${seniority} שנים)`:""}`}/>}
      {employee.base_salary!=null&&<DetailItem icon="💰" label="שכר בסיס" value={`${Number(employee.base_salary).toLocaleString("he-IL")} ₪ ${employee.salary_type==="hourly"?"לשעה":"לחודש"}${employee.salary_type?` · ${SALARY_TYPE_LABELS[employee.salary_type]||""}`:""}`}/>}
      {employee.pension_provider&&<DetailItem icon="🏦" label="קרן פנסיה / קופה" value={employee.pension_provider}/>}
      {employee.section_14_status&&<DetailItem icon="📜" label="מעמד סעיף 14" value={SECTION_14_LABELS[employee.section_14_status]||employee.section_14_status}/>}
      {employee.last_contract_review_date&&<DetailItem icon="🔄" label="עדכון הסכם אחרון" value={new Date(employee.last_contract_review_date).toLocaleDateString("he-IL")}/>}
      {employee.notes&&<DetailItem icon="📝" label="הערות" value={employee.notes}/>}
    </div>
    <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
      <button type="button" onClick={handleDelete} style={{padding:10,background:"white",color:"#ef4444",border:"1px solid #ef4444",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ מחק עובד</button>
      {hasHr&&<button type="button" onClick={()=>setShowAmendment(true)} style={{padding:10,background:"linear-gradient(135deg, #f59e0b 0%, #f97316 100%)",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>📝 יצירת נספח עדכון</button>}
      <button type="button" onClick={()=>setEditing(true)} style={{flex:1,padding:10,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>✏️ ערוך פרטים</button>
    </div>
    {showAmendment&&<ContractAmendmentModal employee={employee} onClose={()=>setShowAmendment(false)} onCreated={onUpdate}/>}
  </div>;
}

function buildContractAmendmentHtml(employee,amendmentDate,changes){
  const heDate=d=>new Date(d).toLocaleDateString("he-IL");
  return `<!DOCTYPE html>

    .header-info { margin-bottom: 20px; }

    .clause { margin: 15px 0; }
    .clause-num { font-weight: bold; }
    .signature-block { margin-top: 60px; display: flex; justify-content: space-around; }
    .signature-line { border-top: 1px solid #000; padding-top: 4px; text-align: center; width: 200px; }

  </style>
</head>
<body>
  <h1>נספח לעדכון תנאי העסקה</h1>
  <div class="header-info">
    <p>שנערך ונחתם ב-________ ביום ${heDate(amendmentDate)}</p>
  </div>
  <div class="parties">
    <p><strong>בין:</strong> נטלי פתרונות הדפסה בע"מ, ח.פ. 517205332<br>
    מרחוב שדרות הר ציון 104, תל אביב<br>
    (להלן: "החברה")</p>
    <p><strong>לבין:</strong> ${employee.full_name}, ת.ז. ${employee.id_number||"________"}<br>
    ${employee.address?`מרחוב ${employee.address}`:""}<br>
    (להלן: "העובד/ת")</p>
  </div>
  <div class="clause">
    <p><span class="clause-num">1.</span> <strong>רקע</strong></p>
    <p>העובד/ת מועסק/ת בחברה החל מיום ${employee.work_start_date?heDate(employee.work_start_date):"________"}
    בתפקיד ${employee.role_title||"________"}, בהתאם להסכם עבודה שנחתם בין הצדדים.</p>
  </div>

    <p><span class="clause-num">2.</span> <strong>עדכון תנאים</strong></p>
    <p>הצדדים מסכימים בזאת על עדכון תנאי ההעסקה כדלקמן, החל מיום ${heDate(amendmentDate)}:</p>
    <ul style="padding-right: 25px;">
      ${changes.salary.enabled?`
        <li><strong>שכר:</strong>
          שכר העובד/ת יעודכן ל-${changes.salary.new_amount} ש"ח

          (${changes.salary.type==="monthly_global"?"שכר כולל וגלובלי":changes.salary.type==="monthly"?"שכר חודשי":"שכר שעתי"}).
          <br><span class="placeholder">[עו"ד: להוסיף ניסוח משפטי מדויק]</span>
        </li>`:""}
      ${changes.role.enabled?`
        <li><strong>תפקיד:</strong>
          תפקידו/ה של העובד/ת יעודכן ל-${changes.role.new_role}.
          <br><span class="placeholder">[עו"ד: להוסיף פירוט תפקיד וסמכויות]</span>
        </li>`:""}
      ${changes.scope.enabled?`
        <li><strong>היקף משרה:</strong>
          היקף המשרה יעודכן ל-${changes.scope.new_scope}.

function ContractAmendmentModal({employee,onClose,onCreated}){
  const [amendmentDate,setAmendmentDate]=useState(new Date().toISOString().split("T")[0]);
  const [changes,setChanges]=useState({
    salary:{enabled:false,new_amount:"",type:employee.salary_type||"monthly"},
    role:{enabled:false,new_role:""},
    scope:{enabled:false,new_scope:""},
    other:{enabled:false,description:""},
  });
  const [generating,setGenerating]=useState(false);
  const inp={flex:1,padding:"8px 10px",border:"1px solid #d1d5db",borderRadius:6,fontFamily:"inherit",fontSize:14};
  const toggleChange=key=>setChanges({...changes,[key]:{...changes[key],enabled:!changes[key].enabled}});
  const updateChange=(key,field,value)=>setChanges({...changes,[key]:{...changes[key],[field]:value}});
  const generatePdf=()=>{
    if(!Object.values(changes).some(c=>c.enabled)){window.alert("נא לבחור לפחות שינוי אחד");return;}
    setGenerating(true);
    try{
      const html=buildContractAmendmentHtml(employee,amendmentDate,changes);
      const printWindow=window.open("","_blank");
      if(!printWindow){window.alert("הדפדפן חסם חלון קופץ - יש לאשר חלונות קופצים ולנסות שוב");return;}
      printWindow.document.write(html);
      printWindow.document.close();
      setTimeout(()=>{
        printWindow.print();
        window.alert(
          "💡 הנספח נוצר בהצלחה!\n\n"+
          '1. לחץ "שמור כ-PDF" בחלון ההדפסה\n'+
          "2. העבר את הקובץ לעו\"ד לבדיקה\n"+
          "3. אחרי חתימה - העלה את הקובץ החתום לתיק ההסכמים של העובד"
        );
      },500);
      onCreated?.();
      onClose();
    }catch(err){window.alert("שגיאה: "+err.message);}
    finally{setGenerating(false);}
  };
  const changeBox={background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,padding:12,marginBottom:10};
  const changeHeader={display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontWeight:600,color:"#1f2937"};
  const changeFields={marginTop:10,paddingRight:26,display:"flex",gap:8};
  return<Modal open onClose={onClose} title="📝 יצירת נספח עדכון תנאים" maxWidth={600}>
    <div style={{display:"flex",gap:12,padding:14,background:"#f0fdfa",borderRadius:10,marginBottom:20,alignItems:"center"}}>
      <div style={{fontSize:32,width:50,height:50,display:"flex",alignItems:"center",justifyContent:"center",background:"white",borderRadius:"50%"}}>👤</div>
      <div style={{flex:1}}>
        <div style={{fontWeight:700,color:"#1f2937",fontSize:16}}>{employee.full_name}</div>
        <div style={{fontSize:13,color:"#6b7280"}}>{employee.role_title||"—"}</div>
        <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>ת.ז.: {employee.id_number||"—"}</div>
      </div>
    </div>
    <div style={{marginBottom:15}}>
      <label style={{fontWeight:600,fontSize:13}}>תאריך עדכון:</label>
      <input type="date" value={amendmentDate} onChange={e=>setAmendmentDate(e.target.value)} style={{...inp,width:"100%",boxSizing:"border-box",marginTop:4}}/>
    </div>
    <h4 style={{margin:"0 0 12px",color:"#0d9488"}}>מה משתנה?</h4>
    <div style={changeBox}>
      <label style={changeHeader}><input type="checkbox" checked={changes.salary.enabled} onChange={()=>toggleChange("salary")}/> 💰 שכר</label>
      {changes.salary.enabled&&<div style={changeFields}>
        <input type="number" value={changes.salary.new_amount} onChange={e=>updateChange("salary","new_amount",e.target.value)} placeholder="סכום חדש" style={inp}/>
        <select value={changes.salary.type} onChange={e=>updateChange("salary","type",e.target.value)} style={inp}>
          <option value="monthly">חודשי רגיל</option><option value="monthly_global">חודשי גלובלי</option><option value="hourly">שעתי</option>
        </select>
      </div>}
    </div>
    <div style={changeBox}>
      <label style={changeHeader}><input type="checkbox" checked={changes.role.enabled} onChange={()=>toggleChange("role")}/> 💼 תפקיד</label>
      {changes.role.enabled&&<div style={changeFields}>
        <input type="text" value={changes.role.new_role} onChange={e=>updateChange("role","new_role",e.target.value)} placeholder="תפקיד חדש" style={inp}/>
      </div>}
    </div>
    <div style={changeBox}>
      <label style={changeHeader}><input type="checkbox" checked={changes.scope.enabled} onChange={()=>toggleChange("scope")}/> ⏰ היקף משרה</label>
      {changes.scope.enabled&&<div style={changeFields}>
        <input type="text" value={changes.scope.new_scope} onChange={e=>updateChange("scope","new_scope",e.target.value)} placeholder="למשל: 80% משרה" style={inp}/>
      </div>}
    </div>
    <div style={changeBox}>
      <label style={changeHeader}><input type="checkbox" checked={changes.other.enabled} onChange={()=>toggleChange("other")}/> 📄 שינוי אחר</label>
      {changes.other.enabled&&<div style={changeFields}>
        <textarea value={changes.other.description} onChange={e=>updateChange("other","description",e.target.value)} placeholder="תאר את השינוי..." rows={3} style={inp}/>
      </div>}
    </div>
    <div style={{padding:12,background:"#fef3c7",borderRight:"4px solid #f59e0b",borderRadius:6,color:"#92400e",fontSize:13,marginTop:15}}>
      ⚠️ <strong>חשוב:</strong> הטיוטה תיווצר אוטומטית עם ניסוחים בסיסיים.
      <br/>יש להעביר לעו"ד לבדיקה והשלמת ניסוחים משפטיים מדויקים לפני החתמה.
    </div>
    <div style={{display:"flex",gap:10,marginTop:20}}>
      <button type="button" onClick={onClose} disabled={generating} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
      <button type="button" onClick={generatePdf} disabled={generating} style={{flex:2,padding:12,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:generating?"wait":"pointer",fontFamily:"inherit"}}>{generating?"⏳ יוצר...":"📄 צור טיוטת PDF"}</button>
    </div>
  </Modal>;
}

function EmployeeDocRow({doc,onUpdate,customLabel}){
  const [previewing,setPreviewing]=useState(false);
  const handleOpen=async()=>{
    setPreviewing(true);
    try{
      const url=await getSignedUrl(doc.file_path);
      if(url)window.open(url,"_blank");
      else window.alert("שגיאה בפתיחה");
    }finally{setPreviewing(false);}
  };
  const handleDelete=async()=>{
    if(!window.confirm(`למחוק את "${doc.title}"?`))return;
    try{
      await deleteFileFromStorage(doc.file_path);
      await sb(`documents?id=eq.${doc.id}`,{method:"DELETE"});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  return<div style={{background:"white",padding:10,borderRadius:6,border:"1px solid #e5e7eb",display:"flex",alignItems:"center",gap:10}}>
    <div style={{fontSize:24}}>{getFileIcon(doc.file_type,doc.file_name)}</div>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontWeight:600,fontSize:13}}>{customLabel||doc.title}</div>
      <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{doc.document_date&&`📅 ${new Date(doc.document_date).toLocaleDateString("he-IL")} · `}{formatFileSize(doc.file_size)}</div>
    </div>
    <button type="button" onClick={handleOpen} disabled={previewing} style={{padding:"6px 10px",background:"#0d9488",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>{previewing?"⏳":"👁️"}</button>
    <button type="button" onClick={handleDelete} style={{padding:"6px 10px",background:"white",color:"#ef4444",border:"1px solid #ef4444",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>🗑️</button>
  </div>;
}

function PayslipRow({doc,onUpdate}){
  const date=doc.document_date?new Date(doc.document_date):new Date(doc.uploaded_at);
  const monthName=date.toLocaleDateString("he-IL",{month:"long"});
  return<EmployeeDocRow doc={doc} onUpdate={onUpdate} customLabel={`💰 ${monthName} ${date.getFullYear()}`}/>;
}

function UploadEmployeeDocModal({employee,category,isPayslip,onClose,onUploaded,user}){
  const [step,setStep]=useState("upload");
  const [uploadedFile,setUploadedFile]=useState(null);
  const [title,setTitle]=useState("");
  const [docDate,setDocDate]=useState(isPayslip?new Date().toISOString().substring(0,10):"");
  const [saving,setSaving]=useState(false);
  const cat=getEmployeeCatById(category);
  const handleFileUploaded=fileResult=>{
    setUploadedFile(fileResult);
    if(isPayslip){
      const now=new Date();
      const monthName=now.toLocaleDateString("he-IL",{month:"long",year:"numeric"});
      setTitle(`תלוש שכר ${monthName}`);
    }else setTitle(fileResult.name.replace(/\.[^.]+$/,""));
    setStep("details");
  };
  const handleSave=async()=>{
    if(!title.trim()){window.alert("יש למלא שם");return;}
    setSaving(true);
    try{
      await sb("documents",{method:"POST",body:JSON.stringify({employee_id:employee.id,category,title:title.trim(),file_path:uploadedFile.path,file_name:uploadedFile.name,file_size:uploadedFile.size,file_type:uploadedFile.type,document_date:docDate||null,uploaded_by:user?.name||"unknown"})});
      onUploaded?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
    finally{setSaving(false);}
  };
  return<Modal open onClose={onClose} title={`➕ העלה ${cat.name} - ${employee.full_name}`} maxWidth={500}>
    {step==="upload"?<>
      <FileUploadField folder={`employees/${employee.id}/${category}`} onUploaded={handleFileUploaded} label={`בחר/גרור קובץ ${cat.name}`}/>
      <button type="button" onClick={onClose} style={{width:"100%",padding:10,marginTop:15,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
    </>:<>
      <div style={{padding:10,background:cat.color+"15",borderRadius:6,marginBottom:15}}>
        <div style={{fontSize:12,color:cat.color,marginBottom:4}}>{cat.icon} {cat.name}</div>
        <div style={{fontWeight:600,fontSize:13}}>{uploadedFile.name}</div>
      </div>
      <div style={{marginBottom:10}}><label style={{fontWeight:600,fontSize:13}}>שם מסמך *:</label><input value={title} onChange={e=>setTitle(e.target.value)} style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}} autoFocus/></div>
      <div style={{marginBottom:15}}>
        <label style={{fontWeight:600,fontSize:13}}>{isPayslip?"חודש התלוש *:":"תאריך המסמך:"}</label>
        <input type="date" value={docDate} onChange={e=>setDocDate(e.target.value)} style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/>
        {isPayslip&&<div style={{fontSize:11,color:"#6b7280",marginTop:4}}>💡 התלושים יסודרו לפי תאריך זה</div>}
      </div>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" onClick={handleSave} disabled={saving} style={{flex:2,padding:12,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:saving?"wait":"pointer",fontFamily:"inherit"}}>{saving?"⏳ שומר...":"💾 שמור"}</button>
      </div>
    </>}
  </Modal>;

function PayslipsTab({employee,docs,onUpdate,user}){
  const [showUpload,setShowUpload]=useState(false);
  const docsByYear=useMemo(()=>{
    const groups={};
    docs.forEach(d=>{
      const date=d.document_date||d.uploaded_at;
      const year=new Date(date).getFullYear();
      if(!groups[year])groups[year]=[];
      groups[year].push(d);
    });
    Object.keys(groups).forEach(year=>{
      groups[year].sort((a,b)=>{
        const dA=new Date(a.document_date||a.uploaded_at);
        const dB=new Date(b.document_date||b.uploaded_at);
        return dB-dA;
      });
    });
    return groups;
  },[docs]);
  const years=Object.keys(docsByYear).sort((a,b)=>b-a);
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:15}}>
      <div style={{color:"#6b7280",fontSize:13}}>{docs.length} תלושי שכר · מסודרים לפי חודש ושנה</div>
      <button type="button" onClick={()=>setShowUpload(true)} style={{padding:"8px 14px",background:"#10b981",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>➕ העלה תלוש</button>
    </div>
    {docs.length===0?<div style={{textAlign:"center",padding:30,color:"#9ca3af",background:"#f9fafb",borderRadius:8}}>אין תלושי שכר בתיק עדיין</div>:<div>{years.map(year=><div key={year} style={{marginBottom:20}}>
      <div style={{background:"#f0fdfa",padding:"8px 14px",borderRadius:6,fontWeight:700,color:"#0d9488",marginBottom:8}}>📅 {year} ({docsByYear[year].length} תלושים)</div>
      <div style={{display:"grid",gap:6}}>{docsByYear[year].map(d=><PayslipRow key={d.id} doc={d} onUpdate={onUpdate}/>)}</div>
    </div>)}</div>}
    {showUpload&&<UploadEmployeeDocModal employee={employee} category="payslip" isPayslip user={user} onClose={()=>setShowUpload(false)} onUploaded={()=>{onUpdate?.();setShowUpload(false);}}/>}
  </div>;
}

            {t.label}

          </button>)}
        </div>
        {loadingDocs&&fileTab!=="details"?<div style={{padding:20,textAlign:"center",color:"#6b7280"}}>טוען מסמכים...</div>:<>

          {fileTab==="regulations"&&<EmployeeDocsTab employee={employee} category="regulations" docs={docsByCategory.regulations} onUpdate={loadDocs} user={user}/>}
          {fileTab==="general"&&<EmployeeDocsTab employee={employee} category="general" docs={docsByCategory.general} onUpdate={loadDocs} user={user}/>}

function EmployeesDashboard({user}){
  const [employees,setEmployees]=useState([]);
  const [docCounts,setDocCounts]=useState({});
  const [loading,setLoading]=useState(true);
  const [selectedEmployee,setSelectedEmployee]=useState(null);
  const [showAddModal,setShowAddModal]=useState(false);
  const [checkingHr,setCheckingHr]=useState(false);
  const [checkingBday,setCheckingBday]=useState(false);
  const checkHrReminders=async()=>{
    setCheckingHr(true);
    try{
      const {data,error}=await supabaseClient.functions.invoke("hr-reminders-check");
      if(error)throw error;
      window.alert("🔔 תוצאת בדיקת תזכורות HR:\n\n"+JSON.stringify(data,null,2));
    }catch(e){window.alert("שגיאה בבדיקת תזכורות: "+(e.message||String(e)));}
    finally{setCheckingHr(false);}
  };
  const checkBirthdayGreetings=async()=>{
    setCheckingBday(true);
    try{
      const {data,error}=await supabaseClient.functions.invoke("birthday-greetings");
      if(error)throw error;
      window.alert("🎂 תוצאת ברכות ימי הולדת:\n\n"+JSON.stringify(data,null,2));
    }catch(e){window.alert("שגיאה בברכות יום הולדת: "+(e.message||String(e)));}
    finally{setCheckingBday(false);}
  };
  const loadData=async()=>{
    try{
      const emps=await sb("employees?is_active=eq.true&order=full_name");
      setEmployees(emps||[]);
      const docs=await sb("documents?employee_id=not.is.null&select=employee_id");
      const counts={};
      (docs||[]).forEach(d=>{counts[d.employee_id]=(counts[d.employee_id]||0)+1;});
      setDocCounts(counts);
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };
  useEffect(()=>{
    loadData();
    const interval=setInterval(loadData,60000);
    return()=>clearInterval(interval);
  },[]);
  const upcomingBirthdays=useMemo(()=>employees.filter(e=>e.birth_date).map(e=>({...e,daysUntil:daysUntilBirthday(e.birth_date)})).filter(e=>e.daysUntil<=7).sort((a,b)=>a.daysUntil-b.daysUntil),[employees]);
  if(loading)return<div style={{padding:30,textAlign:"center"}}>טוען...</div>;
  return<div style={{padding:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>

      <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
        <button type="button" onClick={checkHrReminders} disabled={checkingHr} style={{padding:"10px 18px",background:"white",color:"#0d9488",border:"1px solid #0d9488",borderRadius:8,fontWeight:600,cursor:checkingHr?"wait":"pointer",fontFamily:"inherit"}}>{checkingHr?"⏳ בודק...":"🔔 בדיקת תזכורות HR"}</button>
        <button type="button" onClick={checkBirthdayGreetings} disabled={checkingBday} style={{padding:"10px 18px",background:"white",color:"#db2777",border:"1px solid #db2777",borderRadius:8,fontWeight:600,cursor:checkingBday?"wait":"pointer",fontFamily:"inherit"}}>{checkingBday?"⏳ בודק...":"🎂 בדיקת ימי הולדת"}</button>
        <button type="button" onClick={()=>setShowAddModal(true)} style={{padding:"10px 18px",background:"#0d9488",color:"white",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>➕ הוסף עובד</button>
      </div>
    </div>
    {upcomingBirthdays.length>0&&<BirthdayBanner birthdays={upcomingBirthdays} onSelect={emp=>setSelectedEmployee(emp)}/>}
    {employees.length===0?<div style={{textAlign:"center",padding:40,color:"#9ca3af",background:"#f9fafb",borderRadius:10}}>
      <div style={{fontSize:48,marginBottom:10}}>👥</div>
      <div>אין עובדים במערכת עדיין</div>
      <div style={{fontSize:13,marginTop:6}}>לחץ "➕ הוסף עובד" כדי להתחיל</div>
    </div>:<>
      <h3 style={{marginBottom:12}}>רשימת עובדים ({employees.length})</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(280px, 1fr))",gap:12}}>
        {employees.map(emp=><EmployeeCard key={emp.id} employee={emp} docCount={docCounts[emp.id]||0} onClick={()=>setSelectedEmployee(emp)}/>)}
      </div>
    </>}
    {showAddModal&&<EditEmployeeModal hasHrFields={employees.length===0||employeeHasHrFields(employees[0])} onClose={()=>setShowAddModal(false)} onSaved={()=>{loadData();setShowAddModal(false);}}/>}
    {selectedEmployee&&<EmployeeFileModal employee={selectedEmployee} user={user} onClose={()=>setSelectedEmployee(null)} onUpdate={loadData}/>}
  </div>;
}

function buildEmployeeMessageHtml(subject,body){
  const htmlBody=String(body||"").replace(/\n/g,"<br>");

function invToBinaDate(iso){
  if(!iso)return"";
  const s=String(iso).slice(0,10);
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m)return s;
  return`${m[3]}/${m[2]}/${m[1]}`;
}
function invFromBinaDate(ddmmyyyy){
  if(!ddmmyyyy)return null;
  const s=String(ddmmyyyy).trim();
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m){
    if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
    return null;
  }
  return`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
}
function invNormalizeSupplierName(name){
  return String(name||"")
    .replace(/[\"'״׳]/g,"")
    .replace(/\s+/g," ")
    .trim()
    .replace(/\s*(בע\"מ|בעמ)\s*$/i,"")
    .trim()
    .toLowerCase();
}
function invMatchSupplier(taxId,name,suppliersList){
  const list=(suppliersList||[]).filter(s=>s.is_active!==false);
  const digits=String(taxId||"").replace(/\D/g,"");
  if(digits){
    const byTax=list.find(s=>String(s.supplier_tax_id||"").replace(/\D/g,"")===digits);
    if(byTax)return{supplier:byTax,match_method:"tax_id"};
  }
  const norm=invNormalizeSupplierName(name);
  if(norm){
    const exact=list.filter(s=>invNormalizeSupplierName(s.supplier_name)===norm);
    if(exact.length===1)return{supplier:exact[0],match_method:"name_exact"};
    const partial=list.filter(s=>{
      const n=invNormalizeSupplierName(s.supplier_name);
      return n&&(n.includes(norm)||norm.includes(n));
    });
    if(partial.length===1)return{supplier:partial[0],match_method:"name_partial"};
  }
  return null;
}
function invCalcDueDate(invoiceDate,paymentTerms){
  if(!invoiceDate)return null;
  const d=new Date(String(invoiceDate).slice(0,10)+"T12:00:00");
  if(isNaN(d.getTime()))return null;
  const terms=String(paymentTerms||"");
  const t=terms.trim();
  if(/מזומן|שוטף\s*$/i.test(t)||t==="שוטף"){
    return d.toISOString().slice(0,10);
  }
  const m=terms.match(/שוטף\s*\+?\s*(\d+)/);
  if(!m)return null;
  const days=Number(m[1]);
  const end=new Date(d.getFullYear(),d.getMonth()+1,0);
  end.setDate(end.getDate()+days);
  return end.toISOString().slice(0,10);
}
function invCopyText(text){
  return navigator.clipboard.writeText(String(text??""));
}
function invToast(setToast,msg){
  setToast(msg);
  setTimeout(()=>setToast(null),2000);
}
function invFmtNum(n){
  if(n===null||n===undefined||n==="")return"";
  const x=Number(n);
  if(isNaN(x))return String(n);
  return x.toFixed(2);
}
function invParseLowConfidence(v){
  if(Array.isArray(v))return v.map(k=>String(k||"").trim()).filter(Boolean);
  if(typeof v==="string"&&v.trim()){
    try{
      const p=JSON.parse(v);
      if(Array.isArray(p))return p.map(k=>String(k||"").trim()).filter(Boolean);
    }catch(_e){}
  }
  return[];
}

function invDueDateSource(inv){
  if(!inv)return null;
  const due=inv.due_date?String(inv.due_date).slice(0,10):"";
  if(!due)return null;
  const doc=inv.raw_response?.due_date?String(inv.raw_response.due_date).slice(0,10):"";
  if(doc&&doc===due)return"document";
  return"calculated";
}

        address:form.supplier_address||null,
        city:form.supplier_city||null,
        phone:form.supplier_phone||null,
        default_expense_type:form.expense_type||"עסקי",
        default_payment_terms:form.payment_terms||null,
      }).select().single();
      if(error){
        if(String(error.message||"").includes("duplicate")||error.code==="23505"){
          window.alert(`קוד ספק ${code} כבר משויך לספק אחר`);
          return;
        }
        throw error;
      }
      await supabaseClient.from("supplier_invoices").update({
        matched_supplier_id:data.id,
        bina_supplier_code:code,
        match_method:"manual",
      }).eq("id",invoice.id);
      setForm(f=>({...f,matched_supplier_id:data.id,bina_supplier_code:code,match_method:"manual"}));
      invToast(setToast,"✅ מיפוי נשמר");
      onUpdated?.();
    }catch(e){window.alert(e.message||String(e));}
  };
  const matched=!!form.bina_supplier_code;
  const partial=form.match_method==="name_partial";
  const bannerBg=matched?(partial?"#fff7ed":"#ecfdf5"):"#fff7ed";
  const bannerBorder=matched?(partial?"#fdba74":"#6ee7b7"):"#fdba74";

  return<div style={{marginTop:16}}>
    <div style={{background:bannerBg,border:`1px solid ${bannerBorder}`,borderRadius:12,padding:14,marginBottom:14}}>
      {matched?<>
        <div style={{fontWeight:800,fontSize:15}}>{partial?"⚠️ ספק מזוהה (לפי שם חלקי — אמת)":"✅ ספק מזוהה"}: {form.supplier_name}</div>
        <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8,flexWrap:"wrap"}}>
          <span style={{fontSize:13,color:"#6b7280"}}>קוד ספק:</span>
          <span style={{fontSize:28,fontWeight:900,color:"#0d9488"}}>{form.bina_supplier_code}</span>
          <button type="button" onClick={()=>{invCopyText(form.bina_supplier_code);invToast(setToast,"📋 הועתק");}} style={{padding:"8px 12px",borderRadius:8,border:"1px solid #0d9488",background:"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📋</button>
          <span style={{fontSize:12,color:"#6b7280"}}>(זוהה לפי {form.match_method==="tax_id"?"ח.פ":form.match_method==="name_exact"?"שם":form.match_method==="name_partial"?"שם חלקי":form.match_method||"—"})</span>
        </div>
      </>:<>
        <div style={{fontWeight:800}}>⚠️ ספק לא מזוהה במיפוי</div>
        <div style={{marginTop:6,fontSize:14}}>{form.supplier_name||"—"} | ח.פ {form.supplier_tax_id||"—"}</div>
        <div style={{display:"flex",gap:8,marginTop:10,flexWrap:"wrap",alignItems:"center"}}>
          <span style={{fontSize:13}}>מה קוד הספק בבינה?</span>
          <input value={mapCode} onChange={e=>setMapCode(e.target.value)} style={{padding:"10px 12px",borderRadius:8,border:"1px solid #e5e7eb",width:100,fontFamily:"inherit",minHeight:44}}/>
          <button type="button" onClick={saveMapping} style={{padding:"10px 14px",borderRadius:8,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>💾 שמור מיפוי</button>
        </div>
        <details style={{marginTop:10}}>
          <summary style={{cursor:"pointer",fontWeight:600,color:"#0d9488"}}>➕ ספק חדש בבינה (העתקה)</summary>
          <pre style={{background:"#fff",padding:10,borderRadius:8,fontSize:12,whiteSpace:"pre-wrap",marginTop:8}}>{`שם: ${form.supplier_name||""}\nח.פ: ${form.supplier_tax_id||""}\nכתובת: ${form.supplier_address||""}\nעיר: ${form.supplier_city||""}\nטלפון: ${form.supplier_phone||""}`}</pre>
          <button type="button" onClick={()=>{invCopyText(`שם: ${form.supplier_name||""}\nח.פ: ${form.supplier_tax_id||""}\nכתובת: ${form.supplier_address||""}\nעיר: ${form.supplier_city||""}\nטלפון: ${form.supplier_phone||""}`);invToast(setToast,"📋 הועתק");}} style={{padding:"8px 12px",borderRadius:8,border:"1px solid #e5e7eb",background:"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📋 העתק פרטי ספק</button>
        </details>
      </>}
    </div>

    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {INV_FIELD_ORDER.map(f=>{
        if(f.type==="lines"){
          return<div key="__line_items__" style={{marginTop:8,marginBottom:8}}>
            <div style={{fontWeight:700,marginBottom:8}}>שורות פירוט</div>
            {lines.length===0?<div style={{color:"#9ca3af",fontSize:13}}>לא זוהו שורות פירוט</div>:
              <div style={{overflowX:"auto"}}>
                <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                  <thead><tr style={{background:"#f3f4f6"}}>
                    <th style={{padding:8,textAlign:"right"}}>תאור</th><th style={{padding:8}}>כמות</th><th style={{padding:8}}>מחיר</th><th style={{padding:8}}>הנחה%</th><th style={{padding:8}}>סה״כ</th><th style={{padding:8}}></th>
                  </tr></thead>
                  <tbody>
                    {lines.map((l,i)=><tr key={i} style={{borderTop:"1px solid #e5e7eb"}}>
                      <td style={{padding:8}}>{l.description||"—"}</td>
                      <td style={{padding:8,textAlign:"center"}}>{l.quantity??"—"}</td>
                      <td style={{padding:8,textAlign:"center"}}>{invFmtNum(l.unit_price)}</td>
                      <td style={{padding:8,textAlign:"center"}}>{l.discount_percent??"—"}</td>
                      <td style={{padding:8,textAlign:"center"}}>{invFmtNum(l.total)}</td>
                      <td style={{padding:8}}><button type="button" onClick={()=>{invCopyText(`${l.description||""}\t${l.quantity??""}\t${l.unit_price??""}\t${l.total??""}`);invToast(setToast,"📋 הועתק");}} style={{border:"1px solid #e5e7eb",background:"#fff",borderRadius:6,padding:"6px 10px",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📋</button></td>
                    </tr>)}
                  </tbody>
                </table>
              </div>}
          </div>;
        }
        const unsure=low.includes(f.key);
        const fieldLabel=f.key==="due_date"?invDueDateLabel(dueDateSource):f.label;
        return<div key={f.key} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",padding:"8px 10px",borderRadius:8,background:unsure?"#fff7ed":"#f9fafb",border:unsure?"1px solid #fdba74":"1px solid #e5e7eb"}}>
          <div style={{width:140,fontWeight:f.bold?800:600,fontSize:13}}>{fieldLabel}{unsure?" ⚠️":""}</div>
          {f.type==="expense"?<select value={form.expense_type||"עסקי"} onChange={e=>setField("expense_type","text",e.target.value)} style={{flex:1,minWidth:160,padding:"10px",borderRadius:8,border:"1px solid #e5e7eb",fontFamily:"inherit",minHeight:44}}>
            <option value="עסקי">עסקי</option>
            <option value="אחר">אחר</option>
          </select>:<input value={displayVal(f.key,f.type)} onChange={e=>setField(f.key,f.type,e.target.value)} style={{flex:1,minWidth:160,padding:"10px",borderRadius:8,border:"1px solid #e5e7eb",fontFamily:"inherit",fontWeight:f.bold?800:400,minHeight:44}}/>}
          <button type="button" title={unsure?"ה-AI לא היה בטוח בשדה הזה, כדאי לאמת":"העתק"} onClick={()=>{invCopyText(displayVal(f.key,f.type));invToast(setToast,"📋 הועתק");}} style={{padding:"8px 12px",borderRadius:8,border:"1px solid #e5e7eb",background:"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📋</button>
        </div>;
      })}
    </div>

    {(form.ai_notes||form.notes)&&<div style={{marginTop:14,padding:12,background:"#fef3c7",borderRadius:10,borderRight:"4px solid #f59e0b",color:"#92400e",fontSize:13,whiteSpace:"pre-wrap"}}>
      {(form.ai_notes||form.notes)}
    </div>}

    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginTop:16}}>
      <button type="button" onClick={()=>{invCopyText(buildCopyAll());invToast(setToast,"✅ הועתק");}} style={{padding:"12px 16px",borderRadius:10,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📋 העתק הכל</button>
      <button type="button" onClick={saveEdits} disabled={saving} style={{padding:"12px 16px",borderRadius:10,border:"1px solid #0d9488",background:"#fff",color:"#0d9488",fontWeight:700,cursor:saving?"wait":"pointer",fontFamily:"inherit",minHeight:44}}>💾 שמור תיקונים</button>
    </div>

    <div style={{marginTop:18,padding:14,background:"#f9fafb",borderRadius:12}}>
      <div style={{fontWeight:700,marginBottom:10}}>איך היה הפרסור?</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button type="button" onClick={()=>setQuality("perfect")} style={{padding:"10px 14px",borderRadius:8,border:form.parse_quality==="perfect"?"2px solid #16a34a":"1px solid #e5e7eb",background:form.parse_quality==="perfect"?"#dcfce7":"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>✅ מושלם</button>
        <button type="button" onClick={()=>setQuality("minor_errors")} style={{padding:"10px 14px",borderRadius:8,border:form.parse_quality==="minor_errors"?"2px solid #d97706":"1px solid #e5e7eb",background:form.parse_quality==="minor_errors"?"#ffedd5":"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>⚠️ שגיאות קלות</button>
        <button type="button" onClick={()=>setQuality("major_errors")} style={{padding:"10px 14px",borderRadius:8,border:form.parse_quality==="major_errors"?"2px solid #dc2626":"1px solid #e5e7eb",background:form.parse_quality==="major_errors"?"#fee2e2":"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>❌ שגיאות חמורות</button>
      </div>
      {(form.parse_quality==="minor_errors"||form.parse_quality==="major_errors"||qualityNotes)&&<textarea value={qualityNotes} onChange={e=>setQualityNotes(e.target.value)} onBlur={()=>{if(form.parse_quality&&form.parse_quality!=="perfect")setQuality(form.parse_quality);}} placeholder="מה היה שגוי?" style={{width:"100%",marginTop:10,padding:10,borderRadius:8,border:"1px solid #e5e7eb",fontFamily:"inherit",minHeight:70}}/>}
      <label style={{display:"flex",alignItems:"center",gap:8,marginTop:12,cursor:"pointer",fontSize:14}}>
        <input type="checkbox" checked={!!form.entered_in_bina} onChange={e=>toggleEntered(e.target.checked)}/> הוזן בבינה
      </label>
    </div>
  </div>;
}

function SupplierInvoicesTab({user}){
  const [sub,setSub]=useState("parse");
  const [toast,setToast]=useState(null);
  const [suppliers,setSuppliers]=useState([]);
  const [invoices,setInvoices]=useState([]);
  const [loading,setLoading]=useState(true);
  const [file,setFile]=useState(null);
  const [previewUrl,setPreviewUrl]=useState(null);
  const [parsing,setParsing]=useState(false);
  const [current,setCurrent]=useState(null);
  const [histQ,setHistQ]=useState("");
  const [histQuality,setHistQuality]=useState("");
  const [histOnlyPending,setHistOnlyPending]=useState(false);
  const [histPage,setHistPage]=useState(0);
  const [viewModal,setViewModal]=useState(null);
  const [supForm,setSupForm]=useState(null);
  const [supSearch,setSupSearch]=useState("");
  const fileRef=useRef(null);
  const camRef=useRef(null);

  const loadAll=async()=>{
    try{
      const [s,inv]=await Promise.all([
        sb("bina_suppliers?order=supplier_name.asc"),
        sb("supplier_invoices?order=created_at.desc&limit=200"),
      ]);
      setSuppliers(s||[]);
      setInvoices(inv||[]);
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };
  useEffect(()=>{loadAll();},[]);

  const stats=useMemo(()=>{
    const success=invoices.filter(i=>i.parse_status==="success");
    const reviewed=invoices.filter(i=>i.parse_quality);
    const perfect=invoices.filter(i=>i.parse_quality==="perfect");
    const minor=invoices.filter(i=>i.parse_quality==="minor_errors").length;
    const major=invoices.filter(i=>i.parse_quality==="major_errors").length;
    const failed=invoices.filter(i=>i.parse_status==="failed").length;
    const pct=reviewed.length?Math.round(perfect.length/reviewed.length*100):null;
    return{success:success.length,reviewed:reviewed.length,perfect:perfect.length,minor,major,failed,pct};
  },[invoices]);

  const onPickFile=(f)=>{
    if(!f)return;
    if(f.size>5*1024*1024)window.alert("הקובץ גדול, הפרסור עלול להיכשל. מומלץ לצלם מחדש באיכות נמוכה יותר.");
    setFile(f);
    if(previewUrl)URL.revokeObjectURL(previewUrl);
    setPreviewUrl(f.type.startsWith("image/")?URL.createObjectURL(f):null);
  };

  const runParse=async()=>{
    if(!file||parsing)return;
    setParsing(true);
    setCurrent(null);
    const uuid=crypto.randomUUID();
    const safeName=String(file.name||"invoice").replace(/[^\w.\u0590-\u05FF-]+/g,"_");
    const year=new Date().getFullYear();
    const path=`supplier-invoices/${year}/${uuid}_${safeName}`;
    let filePath=null;
    let notesExtra=null;
    try{
      const {error:upErr}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
      if(upErr){notesExtra="העלאה ל-storage נכשלה: "+upErr.message;console.warn(upErr);}
      else filePath=path;
    }catch(e){notesExtra="העלאה ל-storage נכשלה: "+(e.message||e);}

    try{
      await supabaseClient.from("supplier_invoices").insert({
        id:uuid,
        created_by_name:user?.name||user?.full_name||null,
        file_path:filePath,
        file_name:file.name,
        file_type:file.type,
        file_size_kb:Math.round(file.size/1024),
        parse_status:"pending",
        notes:notesExtra,
      });
    }catch(e){window.alert("שגיאה ביצירת רשומה: "+(e.message||e));setParsing(false);return;}

    const toBase64=(f)=>new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(String(r.result).split(",")[1]);
      r.onerror=reject;
      r.readAsDataURL(f);
    });

    try{
      const file_base64=await toBase64(file);
      const {data,error}=await supabaseClient.functions.invoke("parse-invoice",{body:{file_base64,media_type:file.type||"image/jpeg",file_name:file.name}});
      if(error)throw error;
      if(!data?.success){
        await supabaseClient.from("supplier_invoices").update({parse_status:"failed",parse_error:data?.error||"פרסור נכשל",parse_duration_ms:data?.parse_duration_ms||null,model_used:data?.model_used||null}).eq("id",uuid);
        await loadAll();
        window.alert("פרסור נכשל: "+(data?.error||"שגיאה"));
        return;
      }
      const parsed=data.parsed||{};
      const match=invMatchSupplier(parsed.supplier_tax_id,parsed.supplier_name,suppliers);
      const docDue=parsed.due_date&&/^\d{4}-\d{2}-\d{2}/.test(String(parsed.due_date))?String(parsed.due_date).slice(0,10):null;
      const due=docDue||invCalcDueDate(parsed.invoice_date,parsed.payment_terms)||null;
      const update={
        parse_status:"success",
        parse_error:null,
        model_used:data.model_used||null,
        parse_duration_ms:data.parse_duration_ms||null,
        raw_response:parsed,
        supplier_name:parsed.supplier_name||null,
        supplier_tax_id:parsed.supplier_tax_id||null,
        supplier_address:parsed.supplier_address||null,
        supplier_city:parsed.supplier_city||null,
        supplier_phone:parsed.supplier_phone||null,
        matched_supplier_id:match?.supplier?.id||null,
        bina_supplier_code:match?.supplier?.bina_supplier_code||null,
        match_method:match?.match_method||null,
        allocation_number:parsed.allocation_number||null,
        invoice_number:parsed.invoice_number||null,
        invoice_date:parsed.invoice_date||null,
        vat_date:parsed.vat_date||parsed.invoice_date||null,
        payment_terms:parsed.payment_terms||null,
        due_date:due,
        expense_type:"עסקי",
        currency:parsed.currency||"ILS",
        amount_before_vat:parsed.amount_before_vat??null,
        discount_percent:parsed.discount_percent??null,
        discount_amount:parsed.discount_amount??null,
        amount_after_discount:parsed.amount_after_discount??null,
        vat_rate:parsed.vat_rate??null,
        vat_amount:parsed.vat_amount??null,
        total_amount:parsed.total_amount??null,
        line_items:parsed.line_items||[],
        low_confidence_fields:parsed.low_confidence_fields||[],
        ai_notes:parsed.notes||null,
      };
      await supabaseClient.from("supplier_invoices").update(update).eq("id",uuid);
      await loadAll();
      const {data:row}=await supabaseClient.from("supplier_invoices").select("*").eq("id",uuid).single();
      setCurrent(row);
    }catch(e){
      await supabaseClient.from("supplier_invoices").update({parse_status:"failed",parse_error:e.message||String(e)}).eq("id",uuid);
      await loadAll();
      window.alert("שגיאה: "+(e.message||e));
    }finally{setParsing(false);}
  };

  const filteredHist=useMemo(()=>{
    let list=invoices;
    const q=histQ.trim().toLowerCase();
    if(q)list=list.filter(i=>[i.supplier_name,i.invoice_number,i.supplier_tax_id,i.bina_supplier_code].some(x=>String(x||"").toLowerCase().includes(q)));
    if(histQuality)list=list.filter(i=>(histQuality==="unreviewed"?!i.parse_quality:i.parse_quality===histQuality));
    if(histOnlyPending)list=list.filter(i=>!i.entered_in_bina);
    return list;
  },[invoices,histQ,histQuality,histOnlyPending]);
  const pageSize=25;
  const pageItems=filteredHist.slice(histPage*pageSize,(histPage+1)*pageSize);

  const openFile=async(inv)=>{
    if(!inv.file_path){window.alert("אין קובץ מקור");return;}
    try{
      const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(inv.file_path,3600);
      if(error)throw error;
      window.open(data.signedUrl,"_blank");
    }catch(e){window.alert(e.message||String(e));}
  };
  const deleteInv=async(inv)=>{
    if(!window.confirm("למחוק חשבונית זו?"))return;
    try{
      if(inv.file_path)await supabaseClient.storage.from(STORAGE_BUCKET).remove([inv.file_path]);
      await supabaseClient.from("supplier_invoices").delete().eq("id",inv.id);
      if(current?.id===inv.id)setCurrent(null);
      await loadAll();
    }catch(e){window.alert(e.message||String(e));}
  };

  const filteredSup=useMemo(()=>{
    const q=supSearch.trim().toLowerCase();
    if(!q)return suppliers;
    return suppliers.filter(s=>[s.supplier_name,s.bina_supplier_code,s.supplier_tax_id].some(x=>String(x||"").toLowerCase().includes(q)));
  },[suppliers,supSearch]);

  const saveSupplier=async()=>{
    if(!supForm)return;
    const code=String(supForm.bina_supplier_code||"").trim();
    const name=String(supForm.supplier_name||"").trim();
    if(!code||!name){window.alert("קוד ספק ושם ספק הם שדות חובה");return;}
    const payload={
      bina_supplier_code:code,
      supplier_name:name,
      supplier_tax_id:supForm.supplier_tax_id||null,
      address:supForm.address||null,
      city:supForm.city||null,
      phone:supForm.phone||null,
      fax:supForm.fax||null,
      email:supForm.email||null,
      default_expense_type:supForm.default_expense_type||"עסקי",
      default_payment_terms:supForm.default_payment_terms||null,
      is_active:supForm.is_active!==false,
      notes:supForm.notes||null,
      updated_at:new Date().toISOString(),
    };
    try{
      if(supForm.id){
        const {error}=await supabaseClient.from("bina_suppliers").update(payload).eq("id",supForm.id);
        if(error)throw error;
      }else{
        const {error}=await supabaseClient.from("bina_suppliers").insert(payload);
        if(error){
          if(error.code==="23505"||String(error.message||"").includes("duplicate")){
            const exist=suppliers.find(s=>s.bina_supplier_code===code);
            window.alert(`קוד ספק ${code} כבר משויך ל־${exist?.supplier_name||"ספק אחר"}`);
            return;
          }
          throw error;
        }
      }
      setSupForm(null);
      await loadAll();
    }catch(e){window.alert(e.message||String(e));}
  };
  const deleteSupplier=async(s)=>{
    if(!window.confirm(`למחוק את הספק ${s.supplier_name}?`))return;
    try{
      const {error}=await supabaseClient.from("bina_suppliers").delete().eq("id",s.id);
      if(error)throw error;
      await loadAll();
    }catch(e){window.alert(e.message||String(e));}
  };

  const pctColor=stats.pct==null?"#6b7280":stats.pct>=90?"#16a34a":stats.pct>=75?"#d97706":"#dc2626";
  const qualityBadge=(q,status)=>{
    if(status==="failed")return{t:"💥 נכשל",c:"#6b7280",bg:"#f3f4f6"};
    if(!q)return{t:"⏳ לא נבדק",c:"#6b7280",bg:"#f3f4f6"};
    if(q==="perfect")return{t:"✅ מושלם",c:"#166534",bg:"#dcfce7"};
    if(q==="minor_errors")return{t:"⚠️ קלות",c:"#92400e",bg:"#ffedd5"};
    return{t:"❌ חמורות",c:"#991b1b",bg:"#fee2e2"};
  };

  if(loading)return<div style={{padding:30,textAlign:"center"}}>טוען...</div>;

  return<div style={{padding:20,maxWidth:1100,margin:"0 auto",direction:"rtl"}}>
    {toast&&<div style={{position:"fixed",bottom:24,left:"50%",transform:"translateX(-50%)",background:"#0f172a",color:"#fff",padding:"10px 18px",borderRadius:999,zIndex:2000,fontWeight:700}}>{toast}</div>}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:12,flexWrap:"wrap",marginBottom:16}}>
