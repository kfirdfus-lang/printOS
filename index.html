function shipmentDateWeekday(dateStr){
  if(!dateStr)return null;
  const p=String(dateStr).split("-").map(Number);
  if(p.length<3||!p[0])return null;
  return new Date(p[0],p[1]-1,p[2]).getDay();
}
function isShipmentWeekendDate(dateStr){
  const day=shipmentDateWeekday(dateStr);
  return day===5||day===6;
}
function shipmentWeekendWarning(dateStr){
  const day=shipmentDateWeekday(dateStr);
  if(day===5)return"⚠️ תאריך זה יום שישי - לא יוצג בלוח הראשי, ניתן יהיה לערוך";
  if(day===6)return"⚠️ תאריך זה יום שבת - לא יוצג בלוח הראשי, ניתן יהיה לערוך";
  return null;
}

function formatSingleShipmentText(task){
  let text=`📦 *משלוח - ${task.client_name||"לקוח"}*\n`;
  if(task.bina_order_id)text+=`📝 הזמנה #${task.bina_order_id}\n`;
  if(task.sales_agent)text+=`👤 סוכן: ${task.sales_agent}\n`;
  text+="\n";
  if(task.delivery_address_snapshot)text+=`📍 ${task.delivery_address_snapshot}\n`;
  if(task.delivery_contact_snapshot||task.delivery_phone_snapshot){
    const contactLine=`${task.delivery_contact_snapshot||""} ${task.delivery_phone_snapshot||""}`.trim();
    if(contactLine)text+=`📞 ${contactLine}\n`;
  }
  const items=Array.isArray(task.items)?task.items:[];
  if(items.length>0){
    text+=`\n📦 פריטים למסירה:\n`;
    items.forEach(item=>{text+=`• ${item.description||"—"} (×${item.quantity??0})\n`;});
  }
  if(task.delivery_special_notes)text+=`\n💬 ${task.delivery_special_notes}\n`;
  return text.trim();
}

function MoveToDeliveryModal({task,user,onClose,onSuccess}){
  const [savedAddresses,setSavedAddresses]=useState([]);
  const [selectedAddressId,setSelectedAddressId]=useState(null);
  const [savedContacts,setSavedContacts]=useState([]);
  const [contactMode,setContactMode]=useState("addNew");
  const [selectedContactId,setSelectedContactId]=useState(null);
  const [showAddContact,setShowAddContact]=useState(false);
  const prevContactIdRef=useRef(null);
  const [address,setAddress]=useState("");
  const [contactName,setContactName]=useState("");
  const [phone,setPhone]=useState("");
  const [scheduledDate,setScheduledDate]=useState("");
  const [deliveryType,setDeliveryType]=useState("local");
  const [specialNotes,setSpecialNotes]=useState("");
  const [drivers,setDrivers]=useState([]);
  const [driverId,setDriverId]=useState("");
  const [moveItems,setMoveItems]=useState([]);
  const [client,setClient]=useState(null);
  const [dateWarning,setDateWarning]=useState(null);
  const [loading,setLoading]=useState(true);
  const [saving,setSaving]=useState(false);
  const fld={width:"100%",padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13};
  const handleSelectContact=(contact)=>{
    setSelectedContactId(contact.id);
    setContactName(contact.contact_name);
    setPhone(contact.contact_phone);
    setShowAddContact(false);
  };
  const handleStartAddNew=()=>{
    if(selectedContactId)prevContactIdRef.current=selectedContactId;
    setSelectedContactId(null);
    setContactName("");
    setPhone("");
    setShowAddContact(true);
  };
  const handleSaveNewContact=async()=>{
    if(!contactName.trim()||!phone.trim()){window.alert("יש למלא שם וטלפון");return;}
    if(!client?.id){window.alert("שגיאה: לא ניתן לזהות את הלקוח");return;}
    try{
      const result=await sb("client_delivery_contacts",{method:"POST",body:JSON.stringify({
        client_id:client.id,
        contact_name:contactName.trim(),
        contact_phone:phone.trim(),
        is_default:savedContacts.length===0,
        usage_count:0,
        created_by:user?.name||"unknown",
      })});
      const newContact=Array.isArray(result)?result[0]:result;
      if(newContact){
        setSavedContacts(prev=>[...prev,newContact]);
        setSelectedContactId(newContact.id);
        setShowAddContact(false);
        setContactMode("pick");
      }
    }catch(e){
      const msg=e.message||String(e);
      if(msg.includes("duplicate")||msg.includes("23505"))window.alert("איש קשר עם טלפון זה כבר קיים");
      else window.alert("שגיאה: "+msg);
    }
  };
  const incrementContactUsage=async()=>{
    if(!selectedContactId)return;
    const contact=savedContacts.find(c=>c.id===selectedContactId);
    if(!contact)return;
    try{
      await sb(`client_delivery_contacts?id=eq.${selectedContactId}`,{method:"PATCH",body:JSON.stringify({
        usage_count:(contact.usage_count||0)+1,
        last_used_at:new Date().toISOString(),
      })});
    }catch(_){}
  };
  useEffect(()=>{
    if(!scheduledDate){setDateWarning(null);return;}
    setDateWarning(shipmentWeekendWarning(scheduledDate));
  },[scheduledDate]);
  useEffect(()=>{
    let cancelled=false;
    const load=async()=>{
      setLoading(true);
      setMoveItems([]);
      setClient(null);
      setSavedContacts([]);
      setContactMode("addNew");
      setSelectedContactId(null);
      setShowAddContact(false);
      prevContactIdRef.current=null;
      let clientData=null;
      try{
        if(task.client_id){
          const r=await sb(`clients?id=eq.${task.client_id}&limit=1`);
          if(r?.[0])clientData=r[0];
        }
        if(!clientData&&task.bina_cust_id){
          const r=await sb(`clients?bina_customer_id=eq.${task.bina_cust_id}&limit=1`);
          if(r?.[0])clientData=r[0];
        }
        if(!clientData&&task.client_name){
          const r=await sb(`clients?name=eq.${encodeURIComponent(task.client_name)}&limit=1`);
          if(r?.[0])clientData=r[0];
        }
        if(clientData&&!cancelled){
          setClient(clientData);
          const addrs=await sb(`client_addresses?client_id=eq.${clientData.id}&order=is_default.desc,last_used_at.desc`);
          const list=Array.isArray(addrs)?addrs:[];
          if(!cancelled)setSavedAddresses(list);
          const defaultAddr=list.find(a=>a.is_default)||list[0];
          if(defaultAddr&&!cancelled){
            setSelectedAddressId(defaultAddr.id);
            setAddress(defaultAddr.address);
          }
          let contacts=[];
          try{
            const cr=await sb(`client_delivery_contacts?client_id=eq.${clientData.id}&order=is_default.desc,usage_count.desc,last_used_at.desc`);
            contacts=Array.isArray(cr)?cr:[];
          }catch(e){console.warn("[deliveries] load contacts",e);}
          if(!cancelled){
            setSavedContacts(contacts);
            if(contacts.length>0){
              setContactMode("pick");
              const defaultContact=contacts.find(c=>c.is_default)||contacts[0];
              setSelectedContactId(defaultContact.id);
              setContactName(defaultContact.contact_name);
              setPhone(defaultContact.contact_phone);
            }else{
              setContactMode("addNew");
              setContactName(clientData.delivery_contact_name||clientData.contact_name||task.contact||"");
              setPhone(clientData.delivery_contact_phone||clientData.phone||task.bina_cust_phone||"");
            }
          }
        }else if(!cancelled){
          setContactName(task.contact||"");
          setPhone(task.bina_cust_phone||"");
          const addrParts=[task.bina_cust_address,task.bina_cust_city].filter(Boolean);
          if(addrParts.length)setAddress(addrParts.join(", "));
        }
        const drs=await sb("drivers?is_active=eq.true&order=name.asc");
        if(!cancelled)setDrivers(Array.isArray(drs)?drs:[]);
        const taskItems=await sb(`task_items?task_id=eq.${task.id}&order=id.asc`);
        if(!cancelled)setMoveItems(Array.isArray(taskItems)?taskItems:[]);
        if(!cancelled)setScheduledDate(toLocalDateStr(new Date()));
      }catch(e){console.warn("[shipments]",e);}
      if(!cancelled)setLoading(false);
    };
    load();
    return()=>{cancelled=true};
  },[task.id]);
  const handleMove=async()=>{
    if(deliveryType!=="pickup"&&!address.trim()){window.alert("יש להזין כתובת");return;}
    if(deliveryType!=="pickup"&&(!contactName.trim()||!phone.trim())){window.alert("יש למלא שם וטלפון לאיש קשר");return;}
    setSaving(true);
    try{
      if(selectedContactId){
        await incrementContactUsage();
      }else if(client?.id&&contactName.trim()&&phone.trim()){
        try{
          await sb("client_delivery_contacts",{method:"POST",body:JSON.stringify({
            client_id:client.id,
            contact_name:contactName.trim(),
            contact_phone:phone.trim(),
            is_default:savedContacts.length===0,
            usage_count:1,
            last_used_at:new Date().toISOString(),
            created_by:user?.name||"unknown",
          })});
        }catch(e){console.warn("[deliveries] save contact",e);}
      }
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({
        delivery_status:"ready",
        scheduled_delivery_date:scheduledDate||null,
        assigned_driver_id:driverId||null,
        delivery_type:deliveryType,
        delivery_address_snapshot:deliveryType==="pickup"?null:address.trim(),
        delivery_contact_snapshot:contactName.trim()||null,
        delivery_phone_snapshot:phone.trim()||null,
        delivery_special_notes:specialNotes.trim()||null,
        delivery_marked_at:new Date().toISOString(),
        delivery_marked_by:user?.name||"unknown",
      })});
      if(selectedAddressId){
        const current=savedAddresses.find(a=>a.id===selectedAddressId);
        await sb(`client_addresses?id=eq.${selectedAddressId}`,{method:"PATCH",body:JSON.stringify({
          usage_count:(current?.usage_count||0)+1,
          last_used_at:new Date().toISOString(),
        })});
      }
      if(client&&client.id){
        const clientUpdates={};
        const cn=contactName.trim();
        const ph=phone.trim();
        if(cn&&cn!==(client.delivery_contact_name||""))clientUpdates.delivery_contact_name=cn;
        if(ph&&ph!==(client.delivery_contact_phone||""))clientUpdates.delivery_contact_phone=ph;
        if(Object.keys(clientUpdates).length>0){
          try{
            await sb(`clients?id=eq.${client.id}`,{method:"PATCH",body:JSON.stringify(clientUpdates)});
            console.log("[deliveries] עודכנו פרטי משלוח של הלקוח:",clientUpdates);
          }catch(e){console.warn("[deliveries] לא הצלחנו לעדכן את הלקוח:",e);}
        }
      }
      if(client&&client.id&&deliveryType!=="pickup"&&address.trim()&&!selectedAddressId){
        try{
          await sb("client_addresses",{method:"POST",body:JSON.stringify({
            client_id:client.id,
            address:address.trim(),
            is_default:false,
            created_by:user?.name||"unknown",
          })});
          console.log("[deliveries] נשמרה כתובת חדשה ללקוח");
        }catch(e){console.warn("[deliveries] לא הצלחנו לשמור כתובת:",e);}
      }
      onSuccess?.();
      onClose();
      window.alert(`✅ המשימה הועברה למשלוחים${client?" ופרטי הלקוח עודכנו":""}`);
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    setSaving(false);
  };
  return<Modal open={true} onClose={onClose} title="📦 העבר משימה למשלוחים" maxWidth={600}>
    {loading?<div style={{textAlign:"center",padding:30}}><Spinner sz={28}/></div>:<div style={{direction:"rtl",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"#f0f9ff",padding:10,borderRadius:8,fontSize:13}}>
        <strong>הזמנה:</strong> {task.bina_order_id?`#${task.bina_order_id} — `:""}{task.title}<br/>
        <strong>לקוח:</strong> {task.client_name||"—"}
      </div>
      <div><label style={{display:"block",marginBottom:6,fontWeight:700}}>סוג משלוח:</label>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{v:"local",label:"🚚 משלוח מקומי",desc:"נהג שלנו"},{v:"courier",label:"📮 שליח/דואר",desc:"מסירה חיצונית"},{v:"pickup",label:"🛒 איסוף עצמי",desc:"לקוח אוסף"}].map(opt=>
            <button type="button" key={opt.v} onClick={()=>setDeliveryType(opt.v)} style={{flex:1,minWidth:120,padding:12,borderRadius:8,border:deliveryType===opt.v?"2px solid #7c3aed":"2px solid var(--border)",background:deliveryType===opt.v?"#f5f3ff":"#fff",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
              <div style={{fontWeight:600}}>{opt.label}</div>
              <div style={{color:"var(--text3)",marginTop:4}}>{opt.desc}</div>
            </button>
          )}
        </div>
      </div>
      {deliveryType!=="pickup"&&<>
        <div><label style={{display:"block",marginBottom:6,fontWeight:600}}>📍 כתובת:</label>
          {savedAddresses.length>0&&<select value={selectedAddressId||"custom"} onChange={e=>{
            const val=e.target.value;
            if(val==="custom"){setSelectedAddressId(null);setAddress("");}
            else{const addr=savedAddresses.find(a=>a.id===val);if(addr){setSelectedAddressId(val);setAddress(addr.address);}}
          }} style={{...fld,marginBottom:6}}>
            {savedAddresses.map(a=><option key={a.id} value={a.id}>{a.is_default?"⭐ ":""}{a.label?`[${a.label}] `:""}{String(a.address||"").substring(0,60)}</option>)}
            <option value="custom">✏️ כתובת חדשה</option>
          </select>}
          <textarea value={address} onChange={e=>{setAddress(e.target.value);if(selectedAddressId)setSelectedAddressId(null);}} placeholder="רחוב, עיר" rows={3} style={fld}/>
        </div>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:6,fontWeight:600,fontSize:14}}>👤 איש קשר למשלוח:</label>
          {contactMode==="pick"&&!showAddContact&&<>
            <div style={{background:"#f0fdfa",padding:12,borderRadius:8,border:"1px solid #2dd4bf",marginBottom:8}}>
              <div style={{fontSize:12,color:"#0d9488",marginBottom:8}}>⚡ אנשי קשר שמורים ללקוח זה ({savedContacts.length})</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {savedContacts.map(c=><button type="button" key={c.id} onClick={()=>handleSelectContact(c)} style={{padding:10,textAlign:"right",background:selectedContactId===c.id?"#0d9488":"#fff",color:selectedContactId===c.id?"#fff":"#374151",border:`1px solid ${selectedContactId===c.id?"#0d9488":"#d1d5db"}`,borderRadius:6,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"inherit"}}>
                  <div>
                    <div style={{fontWeight:600}}>{c.is_default&&"⭐ "}{c.contact_name}</div>
                    <div style={{fontSize:12,color:selectedContactId===c.id?"rgba(255,255,255,0.85)":"#6b7280",marginTop:2,direction:"ltr",textAlign:"right"}}>📞 {c.contact_phone}</div>
                  </div>
                  {c.usage_count>0&&<div style={{fontSize:11,color:selectedContactId===c.id?"rgba(255,255,255,0.7)":"#9ca3af"}}>{c.usage_count} פעמים</div>}
                </button>)}
              </div>
            </div>
            <button type="button" onClick={handleStartAddNew} style={{width:"100%",padding:10,background:"transparent",border:"2px dashed #d1d5db",borderRadius:8,cursor:"pointer",color:"#6b7280",fontSize:13,fontFamily:"inherit"}}>➕ הוסף איש קשר חדש</button>
          </>}
          {(contactMode==="addNew"||showAddContact)&&<div style={{background:"#fefce8",padding:12,borderRadius:8,border:"1px solid #fde68a"}}>
            {contactMode==="addNew"&&<div style={{fontSize:12,color:"#78350f",marginBottom:8}}>ℹ️ אין אנשי קשר שמורים ללקוח זה - הוסף את הראשון</div>}
            <div style={{marginBottom:8}}><input type="text" value={contactName} onChange={e=>setContactName(e.target.value)} placeholder="שם איש הקשר *" style={{...fld,borderRadius:6}} autoFocus={contactMode==="addNew"}/></div>
            <div style={{marginBottom:contactMode==="pick"?8:0}}><input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="טלפון *" style={{...fld,borderRadius:6,direction:"ltr"}}/></div>
            {contactMode==="pick"&&showAddContact&&<div style={{display:"flex",gap:6,marginTop:8}}>
              <button type="button" onClick={()=>{
                setShowAddContact(false);
                const prevId=prevContactIdRef.current;
                if(prevId){
                  const prev=savedContacts.find(c=>c.id===prevId);
                  if(prev){setSelectedContactId(prev.id);setContactName(prev.contact_name);setPhone(prev.contact_phone);}
                }
              }} style={{flex:1,padding:8,fontSize:12,background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
              <button type="button" onClick={handleSaveNewContact} style={{flex:2,padding:8,fontSize:12,background:"#0d9488",color:"#fff",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור והשתמש</button>
            </div>}
          </div>}
        </div>
      </>}
      {moveItems.length>0&&<div style={{marginBottom:15,padding:12,background:"#f9fafb",borderRadius:8,border:"1px solid var(--border)"}}>
        <div style={{fontWeight:600,marginBottom:8,color:"var(--text2)"}}>📦 פריטים שיועברו למשלוח:</div>
        {moveItems.map((item,i)=><div key={item.id||i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:13,gap:8}}>
          <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>• {item.description||"—"}</span>
          <span style={{fontWeight:600,direction:"ltr",flexShrink:0}}>×{item.quantity??0}</span>
        </div>)}
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><label style={{display:"block",marginBottom:4,fontSize:12}}>📅 תאריך משלוח</label><input type="date" value={scheduledDate} onChange={e=>setScheduledDate(e.target.value)} style={fld}/></div>
        {deliveryType==="local"&&<div><label style={{display:"block",marginBottom:4,fontSize:12}}>🚛 נהג</label><select value={driverId} onChange={e=>setDriverId(e.target.value)} style={fld}>
          <option value="">-- ללא שיוך --</option>
          {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select></div>}
      </div>
      {dateWarning&&<div style={{marginTop:-4,marginBottom:8,padding:8,background:"#fef3c7",borderRadius:6,fontSize:12,color:"#78350f"}}>{dateWarning}</div>}
      <div><label style={{display:"block",marginBottom:4,fontSize:12}}>💬 הערות מיוחדות</label><textarea value={specialNotes} onChange={e=>setSpecialNotes(e.target.value)} rows={2} style={fld} placeholder="למשל: לתאם מראש, שביר..."/></div>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" disabled={saving} onClick={handleMove} style={{flex:2,padding:12,borderRadius:10,border:"none",background:"#7c3aed",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{saving?"⏳...":"📦 העבר למשלוחים"}</button>
      </div>
    </div>}
  </Modal>;
}

function DriverManagerModal({drivers,onClose,onUpdate}){
  const updateDriver=async(id,updates)=>{
    await sb(`drivers?id=eq.${id}`,{method:"PATCH",body:JSON.stringify(updates)});
    onUpdate?.();
  };
  const addDriver=async()=>{
    const name=window.prompt("שם הנהג:");
    if(!name)return;
    await sb("drivers",{method:"POST",body:JSON.stringify({name,color:"#"+Math.floor(Math.random()*16777215).toString(16).padStart(6,"0"),is_active:true})});
    onUpdate?.();
  };
  return<Modal open={true} onClose={onClose} title="🚛 ניהול נהגים" maxWidth={520}>
    <div style={{direction:"rtl",display:"flex",flexDirection:"column",gap:8}}>
      {drivers.map(d=><div key={d.id} style={{padding:10,border:"1px solid var(--border)",borderRadius:8,display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{width:30,height:30,borderRadius:"50%",background:d.color||"#0e7490",flexShrink:0}}/>
        <input defaultValue={d.name} onBlur={e=>updateDriver(d.id,{name:e.target.value})} style={{flex:1,minWidth:100,padding:6,borderRadius:6,border:"1px solid var(--border)",fontFamily:"inherit"}}/>
        <input type="tel" placeholder="טלפון" defaultValue={d.phone||""} onBlur={e=>updateDriver(d.id,{phone:e.target.value})} style={{width:130,padding:6,direction:"ltr",borderRadius:6,border:"1px solid var(--border)"}}/>
        <input type="color" defaultValue={d.color||"#0e7490"} onChange={e=>updateDriver(d.id,{color:e.target.value})} style={{width:40,height:30,cursor:"pointer"}}/>
        <button type="button" onClick={()=>updateDriver(d.id,{is_active:!d.is_active})} style={{padding:"4px 10px",fontFamily:"inherit",cursor:"pointer"}}>{d.is_active?"🟢 פעיל":"⚫ מושבת"}</button>
      </div>)}
      <button type="button" onClick={addDriver} style={{width:"100%",padding:10,background:"#0e7490",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>➕ הוסף נהג</button>
    </div>
  </Modal>;
}

  const [phone,setPhone]=useState(task.delivery_phone_snapshot||"");

        delivery_address_snapshot:deliveryType==="pickup"?null:(address.trim()||null),
        delivery_contact_snapshot:contactName.trim()||null,
        delivery_phone_snapshot:phone.trim()||null,
        delivery_special_notes:specialNotes.trim()||null,

      onUpdate?.();
      onClose();

  return<Modal open={true} onClose={onClose} title="✏️ עריכת משלוח" maxWidth={600}>

      <div style={{background:"#f0f9ff",padding:10,borderRadius:8,fontSize:13}}>
        <strong>{task.client_name}</strong>
        {task.bina_order_id&&<> · הזמנה <span style={{direction:"ltr",display:"inline-block"}}>#{task.bina_order_id}</span></>}
      </div>
      <div>
        <label style={{display:"block",marginBottom:4,fontWeight:600}}>📅 תאריך משלוח:</label>
        <input type="date" value={scheduledDate} onChange={e=>setScheduledDate(e.target.value)} style={fld}/>
        {dateWarning&&<div style={{marginTop:6,padding:8,background:"#fef3c7",borderRadius:6,fontSize:12,color:"#78350f"}}>{dateWarning}</div>}
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div>
          <label style={{display:"block",marginBottom:4,fontWeight:600}}>סוג:</label>
          <select value={deliveryType} onChange={e=>setDeliveryType(e.target.value)} style={fld}>

        </div>}

function SplitByDriverModal({date,tasks,drivers,onClose}){
  const tasksByDriver=useMemo(()=>{
    const groups={};
    tasks.forEach(t=>{
      const driverId=t.assigned_driver_id||"_unassigned";
      if(!groups[driverId])groups[driverId]=[];
      groups[driverId].push(t);
    });
    return groups;
  },[tasks]);
  const getDriverName=driverId=>{
    if(driverId==="_unassigned")return "⚠️ ללא נהג";
    const d=drivers.find(dr=>dr.id===driverId);
    return d?`🚛 ${d.name}`:"נהג לא ידוע";
  };
  const formatDriverText=(driverId,driverTasks)=>{
    const driverName=getDriverName(driverId);
    const dateStr=date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
    let text=`📦 *משלוחים ${driverName}*\n`;
    text+=`📅 ${dateStr}\n`;
    text+=`סה"כ: ${driverTasks.length} משלוחים\n\n`;
    text+="━━━━━━━━━━━━━━\n\n";
    driverTasks.forEach((t,i)=>{
      text+=`*${i+1}. ${t.client_name||"—"}*\n`;
      if(t.bina_order_id)text+=`📝 הזמנה #${t.bina_order_id}\n`;
      if(t.sales_agent)text+=`👤 סוכן: ${t.sales_agent}\n`;
      if(t.delivery_address_snapshot)text+=`📍 ${t.delivery_address_snapshot}\n`;
      if(t.delivery_contact_snapshot||t.delivery_phone_snapshot){
        const contactLine=`${t.delivery_contact_snapshot||""} ${t.delivery_phone_snapshot||""}`.trim();
        if(contactLine)text+=`📞 ${contactLine}\n`;
      }
      const dayItems=Array.isArray(t.items)?t.items:[];
      if(dayItems.length>0){
        text+=`\n📦 פריטים:\n`;
        dayItems.forEach(item=>{text+=`   • ${item.description||"—"} (×${item.quantity??0})\n`;});
      }
      if(t.delivery_special_notes)text+=`\n💬 ${t.delivery_special_notes}\n`;
      text+="\n━━━━━━━━━━━━━━\n\n";
    });
    return text;
  };
  const handleCopyDriver=async driverId=>{
    const driverTasks=tasksByDriver[driverId];
    const text=formatDriverText(driverId,driverTasks);
    try{
      await navigator.clipboard.writeText(text);
      window.alert(`✅ הועתק - ${driverTasks.length} משלוחים של ${getDriverName(driverId)}`);
    }catch(e){window.alert("שגיאה בהעתקה");}
  };
  const handleWhatsAppDriver=driverId=>{
    const text=formatDriverText(driverId,tasksByDriver[driverId]);
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  const driverIds=Object.keys(tasksByDriver);
  return<Modal open={true} onClose={onClose} title="🚛 פיצול משלוחים לפי נהג" maxWidth={600}>
    <div style={{direction:"rtl"}}>
      <div style={{background:"#f0f9ff",padding:12,borderRadius:8,marginBottom:15,fontSize:14}}>
        📅 {date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}
        <br/>
        <span style={{color:"#6b7280",fontSize:13}}>סה"כ {tasks.length} משלוחים מחולקים בין {driverIds.length} נהגים</span>
      </div>
      {driverIds.length===0?<div style={{textAlign:"center",padding:30,color:"#9ca3af"}}>אין משלוחים ביום זה</div>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {driverIds.map(driverId=>{
          const driverTasks=tasksByDriver[driverId];
          const driver=drivers.find(d=>d.id===driverId);
          const isUnassigned=driverId==="_unassigned";
          return<div key={driverId} style={{background:isUnassigned?"#fef2f2":"#fff",border:`2px solid ${isUnassigned?"#fca5a5":(driver?.color||"#d1d5db")}`,borderRadius:8,padding:12}}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>{getDriverName(driverId)}</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>{driverTasks.length} משלוחים</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:10,maxHeight:80,overflowY:"auto"}}>
              {driverTasks.map((t,i)=><div key={t.id} style={{padding:"2px 0"}}>
                {i+1}. {t.client_name}
                {t.delivery_address_snapshot&&` - ${t.delivery_address_snapshot.substring(0,30)}${t.delivery_address_snapshot.length>30?"...":""}`}
              </div>)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button type="button" onClick={()=>handleCopyDriver(driverId)} style={{flex:1,padding:"8px 10px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>📋 העתק</button>

function groupDeliveriesForPdf(deliveries,drivers){
  const driverName=d=>{
    const drv=(drivers||[]).find(x=>String(x.id)===String(d.assigned_driver_id));
    return drv&&drv.name?String(drv.name).trim():"";
  };
  const hasDrivers=(deliveries||[]).length>0&&deliveries.every(d=>d.assigned_driver_id&&driverName(d));
  const groups={};
  if(hasDrivers){
    deliveries.forEach(d=>{
      const key=driverName(d)||"אחר";
      if(!groups[key])groups[key]=[];
      groups[key].push(d);
    });
    return{type:"driver",groups};
  }
  deliveries.forEach(d=>{
    const city=extractCityFromAddress(d.delivery_address_snapshot);
    const region=city&&cityRegionsCache&&cityRegionsCache[city]?cityRegionsCache[city]:"לא ידוע";
    const key=region||"לא ידוע";
    if(!groups[key])groups[key]=[];
    groups[key].push(d);
  });
  return{type:"region",groups};
}
function renderDeliveryPdfContent(deliveries,grouped,dateStr){
  const container=document.getElementById("delivery-pdf-container");
  if(!container)return;
  const date=new Date(dateStr+"T12:00:00");
  const dayName=date.toLocaleDateString("he-IL",{weekday:"long"});
  const dateFormatted=date.toLocaleDateString("he-IL");
  const regionOrder=["צפון","חיפה","שרון","מרכז","ירושלים","שפלה","דרום","לא ידוע"];
  const groupKeys=Object.keys(grouped.groups||{}).sort((a,b)=>{
    if(grouped.type==="region"){
      const ia=regionOrder.indexOf(a),ib=regionOrder.indexOf(b);
      if(ia>=0||ib>=0)return(ia<0?999:ia)-(ib<0?999:ib);
    }
    return String(a).localeCompare(String(b),"he");
  });
  const groupsHtml=groupKeys.map(key=>{
    const items=grouped.groups[key]||[];
    const groupTitle=grouped.type==="driver"?`👤 נהג: ${escHtml(key)}`:`🗺️ אזור: ${escHtml(key)}`;
    const deliveryCards=items.map((delivery,idx)=>{
      const orderLabel=delivery.bina_order_id?`#${escHtml(delivery.bina_order_id)}`:`#${idx+1}`;
      const contact=[delivery.delivery_contact_snapshot,delivery.delivery_phone_snapshot].filter(Boolean).join(" • ");
      const itemsList=Array.isArray(delivery.items)?delivery.items:[];
      const itemsHtml=itemsList.length?`<div class="delivery-row"><span class="delivery-icon">📦</span><span>${itemsList.map(it=>`${escHtml(it.description||"—")} ×${it.quantity??0}`).join(" · ")}</span></div>`:"";
      return`<div class="delivery-card">
        <div class="delivery-header">
          <div class="delivery-number">${orderLabel}</div>
          <div class="delivery-company">${escHtml(delivery.client_name||"ללא שם")}</div>
        </div>
        <div class="delivery-info">
          ${contact?`<div class="delivery-row"><span class="delivery-icon">👤</span><span>${escHtml(contact)}</span></div>`:""}
          ${delivery.delivery_address_snapshot?`<div class="delivery-row"><span class="delivery-icon">📍</span><span>${escHtml(delivery.delivery_address_snapshot)}</span></div>`:""}
          ${itemsHtml}
          ${delivery.delivery_special_notes?`<div class="delivery-row"><span class="delivery-icon">📝</span><span>${escHtml(delivery.delivery_special_notes)}</span></div>`:""}
        </div>
        <div class="delivery-signature">
          <div class="signature-line"><span>חתימה:</span><div class="signature-empty"></div></div>
          <div class="signature-line"><span>תאריך:</span><div class="signature-empty small"></div></div>
        </div>
      </div>`;
    }).join("");
    return`<div class="delivery-group"><div class="delivery-group-title">${groupTitle} <span class="delivery-group-count">(${items.length} משלוחים)</span></div>${deliveryCards}</div>`;
  }).join("");
  container.innerHTML=`<div class="delivery-pdf-content">
    <div class="delivery-pdf-header">
      <div class="delivery-pdf-logo">🖨️ נטלי פרינט</div>
      <div class="delivery-pdf-title">📦 טופס משלוחים</div>
      <div class="delivery-pdf-date">${escHtml(dayName)}, ${escHtml(dateFormatted)}</div>
      <div class="delivery-pdf-count">${deliveries.length} משלוחים</div>
    </div>
    ${groupsHtml}
    <div class="delivery-pdf-footer">🖨️ נטלי פרינט © ${new Date().getFullYear()}</div>
  </div>`;
}
async function generateDeliveryPdf(dateStr){
  await loadCityRegions();
  const drivers=await sb("drivers?is_active=eq.true&order=name.asc");
  const data=await sb(`tasks?scheduled_delivery_date=eq.${dateStr}&delivery_status=in.(ready,in_transit)&order=delivery_order.asc.nullslast`);
  let deliveries=Array.isArray(data)?data:[];
  if(!deliveries.length){
    window.alert("אין משלוחים בתאריך שנבחר");
    return;
  }
  const taskIds=deliveries.map(t=>t.id);
  if(taskIds.length){
    const itemsRows=await sb(`task_items?task_id=in.(${taskIds.join(",")})&order=id.asc`);
    const allItems=Array.isArray(itemsRows)?itemsRows:[];
    deliveries=deliveries.map(t=>({...t,items:allItems.filter(i=>String(i.task_id)===String(t.id))}));
  }
  const grouped=groupDeliveriesForPdf(deliveries,Array.isArray(drivers)?drivers:[]);
  renderDeliveryPdfContent(deliveries,grouped,dateStr);
  document.body.classList.add("printing-delivery-pdf");
  setTimeout(()=>{
    window.print();
    setTimeout(()=>{
      document.body.classList.remove("printing-delivery-pdf");
      const pdfContainer=document.getElementById("delivery-pdf-container");
      if(pdfContainer)pdfContainer.innerHTML="";
    },500);
  },100);
}

function ShipmentsDashboard({user,clients,onOpenDeliveryNote,refreshAll}){
  const [tasks,setTasks]=useState([]);
  const [drivers,setDrivers]=useState([]);
  const [weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;});
  const [loading,setLoading]=useState(true);
  const [draggedTask,setDraggedTask]=useState(null);
  const [showDriverManager,setShowDriverManager]=useState(false);
  const [deliveryNoteModal,setDeliveryNoteModal]=useState(null);
  const [showSplitByDriverModal,setShowSplitByDriverModal]=useState(null);
  const [showDeliveryPdf,setShowDeliveryPdf]=useState(false);
  const navBtnStyle={padding:"8px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13};
  const loadData=async()=>{
    try{
      const drs=await sb("drivers?is_active=eq.true&order=name.asc");
      setDrivers(Array.isArray(drs)?drs:[]);
      const data=await sb("tasks?delivery_status=in.(ready,in_transit,delivered)&or=(archived_at.is.null,delivery_status.in.(ready,in_transit))&order=scheduled_delivery_date.asc,delivery_order.asc");
      let enriched=Array.isArray(data)?data:[];
      if(enriched.length>0){
        const taskIds=enriched.map(t=>t.id);
        const idsParam=taskIds.join(",");
        const itemsRows=await sb(`task_items?task_id=in.(${idsParam})&order=id.asc`);
        const allItems=Array.isArray(itemsRows)?itemsRows:[];
        enriched=enriched.map(t=>({...t,items:allItems.filter(i=>String(i.task_id)===String(t.id))}));
      }
      setTasks(enriched);
    }catch(e){setTasks([]);setDrivers([]);}
    setLoading(false);
  };
  useEffect(()=>{
    setLoading(true);
    loadData();
    const interval=setInterval(loadData,60000);
    return()=>clearInterval(interval);
  },[weekStart]);
  const weekDays=useMemo(()=>{
    const days=[];
    for(let i=0;i<5;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);days.push(d);}
    return days;
  },[weekStart]);
  const getTasksForDay=(date)=>{
    const dateStr=toLocalDateStr(date);
    return tasks.filter(t=>t.scheduled_delivery_date===dateStr).sort((a,b)=>(a.delivery_order||999)-(b.delivery_order||999));
  };
  const unscheduledTasks=tasks.filter(t=>!t.scheduled_delivery_date);
  const weekendTasks=useMemo(()=>tasks.filter(t=>{
    if(!t.scheduled_delivery_date)return false;
    const day=shipmentDateWeekday(t.scheduled_delivery_date);
    return day===5||day===6;
  }),[tasks]);
  const weekStartStr=toLocalDateStr(weekStart);
  const pastTasks=tasks.filter(t=>t.scheduled_delivery_date&&t.scheduled_delivery_date<weekStartStr);
  const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);};
  const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);};
  const goToday=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWeekStart(d);};
  const handleDragStart=task=>setDraggedTask(task);
  const handleDrop=async targetDate=>{
    if(!draggedTask)return;
    const targetDateStr=targetDate?toLocalDateStr(targetDate):null;
    const dayTasks=targetDate?getTasksForDay(targetDate):[];
    const newOrder=dayTasks.length+1;
    try{
      await sb(`tasks?id=eq.${draggedTask.id}`,{method:"PATCH",body:JSON.stringify({scheduled_delivery_date:targetDateStr,delivery_order:targetDateStr?newOrder:null})});
      setDraggedTask(null);
      await loadData();
      if(refreshAll)await refreshAll();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const handleMoveTo=async(task,dateStr)=>{
    try{
      const dayTasks=dateStr?tasks.filter(t=>t.scheduled_delivery_date===dateStr&&t.id!==task.id):[];
      const newOrder=dateStr?dayTasks.length+1:null;
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({scheduled_delivery_date:dateStr,delivery_order:newOrder})});
      await loadData();
      if(refreshAll)await refreshAll();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const formatShipmentDayText=(date,dayTasks)=>{
    const dateStr=date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
    let text=`📦 *משלוחי יום ${dateStr}*\n`;
    text+=`סה"כ: ${dayTasks.length} משלוחים\n\n`;
    text+="━━━━━━━━━━━━━━\n\n";
    dayTasks.forEach((t,i)=>{
      text+=`*${i+1}. ${t.client_name||"—"}*\n`;
      if(t.bina_order_id)text+=`📝 הזמנה #${t.bina_order_id}\n`;
      if(t.sales_agent)text+=`👤 סוכן: ${t.sales_agent}\n`;
      if(t.delivery_address_snapshot)text+=`📍 ${t.delivery_address_snapshot}\n`;
      if(t.delivery_contact_snapshot||t.delivery_phone_snapshot){
        const contactLine=`${t.delivery_contact_snapshot||""} ${t.delivery_phone_snapshot||""}`.trim();
        if(contactLine)text+=`📞 ${contactLine}\n`;
      }
      const dayItems=Array.isArray(t.items)?t.items:[];
      if(dayItems.length>0){
        text+=`\n📦 פריטים:\n`;
        dayItems.forEach(item=>{text+=`   • ${item.description||"—"} (×${item.quantity??0})\n`;});
      }
      if(t.delivery_special_notes)text+=`\n💬 ${t.delivery_special_notes}\n`;
      text+="\n━━━━━━━━━━━━━━\n\n";
    });
    return text;
  };
  const copyDayToClipboard=date=>{
    const dayTasks=getTasksForDay(date);
    if(dayTasks.length===0){window.alert("אין משלוחים ביום זה");return;}
    const text=formatShipmentDayText(date,dayTasks);
    navigator.clipboard.writeText(text).then(()=>window.alert(`✅ הועתק! ${dayTasks.length} משלוחים`)).catch(()=>window.alert("שגיאה בהעתקה"));
  };
  const sendDayWhatsApp=date=>{
    const dayTasks=getTasksForDay(date);
    if(dayTasks.length===0)return;
    const text=formatShipmentDayText(date,dayTasks);
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  const openNote=task=>{
    if(onOpenDeliveryNote)onOpenDeliveryNote(task);
    else setDeliveryNoteModal({task});
  };
  return<div style={{direction:"rtl",padding:4}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <h1 style={{fontSize:22,fontWeight:800,margin:0}}>🚚 דשבורד משלוחים</h1>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button type="button" className="btn-delivery-pdf" onClick={()=>setShowDeliveryPdf(true)} title="הפקת PDF של משלוחים לפי תאריך">🖨️ PDF משלוחים</button>
        <button type="button" onClick={()=>setShowDriverManager(true)} style={{...navBtnStyle,background:"#ecfeff",borderColor:"#0e7490",color:"#0e7490",fontWeight:600}}>🚛 ניהול נהגים</button>
      </div>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",padding:12,borderRadius:10,marginBottom:15,border:"1px solid var(--border)"}}>
      <button type="button" onClick={prevWeek} style={navBtnStyle}>‹ שבוע קודם</button>
      <div style={{fontWeight:600,fontSize:15,textAlign:"center"}}>
        {weekStart.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})} – {weekDays[4].toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}
        <button type="button" onClick={goToday} style={{marginRight:10,fontSize:12,background:"none",border:"none",color:"#7c3aed",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>היום</button>
      </div>
      <button type="button" onClick={nextWeek} style={navBtnStyle}>שבוע הבא ›</button>
    </div>
    {loading?<div style={{textAlign:"center",padding:40}}><Spinner sz={28}/></div>:<>
    {unscheduledTasks.length>0&&<div onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop(null)} style={{background:"#fef3c7",padding:15,borderRadius:10,marginBottom:15,border:"2px dashed #f59e0b"}}>
      <h3 style={{margin:"0 0 10px",color:"#78350f",fontSize:15}}>📦 ממתינים לתזמון ({unscheduledTasks.length})</h3>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {unscheduledTasks.map(task=><ShipmentCube key={task.id} task={task} drivers={drivers} onDragStart={()=>handleDragStart(task)} compact onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients} onMoveTo={handleMoveTo}/>)}
      </div>
    </div>}
    {weekendTasks.length>0&&<div style={{background:"#fef2f2",padding:15,borderRadius:10,marginBottom:15,border:"2px solid #fca5a5"}}>
      <h3 style={{margin:"0 0 10px",color:"#991b1b",fontSize:15}}>⚠️ תאריכים חריגים - שישי/שבת ({weekendTasks.length})</h3>
      <div style={{fontSize:12,color:"#7f1d1d",marginBottom:10}}>המשלוחים הבאים תוזמנו לסוף השבוע. לחץ על כל אחד כדי לערוך.</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {weekendTasks.map(task=>{
          const p=String(task.scheduled_delivery_date).split("-").map(Number);
          const dateLabel=p.length>=3?new Date(p[0],p[1]-1,p[2]).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"}):"";
          return<div key={task.id} style={{display:"flex",flexDirection:"column"}}>
            <ShipmentCube task={task} drivers={drivers} onDragStart={()=>handleDragStart(task)} onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients} onMoveTo={handleMoveTo}/>
            <div style={{textAlign:"center",fontSize:10,color:"#991b1b",marginTop:2,fontWeight:600}}>{dateLabel}</div>
          </div>;
        })}
      </div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
      {weekDays.map((date,i)=><DayColumn key={i} date={date} tasks={getTasksForDay(date)} drivers={drivers} onDragStart={handleDragStart} onDrop={()=>handleDrop(date)} onCopyDay={()=>copyDayToClipboard(date)} onSendWhatsApp={()=>sendDayWhatsApp(date)} onSplitDay={()=>setShowSplitByDriverModal({date,tasks:getTasksForDay(date)})} isToday={toLocalDateStr(date)===toLocalDateStr(new Date())} onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients} onMoveTo={handleMoveTo}/>)}
    </div>
    {pastTasks.length>0&&<details style={{marginTop:20,background:"#fff",padding:15,borderRadius:10,border:"1px solid var(--border)"}}>
      <summary style={{cursor:"pointer",fontWeight:600}}>📚 משלוחים קודמים ({pastTasks.length})</summary>
      <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:8}}>
        {pastTasks.slice(0,30).map(t=><ShipmentCube key={t.id} task={t} drivers={drivers} compact readonly onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients}/>)}
      </div>
    </details>}
    </>}
    {showDriverManager&&<DriverManagerModal drivers={drivers} onClose={()=>setShowDriverManager(false)} onUpdate={loadData}/>}
    {deliveryNoteModal&&<DeliveryNoteModal task={deliveryNoteModal.task} clients={clients} user={user} onClose={()=>setDeliveryNoteModal(null)}/>}
    {showSplitByDriverModal&&<SplitByDriverModal date={showSplitByDriverModal.date} tasks={showSplitByDriverModal.tasks} drivers={drivers} onClose={()=>setShowSplitByDriverModal(null)}/>}
    {showDeliveryPdf&&<DeliveryPdfDialog onClose={()=>setShowDeliveryPdf(false)}/>}
  </div>;
}

function ClientAddressesList({clientId}){
  const [addresses,setAddresses]=useState([]);
  const [loading,setLoading]=useState(true);
  const loadAddresses=async()=>{
    setLoading(true);
    try{
      const data=await sb(`client_addresses?client_id=eq.${clientId}&order=is_default.desc,last_used_at.desc`);
      setAddresses(Array.isArray(data)?data:[]);
    }catch(e){setAddresses([]);}
    setLoading(false);
  };
  useEffect(()=>{if(clientId)loadAddresses();},[clientId]);
  const setDefault=async(addressId)=>{
    try{
      await sb(`client_addresses?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      await sb(`client_addresses?id=eq.${addressId}`,{method:"PATCH",body:JSON.stringify({is_default:true})});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };

    if(!window.confirm("למחוק את הכתובת?"))return;
    try{
      await sb(`client_addresses?id=eq.${addressId}`,{method:"DELETE"});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}

  if(loading)return<div style={{padding:12,color:"var(--text3)",fontSize:13}}><Spinner sz={16}/> טוען כתובות…</div>;

        </div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>

function Login({onLogin,sb}){
  const [users,setUsers]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selectedUser,setSelectedUser]=useState(null);
  const [password,setPassword]=useState("");
  const [confirmPassword,setConfirmPassword]=useState("");
  const [rememberMe,setRememberMe]=useState(true);
  const [error,setError]=useState("");
  const [busy,setBusy]=useState(false);

  useEffect(()=>{
    (async()=>{
      try{
        const data=await sb("users?order=role.desc,name.asc");
        setUsers(data||[]);
      }catch(err){
        console.error("Failed to load users:",err);
      }finally{
        setLoading(false);
      }
    })();
    try{
      const saved=localStorage.getItem("printos_session");
      if(saved){
        const session=JSON.parse(saved);
        if(session.expires_at&&session.expires_at>Date.now()&&session.user){
          onLogin(session.user);
        }else{
          localStorage.removeItem("printos_session");
        }
      }
    }catch(_){
      localStorage.removeItem("printos_session");
    }
  },[]);

  function completeLogin(user){
    const safeUser={...user,password_hash:undefined};
    if(rememberMe){
      try{
        localStorage.setItem("printos_session",JSON.stringify({
          user:safeUser,
          expires_at:Date.now()+30*24*60*60*1000,
        }));
      }catch(err){
        console.warn("Could not save session:",err);
      }
    }else{
      localStorage.removeItem("printos_session");
    }
    onLogin(safeUser);
  }

  async function handleLogin(){
    setError("");
    if(!selectedUser)return;
    const isFirstTime=!selectedUser.password_hash;
    const bcrypt=window.dcodeIO&&window.dcodeIO.bcrypt;
    if(!bcrypt){
      setError("ספריית האבטחה לא נטענה — רענן את הדף");
      return;
    }
    if(isFirstTime){
      if(password.length<6){setError("הסיסמה חייבת להיות לפחות 6 תווים");return;}
      if(password!==confirmPassword){setError("הסיסמאות לא תואמות");return;}
      setBusy(true);
      try{
        const salt=bcrypt.genSaltSync(10);
        const hash=bcrypt.hashSync(password,salt);
        await sb(`users?id=eq.${selectedUser.id}`,{
          method:"PATCH",
          body:JSON.stringify({password_hash:hash,password_updated_at:new Date().toISOString()}),
          headers:{"Content-Type":"application/json",Prefer:"return=minimal"},
        });
        completeLogin({...selectedUser,password_hash:hash});
      }catch(err){
        setError("שגיאה בשמירת הסיסמה: "+(err.message||String(err)));
      }finally{
        setBusy(false);
      }
    }else{
      if(!password){setError("אנא הקלד סיסמה");return;}
      setBusy(true);
      try{
        const isValid=bcrypt.compareSync(password,selectedUser.password_hash);
        if(!isValid){setError("סיסמה שגויה");setBusy(false);return;}
        completeLogin(selectedUser);
      }catch(_){
        setError("שגיאה בבדיקת הסיסמה");
        setBusy(false);
      }
    }
  }

  function handleUserSelect(user){
    setSelectedUser(user);
    setPassword("");
    setConfirmPassword("");
    setError("");
    setTimeout(()=>{
      const input=document.getElementById("password-input");
      if(input)input.focus();
    },100);
  }

  function handleBack(){
    setSelectedUser(null);
    setPassword("");
    setConfirmPassword("");
    setError("");
  }

  if(loading)return<div className="login-screen"><div className="login-loading"><Spinner sz={36}/></div></div>;

  if(!selectedUser){
    return<div className="login-screen">
      <div className="login-header">
        <h1>🖨️ PrintOS</h1>
        <p>בחר משתמש כדי להיכנס</p>
      </div>
      <div className="login-users-list">
        {users.map(user=>{
          const isAdmin=user.role==="admin";
          return<button key={user.id} type="button" onClick={()=>handleUserSelect(user)} className={`login-user-card ${isAdmin?"admin":"worker"}`}>
            <div className="login-user-avatar">{isAdmin?"👑":"👤"}</div>
            <div className="login-user-info">
              <div className="login-user-name">{user.name}</div>
              <div className="login-user-role">{isAdmin?"מנהל/ת":(user.dept||"עובד/ת")}</div>
            </div>
            {!user.password_hash&&<div className="login-user-badge">כניסה ראשונה</div>}
          </button>;
        })}
      </div>
    </div>;
  }

  const isFirstTime=!selectedUser.password_hash;
  return<div className="login-screen">
    <div className="login-header">
      <h1>שלום, {selectedUser.name} 👋</h1>
      {isFirstTime&&<div className="login-first-time-msg">🎉 ברוך הבא! זו הכניסה הראשונה שלך - אנא בחר סיסמה</div>}
    </div>
    <div className="login-form">
      <div className="login-field">
        <label>{isFirstTime?"סיסמה חדשה:":"הקלד סיסמה:"}</label>
        <input id="password-input" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!isFirstTime&&handleLogin()} disabled={busy} autoFocus/>
      </div>
      {isFirstTime&&<>
        <div className="login-field">
          <label>אישור סיסמה:</label>
          <input type="password" value={confirmPassword} onChange={e=>setConfirmPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} disabled={busy}/>
        </div>
        <div className="login-hint">💡 לפחות 6 תווים</div>
      </>}
      <label className="login-checkbox">
        <input type="checkbox" checked={rememberMe} onChange={e=>setRememberMe(e.target.checked)} disabled={busy}/>
        זכור אותי ל-30 יום
      </label>
      {error&&<div className="login-error">⚠️ {error}</div>}
      <div className="login-actions">
        <button type="button" onClick={handleBack} className="login-btn-back" disabled={busy}>חזור</button>
        <button type="button" onClick={handleLogin} className="login-btn-primary" disabled={busy}>{busy?"⏳":isFirstTime?"שמור וכניסה →":"כניסה →"}</button>
      </div>
    </div>
  </div>;
}

// ── AI CHAT ──
function AiChat({user,tasks,clients,onRefresh,onClose}){
  const [msgs,setMsgs]=useState([{role:"ai",text:`שלום ${user.name.split(" ")[0]}! 👋\nאני עוזר ה-AI של PrintOS.\n\nתוכל לבקש ממני:\n• להוסיף משימות\n• לעדכן סטטוסים\n• לשאול על נתונים\n\nמה תרצה?`}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const txt=input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text:txt}]);
    setLoading(true);

    const system=`אתה עוזר AI לניהול בית דפוס PrintOS. עונה בעברית בלבד, קצר וברור.
משתמש: ${user.name} | ${user.role==="admin"?"מנהל":"עובד ב-"+(user?.dept||"—")}
מחלקות: ${DEPTS.join(", ")}
משימות קיימות (${tasks.length}): ${tasks.slice(0,10).map(t=>`[${t.id?.slice(0,6)}] ${t.title}|${t.dept}|${t.status}`).join(" | ")}
לקוחות: ${clients.slice(0,10).map(c=>c.name).join(", ")}

כשצריך לבצע פעולה, כלול JSON בתוך \`\`\`json ... \`\`\`:
{ "action": "add_task"|"update_status"|"none", "data": {...}, "message": "תשובה" }

add_task: data={title,dept,priority,client_name,assignee,due_date,notes}
update_status: data={task_id(6תווים),status}`;

    try{
      const res=await fetch("/api/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system,
          messages:[
            ...msgs.filter(m=>m.role!=="ai"||msgs.indexOf(m)>0).slice(-6).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text})),
            {role:"user",content:txt}
          ]
        })
      });
      const data=await res.json();
      const raw=data.content?.[0]?.text||"מצטער, לא הצלחתי להבין.";
      const match=raw.match(/```json\s*([\s\S]*?)\s*```/);
      let action=null;
      if(match){try{action=JSON.parse(match[1]);}catch{}}
      const reply=action?.message||raw.replace(/```json[\s\S]*?```/g,"").trim();
      setMsgs(p=>[...p,{role:"ai",text:reply}]);

      if(action?.action==="add_task"&&action.data?.title){
        const d=action.data;
        await sb("tasks",{method:"POST",body:JSON.stringify({title:d.title,dept:d.dept||user?.dept||DEPTS[0],priority:d.priority||"בינונית",status:"ממתין",client_name:d.client_name||"",assignee:d.assignee||"",due_date:d.due_date||null,notes:d.notes||"",created_by:user.name})});
        onRefresh();
        setMsgs(p=>[...p,{role:"ai",text:`✅ המשימה "${d.title}" נוספה!`}]);
      }
      if(action?.action==="update_status"&&action.data){
        const task=tasks.find(t=>t.id?.startsWith(action.data.task_id));
        if(task){
          await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({status:action.data.status})});
          onRefresh();

// ── CALENDAR TAB ──
function CalendarTab({tasks,taskItems,user,isA,onTaskClick,clients,onTaskRefresh}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [deptFilter,setDeptFilter]=useState(isA?"הכל":(user?.dept||DEPTS[0]));

  const getWeekDays=()=>{
    const today=new Date();
    const monday=new Date(today);
    monday.setDate(today.getDate()-today.getDay()+1+weekOffset*7);
    return Array.from({length:7},(_,i)=>{
      const d=new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  };

  const days=getWeekDays();
  const todayStr=new Date().toISOString().split('T')[0];

  const dayNames=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  const getTasksForDay=(dateStr)=>{
    let filtered=tasks.filter(t=>t.due_date===dateStr&&isTaskActive(t));
    if(deptFilter!=="הכל"){
      const ids=new Set((taskItems||[]).filter(i=>i.department===deptFilter&&i.status!=="ארכיון").map(i=>i.task_id));
      filtered=filtered.filter(t=>!t.has_items?t.dept===deptFilter:ids.has(t.id));
    }
    return filtered;
  };

  const weekStart=days[0];
  const weekEnd=days[6];
  const weekLabel=`${weekStart.getDate()} ${monthNames[weekStart.getMonth()]} — ${weekEnd.getDate()} ${monthNames[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;

  return<div>
    <div style={{marginBottom:20}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",margin:0}}>לוח שנה 📅</h1>
      <p style={{color:"var(--text3)",margin:"5px 0 0",fontSize:13}}>{weekLabel}</p>
    </div>

    {/* Controls */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setWeekOffset(p=>p-1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>← שבוע קודם</button>
        <button onClick={()=>setWeekOffset(0)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:weekOffset===0?"var(--blue-light)":"#fff",color:weekOffset===0?"var(--blue)":"var(--text2)",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>היום</button>
        <button onClick={()=>setWeekOffset(p=>p+1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>שבוע הבא →</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {["הכל",...DEPTS].map(d=><button key={d} onClick={()=>setDeptFilter(d)} style={{padding:"5px 10px",borderRadius:20,border:`1px solid ${deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--border)"}`,background:deptFilter===d?`${DEPT_COLORS[d]||"#2563EB"}15`:"#fff",color:deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--text2)",fontWeight:600,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{d}</button>)}
      </div>
    </div>

    {/* Week grid */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
      {days.map((day,i)=>{
        const dateStr=day.toISOString().split('T')[0];
        const dayTasks=getTasksForDay(dateStr);
        const isToday=dateStr===todayStr;
        const isWeekend=day.getDay()===5||day.getDay()===6;

        return<div key={dateStr} style={{background:isToday?"var(--blue-light)":isWeekend?"var(--bg2)":"#fff",border:`1px solid ${isToday?"var(--blue-mid)":"var(--border)"}`,borderRadius:12,padding:10,minHeight:140}}>
          <div style={{marginBottom:8,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:600,color:isToday?"var(--blue)":"var(--text3)"}}>{dayNames[day.getDay()]}</div>
            <div style={{width:28,height:28,borderRadius:"50%",background:isToday?"var(--blue)":"transparent",color:isToday?"#fff":"var(--text)",fontWeight:isToday?800:600,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"2px auto 0"}}>{day.getDate()}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {dayTasks.map(t=>{
              const sc=SC[t.status]||{c:"#475569",bg:"#F1F5F9"};
              return<div key={t.id} style={{display:"flex",alignItems:"center",gap:4}}>
                <div onClick={()=>onTaskClick(t)} style={{flex:1,minWidth:0,padding:"4px 7px",borderRadius:6,background:sc.bg,borderRight:`3px solid ${DEPT_COLORS[t.dept]||sc.c}`,cursor:"pointer",fontSize:10,fontWeight:600,color:sc.c,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={t.title}>
                  {t.title}
                </div>
                <button type="button" onClick={e=>openLabelPrintTask(e,t)} title="הדפס מדבקת אריזה" style={{...LABEL_PRINT_BTN_STYLE,padding:"2px 6px",flexShrink:0}}>🏷️</button>
                <button type="button" onClick={e=>openDeliveryNoteFromTask(e,t)} title="תעודת משלוח" style={{...DELIVERY_NOTE_BTN_STYLE,padding:"2px 4px",fontSize:8,whiteSpace:"normal",lineHeight:1.15,textAlign:"center",maxWidth:72}}>📋 תעודת משלוח</button>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskMoveToDeliveryBtn task={t}/></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskInquiryButton task={t} user={user} compact/></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><RefreshFromBinaButton task={t} compact onUpdate={onTaskRefresh} /></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskNotificationButtons task={t} user={user} clients={clients} onUpdate={onTaskRefresh} compact/></div>

              </div>;
            })}
            {dayTasks.length===0&&<div style={{fontSize:10,color:"var(--text3)",textAlign:"center",paddingTop:8}}>—</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

            <div style="flex:1;font-size:12px;color:#94A3B8">שעת מסירה: ________________</div>

        </div>;
      })}

  </div>;
}

function CreateOrderModal({open,onClose,onSuccess,clients,sb}){
  const [step,setStep]=useState(1);
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState(null);
  const [clientSearch,setClientSearch]=useState("");
  const [selectedClient,setSelectedClient]=useState(null);
  const [items,setItems]=useState([{description:"",quantity:1,unitPrice:0,discount:0}]);
  const [title,setTitle]=useState("");
  const [remark,setRemark]=useState("");
  const [dept,setDept]=useState("כללי");
  const [agent,setAgent]=useState("");
  const [contactName,setContactName]=useState("");
  useEffect(()=>{
    if(open){
      setStep(1);
      setClientSearch("");
      setSelectedClient(null);
      setItems([{description:"",quantity:1,unitPrice:0,discount:0}]);
      setTitle("");
      setRemark("");
      setDept("כללי");
      setAgent("");
      setContactName("");
      setError(null);
      setSubmitting(false);
    }
  },[open]);
  if(!open)return null;
  const filteredClients=(clients||[]).filter(c=>{
    if(!clientSearch.trim())return true;
    const q=clientSearch.toLowerCase().trim();
    return (
      (c.name||"").toLowerCase().includes(q)||
      (c.phone||"").includes(q)||
      String(c.bina_customer_id||"").includes(q)
    );
  }).slice(0,50);
  const itemsTotal=items.reduce((sum,it)=>{
    const qty=Number(it.quantity)||0;
    const price=Number(it.unitPrice)||0;
    const disc=Number(it.discount)||0;
    return sum+qty*price*(1-disc/100);
  },0);
  const addItem=()=>{setItems([...items,{description:"",quantity:1,unitPrice:0,discount:0}]);};
  const removeItem=(idx)=>{if(items.length===1)return;setItems(items.filter((_,i)=>i!==idx));};
  const updateItem=(idx,field,value)=>{const ni=[...items];ni[idx]={...ni[idx],[field]:value};setItems(ni);};
  const handleSubmit=async()=>{
    setSubmitting(true);
    setError(null);
    try{
      const payload={
        client:{
          binaCustomerId:String(selectedClient.bina_customer_id),
          name:selectedClient.name||"ללא שם",
          city:selectedClient.address||"ללא",
          address:selectedClient.address||"ללא",
          contactPerson:(contactName||"").trim()||selectedClient.name||"ללא",
          phone:selectedClient.phone||"",
          email:selectedClient.email||"",
        },
        items:items.map((it,idx)=>({
          itemId:`LINE-${idx+1}`,
          description:it.description||`פריט ${idx+1}`,
          quantity:Number(it.quantity)||1,
          unitPrice:Number(it.unitPrice)||0,
          discount:Number(it.discount)||0,
        })),
        title:title||`הזמנה ל${selectedClient.name||"לקוח"}`,
        remark:remark||"",
      };
      const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-order",{body:payload});
      if(invE)throw new Error(invE.message);
      let result=data;
      if(typeof data==="string"){try{result=JSON.parse(data)}catch{result=null}}
      if(!result||result.success!==true)throw new Error(result?.error||"שגיאה לא ידועה");
      if(result.taskId){
        const taskPatch={};
        if(dept!=="כללי")taskPatch.dept=dept;
        const ag=(agent||"").trim();
        if(ag)taskPatch.assignee=ag;
        taskPatch.sales_agent=ag||null;
        try{
          await sb(`tasks?id=eq.${result.taskId}`,{method:"PATCH",body:JSON.stringify(taskPatch)});
        }catch(e){console.warn("Failed to update task (dept/assignee/sales_agent):",e)}
      }
      try{
        const addrStr=selectedClient.address||"";
        const cityPart=(addrStr.split(",")[0]||"").trim();
        const orderRow={
          bina_doc_id:Number(result.binaOrderId),
          title:title||`הזמנה ל${selectedClient.name||"לקוח"}`,
          bina_cust_id:parseInt(String(selectedClient.bina_customer_id),10),
          bina_cust_name:selectedClient.name||"",
          bina_cust_address:addrStr||null,
          bina_cust_city:cityPart||null,
          bina_cust_phone:selectedClient.phone||null,
          bina_cust_email:selectedClient.email||null,
          contact_person:(contactName||"").trim()||null,
          sales_agent:(agent||"").trim()||null,
          remark:remark||"",
          status:"נשלחה",
          task_id:result.taskId||null,
        };
        const ordRes=await sb("orders",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(orderRow)});
        const ord=Array.isArray(ordRes)?ordRes[0]:ordRes;
        if(ord?.id){
          const oItems=items.map((it,idx)=>({
            order_id:ord.id,
            line_number:idx+1,
            description:it.description||`פריט ${idx+1}`,
            quantity:Number(it.quantity)||1,
            unit_price:Number(it.unitPrice)||0,
            discount_pct:Number(it.discount)||0,
          }));
          await sb("order_items",{method:"POST",body:JSON.stringify(oItems)});
        }
      }catch(e){console.warn("[CreateOrderModal] orders DB save failed:",e);}
      if(onSuccess)onSuccess(result);
      const orderTitleUi=title||`הזמנה ל${selectedClient.name||"לקוח"}`;
      const showPDF=window.confirm(`✅ נוצרה הזמנה #${result.binaOrderId} בבינה!\n\nלפתוח PDF לתצוגה/הדפסה?`);
      if(showPDF&&typeof window.openDocumentPDF==="function"){
        window.openDocumentPDF({
          docType:"order",
          binaDocId:result.binaOrderId,
          title:orderTitleUi,
          client:{
            name:selectedClient.name,
            address:selectedClient.address,
            phone:selectedClient.phone,
            email:selectedClient.email||"",
            contactPerson:(contactName||"").trim()||selectedClient.name,
          },
          items:items.map(it=>({description:it.description,quantity:Number(it.quantity)||1,unitPrice:Number(it.unitPrice)||0,discount:Number(it.discount)||0})),
          agent:(agent||"").trim(),
          createdAt:new Date().toISOString(),
          remark:remark||"",
        });
      }
      onClose();

  </div>;
  const renderStep3=()=><div>

      <option value="נטלי">נטלי</option>

function CreateQuoteModal({open,onClose,onSuccess,clients,sb}){
  const [step,setStep]=useState(1);
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState(null);
  const [clientSearch,setClientSearch]=useState("");
  const [selectedClient,setSelectedClient]=useState(null);
  const [items,setItems]=useState([{description:"",quantity:1,unitPrice:0,discount:0}]);
  const [title,setTitle]=useState("");
  const [agent,setAgent]=useState("");
  const [contactName,setContactName]=useState("");
  useEffect(()=>{
    if(open){
      setStep(1);
      setClientSearch("");
      setSelectedClient(null);
      setItems([{description:"",quantity:1,unitPrice:0,discount:0}]);
      setTitle("");
      setAgent("");
      setContactName("");
      setError(null);
      setSubmitting(false);
    }
  },[open]);
  if(!open)return null;
  const filteredClients=(clients||[]).filter(c=>{
    if(!clientSearch.trim())return true;
    const q=clientSearch.toLowerCase().trim();
    return (c.name||"").toLowerCase().includes(q)||(c.phone||"").includes(q)||String(c.bina_customer_id||"").includes(q);
  }).slice(0,50);
  const itemsTotal=items.reduce((sum,it)=>{
    const qty=Number(it.quantity)||0;
    const price=Number(it.unitPrice)||0;
    const disc=Number(it.discount)||0;
    return sum+qty*price*(1-disc/100);
  },0);
  const addItem=()=>setItems([...items,{description:"",quantity:1,unitPrice:0,discount:0}]);
  const removeItem=(idx)=>{if(items.length===1)return;setItems(items.filter((_,i)=>i!==idx));};
  const updateItem=(idx,field,value)=>{const ni=[...items];ni[idx]={...ni[idx],[field]:value};setItems(ni);};
  const handleSubmit=async()=>{
    setSubmitting(true);
    setError(null);
    try{
      const quoteTitle=title||`הצעה ל${selectedClient.name||"לקוח"}`;
      const binaCustNum=parseInt(String(selectedClient.bina_customer_id),10);
      if(!binaCustNum||Number.isNaN(binaCustNum))throw new Error("קוד לקוח בינה לא תקין");

      const quoteData={
        title:quoteTitle,
        bina_cust_id:binaCustNum,
        bina_cust_name:selectedClient.name||"ללא שם",
        bina_cust_city:(selectedClient.address||"").split(",")[0]?.trim()||selectedClient.address||"",
        bina_cust_address:selectedClient.address||"",
        bina_cust_phone:selectedClient.phone||"",
        contact_person:(contactName||"").trim(),
        sales_agent:agent||null,
        status:"טיוטה",
      };

      const quoteResponse=await sb("quotes",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(quoteData)});
      const quoteResult=Array.isArray(quoteResponse)?quoteResponse[0]:quoteResponse;
      if(!quoteResult?.id)throw new Error("שגיאה ביצירת הצעה ב-DB");
      const quoteId=quoteResult.id;

      const itemsToInsert=items.map((it,idx)=>({
        quote_id:quoteId,
        item_name:`LINE-${idx+1}`,
        description:it.description||`פריט ${idx+1}`,
        quantity:Number(it.quantity)||1,
        unit_price:Number(it.unitPrice)||0,
        discount_pct:Number(it.discount)||0,
        line_number:idx+1,
      }));

      await sb("quote_items",{method:"POST",body:JSON.stringify(itemsToInsert)});

      const {data:fnData,error:invE}=await supabaseClient.functions.invoke("bina-create-quote",{body:{quote_id:quoteId}});
      if(invE)throw new Error(invE.message);
      let result=fnData;
      if(typeof fnData==="string"){try{result=JSON.parse(fnData)}catch{result=null}}
      if(!result||result.success!==true)throw new Error(result?.error||result?.binaMessage||"שגיאה בשליחה לבינה");

      if(onSuccess)onSuccess(result);
      const quoteTitleUi=quoteTitle;
      const showPDF=window.confirm(`✅ נוצרה הצעת מחיר #${result.binaDocId} בבינה!\n\nלפתוח PDF לתצוגה/הדפסה?`);
      if(showPDF&&typeof window.openDocumentPDF==="function"){
        window.openDocumentPDF({
          docType:"quote",
          binaDocId:result.binaDocId,
          title:quoteTitleUi,
          client:{
            name:selectedClient.name,
            address:selectedClient.address,
            phone:selectedClient.phone,
            email:selectedClient.email||"",
            contactPerson:(contactName||"").trim()||selectedClient.name,
          },
          items:items.map(it=>({description:it.description,quantity:Number(it.quantity)||1,unitPrice:Number(it.unitPrice)||0,discount:Number(it.discount)||0})),
          agent:(agent||"").trim(),
          createdAt:new Date().toISOString(),
          remark:"",
        });
      }
      onClose();
    }catch(err){
      setError(err.message||String(err));
    }finally{
      setSubmitting(false);
    }
  };

  const purple="#7C3AED";
  const purpleLight="#F5F3FF";
  const overlayStyle={position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:0};

  const headerStyle={padding:"16px 20px",borderBottom:"1px solid #eee",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg2)"};
  const bodyStyle={flex:1,overflowY:"auto",padding:20,direction:"rtl"};
  const footerStyle={padding:16,borderTop:"1px solid #eee",background:"var(--bg2)",display:"flex",gap:8};
  const labelStyle={display:"block",fontSize:14,fontWeight:600,marginBottom:6,color:"var(--text)"};
  const inputStyle={width:"100%",padding:"12px 14px",fontSize:16,border:"1px solid var(--border)",borderRadius:10,boxSizing:"border-box",fontFamily:"inherit",direction:"rtl",background:"var(--bg2)",color:"var(--text)"};
  const btnPrimary={flex:1,padding:"14px 20px",fontSize:16,fontWeight:600,background:purple,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnSecondary={flex:1,padding:"14px 20px",fontSize:16,background:"#fff",color:"var(--text2)",border:"1px solid var(--border)",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnDanger={padding:"8px 12px",fontSize:14,background:"var(--red)",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"};

  const renderStep1=()=><div>
    <h3 style={{marginTop:0,marginBottom:16}}>👤 בחירת לקוח להצעה</h3>
    <input type="text" placeholder="🔍 חיפוש לפי שם, טלפון, או קוד בינה..." value={clientSearch} onChange={e=>setClientSearch(e.target.value)} style={inputStyle}/>
    <div style={{marginTop:12,maxHeight:"calc(95vh - 280px)",overflowY:"auto"}}>
      {filteredClients.length===0?<div style={{padding:20,textAlign:"center",color:"var(--text3)"}}>{clientSearch?"לא נמצאו לקוחות":"אין לקוחות ברשימה"}</div>:
      filteredClients.map(c=><div
        key={c.id}
        onClick={()=>{
          if(c.bina_customer_id){setSelectedClient(c);setStep(2);}
          else{
            const ok=window.confirm(`הלקוח "${c.name||"ללא שם"}" לא מקושר לבינה.\n\nכדי ליצור הצעה צריך קודם ליצור אותו בבינה.\n\nלפתוח את מסך יצירת לקוח חדש?`);
            if(ok){onClose();if(window.openBinaClient)window.openBinaClient();}

        style={{
          padding:14,marginBottom:8,border:"1px solid #eee",borderRadius:8,cursor:"pointer",
          background:c.bina_customer_id?"#f0fdf4":"#fefce8",

        }}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:600,fontSize:15}}>{c.name||"ללא שם"}</div>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:12,background:c.bina_customer_id?"#22c55e":"#eab308",color:"#fff",fontWeight:600}}>
            {c.bina_customer_id?"✓ בבינה":"⚠ לא בבינה"}
          </span>
        </div>
        <div style={{fontSize:13,color:"#666",marginTop:4}}>📞 {c.phone||"—"} {c.bina_customer_id?`· 🆔 ${c.bina_customer_id}`:""}</div>
      </div>)}
    </div>
  </div>;

  const renderStep2=()=><div>
    <h3 style={{marginTop:0,marginBottom:4}}>📦 פריטים בהצעה</h3>

      </div>
      <label style={labelStyle}>תיאור</label>
      <input type="text" placeholder="לדוגמה: כרטיסי ביקור 350 גרם..." value={it.description} onChange={e=>updateItem(idx,"description",e.target.value)} style={{...inputStyle,marginBottom:10}}/>

        <div><label style={labelStyle}>הנחה %</label><input type="number" inputMode="numeric" value={it.discount} onChange={e=>updateItem(idx,"discount",e.target.value)} style={inputStyle}/></div>

    </div>)}
    <button type="button" onClick={addItem} style={{width:"100%",padding:14,fontSize:15,background:"#fff",border:`2px dashed ${purple}`,color:purple,borderRadius:10,cursor:"pointer",fontFamily:"inherit"}}>➕ הוסף פריט</button>

  </div>;

  const renderStep3=()=><div>

    </select>

        <button type="button" onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:"var(--text2)",fontFamily:"inherit"}}>✕</button>

        {step===1&&<button type="button" onClick={onClose} style={btnSecondary}>ביטול</button>}
        {step===2&&<button type="button" onClick={()=>setStep(3)} style={btnPrimary}>המשך ←</button>}

      </div>
    </div>
  </div>;
}

function DepartmentDashboard({user,allTasks,taskItems,isA,deptFilter}){
  const targetDept=isA?(deptFilter==="all"?null:deptFilter):(user?.dept??null);
  const tasks=tasksForDepartment(allTasks||[],taskItems||[],targetDept);
  const today=new Date();
  today.setHours(0,0,0,0);
  const todayMs=today.getTime();
  const yesterdayMs=todayMs-86400000;
  const weekStartMs=todayMs-(today.getDay()*86400000);
  const openTasks=tasks.filter(t=>!t.archived_at&&t.status!=="הושלם"&&t.status!=="הושלמה");
  const urgentTasks=openTasks.filter(t=>{
    if(t.priority==="גבוהה"||t.priority==="דחוף")return true;
    if(t.due_date){
      const due=new Date(t.due_date).getTime();
      return due<=todayMs+86400000;
    }
    return false;
  });
  const completedToday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=todayMs;
  });
  const completedYesterday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=yesterdayMs&&c<todayMs;
  });
  const completedThisWeek=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=weekStartMs;
  });
  const todayChange=completedYesterday.length===0?null:Math.round(((completedToday.length-completedYesterday.length)/completedYesterday.length)*100);
  const dailyTarget=Math.max(5,Math.ceil(openTasks.length*0.6));

  const cardStyle={background:"linear-gradient(135deg, #fff 0%, #fafbfc 100%)",border:"1px solid var(--border)",borderRadius:16,padding:20,marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,0.04)",direction:"rtl"};

  const metricValue=(color)=>({fontSize:24,fontWeight:800,color:color,lineHeight:1.1});

  const progressBarOuter={width:"100%",height:10,background:"#f1f5f9",borderRadius:999,overflow:"hidden",marginTop:6};
  const progressBarInner={width:`${progressPct}%`,height:"100%",background:`linear-gradient(90deg, ${deptColor}, ${deptColor}dd)`,transition:"width 0.5s ease",borderRadius:999};
  return<div style={cardStyle}>

function categorizeOrder(task) {
  const text = ((task.title || '') + ' ' + (task.notes || '')).toLowerCase();
  for (const cat of PRODUCT_CATEGORIES) {
    for (const kw of cat.keywords) {
      if (text.includes(kw.toLowerCase())) return cat;
    }
  }
  return { name: 'אחר', emoji: '❓', keywords: [] };
}

function normalizeAgentName(name) {
  if (!name) return null;
  const trimmed = String(name).trim();
  if (/^כפיר/.test(trimmed)) return 'כפיר';
  return trimmed;
}

function MonthlyAgentSummary({ allTasks, onAgentClick }) {
  const today = new Date();
  const [selectedYear, setSelectedYear] = useState(today.getFullYear());
  const [selectedMonth, setSelectedMonth] = useState(today.getMonth());

  const monthlyStats = useMemo(() => {
    const stats = new Map();

    for (const task of (allTasks || [])) {
      if (!task.created_at) continue;
      if (!task.total_amount || Number(task.total_amount) <= 0) continue;
      const d = new Date(task.created_at);
      if (d.getFullYear() !== selectedYear || d.getMonth() !== selectedMonth) continue;
      const agent = normalizeAgentName(task.sales_agent || task.assignee);
      if (!agent) continue;

      if (!stats.has(agent)) {
        stats.set(agent, { agent, count: 0, total: 0, orders: [] });
      }
      const s = stats.get(agent);
      s.count += 1;
      s.total += Number(task.total_amount || 0);
      s.orders.push(task);
    }

    return Array.from(stats.values()).sort((a, b) => b.total - a.total);
  }, [allTasks, selectedYear, selectedMonth]);

  const availableMonths = useMemo(() => {
    const months = new Set();
    for (const task of (allTasks || [])) {
      if (!task.created_at) continue;
      if (!task.total_amount || Number(task.total_amount) <= 0) continue;
      const d = new Date(task.created_at);
      months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);

    const arr = Array.from(months).sort().reverse();
    if (arr.length === 0) {
