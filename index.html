function EmailModal({ client, mode, emailType, onClose, onSendEmail, sb, createdBy }) {
  const [savedEmails, setSavedEmails] = useState([]);
  const [emailMode, setEmailMode] = useState('loading');
  const [selectedEmailId, setSelectedEmailId] = useState(null);
  const [recipient, setRecipient] = useState('');
  const [showAddNew, setShowAddNew] = useState(false);
  const [newEmail, setNewEmail] = useState('');
  const [newLabel, setNewLabel] = useState('');
  const [saving, setSaving] = useState(false);
  const prevEmailIdRef = useRef(null);
  const clientId = client?.client_id || null;
  const isEditMode = mode === 'editEmail';
  const isConfirmMode = mode === 'confirmSend';
  const overlayStyle = { position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16 };
  const modalStyle = { background: '#fff', borderRadius: 16, maxWidth: 520, width: '100%', direction: 'rtl', overflow: 'hidden', maxHeight: '90vh', display: 'flex', flexDirection: 'column' };
  const inputStyle = { width: '100%', padding: '10px 12px', fontSize: 14, border: '1px solid #e5e7eb', borderRadius: 8, fontFamily: 'inherit', boxSizing: 'border-box', direction: 'ltr', textAlign: 'left' };
  const handleSelectEmail = (em) => { setSelectedEmailId(em.id); setRecipient(em.email); setShowAddNew(false); };
  const handleStartAddNew = () => {
    if (selectedEmailId) prevEmailIdRef.current = selectedEmailId;
    setSelectedEmailId(null); setRecipient(''); setNewEmail(''); setNewLabel(''); setShowAddNew(true);
  };
  const handleSaveNewEmail = async () => {
    if (!newEmail.trim() || !newEmail.includes('@')) { window.alert('כתובת מייל לא תקינה'); return; }
    if (!clientId) { window.alert('שגיאה: לא ניתן לזהות את הלקוח'); return; }
    try {
      const result = await sb('client_billing_emails', { method: 'POST', body: JSON.stringify({
        client_id: clientId, email: newEmail.trim().toLowerCase(), label: newLabel.trim() || null,
        is_default: savedEmails.length === 0, usage_count: 0, created_by: createdBy || 'unknown',
      }) });
      const newE = Array.isArray(result) ? result[0] : result;
      if (newE) {
        setSavedEmails((prev) => [...prev, newE]);
        setSelectedEmailId(newE.id); setRecipient(newE.email);
        setShowAddNew(false); setEmailMode('pick'); setNewEmail(''); setNewLabel('');
      }
    } catch (e) {
      const msg = e.message || String(e);
      if (msg.includes('duplicate') || msg.includes('23505')) window.alert('כתובת מייל זו כבר קיימת במאגר');
      else window.alert('שגיאה: ' + msg);
    }
  };
  const incrementUsage = async () => {
    if (!selectedEmailId) return;
    const em = savedEmails.find((e) => e.id === selectedEmailId);
    if (!em) return;
    try {
      await sb(`client_billing_emails?id=eq.${selectedEmailId}`, { method: 'PATCH', body: JSON.stringify({
        usage_count: (em.usage_count || 0) + 1, last_used_at: new Date().toISOString(),
      }) });
    } catch (_) {}
  };
  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      setEmailMode('loading');
      if (!clientId) {
        if (!cancelled) {
          setSavedEmails([]);
          setEmailMode('addFirst');
          if (client.collection_email_primary) {
            setRecipient(client.collection_email_primary);
            setNewEmail(client.collection_email_primary);
          }
        }
        return;
      }
      try {
        const data = await loadClientBillingEmailPool(clientId);
        if (cancelled) return;
        setSavedEmails(data);
        if (data.length > 0) {
          setEmailMode('pick');
          const def = data.find((e) => e.is_default) || data[0];
          setSelectedEmailId(def.id);
          setRecipient(def.email);
        } else {
          setEmailMode('addFirst');
          if (client.collection_email_primary) {
            setRecipient(client.collection_email_primary);
            setNewEmail(client.collection_email_primary);
          }
        }
      } catch (e) {
        console.error(e);
        if (!cancelled) setEmailMode('addFirst');
      }
    };
    load();
    return () => { cancelled = true; };
  }, [clientId, client.collection_email_primary]);
  const billingPickerUi = <>
    <div style={{ marginBottom: 15 }}>
      <label style={{ display: 'block', marginBottom: 6, fontWeight: 600, fontSize: 14 }}>💼 מייל הנה"ח / גבייה:</label>
      {emailMode === 'loading' && <div style={{ padding: 12, background: '#f9fafb', borderRadius: 6, color: '#6b7280', fontSize: 13, textAlign: 'center' }}>טוען מיילים שמורים...</div>}
      {emailMode === 'pick' && !showAddNew && <>
        <div style={{ background: '#fef3c7', padding: 12, borderRadius: 8, border: '1px solid #fde68a', marginBottom: 8 }}>
          <div style={{ fontSize: 12, color: '#78350f', marginBottom: 8, fontWeight: 600 }}>💼 מיילים שמורים ללקוח ({savedEmails.length})</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6, maxHeight: 220, overflowY: 'auto' }}>
            {savedEmails.map((em) => <button type="button" key={em.id} onClick={() => handleSelectEmail(em)} style={{ padding: 10, textAlign: 'right', background: selectedEmailId === em.id ? '#92400e' : 'white', color: selectedEmailId === em.id ? 'white' : '#374151', border: `1px solid ${selectedEmailId === em.id ? '#92400e' : '#d1d5db'}`, borderRadius: 6, cursor: 'pointer', display: 'flex', justifyContent: 'space-between', alignItems: 'center', fontFamily: 'inherit' }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, direction: 'ltr', textAlign: 'right', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', fontWeight: 600 }}>{em.is_default && '⭐ '}{em.email}</div>
                {em.label && <div style={{ fontSize: 11, color: selectedEmailId === em.id ? 'rgba(255,255,255,0.85)' : '#6b7280', marginTop: 2 }}>🏷️ {em.label}</div>}
              </div>
              {em.usage_count > 0 && <div style={{ fontSize: 11, marginRight: 8, color: selectedEmailId === em.id ? 'rgba(255,255,255,0.7)' : '#9ca3af', whiteSpace: 'nowrap' }}>{em.usage_count}×</div>}
            </button>)}
          </div>
        </div>
        <button type="button" onClick={handleStartAddNew} style={{ width: '100%', padding: 10, background: 'transparent', border: '2px dashed #d1d5db', borderRadius: 8, cursor: 'pointer', color: '#6b7280', fontSize: 13, fontFamily: 'inherit' }}>➕ הוסף מייל גבייה נוסף</button>
      </>}
      {(emailMode === 'addFirst' || showAddNew) && <div style={{ background: '#fefce8', padding: 12, borderRadius: 8, border: '2px solid #fde68a' }}>
        {emailMode === 'addFirst' && <div style={{ fontSize: 12, color: '#78350f', marginBottom: 10 }}>ℹ️ אין מיילי גבייה שמורים ללקוח - הוסף את הראשון</div>}
        <div style={{ marginBottom: 8 }}><input type="email" value={showAddNew ? newEmail : (newEmail || recipient)} onChange={(e) => { const v = e.target.value; setNewEmail(v); if (emailMode === 'addFirst') setRecipient(v); }} placeholder="email@company.co.il *" style={inputStyle} autoFocus /></div>
        <div style={{ marginBottom: emailMode === 'pick' && showAddNew ? 10 : 0 }}><input type="text" value={newLabel} onChange={(e) => setNewLabel(e.target.value)} placeholder='תווית (אופציונלי) - "הנה"ח", "גבייה"...' style={{ ...inputStyle, direction: 'rtl', textAlign: 'right' }} /></div>
        {emailMode === 'pick' && showAddNew && <div style={{ display: 'flex', gap: 6, marginTop: 8 }}>
          <button type="button" onClick={() => { setShowAddNew(false); const prevId = prevEmailIdRef.current; if (prevId) { const prev = savedEmails.find((e) => e.id === prevId); if (prev) { setSelectedEmailId(prev.id); setRecipient(prev.email); } } }} style={{ flex: 1, padding: 8, fontSize: 12, background: '#f3f4f6', border: '1px solid #d1d5db', borderRadius: 6, cursor: 'pointer', fontFamily: 'inherit' }}>ביטול</button>
          <button type="button" onClick={handleSaveNewEmail} style={{ flex: 2, padding: 8, fontSize: 12, background: '#92400e', color: 'white', border: 'none', borderRadius: 6, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>💾 שמור והשתמש</button>
        </div>}
        {emailMode === 'addFirst' && <div style={{ fontSize: 11, color: '#6b7280', marginTop: 8, textAlign: 'center' }}>💡 המייל יישמר אוטומטית כשתשלח</div>}
      </div>}
    </div>
  </>;
  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={modalStyle} onClick={(e) => e.stopPropagation()}>
        <div style={{ padding: '16px 20px', borderBottom: '1px solid #e5e7eb', background: '#fffbeb', flexShrink: 0 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <div style={{ fontSize: 17, fontWeight: 700, color: '#1E3A52' }}>{isEditMode ? '✏️ מיילי גבייה' : '📧 אישור שליחה'}</div>

    </div>
  );

function fmtCurrencySimple(n) {
  return `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
}

/** משימות לפי מחלקה: legacy לפי tasks.dept, או הזמנות עם task_items לפי department של הפריט */
function tasksForDepartment(allTasks, taskItems, targetDept) {
  const list = Array.isArray(allTasks) ? allTasks : [];
  const items = Array.isArray(taskItems) ? taskItems : [];
  if (!targetDept) return list;
  const taskIdsFromItems = new Set(
    items.filter((i) => i.department === targetDept && i.status !== "ארכיון").map((i) => i.task_id),
  );
  return list.filter((t) => {
    if (!t.has_items) return t.dept === targetDept;
    return taskIdsFromItems.has(t.id);
  });
}

const generateSignupToken=()=>{
  const chars="abcdefghijklmnopqrstuvwxyz0123456789";
  let token="";
  for(let i=0;i<16;i++)token+=chars[Math.floor(Math.random()*chars.length)];
  return token;
};
const parseBillingAddressForBina=(addr)=>{
  const t=String(addr||"").trim();
  if(!t)return{custCity:"תל אביב",custAddress:""};
  const parts=t.split(/[,،]/).map(s=>s.trim()).filter(Boolean);
  if(parts.length>=2)return{custCity:parts[parts.length-1],custAddress:parts.slice(0,-1).join(", ")};
  return{custCity:"תל אביב",custAddress:t};
};

async function sendAdminSignupNotification(formData){
  try{
    const name=formData.business_name||formData.full_name||formData.contact_name||"לקוח";
    await sendEmail({
      to:["kfir.dfus@gmail.com","natalie.zem@gmail.com"],
      subject:`🆕 טופס לקוח חדש: ${name}`,
      html:buildAdminSignupNotification(formData),
      from:"PrintOS - טפסים <orders@natalie-print.com>",
    });
  }catch(err){
    console.error("Failed to send admin notification:",err);
  }
}

function SignupFormField({label,value,onChange,placeholder,type="text",ltr,textarea}){
  const base={width:"100%",padding:10,borderRadius:6,border:"1px solid #d1d5db",fontSize:14,direction:ltr?"ltr":"rtl"};
  return<div style={{marginBottom:12}}>
    <label style={{display:"block",marginBottom:4,fontWeight:600,color:"#134e4a",fontSize:14}}>{label}</label>
    {textarea?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={{...base,minHeight:60,fontFamily:"inherit"}}/>:
    <input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} style={base}/>}
  </div>;
}

function SignupLinkGeneratorModal({user,onClose,onCreated}){
  const [sentToName,setSentToName]=useState("");
  const [sentToContact,setSentToContact]=useState("");
  const [generatedLink,setGeneratedLink]=useState(null);
  const [generating,setGenerating]=useState(false);
  const handleGenerate=async()=>{
    if(!sentToName.trim()){alert("יש למלא שם נמען");return;}
    setGenerating(true);
    try{
      const token=generateSignupToken();
      const result=await sb("client_signup_forms",{
        method:"POST",
        body:JSON.stringify({
          token,
          client_type:"business",
          phone:"_pending_",
          email:"_pending_",
          billing_address:"_pending_",
          status:"pending",
          sent_by:user?.name||"unknown",
          sent_to_name:sentToName.trim(),
          sent_to_contact:sentToContact.trim()||null
        }),
        headers:{Prefer:"return=representation"}
      });
      if(result&&result[0]){
        const link=`${window.location.origin}${window.location.pathname||""}${window.location.search||""}#signup/${token}`;
        setGeneratedLink(link);
        onCreated?.();
      }
    }catch(e){alert("שגיאה ביצירת קישור: "+(e.message||String(e)));}
    finally{setGenerating(false);}
  };
  const handleCopy=async()=>{
    try{await navigator.clipboard.writeText(generatedLink);alert("✅ הקישור הועתק!");}
    catch{alert("לא ניתן להעתיק — העתק ידנית");}
  };
  const handleWhatsApp=()=>{
    const message=`שלום ${sentToName}! 👋\n\nלפתיחת כרטיס לקוח אצלנו בדפוס נטלי, אנא מלא את הטופס בקישור:\n${generatedLink}\n\nתודה,\nדפוס נטלי`;
    window.open(`https://wa.me/?text=${encodeURIComponent(message)}`,"_blank");
  };
  return<div onClick={onClose} style={SIGNUP_MODAL_OVERLAY}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:24,width:"100%",maxWidth:500,maxHeight:"90vh",overflowY:"auto"}}>
      <h2 style={{margin:"0 0 16px",color:"#0d9488"}}>📋 צור קישור פתיחת לקוח</h2>
      {!generatedLink?<>
        <SignupFormField label="שם הנמען / שם החברה:" value={sentToName} onChange={setSentToName} placeholder="למשל: יוסי / חברת ABC"/>
        <SignupFormField label="טלפון/מייל (אופציונלי - לתיעוד):" value={sentToContact} onChange={setSentToContact} placeholder="0501234567 או email@example.com" ltr/>
        <div style={{display:"flex",gap:10}}>
          <button type="button" onClick={onClose} style={{flex:1,padding:10,borderRadius:6,border:"1px solid #d1d5db",background:"#f3f4f6",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
          <button type="button" onClick={handleGenerate} disabled={generating} style={{flex:2,padding:12,background:"#0e7490",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>
            {generating?"יוצר...":"🔗 צור קישור"}
          </button>
        </div>
      </>:<>
        <div style={{padding:15,background:"#f0fdfa",borderRadius:8,marginBottom:15,border:"2px solid #2dd4bf"}}>
          <div style={{fontWeight:600,marginBottom:8,color:"#0d9488"}}>✅ הקישור מוכן!</div>
          <div style={{background:"white",padding:10,borderRadius:6,direction:"ltr",fontSize:13,wordBreak:"break-all",fontFamily:"monospace"}}>{generatedLink}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
          <button type="button" onClick={handleCopy} style={{padding:10,background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>📋 העתק קישור</button>
          <button type="button" onClick={handleWhatsApp} style={{padding:10,background:"#25d366",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontWeight:600,fontFamily:"inherit"}}>📱 שלח ב-WhatsApp</button>
        </div>
        <div style={{fontSize:12,color:"#6b7280"}}>⏰ הקישור תקף ל-30 ימים</div>
        <button type="button" onClick={onClose} style={{width:"100%",padding:10,marginTop:15,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>סגור</button>
      </>}
    </div>
  </div>;
}

function ClientSignupPage({token}){
  const [form,setForm]=useState(null);
  const [loading,setLoading]=useState(true);
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [error,setError]=useState(null);
  const [clientType,setClientType]=useState("business");
  const [businessName,setBusinessName]=useState("");
  const [businessId,setBusinessId]=useState("");
  const [fullName,setFullName]=useState("");
  const [personalId,setPersonalId]=useState("");
  const [phone,setPhone]=useState("");
  const [email,setEmail]=useState("");
  const [contactName,setContactName]=useState("");
  const [billingAddress,setBillingAddress]=useState("");
  const [hasShipping,setHasShipping]=useState(false);
  const [shippingAddress,setShippingAddress]=useState("");
  const [ordersEmail,setOrdersEmail]=useState("");
  const [paymentTerms,setPaymentTerms]=useState("");
  const [notes,setNotes]=useState("");
  useEffect(()=>{
    const load=async()=>{
      try{
        const r=await sb(`client_signup_forms?token=eq.${encodeURIComponent(token)}&limit=1`);
        if(!r||r.length===0){setError("הקישור לא נמצא או פג תוקף");setLoading(false);return;}
        const f=r[0];
        if(new Date(f.expires_at)<new Date()){setError("הקישור פג תוקף");setLoading(false);return;}
        if(f.submitted_at||(f.status&&f.status!=="pending")){setSubmitted(true);setLoading(false);return;}
        setForm(f);
        setLoading(false);
      }catch{setError("שגיאה בטעינה");setLoading(false);}
    };
    load();
  },[token]);
  const handleSubmit=async()=>{
    if(clientType==="business"){
      if(!businessName.trim()||!businessId.trim()){alert("יש למלא שם חברה וח.פ");return;}
    }else{
      if(!fullName.trim()||!personalId.trim()){alert("יש למלא שם מלא ות.ז");return;}
    }
    if(!phone.trim()||!email.trim()||!billingAddress.trim()){alert("יש למלא את כל שדות החובה");return;}
    if(!email.includes("@")){alert("יש להזין כתובת מייל תקינה");return;}
    setSubmitting(true);
    try{
      const isComplete=clientType==="business"
        ?!!(businessName.trim()&&businessId.trim()&&phone&&email&&billingAddress)
        :!!(fullName.trim()&&personalId.trim()&&phone&&email&&billingAddress);
      const status=isComplete?"approved":"needs_review";
      await sb(`client_signup_forms?id=eq.${form.id}`,{
        method:"PATCH",
        body:JSON.stringify({
          client_type:clientType,
          business_name:businessName.trim()||null,
          business_id:businessId.trim()||null,
          full_name:fullName.trim()||null,
          personal_id:personalId.trim()||null,
          phone:phone.trim(),
          email:email.trim(),
          contact_name:contactName.trim()||null,
          billing_address:billingAddress.trim(),
          shipping_address:hasShipping?shippingAddress.trim():null,
          orders_email:ordersEmail.trim()||null,
          payment_terms:paymentTerms.trim()||null,
          notes:notes.trim()||null,
          status,
          submitted_at:new Date().toISOString()
        })
      });
      const customerName=clientType==="business"?(contactName||businessName):fullName;
      const displayBiz=clientType==="business"?businessName:fullName;
      const submittedPayload={
        business_name:businessName.trim()||null,
        business_id:businessId.trim()||null,
        full_name:fullName.trim()||null,
        personal_id:personalId.trim()||null,
        phone:phone.trim(),
        email:email.trim(),
        contact_name:contactName.trim()||null,
        billing_address:billingAddress.trim(),
        notes:notes.trim()||null,
      };
      try{await sendAdminSignupNotification(submittedPayload);}catch(_){}
      try{
        await sendEmail({
          to:email.trim(),
          cc:[ADMIN_NOTIFY_EMAIL],
          subject:"✅ תודה! פרטיך התקבלו - דפוס נטלי",
          from:"דפוס נטלי <orders@natalie-print.com>",
          html:buildThankYouEmail(customerName,displayBiz),
          text:`שלום ${customerName},\n\nתודה שמילאת את פרטיך! קיבלנו את הטופס ונחזור אליך בקרוב.\n\nדפוס נטלי\n03-6815703`
        });
      }catch(e){console.warn("Failed to send thank you email:",e);}
      setSubmitted(true);
    }catch(e){alert("שגיאה בשליחה: "+(e.message||String(e)));}
    finally{setSubmitting(false);}
  };
  if(loading)return<div style={{textAlign:"center",padding:50,fontSize:18,direction:"rtl"}}>טוען...</div>;
  if(error)return<div style={{maxWidth:500,margin:"50px auto",padding:30,textAlign:"center",direction:"rtl"}}>
    <div style={{fontSize:48,marginBottom:20}}>⚠️</div>
    <h2 style={{color:"#991b1b"}}>{error}</h2>
    <p>אנא פנה לדפוס נטלי לקבלת קישור חדש.</p>
    <p style={{marginTop:20,color:"#6b7280"}}>📞 03-6815703<br/>📧 orders@natalie-print.com</p>
  </div>;
  if(submitted)return<div style={{maxWidth:500,margin:"50px auto",padding:30,textAlign:"center",direction:"rtl"}}>
    <div style={{fontSize:64,marginBottom:20}}>✅</div>
    <h2 style={{color:"#0d9488"}}>תודה!</h2>
    <p style={{fontSize:18,marginBottom:10}}>פרטיך התקבלו אצלנו בהצלחה.</p>
    <p style={{color:"#6b7280"}}>נחזור אליך בהקדם.</p>
    <div style={{marginTop:30,padding:15,background:"#f0fdfa",borderRadius:8}}>
      📞 לכל שאלה: 03-6815703<br/>📧 orders@natalie-print.com
    </div>
  </div>;
  return<div style={{minHeight:"100vh",background:"#f8fafc",padding:"20px 10px",direction:"rtl",fontFamily:"Segoe UI, Arial, sans-serif"}}>
    <div style={{maxWidth:600,margin:"0 auto",background:"white",borderRadius:12,overflow:"hidden",boxShadow:"0 4px 6px rgba(0,0,0,0.1)"}}>
      <div style={{background:"#ffffff",padding:30,textAlign:"center"}}>
        <div style={{fontSize:36,fontWeight:700,color:"#0d9488",letterSpacing:2}}>NATALIE</div>
        <div style={{color:"#134e4a",marginTop:4}}>פתרונות הדפסה</div>
      </div>
      <div style={{height:4,background:"linear-gradient(90deg,#2dd4bf 0%,#0d9488 100%)"}}/>
      <div style={{padding:30}}>
        <h1 style={{margin:"0 0 8px",color:"#0d9488",fontSize:24}}>📋 פתיחת כרטיס לקוח</h1>
        <p style={{margin:"0 0 25px",color:"#64748b"}}>אנא מלא את הפרטים הבאים כדי שנוכל לפתוח לך כרטיס לקוח אצלנו.</p>
        <div style={{marginBottom:20}}>
          <label style={{display:"block",marginBottom:8,fontWeight:600,color:"#134e4a"}}>סוג לקוח:</label>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {["business","private"].map(t=><button key={t} type="button" onClick={()=>setClientType(t)} style={{
              padding:12,background:clientType===t?"#0d9488":"white",color:clientType===t?"white":"#134e4a",
              border:`2px solid ${clientType===t?"#0d9488":"#d1d5db"}`,borderRadius:8,cursor:"pointer",fontWeight:600,fontFamily:"inherit"
            }}>{t==="business"?"🏢 חברה":"👤 פרטי"}</button>)}
          </div>
        </div>
        {clientType==="business"&&<>
          <SignupFormField label="שם חברה *" value={businessName} onChange={setBusinessName}/>
          <SignupFormField label="ח.פ *" value={businessId} onChange={setBusinessId} ltr/>
        </>}
        {clientType==="private"&&<>
          <SignupFormField label="שם מלא *" value={fullName} onChange={setFullName}/>
          <SignupFormField label="תעודת זהות *" value={personalId} onChange={setPersonalId} ltr/>
        </>}
        <h3 style={{margin:"25px 0 10px",color:"#0d9488",fontSize:16}}>📞 פרטי קשר</h3>
        <SignupFormField label="טלפון *" value={phone} onChange={setPhone} ltr placeholder="05X-XXXXXXX"/>
        <SignupFormField label="מייל *" value={email} onChange={setEmail} ltr type="email" placeholder="example@company.com"/>

async function createBinaFromSignupForm(form,user){
  const custName=(form.business_name||form.full_name||"").trim();
  const custTz=signupPhoneDigits(form.business_id||form.personal_id);
  if(custTz.length!==9)throw new Error("ח.פ/ת.ז חייבים 9 ספרות");
  const {custCity,custAddress}=parseBillingAddressForBina(form.billing_address);
  if(!custAddress.trim())throw new Error("כתובת חיוב חסרה");
  const tel=signupPhoneDigits(form.phone);
  if(tel.length<9||tel.length>10)throw new Error("טלפון לא תקין (9–10 ספרות)");
  const em=String(form.orders_email||form.email||"").trim();
  if(!em||!em.includes("@"))throw new Error("מייל לא תקין");
  const body={
    custName,
    custTz,
    custCity,
    custAddress,
    custGroup:form.client_type==="private"?"פרטי":"ישראל",
    custTel:tel,
    custCel:tel,
    custEmail:em,
    termsofPayment:(form.payment_terms||"").trim()||"שוטף + 30"
  };
  const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-customer",{body});
  if(invE)throw new Error(invE.message||"שגיאה בבינה");
  let resRow=data;
  if(typeof data==="string"){try{resRow=JSON.parse(data)}catch{resRow=null}}
  resRow=Array.isArray(resRow)?resRow[0]:resRow;
  if(!resRow)throw new Error("תשובה לא צפויה מבינה");
  const rc=resRow.ResCode;
  if(rc===0||rc==="0"){
    const code=resRow.kuponId??resRow.requestId??resRow.KuponId??resRow.custId??resRow.docId??"—";
    const binaId=code!=="—"&&code!=null&&String(code).trim()!==""?String(code):null;
    const addrLine=`${custCity}, ${custAddress}`;
    const notesParts=[form.notes?.trim(),form.shipping_address?`משלוחים: ${form.shipping_address}`:null,form.contact_name?`איש קשר: ${form.contact_name}`:null,`ת.ז./ח.פ.: ${custTz}`].filter(Boolean);
    await sb("clients",{method:"POST",body:JSON.stringify({
      name:custName,
      phone:form.phone,
      email:em,
      address:addrLine,
      payment_terms:body.termsofPayment,
      contact_name:form.contact_name||null,
      notes:notesParts.length?notesParts.join("\n"):null,
      bina_customer_id:binaId,
    })});

      method:"PATCH",
      body:JSON.stringify({
        bina_customer_id:binaId,
        bina_synced_at:new Date().toISOString(),
        status:"approved",
        reviewed_at:new Date().toISOString(),
        reviewed_by:user?.name||"unknown"
      })
    });
    return binaId||code;
  }
  if(rc===-5||rc==="-5")throw new Error("ת.ז./ח.פ. כבר קיים במערכת");
  throw new Error(resRow.ResMsg||resRow.ResMsgHe||"שגיאה ביצירה בבינה");
}

let cityRegionsCache=null;
let cityRegionsListCache=null;

async function loadCityRegions(force){
  if(cityRegionsCache&&!force)return cityRegionsCache;
  try{
    const{data,error}=await supabaseClient.from("city_regions").select("city_name, region, aliases");
    if(error)throw error;
    const mapping={};
    const names=[];
    (data||[]).forEach(entry=>{
      const name=String(entry.city_name||"").trim();
      if(!name)return;
      names.push(name);
      mapping[name]=entry.region;
      (entry.aliases||[]).forEach(alias=>{
        const a=String(alias||"").trim();
        if(a)mapping[a]=entry.region;
      });
    });
    cityRegionsCache=mapping;
    cityRegionsListCache=names.sort((a,b)=>a.localeCompare(b,"he"));
    return mapping;
  }catch(e){
    console.warn("loadCityRegions",e);
    cityRegionsCache=cityRegionsCache||{};
    cityRegionsListCache=cityRegionsListCache||[];
    return cityRegionsCache;
  }
}
function clearCityRegionsCache(){
  cityRegionsCache=null;
  cityRegionsListCache=null;
}
function extractCityFromAddress(address){
  if(!address||typeof address!=="string")return null;
  const mapping=cityRegionsCache||{};
  const cityKeys=Object.keys(mapping).sort((a,b)=>b.length-a.length);
  if(!cityKeys.length)return null;
  const cleaned=address.replace(/\d+/g," ").replace(/[,\.\-\/\\]/g," ").replace(/\s+/g," ").trim();
  const words=cleaned.split(/\s+/).filter(w=>w.length>1);
  const hasKey=c=>Object.prototype.hasOwnProperty.call(mapping,c);
  for(let i=0;i<words.length;i++){
    for(let j=Math.min(i+4,words.length);j>i;j--){
      const candidate=words.slice(i,j).join(" ");
      if(hasKey(candidate))return candidate;
    }
  }
  for(const word of words){
    if(hasKey(word))return word;
  }
  for(const word of words){
    if(word.length<3)continue;
    for(const city of cityKeys){
      if(city.length<3)continue;
      if(city.includes(word)||word.includes(city))return city;
    }
  }
  return null;
}
function getOrderRegion(order){
  if(!order||order.is_pickup)return null;
  const mapping=cityRegionsCache||{};
  const raw=(order.delivery_city&&String(order.delivery_city).trim())||extractCityFromAddress(order.delivery_address);
  if(!raw)return null;
  if(mapping[raw])return mapping[raw];
  const extracted=extractCityFromAddress(raw);
  return extracted&&mapping[extracted]?mapping[extracted]:null;
}
function alutResolveDeliveryCity(explicitCity,address,isPickup){
  if(isPickup)return null;
  const typed=(explicitCity&&String(explicitCity).trim())||"";
  if(typed)return typed;
  return extractCityFromAddress(address)||null;
}
function getOrderCity(order){
  if(!order||order.is_pickup)return null;
  const typed=order.delivery_city&&String(order.delivery_city).trim();
  if(typed)return typed;
  return extractCityFromAddress(order.delivery_address);
}

function alutSubtractBusinessDays(date,days){
  const result=new Date(date);
  let subtracted=0;
  while(subtracted<days){
    result.setDate(result.getDate()-1);
    const day=result.getDay();
    if(day!==5&&day!==6)subtracted++;
  }
  return result;
}
function alutFormatDateHe(d){
  if(!d)return"—";
  const x=d instanceof Date?d:new Date(String(d).includes("T")?d:d+"T00:00:00");
  if(isNaN(x.getTime()))return"—";
  return x.toLocaleDateString("he-IL");
}

function alutNormalizeCalendarType(t){
  const s=String(t||"").trim().toLowerCase();
  if(s==="duplex"||s==="soft"||s.includes("דופלקס")||s.includes("רך"))return"duplex";
  if(s==="wall"||s.includes("קיר"))return"wall";
  if(s==="hard"||s.includes("קשיח"))return"hard";
  return s==="duplex"||s==="wall"||s==="hard"?s:"hard";
}
function alutDefaultUnitPrice(calendarType,pricing){

}
function alutResolveUnitPrice(item,pricing){
  const defaultPrice=alutDefaultUnitPrice(item?.calendar_type,pricing);
  if(item?.unit_price===undefined||item?.unit_price===null||String(item.unit_price).trim()==="")return defaultPrice;
  const n=Number(item.unit_price);
  return Number.isFinite(n)?n:defaultPrice;
}
function calculateAlutOrderTotals(items,pricing,isPickup){
  const itemsWithCalc=(items||[]).map(item=>{
    const calType=alutNormalizeCalendarType(item.calendar_type);
    const defaultUnitPrice=alutDefaultUnitPrice(calType,pricing);
    const unitPrice=alutResolveUnitPrice(item,pricing);
    const cartonSize=Math.max(1,Number({hard:pricing.carton_hard,duplex:pricing.carton_duplex,wall:pricing.carton_wall}[calType])||1);
    const qty=Number(item.quantity)||0;
    const cartonsCount=Math.ceil(qty/cartonSize);
    const boardsTotal=qty*unitPrice;
    const needsDesign=item.needs_design!==false&&!item.is_template_only;
    const designPrice=needsDesign?(pricing.price_design||0):0;
    const subtotal=boardsTotal+designPrice;
    const davachCost=["duplex","wall"].includes(calType)?qty*(pricing.cost_davach_per_unit||0):0;
    return{...item,calendar_type:calType,needs_design:needsDesign,unit_price:unitPrice,default_unit_price:defaultUnitPrice,design_price:designPrice,cartons_count:cartonsCount,subtotal,davach_cost:davachCost,boardsTotal};
  });
  const totalCartons=itemsWithCalc.reduce((s,i)=>s+Number(i.cartons_count||0),0);
  const itemsTotal=itemsWithCalc.reduce((s,i)=>s+i.subtotal,0);
  const shippingPrice=isPickup?0:(totalCartons*(pricing.price_shipping_carton||0));
  const subtotalBeforeVat=itemsTotal+shippingPrice;
  const vat=subtotalBeforeVat*0.18;
  const total=subtotalBeforeVat+vat;
  return{items:itemsWithCalc,totalCartons,itemsTotal,shippingPrice,subtotalBeforeVat,vat,total};
}
function alutFmtMoney(n,withVat){
  const v=withVat?Number(n||0)*1.18:Number(n||0);
  return`₪${v.toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
}
function alutGetDeadlineInfo(deadline){
  if(!deadline)return{text:"טרם אושרה סקיצה",color:"#9ca3af",urgent:false};
  const today=new Date();today.setHours(0,0,0,0);
  const dl=new Date(deadline+"T00:00:00");
  const diff=Math.ceil((dl-today)/(1000*60*60*24));
  const dateStr=dl.toLocaleDateString("he-IL");
  const warningDate=alutSubtractBusinessDays(dl,4);
  const warningStr=alutFormatDateHe(warningDate);
  const urgent=diff<=4;
  let color="#10b981";
  let bold=false;
  if(diff<=0){color="#dc2626";bold=true;}
  else if(diff<=3)color="#dc2626";
  else if(diff<=7)color="#f97316";
  return{
    text:dateStr+(diff<=0?" · עבר!":` · ${diff} ימים`),
    color,bold,urgent,diff,dateStr,warningStr,
    deadline:String(deadline),
  };
}
function alutDaysUntilDeadline(deadline){
  if(!deadline)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const dl=new Date(deadline+"T00:00:00");
  return Math.ceil((dl-today)/(1000*60*60*24));
}
function alutGetOrderDeadlineInfo(items){
  const list=(items||[]).filter(i=>i.delivery_deadline&&!["delivered","cancelled"].includes(i.status));
  if(!list.length){
    const anyDeadline=(items||[]).filter(i=>i.delivery_deadline);
    if(!anyDeadline.length)return alutGetDeadlineInfo(null);
    const earliest=anyDeadline.reduce((a,b)=>a.delivery_deadline<b.delivery_deadline?a:b);
    return alutGetDeadlineInfo(earliest.delivery_deadline);
  }
  const anyOverdue=list.some(i=>(alutDaysUntilDeadline(i.delivery_deadline)??999)<=0);
  const earliest=list.reduce((a,b)=>a.delivery_deadline<b.delivery_deadline?a:b);
  const info=alutGetDeadlineInfo(earliest.delivery_deadline);
  const urgent=list.some(i=>{
    const d=alutDaysUntilDeadline(i.delivery_deadline);
    return d!==null&&d<=4;
  });
  if(anyOverdue)return{...info,color:"#dc2626",bold:true,urgent:true};
  return{...info,urgent};
}
function alutOrderIsUrgent(order){
  return(order?.items||[]).some(i=>{
    if(!i.delivery_deadline||["delivered","cancelled"].includes(i.status))return false;
    const d=alutDaysUntilDeadline(i.delivery_deadline);
    return d!==null&&d<=4;
  });
}
function alutRenderDeadlineCell(dl){

    {dl.urgent&&dl.diff>0&&<div className="alut-deadline-alert deadline-alert">פחות מ-4 ימים!</div>}
  </div>;
}
function alutPrintWithClass(className){

    pageStyle.textContent="@page{size:A4 landscape;margin:10mm 8mm;}";

function alutFormatStatusSummary(items){
  if(!items?.length)return{type:"empty",label:"—",bg:"#f3f4f6",statusKey:null,chips:[]};
  const unique=[...new Set(items.map(i=>i.status))];
  if(unique.length===1){

    return{type:"single",label:st.label,bg:st.bg,statusKey:unique[0],chips:[{status:unique[0],label:st.label,n:items.length}]};

    if(sendManualToClient&&showManualClient){
      if(!clientHasEmail){window.alert("אין כתובת מייל ללקוח");return;}
      if(!(manualSubject||"").trim()||!(manualBody||"").trim()){window.alert("נא למלא נושא ותוכן למייל הידני");return;}
    }
    setSending(true);
    const results=[];
    try{
      if(sendToKarin&&karinAvailable){
        const{error}=await supabaseClient.functions.invoke("send-email",{body:{
          to:[ALUT_KARIN_EMAIL],subject:karinEmail.subject,html:karinEmail.html,from:ALUT_EMAIL_FROM,
        }});
        results.push({to:"karin",email:ALUT_KARIN_EMAIL,subject:karinEmail.subject,ok:!error,error});
      }
      if(sendToClient&&clientAvailable&&clientHasEmail){
        const{error}=await supabaseClient.functions.invoke("send-email",{body:{
          to:[order.contact_email.trim()],subject:clientEmail.subject,html:clientEmail.html,from:ALUT_EMAIL_FROM,
        }});
        results.push({to:"client",email:order.contact_email.trim(),subject:clientEmail.subject,ok:!error,error});
      }
      if(sendManualToClient&&showManualClient&&clientHasEmail){
        const contactName=order.contact_name||"לקוח יקר";
        const bodyHtml=`<p>שלום ${contactName},</p><p>${String(manualBody).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\n/g,"<br>")}</p>`;
        const html=alutWrapEmailHtml(bodyHtml,true);
        const subject=manualSubject.trim();
        const{error}=await supabaseClient.functions.invoke("send-email",{body:{
          to:[order.contact_email.trim()],subject,html,from:ALUT_EMAIL_FROM,
        }});
        results.push({to:"client",email:order.contact_email.trim(),subject,ok:!error,error});
      }
      if(results.length)await alutLogSentEmails(item.id,order.id,newStatus,results);
      const successCount=results.filter(r=>r.ok).length;
      const failCount=results.filter(r=>!r.ok).length;
      if(results.length===0){onSent?.();onClose();return;}
      if(failCount===0){
        setToast(`✅ ${successCount} מיילים נשלחו בהצלחה`);
        setTimeout(()=>{onSent?.();onClose();},1700);
      }else{
        setToast(`⚠️ ${successCount} נשלחו, ${failCount} נכשלו`);
        onSent?.();
        setSending(false);
      }
    }catch(err){
      window.alert("שגיאה: "+(err.message||String(err)));
      setSending(false);
    }
  };

  const skip=()=>{onSent?.();onClose();};
  const canSend=(sendToKarin&&karinAvailable)||(sendToClient&&clientAvailable&&clientHasEmail)||(sendManualToClient&&showManualClient&&clientHasEmail);

  return<div className="alut-auto-emails-modal-backdrop" onClick={skip}>
    <div className="alut-auto-emails-modal" onClick={e=>e.stopPropagation()}>
      <div className="alut-auto-emails-header"><h3>📧 מיילים - סטטוס: {statusLabel}</h3></div>
      <div className="alut-auto-emails-body">
        <p style={{marginTop:0,fontSize:14}}>ההזמנה עודכנה לסטטוס <strong>"{statusLabel}"</strong> ({ct.icon} {item.quantity} {ct.label}).<br/>ניתן לשלוח את המיילים הבאים:</p>

        <div className={"alut-email-option"+(sendToKarin?" checked":"")+(karinAvailable?"":" alut-email-option-disabled")}>
          <label className="alut-email-checkbox-row" style={{cursor:karinAvailable?"pointer":"default"}}>
            <input type="checkbox" checked={sendToKarin} disabled={!karinAvailable} onChange={e=>setSendToKarin(e.target.checked)} style={{accentColor:"#0d9488",width:18,height:18}}/>
            <span>👤 שלח מייל לקארין ({ALUT_KARIN_EMAIL})</span>
          </label>
          {karinAvailable?<>
            <div style={{fontSize:13,color:"#4b5563",marginTop:8}}>נושא: <strong>{karinEmail.subject}</strong></div>
            <button type="button" className="alut-email-preview-btn" onClick={()=>setShowKarinPreview(v=>!v)}>{showKarinPreview?"🙈 הסתר תצוגה":"👁️ תצוגה מקדימה"}</button>
            {showKarinPreview&&<div className="alut-email-preview-box"><iframe title="karin-preview" srcDoc={karinEmail.html} style={{width:"100%",height:320,border:"none"}}/></div>}
          </>:<div style={{fontSize:12,color:"#9ca3af",marginTop:6}}>(אין מייל אוטומטי לקארין בסטטוס הזה)</div>}
        </div>

        {clientAvailable?(
          <div className={"alut-email-option"+(sendToClient?" checked":"")+((clientAvailable&&clientHasEmail)?"":" alut-email-option-disabled")}>
            <label className="alut-email-checkbox-row" style={{cursor:(clientAvailable&&clientHasEmail)?"pointer":"default"}}>
              <input type="checkbox" checked={sendToClient} disabled={!clientAvailable||!clientHasEmail} onChange={e=>setSendToClient(e.target.checked)} style={{accentColor:"#0d9488",width:18,height:18}}/>
              <span>📦 שלח מייל ללקוח {clientHasEmail?`(${order.contact_email.trim()})`:""}</span>
            </label>
            {!clientHasEmail?<div style={{fontSize:12,color:"#9ca3af",marginTop:6}}>(אין כתובת מייל ללקוח)</div>
              :<>
                <div style={{fontSize:13,color:"#4b5563",marginTop:8}}>נושא: <strong>{clientEmail.subject}</strong></div>
                <button type="button" className="alut-email-preview-btn" onClick={()=>setShowClientPreview(v=>!v)}>{showClientPreview?"🙈 הסתר תצוגה":"👁️ תצוגה מקדימה"}</button>
                {showClientPreview&&<div className="alut-email-preview-box"><iframe title="client-preview" srcDoc={clientEmail.html} style={{width:"100%",height:320,border:"none"}}/></div>}
              </>}
          </div>
        ):(
          <div className={"email-option-manual"+(sendManualToClient?" checked":"")}>
            <label className="alut-email-checkbox-row" style={{cursor:clientHasEmail?"pointer":"default"}}>
              <input type="checkbox" checked={sendManualToClient} disabled={!clientHasEmail} onChange={e=>setSendManualToClient(e.target.checked)} style={{accentColor:"#0d9488",width:18,height:18}}/>
              <span>✏️ שלח מייל ידני ללקוח {clientHasEmail?`(${order.contact_email.trim()})`:""}</span>
            </label>
            {!clientHasEmail?<div style={{fontSize:12,color:"#9ca3af",marginTop:6}}>(אין כתובת מייל ללקוח)</div>
              :sendManualToClient&&(
                <div className="email-manual-editor">
                  <div className="email-field">
                    <label>נושא:</label>
                    <input type="text" value={manualSubject} onChange={e=>setManualSubject(e.target.value)} placeholder="נושא המייל" disabled={sending}/>
                  </div>
                  <div className="email-field">
                    <label>תוכן:</label>
                    <textarea value={manualBody} onChange={e=>setManualBody(e.target.value)} placeholder="תוכן המייל" rows={6} disabled={sending}/>
                  </div>
                </div>
              )}
          </div>
        )}
      </div>
      <div className="alut-auto-emails-footer">
        <button type="button" className="alut-btn-cancel" onClick={skip} disabled={sending}>דלג</button>
        <button type="button" className="alut-btn-send-emails" onClick={handleSend} disabled={sending||!canSend}>{sending?"⏳ שולח...":"📤 שלח את המסומנים"}</button>
      </div>
    </div>
    {toast&&<div className="alut-toast">{toast}</div>}
  </div>;
}

function AlutItemStatusModal({item,order,orderNumber,onClose,onSaved}){
  const [newStatus,setNewStatus]=useState(item.status);
  const [notes,setNotes]=useState("");
  const [saving,setSaving]=useState(false);
  const [autoEmails,setAutoEmails]=useState(null);
  const cur=ALUT_STATUS_CONFIG[item.status]||ALUT_STATUS_CONFIG.new;
  const ct=ALUT_CALENDAR_TYPES[item.calendar_type]||{};
  const availableStatuses=alutFilterStatusesForOrder(order||{});
  const handleSave=async()=>{
    if(newStatus===item.status){onClose();return;}
    setSaving(true);
    try{
      const payload={status:newStatus};
      const nowIso=new Date().toISOString();
      if(newStatus==="design_approved")payload.design_approved_at=nowIso;
      if(newStatus==="sent_to_natalie")payload.sent_to_natalie_at=nowIso;
      if(newStatus==="at_davach")payload.davach_sent_at=nowIso;
      if(newStatus==="at_itzik")payload.itzik_sent_at=nowIso;
      if((newStatus==="ready_to_ship"||newStatus==="ready_for_pickup")&&item.status==="at_davach")payload.davach_received_at=nowIso;
      if((newStatus==="ready_to_ship"||newStatus==="ready_for_pickup")&&item.status==="at_itzik")payload.itzik_received_at=nowIso;
      if(newStatus==="shipped")payload.shipped_at=nowIso;
      if(newStatus==="delivered")payload.delivered_at=nowIso;
      await sb(`alut_order_items?id=eq.${item.id}`,{method:"PATCH",body:JSON.stringify(payload)});
      if(notes.trim()){
        const hist=await sb(`alut_status_history?item_id=eq.${item.id}&order=created_at.desc&limit=1`);
        if(hist?.[0])await sb(`alut_status_history?id=eq.${hist[0].id}`,{method:"PATCH",body:JSON.stringify({notes:notes.trim()})});
      }
      onSaved?.();
      if(order){
        setAutoEmails({item:{...item,status:newStatus},order,newStatus});
        setSaving(false);
        return;
      }
      onClose();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    finally{setSaving(false);}
  };
  if(autoEmails)return<AlutAutoEmailsModal item={autoEmails.item} order={autoEmails.order} newStatus={autoEmails.newStatus} onSent={()=>onSaved?.()} onClose={onClose}/>;
  return<Modal open={true} onClose={onClose} title={`🔄 שינוי סטטוס - הזמנה #${orderNumber}`} maxWidth={480}>
    <div style={{direction:"rtl"}}>
      <div style={{fontSize:13,color:"var(--text3)",marginBottom:12}}>{ct.icon} {item.quantity} {ct.label}</div>
      <div style={{marginBottom:16,padding:12,background:cur.bg,borderRadius:10,fontSize:14}}>סטטוס נוכחי: <strong>{cur.label}</strong></div>
      <div style={{fontWeight:600,marginBottom:10,fontSize:13}}>עבור ל:</div>
      <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:16,maxHeight:280,overflowY:"auto"}}>
        {availableStatuses.map(s=>{
          const cfg=ALUT_STATUS_CONFIG[s];
          const active=newStatus===s;
          return<label key={s} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,border:`2px solid ${active?"#2dd4bf":"var(--border)"}`,background:active?"#f0fdfa":"#fff",cursor:"pointer",fontSize:13}}>
            <input type="radio" name="alutItemStatus" checked={active} onChange={()=>setNewStatus(s)} style={{accentColor:"#0d9488"}}/>
            <span style={{fontWeight:active?700:500}}>{cfg.label}</span>
          </label>;
        })}
      </div>
      {newStatus==="design_approved"&&<div style={{background:"#fef3c7",padding:10,borderRadius:8,fontSize:12,color:"#92400e",marginBottom:12}}>⚠️ מעבר ל״סקיצה מאושרת״ יתחיל את מונה 14 ימי העבודה לדדליין</div>}
      <label style={{display:"block",fontSize:12,fontWeight:600,marginBottom:6}}>📝 הערה (אופציונלי)</label>
      <textarea value={notes} onChange={e=>setNotes(e.target.value)} style={{width:"100%",minHeight:60,padding:10,borderRadius:8,border:"1px solid var(--border)",fontFamily:"inherit",marginBottom:16}}/>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button type="button" onClick={onClose} style={{padding:"10px 20px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>ביטול</button>
        <button type="button" onClick={handleSave} disabled={saving} style={{padding:"10px 20px",borderRadius:10,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>{saving?"שומר...":"✅ אשר"}</button>
      </div>
    </div>
  </Modal>;
}

    <input type="number" min="1" value={item.quantity} onChange={e=>update({quantity:e.target.value})} style={{...IS,marginBottom:10,width:140,direction:"ltr"}}/>
    <label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:4}}>מחיר יחידה (₪ לפני מע״מ)</label>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
      <input type="number" min="0" step="0.01" value={priceValue} onChange={e=>update({unit_price:e.target.value})} style={{...IS,width:140,direction:"ltr",marginBottom:0,border:isCustomPrice?"2px solid #f59e0b":IS.border,background:isCustomPrice?"#fffbeb":IS.background}}/>
      {isCustomPrice&&<span style={{fontSize:12,fontWeight:600,color:"#92400e",background:"#fef3c7",padding:"4px 10px",borderRadius:8}}>💡 מחיר מותאם אישית</span>}
      {!isCustomPrice&&<span style={{fontSize:11,color:"var(--text3)"}}>ברירת מחדל: ₪{Number(defaultPrice).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2})}</span>}

    <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:10,fontSize:13,cursor:"pointer"}}>

    </label>
    <div style={{fontSize:12,color:"var(--text2)",borderTop:"1px solid var(--border)",paddingTop:8}}>
      <div>{item.quantity} × {ci.unit_price||0} = {alutFmtMoney(ci.boardsTotal||0)}</div>
      {ci.design_price>0&&<div>סקיצה: {alutFmtMoney(ci.design_price)}</div>}
      <div style={{fontWeight:600,marginTop:4}}>סה״כ פריט: {alutFmtMoney(ci.subtotal||0)} | {ci.cartons_count||0} קרטונים</div>
    </div>
  </div>;
}

function alutItemsFromParsed(items){
  if(!items?.length)return[ALUT_EMPTY_ITEM()];
  return items.map(i=>({
    calendar_type:alutNormalizeCalendarType(i.calendar_type),
    quantity:Number(i.quantity)||1,
    needs_design:i.needs_design!==false,
    is_template_only:i.needs_design===false,
  }));
}

function AlutPasteEmailModal({onClose,onParsed,onManualFill}){
  const [emailText,setEmailText]=useState("");
  const [isParsing,setIsParsing]=useState(false);
  const [parseError,setParseError]=useState(null);
  const handleParse=async()=>{
    if(!emailText.trim()){window.alert("אנא הדבק את המייל");return;}
    setIsParsing(true);
    setParseError(null);
    try{
      const {data,error}=await supabaseClient.functions.invoke("parse-karin-email",{body:{email_text:emailText}});
      if(error)throw error;
      if(!data?.success)throw new Error(data?.error||data?.details||"שגיאה בפרסור");
      onParsed?.({...data.data,original_email:emailText});
    }catch(err){
      setParseError(err.message||String(err)||"שגיאה בפרסור המייל");
    }finally{setIsParsing(false);}
  };
  const IS={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"12px",color:"var(--text)",fontSize:13,width:"100%",outline:"none",fontFamily:"inherit",direction:"rtl",resize:"vertical",minHeight:220};
  return<Modal open={true} onClose={isParsing?()=>{}:onClose} title="📧 הדבק מייל של קארין" maxWidth={560}>
    <div style={{direction:"rtl"}}>
      <p style={{fontSize:13,color:"var(--text2)",margin:"0 0 12px",lineHeight:1.6}}>הדבק את המייל שקיבלת מקארין. Claude יזהה אוטומטית את הפרטים.</p>
      <textarea value={emailText} onChange={e=>setEmailText(e.target.value)} placeholder="הדבק כאן את תוכן המייל..." disabled={isParsing} style={IS}/>
      {parseError&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:12,marginTop:12,fontSize:13,color:"#991b1b"}}>
        <div style={{fontWeight:600,marginBottom:6}}>לא הצלחתי לפרסר את המייל:</div>
        <div style={{marginBottom:10}}>{parseError}</div>
        <button type="button" onClick={()=>onManualFill?.(emailText)} style={{padding:"8px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>מלא ידנית</button>
      </div>}
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
        <button type="button" onClick={onClose} disabled={isParsing} style={{padding:"12px 20px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:isParsing?"wait":"pointer",fontFamily:"inherit",minHeight:44}}>ביטול</button>
        <button type="button" onClick={handleParse} disabled={isParsing} style={{padding:"12px 20px",borderRadius:10,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:isParsing?"wait":"pointer",fontFamily:"inherit",minHeight:44,display:"flex",alignItems:"center",gap:8}}>
          {isParsing?<><Spinner sz={16} color="#fff"/> מפרסר...</>:<>🤖 פרסר את המייל</>}
        </button>
      </div>
    </div>
  </Modal>;
}

function AlutNewOrderModal({projectId,pricingRows,initialData,onClose,onSaved}){
  const fromEmail=!!(initialData&&(initialData.company_name||initialData.items?.length));
  const [localPricingRows,setLocalPricingRows]=useState(pricingRows?.length?pricingRows:[]);
  const [pricingLoading,setPricingLoading]=useState(!(pricingRows?.length));
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      try{
        const {data,error}=await supabaseClient.from("alut_pricing").select().order("category",{ascending:true}).order("key",{ascending:true});
        if(error)throw error;
        if(!cancelled){setLocalPricingRows(data||[]);setPricingLoading(false);}
      }catch(e){console.warn("alut pricing load",e);if(!cancelled)setPricingLoading(false);}
    })();
    return()=>{cancelled=true;};
  },[]);
  const effectivePricingRows=localPricingRows.length?localPricingRows:(pricingRows||[]);
  const pricing=useMemo(()=>alutPricingRowsToMap(effectivePricingRows),[effectivePricingRows]);
  const pricingReady=!pricingLoading&&(pricing.price_hard!=null||pricing.price_duplex!=null||pricing.price_wall!=null);
  const [orderNumber,setOrderNumber]=useState(initialData?.order_number||"");
  const [companyName,setCompanyName]=useState(initialData?.company_name||"");
  const [contactName,setContactName]=useState(initialData?.contact_name||"");
  const [contactPhone,setContactPhone]=useState(initialData?.contact_phone||"");
  const [contactEmail,setContactEmail]=useState(initialData?.contact_email||"");
  const [isPickup,setIsPickup]=useState(!!initialData?.is_pickup);
  const [deliveryAddress,setDeliveryAddress]=useState(initialData?.delivery_address||"");
  const [deliveryCity,setDeliveryCity]=useState(initialData?.delivery_city||"");
  const [allCities,setAllCities]=useState(cityRegionsListCache||[]);
  const [notes,setNotes]=useState("");
  const [originalEmail,setOriginalEmail]=useState(initialData?.original_email||"");
  const [orderDupWarn,setOrderDupWarn]=useState(false);
  const [items,setItems]=useState(()=>alutItemsFromParsed(initialData?.items));
  const [saving,setSaving]=useState(false);
  useEffect(()=>{loadCityRegions().then(()=>setAllCities(cityRegionsListCache||[]));},[]);
  useEffect(()=>{
    if(!initialData)return;
    if(initialData.company_name!=null)setCompanyName(initialData.company_name||"");
    if(initialData.contact_name!=null)setContactName(initialData.contact_name||"");
    if(initialData.contact_phone!=null)setContactPhone(initialData.contact_phone||"");
    if(initialData.contact_email!=null)setContactEmail(initialData.contact_email||"");
    if(initialData.delivery_address!=null)setDeliveryAddress(initialData.delivery_address||"");
    if(initialData.delivery_city!=null)setDeliveryCity(initialData.delivery_city||"");
    if(initialData.is_pickup!=null)setIsPickup(!!initialData.is_pickup);
    if(initialData.original_email)setOriginalEmail(initialData.original_email);
    if(initialData.items?.length)setItems(alutItemsFromParsed(initialData.items));
  },[initialData]);
  const calc=useMemo(()=>{
    if(!pricingReady)return{items:[],totalCartons:0,itemsTotal:0,shippingPrice:0,subtotalBeforeVat:0,vat:0,total:0};
    return calculateAlutOrderTotals(items.map(i=>({...i,needs_design:!i.is_template_only})),pricing,isPickup);
  },[items,isPickup,pricing,pricingReady]);
  useEffect(()=>{
    if(initialData?.order_number){
      setOrderNumber(initialData.order_number);
      sb(`alut_orders?project_id=eq.${projectId}&order_number=eq.${initialData.order_number}&limit=1`).then(r=>setOrderDupWarn(!!r?.length)).catch(()=>setOrderDupWarn(false));
    }else{
      sb(`alut_orders?select=order_number&project_id=eq.${projectId}&order=order_number.desc&limit=1`).then(r=>setOrderNumber((r?.[0]?.order_number||0)+1)).catch(()=>setOrderNumber(1));
      setOrderDupWarn(false);
    }
  },[projectId,initialData?.order_number]);
  const updateItem=(idx,patch)=>setItems(prev=>prev.map((it,i)=>i===idx?patch:it));
  const removeItem=(idx)=>setItems(prev=>prev.length<=1?prev:prev.filter((_,i)=>i!==idx));
  const addItem=()=>setItems(prev=>[...prev,ALUT_EMPTY_ITEM()]);
  const handleSave=async()=>{
    if(!companyName.trim()){window.alert("יש למלא שם חברה");return;}
    if(items.some(i=>!i.quantity||Number(i.quantity)<1)){window.alert("יש למלא כמות בכל פריט");return;}

    setSaving(true);
    try{
      await loadCityRegions();
      const resolvedCity=alutResolveDeliveryCity(deliveryCity,deliveryAddress,isPickup);
      const header={project_id:projectId,order_number:Number(orderNumber),company_name:companyName.trim(),contact_name:contactName.trim()||null,contact_phone:contactPhone.trim()||null,contact_email:contactEmail.trim()||null,delivery_address:deliveryAddress.trim()||null,delivery_city:resolvedCity,is_pickup:isPickup,notes:notes.trim()||null,original_email:originalEmail.trim()||null};
      const created=await sb("alut_orders",{method:"POST",body:JSON.stringify(header)});
      const orderId=(Array.isArray(created)?created[0]:created)?.id;
      if(!orderId)throw new Error("לא נוצרה הזמנה");
      for(const item of calc.items){
        await sb("alut_order_items",{method:"POST",body:JSON.stringify({
          order_id:orderId,calendar_type:item.calendar_type,quantity:Number(item.quantity),
          needs_design:item.needs_design,is_template_only:!!item.is_template_only,
          unit_price:item.unit_price,design_price:item.design_price,cartons_count:item.cartons_count,
          subtotal:item.subtotal,davach_cost:item.davach_cost,status:"new",
        })});
      }
      onSaved?.();onClose();
    }catch(e){window.alert("שגיאה בשמירה: "+(e.message||String(e)));}
    finally{setSaving(false);}
  };
  const IS={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 13px",color:"var(--text)",fontSize:13,width:"100%",outline:"none",fontFamily:"inherit",direction:"rtl"};
  const modalTitle=fromEmail?"➕ הזמנה חדשה (נטענה מהמייל)":"🗓️ הזמנה חדשה - אלוט";
  return<Modal open={true} onClose={onClose} title={modalTitle} maxWidth={600}>

      {fromEmail&&<div style={{background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:10,padding:12,marginBottom:14,fontSize:13,color:"#92400e"}}>ℹ️ הנתונים נטענו אוטומטית מהמייל. עבור עליהם ותקן אם צריך לפני שמירה.</div>}
      {orderDupWarn&&<div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:10,marginBottom:12,fontSize:13,color:"#991b1b",fontWeight:600}}>⚠️ הזמנה #{orderNumber} כבר קיימת במערכת</div>}
      <label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:4}}>מספר הזמנה</label>
      <input value={orderNumber} onChange={e=>setOrderNumber(e.target.value)} style={{...IS,direction:"ltr",width:120,marginBottom:12}}/>
      <div style={{fontWeight:700,color:"#0d9488",margin:"8px 0 10px"}}>🏢 פרטי לקוח</div>
      <input value={companyName} onChange={e=>setCompanyName(e.target.value)} placeholder="שם חברה *" style={{...IS,marginBottom:8}}/>
      <input value={contactName} onChange={e=>setContactName(e.target.value)} placeholder="איש קשר" style={{...IS,marginBottom:8}}/>
      <input value={contactPhone} onChange={e=>setContactPhone(e.target.value)} placeholder="טלפון" style={{...IS,marginBottom:8,direction:"ltr",textAlign:"right"}}/>
      <input value={contactEmail} onChange={e=>setContactEmail(e.target.value)} placeholder="מייל" style={{...IS,marginBottom:8,direction:"ltr",textAlign:"right"}}/>
      <label style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,fontSize:13,cursor:"pointer"}}>
        <input type="checkbox" checked={isPickup} onChange={e=>setIsPickup(e.target.checked)}/> איסוף עצמי
      </label>
      {!isPickup&&<>
        <input value={deliveryAddress} onChange={e=>setDeliveryAddress(e.target.value)} placeholder="כתובת" style={{...IS,marginBottom:8}}/>
        <label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:4}}>עיר (אופציונלי, נחלץ אוטומטית מהכתובת)</label>
        <input value={deliveryCity} onChange={e=>setDeliveryCity(e.target.value)} placeholder="למשל: תל אביב" list="alut-cities-list-new" style={{...IS,marginBottom:8}}/>

        {!deliveryCity&&deliveryAddress&&<div style={{fontSize:12,color:"#92400e",marginBottom:12}}>💡 המערכת תנסה לחלץ את העיר מהכתובת</div>}
      </>}
      <div style={{fontWeight:700,color:"#0d9488",margin:"12px 0 10px"}}>📦 פריטי הזמנה</div>
      {pricingLoading?<div style={{padding:12,textAlign:"center",color:"var(--text3)",fontSize:13}}><Spinner sz={20} color="#0d9488"/> טוען מחירים...</div>:
      items.map((it,i)=><AlutItemFormCard key={i} item={it} index={i} pricing={pricing} calcItem={calc.items[i]} onChange={updateItem} onRemove={removeItem} canRemove={items.length>1}/>)}
      <button type="button" onClick={addItem} style={{width:"100%",padding:12,borderRadius:10,border:"2px dashed #99f6e4",background:"#f0fdfa",color:"#0d9488",fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginBottom:16,minHeight:44}}>+ הוסף פריט נוסף</button>

function alutBuildDavachPdfPayload(order,item,itemIndex,pricing,notes){
  const itemLetter=String.fromCharCode(65+itemIndex);
  const costPerUnit=Number(pricing.cost_davach_per_unit)||0;
  const quantity=Number(item.quantity)||0;
  const cartonsSize=item.calendar_type==="wall"?Number(pricing.carton_wall):Number(pricing.carton_duplex);
  return{
    order_number:order.order_number,
    item_letter:itemLetter,
    company_name:order.company_name,
    contact_name:order.contact_name,
    calendar_type_label:item.calendar_type==="wall"?"לוח קיר":"לוח דופלקס",
    quantity,
    cartons_count:Number(item.cartons_count)||0,
    cartons_size:cartonsSize,
    cost_per_unit:costPerUnit,
    total_cost:quantity*costPerUnit,
    notes:notes||null,
  };
}

function AlutDavachModal({item,itemIndex,order,pricing,onClose,onSaved}){

    setIsGenerating(true);
    try{
      const filename=`davach_order_${payload.order_number}${payload.item_letter}.pdf`;
      const {error:insertError}=await supabaseClient.from("alut_davach_orders").insert({
        item_id:item.id,
        order_id:order.id,
        calendar_type:item.calendar_type,
        quantity:payload.quantity,

      });

      if(updateStatus){
        await sb(`alut_order_items?id=eq.${item.id}`,{method:"PATCH",body:JSON.stringify({status:"at_davach",davach_sent_at:new Date().toISOString()})});

    return<AlutBindingOrderPrint

      itemLetter={payload.item_letter}

      quantity={payload.quantity}
      cartonsCount={payload.cartons_count}

      onClose={()=>{setPrintOpen(false);onClose();}}

        <div><strong>🔢 כמות:</strong> {payload.quantity.toLocaleString("he-IL")} יחידות</div>
        <div><strong>📦 קרטונים:</strong> {payload.cartons_count} ({payload.cartons_size.toLocaleString("he-IL")} יחידות בקרטון)</div>
        <div style={{marginTop:10,fontWeight:800,color:"#7c3aed",fontSize:16}}>💰 עלות: {payload.quantity.toLocaleString("he-IL")} × {payload.cost_per_unit.toFixed(2)} = {alutFmtMoney(payload.total_cost)}</div>
      </div>
      <label style={{display:"block",fontSize:12,fontWeight:700,color:"var(--text3)",marginBottom:6}}>📝 הערות (אופציונלי)</label>
      <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="הערות לדבח..." disabled={isGenerating} style={IS}/>
      <label style={{display:"flex",alignItems:"center",gap:8,margin:"12px 0 16px",fontSize:13,cursor:"pointer"}}>
        <input type="checkbox" checked={updateStatus} onChange={e=>setUpdateStatus(e.target.checked)} disabled={isGenerating}/> עדכן סטטוס פריט ל״אצל דבח״ אחרי הפקה
      </label>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button type="button" onClick={onClose} disabled={isGenerating} style={{padding:"12px 20px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:isGenerating?"wait":"pointer",fontFamily:"inherit",minHeight:44}}>ביטול</button>

function alutCartonSizeForType(calendarType,pricing){
  const t=alutNormalizeCalendarType(calendarType);
  return Number({hard:pricing.carton_hard,duplex:pricing.carton_duplex,wall:pricing.carton_wall}[t])||1;
}

        cartons_count:payload.cartons_count,
        pdf_filename:filename,
        notes:notes.trim()||null,
      });

      onSaved?.();
      setPrintOpen(true);
    }catch(err){
      window.alert("שגיאה: "+(err.message||String(err)));

  };
  if(printOpen){
    return<AlutBindingOrderPrint

      cartonsCount={payload.cartons_count}

  return<Modal open={true} onClose={isGenerating?()=>{}:onClose} title={`🖨️ הזמנת עבודה לאיציק - הזמנה #${order.order_number} / פריט ${payload.item_letter}`} maxWidth={520}>
    <div style={{direction:"rtl"}}>
      <div style={{background:"#fdf2f8",border:"1px solid #fbcfe8",borderRadius:12,padding:16,marginBottom:16,fontSize:14,lineHeight:1.8}}>
        <div><strong>👤 לקוח:</strong> {order.company_name}</div>
        <div><strong>📦 סוג:</strong> {ct.icon} {payload.calendar_type_label}</div>
        <div><strong>🔢 כמות:</strong> {payload.quantity.toLocaleString("he-IL")} יחידות</div>
        <div><strong>📦 קרטונים:</strong> {payload.cartons_count} ({payload.cartons_size.toLocaleString("he-IL")} יחידות בקרטון)</div>
      </div>
      <label style={{display:"block",fontSize:12,fontWeight:700,color:"var(--text3)",marginBottom:6}}>📝 הערות (אופציונלי)</label>
      <textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="הערות לאיציק..." disabled={isGenerating} style={IS}/>
      <label style={{display:"flex",alignItems:"center",gap:8,margin:"12px 0 16px",fontSize:13,cursor:"pointer"}}>
        <input type="checkbox" checked={updateStatus} onChange={e=>setUpdateStatus(e.target.checked)} disabled={isGenerating}/> עדכן סטטוס פריט ל״כריכה אצל איציק״ אחרי הפקה
      </label>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button type="button" onClick={onClose} disabled={isGenerating} style={{padding:"12px 20px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:isGenerating?"wait":"pointer",fontFamily:"inherit",minHeight:44}}>ביטול</button>
        <button type="button" onClick={handleGeneratePdf} disabled={isGenerating} style={{padding:"12px 20px",borderRadius:10,border:"none",background:"linear-gradient(135deg,#ec4899 0%,#be185d 100%)",color:"#fff",fontWeight:700,cursor:isGenerating?"wait":"pointer",fontFamily:"inherit",minHeight:44,display:"flex",alignItems:"center",gap:8}}>
          {isGenerating?<><Spinner sz={16} color="#fff"/> שומר...</>:<>🖨️ הדפס / שמור PDF</>}
        </button>
      </div>
    </div>
  </Modal>;
}

function AlutCartonLabelsModal({order,onClose}){
  const labels=[];
  let globalCartonNum=0;
  const totalCartons=Number(order.total_cartons)||0;
  (order.items||[]).forEach(item=>{
    const typeLabel={hard:"לוח שולחני קשיח",duplex:"לוח שולחני דופלקס",wall:"לוח קיר"}[alutNormalizeCalendarType(item.calendar_type)]||"לוח";
    const cartonSize={hard:70,duplex:100,wall:100}[alutNormalizeCalendarType(item.calendar_type)]||100;
    const cartonsCount=Number(item.cartons_count)||Math.ceil((Number(item.quantity)||0)/cartonSize)||0;
    for(let i=0;i<cartonsCount;i++){
      globalCartonNum++;
      const isLast=i===cartonsCount-1;
      const unitsInThisCarton=isLast?(Number(item.quantity)||0)-(i*cartonSize):cartonSize;
      labels.push({cartonNum:globalCartonNum,totalCartons:totalCartons||globalCartonNum,type:typeLabel,units:Math.max(0,unitsInThisCarton)});
    }
  });
  if(totalCartons>0&&labels.length){
    labels.forEach(l=>{l.totalCartons=totalCartons;});
  }
  useEffect(()=>{
    const onKey=e=>{if(e.key==="Escape")onClose?.();};
    document.addEventListener("keydown",onKey);
    return()=>document.removeEventListener("keydown",onKey);
  },[onClose]);
  return<div className="carton-labels-modal">
    <div className="carton-labels-header">
      <h2 style={{margin:0,fontSize:18}}>🏷️ מדבקות לקרטונים - הזמנה #{order.order_number}</h2>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <button type="button" className="carton-print-btn" onClick={()=>alutPrintWithClass("printing-carton-labels")}>🖨️ הדפס</button>
        <button type="button" className="carton-close-btn" onClick={onClose}>✕</button>
      </div>
    </div>
    <div className="carton-labels-grid">
      {labels.map(label=><AlutCartonLabel key={label.cartonNum} order={order} label={label}/>)}
    </div>
    {!labels.length&&<div style={{textAlign:"center",padding:40,color:"#9ca3af"}}>אין קרטונים להדפסה</div>}
  </div>;
}

function AlutTransferToShipmentsModal({order,onClose,onTransferred}){
  const [driver,setDriver]=useState("");
  const [scheduledDate,setScheduledDate]=useState("");
  const [notes,setNotes]=useState("");
  const [transferring,setTransferring]=useState(false);
  const items=order.items||[];
  const itemsSummary=items.map(item=>{
    const typeLabel={hard:"קשיח",duplex:"דופלקס",wall:"קיר"}[alutNormalizeCalendarType(item.calendar_type)]||item.calendar_type;
    return`${item.quantity} ${typeLabel}`;
  }).join(" + ");
  const totalCartons=Number(order.total_cartons)||items.reduce((s,i)=>s+(Number(i.cartons_count)||0),0);
  const IS={background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 13px",color:"var(--text)",fontSize:13,width:"100%",outline:"none",fontFamily:"inherit",direction:"rtl"};
  const handleTransfer=async()=>{
    setTransferring(true);
    try{
      const deliveryNotes=[itemsSummary,`${totalCartons} קרטונים`,notes.trim()].filter(Boolean).join("\n");
      const taskPayload={
        title:`אלוט #${order.order_number} - ${order.company_name}`,
        client_name:order.company_name||"",
        dept:"משלוחים",
        priority:"בינונית",
        status:"ממתין",
        contact:order.contact_name||null,
        notes:deliveryNotes,
        created_by:"אלוט",
        delivery_status:"ready",
        scheduled_delivery_date:scheduledDate||null,
        delivery_type:order.is_pickup?"pickup":"local",
        delivery_address_snapshot:order.is_pickup?null:(order.delivery_address||null),
        delivery_contact_snapshot:order.contact_name||null,
        delivery_phone_snapshot:order.contact_phone||null,
        delivery_special_notes:deliveryNotes||null,
        delivery_marked_at:new Date().toISOString(),
        delivery_marked_by:"אלוט",
      };
      if(driver.trim())taskPayload.driver=driver.trim();
      const created=await sb("tasks",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(taskPayload)});
      const newTask=Array.isArray(created)?created[0]:created;
      if(!newTask?.id)throw new Error("לא נוצרה משימת משלוח");
      await sb(`alut_orders?id=eq.${order.id}`,{method:"PATCH",body:JSON.stringify({
        transferred_to_shipments:true,
        transferred_at:new Date().toISOString(),
        shipment_task_id:newTask.id,
      })});
      const activeIds=items.filter(i=>!["delivered","cancelled"].includes(i.status)).map(i=>i.id);
      if(activeIds.length){
        await sb(`alut_order_items?id=in.(${activeIds.join(",")})`,{method:"PATCH",body:JSON.stringify({
          status:"shipped",
          shipped_at:new Date().toISOString(),
        })});
      }
      window.alert("✅ ההזמנה הועברה למשלוחים");
      onTransferred?.();
      onClose?.();
    }catch(err){
      window.alert("שגיאה: "+(err.message||String(err)));
    }finally{setTransferring(false);}
  };
  return<Modal open={true} onClose={onClose} title={`🚚 העברה למשלוחים - הזמנה #${order.order_number}`} maxWidth={520}>
    <div style={{direction:"rtl"}}>
      <div style={{background:"#f0fdfa",border:"1px solid #99f6e4",borderRadius:12,padding:14,marginBottom:16,fontSize:13,lineHeight:1.8}}>
        <div><strong>לקוח:</strong> {order.company_name}</div>
        <div><strong>איש קשר:</strong> {order.contact_name||"—"}</div>
        <div><strong>כתובת:</strong> {order.is_pickup?"איסוף עצמי":(order.delivery_address||"—")}</div>
        <div><strong>פריטים:</strong> {itemsSummary||"—"}</div>
        <div><strong>קרטונים:</strong> {totalCartons}</div>
      </div>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:12,fontWeight:600,marginBottom:4}}>תאריך משלוח מבוקש</label>
        <input type="date" value={scheduledDate} onChange={e=>setScheduledDate(e.target.value)} style={{...IS,direction:"ltr",textAlign:"right"}}/>
      </div>
      <div style={{marginBottom:12}}>
        <label style={{display:"block",fontSize:12,fontWeight:600,marginBottom:4}}>נהג (אופציונלי)</label>
        <input type="text" value={driver} onChange={e=>setDriver(e.target.value)} placeholder="שם הנהג / חברת שליחויות" style={IS}/>
      </div>
      <div style={{marginBottom:16}}>
        <label style={{display:"block",fontSize:12,fontWeight:600,marginBottom:4}}>הערות נוספות</label>
        <textarea value={notes} onChange={e=>setNotes(e.target.value)} rows={3} style={{...IS,minHeight:70}}/>
      </div>
      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}>
        <button type="button" onClick={onClose} disabled={transferring} style={{padding:"10px 16px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",minHeight:44}}>ביטול</button>
        <button type="button" className="alut-btn-transfer" onClick={handleTransfer} disabled={transferring}>{transferring?"⏳ מעביר...":"🚚 העבר למשלוחים"}</button>
      </div>
    </div>
  </Modal>;
}

  const [allCities,setAllCities]=useState(cityRegionsListCache||[]);

  const [editItem,setEditItem]=useState(null);

  const [showItzikModal,setShowItzikModal]=useState(null);

  const loadWorkOrderRecords=async()=>{
    try{
      const [davach,itzik,emails]=await Promise.all([
        supabaseClient.from("alut_davach_orders").select("*").eq("order_id",order.id).order("generated_at",{ascending:false}),
        supabaseClient.from("alut_itzik_orders").select("*").eq("order_id",order.id).order("generated_at",{ascending:false}),
        supabaseClient.from("alut_sent_emails").select("*").eq("order_id",order.id).order("sent_at",{ascending:false}),
      ]);
      if(!davach.error)setDavachRecords(davach.data||[]);
      if(!itzik.error)setItzikRecords(itzik.data||[]);
      if(!emails.error)setSentEmails(emails.data||[]);
    }catch(e){console.warn("alut work orders load",e);}
  };
  const reload=async()=>{
    const [o,items]=await Promise.all([
      sb(`alut_orders?id=eq.${order.id}&limit=1`),
      sb(`alut_order_items?order_id=eq.${order.id}&order=id.asc`),
    ]);
    const ord=o?.[0];
    if(ord)setData({...ord,items:items||[]});
    await loadWorkOrderRecords();
    onSaved?.();
  };
  useEffect(()=>{reload();loadCityRegions().then(()=>setAllCities(cityRegionsListCache||[]));},[]);
  const items=data.items||[];
  const calc=useMemo(()=>calculateAlutOrderTotals(items.map(i=>({...i,needs_design:!i.is_template_only})),pricing,data.is_pickup),[items,data.is_pickup,pricing]);
  const saveCustomer=async()=>{
    await loadCityRegions();
    const resolvedCity=alutResolveDeliveryCity(customerForm.delivery_city,customerForm.delivery_address,customerForm.is_pickup);
    await sb(`alut_orders?id=eq.${order.id}`,{method:"PATCH",body:JSON.stringify({
      company_name:customerForm.company_name.trim(),contact_name:customerForm.contact_name.trim()||null,
      contact_phone:customerForm.contact_phone.trim()||null,contact_email:customerForm.contact_email.trim()||null,
      is_pickup:customerForm.is_pickup,delivery_address:customerForm.delivery_address.trim()||null,delivery_city:resolvedCity,notes:customerForm.notes.trim()||null,
    })});
    await alutTouchOrderRecalc(order.id);
    setEditingCustomer(false);reload();
  };
  const deleteOrder=async()=>{
    if(!confirm(`למחוק הזמנה #${data.order_number} — ${data.company_name}?`))return;
    await sb(`alut_orders?id=eq.${order.id}`,{method:"DELETE"});
    onSaved?.();onClose();
  };
  const deleteItem=async(item)=>{
    if(items.length<=1){window.alert("לא ניתן למחוק את הפריט האחרון — מחק את כל ההזמנה");return;}

function alutCopyToClipboard(text,label,setToast){
  const show=msg=>{
    if(setToast){
      setToast(msg||`✅ הועתק${label?`: ${label}`:""}`);
      setTimeout(()=>setToast(null),2500);
    }
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(String(text)).then(()=>show(`✅ הועתק${label?`: ${label}`:""}`)).catch(()=>{
      const ta=document.createElement("textarea");
      ta.value=String(text);ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);show(`✅ הועתק${label?`: ${label}`:""}`);
    });
  }
  const ta=document.createElement("textarea");
  ta.value=String(text);ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);show(`✅ הועתק${label?`: ${label}`:""}`);
  return Promise.resolve();
}
function alutCalculateSeasonalSummary(orders,items,pricing){
  const summary={
    hard:{quantity:0,unitPrice:Number(pricing.price_hard)||0,revenue:0},
    duplex:{quantity:0,unitPrice:Number(pricing.price_duplex)||0,revenue:0},
    wall:{quantity:0,unitPrice:Number(pricing.price_wall)||0,revenue:0},
  };
  let designsCount=0;
  let cartonsTotal=0;
  const orderPickup=Object.fromEntries((orders||[]).map(o=>[o.id,!!o.is_pickup]));
  (items||[]).forEach(item=>{
    const t=alutNormalizeCalendarType(item.calendar_type);
    if(!summary[t])return;
    const qty=Number(item.quantity)||0;
    const unit=Number(item.unit_price)||summary[t].unitPrice;
    summary[t].quantity+=qty;
    summary[t].revenue+=qty*unit;
    if(item.needs_design!==false&&!item.is_template_only&&Number(item.design_price)>0)designsCount+=1;
    if(!orderPickup[item.order_id])cartonsTotal+=Number(item.cartons_count)||0;
  });
  const designsUnitPrice=Number(pricing.price_design)||0;
  const shippingUnitPrice=Number(pricing.price_shipping_carton)||0;
  const designsTotal=designsCount*designsUnitPrice;
  const shippingTotal=cartonsTotal*shippingUnitPrice;
  const boardsTotal=summary.hard.revenue+summary.duplex.revenue+summary.wall.revenue;
  const subtotal=boardsTotal+designsTotal+shippingTotal;
  const vat=subtotal*0.18;
  const total=subtotal+vat;
  return{boardsTotal,designsTotal,shippingTotal,subtotal,vat,total};
}
function alutBuildSeasonalGroups(orders,items){
  const orderMap=Object.fromEntries((orders||[]).map(o=>[o.id,o]));
  const groups={
    hard:{title:"📄 לוח שולחני קשיח",totalUnits:0,lines:[],unitLabel:"יח׳"},
    duplex:{title:"📄 לוח שולחני דופלקס",totalUnits:0,lines:[],unitLabel:"יח׳"},
    wall:{title:"📄 לוח קיר",totalUnits:0,lines:[],unitLabel:"יח׳"},
  };
  const designs={title:"🎨 סקיצות",totalUnits:0,lines:[],unitLabel:"הזמנות"};
  const shipping={title:"📦 משלוחים",totalUnits:0,lines:[],unitLabel:"קרטונים"};
  const cartonsByOrder={};
  (items||[]).forEach(item=>{
    const order=orderMap[item.order_id];
    if(!order)return;
    const t=alutNormalizeCalendarType(item.calendar_type);
    if(!groups[t])return;
    const qty=Number(item.quantity)||0;
    groups[t].lines.push(`${order.company_name} - ${qty.toLocaleString("he-IL")}`);
    groups[t].totalUnits+=qty;
    if(item.needs_design!==false&&!item.is_template_only&&Number(item.design_price)>0){
      designs.lines.push(`${order.company_name} - סקיצה`);
      designs.totalUnits+=1;
    }
    if(!order.is_pickup)cartonsByOrder[order.id]=(cartonsByOrder[order.id]||0)+(Number(item.cartons_count)||0);
  });
  (orders||[]).forEach(order=>{
    if(order.is_pickup)return;
    const c=cartonsByOrder[order.id]||0;
    if(c<=0)return;
    shipping.lines.push(`${order.company_name} - ${c} קרטונים`);
    shipping.totalUnits+=c;
  });
  return{hard:groups.hard,duplex:groups.duplex,wall:groups.wall,designs,shipping};
}
function alutFmtNum(n){
  return Number(n||0).toLocaleString("he-IL",{minimumFractionDigits:2,maximumFractionDigits:2});
}
