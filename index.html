      clearCityRegionsCache();
      await loadCityRegions(true);
      await loadCities();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    finally{setBusy(false);}
  };
  const updateRegion=async(cityId,region)=>{
    try{
      const{error}=await supabaseClient.from("city_regions").update({region,updated_at:new Date().toISOString()}).eq("id",cityId);
      if(error)throw error;
      clearCityRegionsCache();
      await loadCityRegions(true);
      await loadCities();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const deleteCity=async(cityId)=>{
    if(!confirm("למחוק את העיר?"))return;
    try{
      const{error}=await supabaseClient.from("city_regions").delete().eq("id",cityId);
      if(error)throw error;
      clearCityRegionsCache();
      await loadCityRegions(true);
      await loadCities();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const filtered=cities.filter(c=>!search||String(c.city_name||"").includes(search));
  return<div className="city-regions-manager">
    <h1 style={{fontSize:22,fontWeight:800,margin:"0 0 8px"}}>🗺️ ניהול ערים ואזורים</h1>
    <p style={{color:"var(--text3)",fontSize:13,marginBottom:16}}>מיפוי ערים לאזורי משלוח של אלוט. שינויים משפיעים מיד על סינון האזורים בדשבורד.</p>
    <div className="add-city-form">
      <input type="text" value={newCity} onChange={e=>setNewCity(e.target.value)} placeholder="שם עיר חדשה" style={{flex:1,minWidth:160}}/>
      <select value={newRegion} onChange={e=>setNewRegion(e.target.value)}>
        {ALUT_REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
      </select>
      <button type="button" onClick={addCity} disabled={busy||!newCity.trim()} style={{padding:"10px 16px",borderRadius:10,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>{busy?"...":"➕ הוסף"}</button>
    </div>
    <input type="text" className="city-search" value={search} onChange={e=>setSearch(e.target.value)} placeholder="חיפוש עיר..."/>
    {loading?<div style={{padding:24}}><Spinner sz={24} color="#0d9488"/> טוען...</div>:
    <div style={{overflowX:"auto"}}>
      <table>
        <thead><tr><th>עיר</th><th>אזור</th><th>שמות חלופיים</th><th>פעולות</th></tr></thead>
        <tbody>
          {filtered.map(city=>(
            <tr key={city.id}>
              <td style={{fontWeight:600}}>{city.city_name}</td>
              <td>
                <select value={city.region} onChange={e=>updateRegion(city.id,e.target.value)} style={{padding:"6px 8px",borderRadius:8,border:"1px solid var(--border)",fontFamily:"inherit"}}>
                  {ALUT_REGIONS.map(r=><option key={r} value={r}>{r}</option>)}
                </select>
              </td>
              <td style={{color:"var(--text3)"}}>{(city.aliases&&city.aliases.length)?city.aliases.join(", "):"—"}</td>
              <td><button type="button" onClick={()=>deleteCity(city.id)} style={{background:"#fee2e2",border:"none",borderRadius:8,padding:"6px 10px",cursor:"pointer",minHeight:36}} title="מחק">🗑️</button></td>
            </tr>
          ))}
          {!filtered.length&&<tr><td colSpan={4} style={{textAlign:"center",color:"var(--text3)",padding:24}}>אין ערים להצגה</td></tr>}
        </tbody>
      </table>
    </div>}
  </div>;
}

function AlutDashboard(){
  const [project,setProject]=useState(null);
  const [pricingRows,setPricingRows]=useState([]);
  const [orders,setOrders]=useState([]);
  const [allItems,setAllItems]=useState([]);
  const [loading,setLoading]=useState(true);
  const [search,setSearch]=useState("");
  const [filterStatus,setFilterStatus]=useState("all");
  const [filterType,setFilterType]=useState("all");
  const [urgentOnly,setUrgentOnly]=useState(false);
  const [sortByDeadline,setSortByDeadline]=useState(false);
  const [selectedRegion,setSelectedRegion]=useState(null);
  const [regionsReady,setRegionsReady]=useState(!!cityRegionsCache);
  const [showPricing,setShowPricing]=useState(false);
  const [showSeasonalQuote,setShowSeasonalQuote]=useState(false);
  const [pasteEmailOpen,setPasteEmailOpen]=useState(false);
  const [newOrderOpen,setNewOrderOpen]=useState(false);
  const [newOrderInitial,setNewOrderInitial]=useState(null);
  const [newOrderKey,setNewOrderKey]=useState(0);
  const [detailOrder,setDetailOrder]=useState(null);
  const loadData=async()=>{
    try{
      const [proj,pricing]=await Promise.all([
        sb("alut_projects?is_active=eq.true&order=year.desc&limit=1"),
        sb("alut_pricing?order=category.asc,key.asc"),
      ]);
      const p=proj?.[0]||null;
      setProject(p);
      setPricingRows(pricing||[]);
      if(p){
        const o=await sb(`alut_orders?project_id=eq.${p.id}&order=order_number.desc&select=*,alut_order_items(*)`);
        const list=(o||[]).map(ord=>({...ord,items:(ord.alut_order_items||[]).sort((a,b)=>a.id-b.id)}));
        setOrders(list);
        setAllItems(list.flatMap(ord=>ord.items||[]));
      }else{setOrders([]);setAllItems([]);}
    }catch(e){console.warn("alut load",e);setOrders([]);setAllItems([]);}
    setLoading(false);
  };
  useEffect(()=>{setLoading(true);loadData();const t=setInterval(loadData,30000);return()=>clearInterval(t);},[]);
  useEffect(()=>{loadCityRegions().then(()=>setRegionsReady(true));},[]);
  const ordersRef=useRef([]);
  useEffect(()=>{
    ordersRef.current=orders;
    if(window.__alutPendingOpenId!=null){
      const o=orders.find(x=>String(x.id)===String(window.__alutPendingOpenId));
      if(o){setDetailOrder(o);window.__alutPendingOpenId=null;}
    }
  },[orders]);
  useEffect(()=>{
    const h=(e)=>{
      const id=e.detail&&e.detail.id;
      if(id==null)return;
      const o=ordersRef.current.find(x=>String(x.id)===String(id));
      if(o)setDetailOrder(o);else window.__alutPendingOpenId=id;
    };
    window.addEventListener("printos-open-alut",h);
    return()=>window.removeEventListener("printos-open-alut",h);
  },[]);
  const filtered=useMemo(()=>{
    const list=orders.filter(o=>{
      const items=o.items||[];
      if(filterType!=="all"&&!items.some(i=>i.calendar_type===filterType))return false;
      if(filterStatus!=="all"&&!items.some(i=>i.status===filterStatus))return false;
      if(urgentOnly&&!items.some(i=>{const d=alutDaysUntilDeadline(i.delivery_deadline);return d!==null&&d<=4&&!["delivered","cancelled"].includes(i.status);}))return false;
      if(search.trim()){
        const s=search.trim().toLowerCase();
        if(!String(o.order_number).includes(s)&&!(o.company_name||"").toLowerCase().includes(s)&&!(o.contact_name||"").toLowerCase().includes(s))return false;
      }
      if(selectedRegion!==null){
        if(selectedRegion==="pickup"){
          if(!o.is_pickup)return false;
        }else if(selectedRegion==="unknown"){
          if(o.is_pickup)return false;
          if(getOrderRegion(o))return false;
        }else{
          if(o.is_pickup)return false;
          if(getOrderRegion(o)!==selectedRegion)return false;
        }
      }
      return true;
    });
    if(!sortByDeadline)return list;
    const earliestDeadline=o=>{
      const dates=(o.items||[]).map(i=>i.delivery_deadline).filter(Boolean).sort();
      return dates[0]||null;
    };
    return[...list].sort((a,b)=>{
      const da=earliestDeadline(a);
      const db=earliestDeadline(b);
      if(!da&&!db)return(Number(b.order_number)||0)-(Number(a.order_number)||0);
      if(!da)return 1;
      if(!db)return -1;
      if(da!==db)return da<db?-1:1;
      return(Number(b.order_number)||0)-(Number(a.order_number)||0);
    });
  },[orders,filterStatus,filterType,urgentOnly,search,sortByDeadline,selectedRegion,regionsReady]);
  const regionCounts=useMemo(()=>{
    const counts={};
    ALUT_REGIONS.forEach(r=>{counts[r]=0;});
    let pickup=0,unknown=0;
    orders.forEach(order=>{
      if(order.is_pickup){pickup++;return;}
      const region=getOrderRegion(order);
      if(region&&counts[region]!==undefined)counts[region]++;
      else unknown++;
    });
    return{...counts,pickup,unknown};
  },[orders,regionsReady]);
  const kpis=useMemo(()=>{
    const sumItems=arr=>arr.reduce((a,x)=>a+Number(x.subtotal||0),0);
    const sumOrders=arr=>arr.reduce((a,x)=>a+Number(x.total_price||0),0);
    const inPrint=allItems.filter(i=>ALUT_IN_PRINT_STATUSES.includes(i.status));
    const inBinding=allItems.filter(i=>ALUT_IN_BINDING_STATUSES.includes(i.status));
    const readyToGo=allItems.filter(i=>ALUT_READY_STATUSES.includes(i.status));
    const inTransit=allItems.filter(i=>ALUT_IN_TRANSIT_STATUSES.includes(i.status));
    const done=allItems.filter(i=>i.status==="delivered");
    return[
      {label:"סה״כ הזמנות",count:orders.length,sum:sumOrders(orders),color:"#0d9488",bg:"#f0fdfa",isOrders:true},
      {label:"בהדפסה",count:inPrint.length,sum:sumItems(inPrint),color:"#f97316",bg:"#fff7ed",isOrders:false},
      {label:"בכריכה",count:inBinding.length,sum:sumItems(inBinding),color:"#a855f7",bg:"#faf5ff",isOrders:false},
      {label:"מוכן למשלוח/איסוף",count:readyToGo.length,sum:sumItems(readyToGo),color:"#7c3aed",bg:"#f5f3ff",isOrders:false},
      {label:"במשלוח",count:inTransit.length,sum:sumItems(inTransit),color:"#6366f1",bg:"#eef2ff",isOrders:false},
      {label:"הושלמו",count:done.length,sum:sumItems(done),color:"#10b981",bg:"#ecfdf5",isOrders:false},
    ];
  },[orders,allItems]);
  const handleDelete=async(o)=>{
    if(!confirm(`למחוק הזמנה #${o.order_number} — ${o.company_name}?`))return;
    try{await sb(`alut_orders?id=eq.${o.id}`,{method:"DELETE"});loadData();}
    catch(e){window.alert("שגיאה במחיקה");}
  };
  const projectName=project?.name||"אלוט 2026";
  const thStyle={padding:"12px 10px",textAlign:"right",borderBottom:"2px solid #e5e7eb",fontSize:12,fontWeight:700,color:"var(--text3)",whiteSpace:"nowrap"};
  const tdStyle={padding:"12px 10px",borderBottom:"1px solid var(--border)",fontSize:13};
  const openDetail=(o)=>setDetailOrder(o);
  const activeFilterLabel=[
    filterStatus!=="all"?`סטטוס: ${(ALUT_STATUS_CONFIG[filterStatus]||{}).label||filterStatus}`:null,
    filterType!=="all"?`סוג: ${(ALUT_CALENDAR_TYPES[filterType]||{}).label||filterType}`:null,
    selectedRegion==="pickup"?"אזור: איסוף עצמי":selectedRegion==="unknown"?"אזור: לא ידוע":selectedRegion?`אזור: ${selectedRegion}`:null,
    urgentOnly?"דחוף בלבד":null,
    sortByDeadline?"מיון לפי תאריך אספקה":null,
    search.trim()?`חיפוש: ${search.trim()}`:null,
  ].filter(Boolean).join(" · ");
  const handlePrintDashboard=()=>alutHandleDashboardPrint();
  return<div style={{direction:"rtl"}} className="alut-dashboard-root">
    <div className="alut-print-header">
      <h1>🖨️ נטלי פרינט - דוח אלוט 2026</h1>
      <div className="print-meta">
        תאריך הדפסה: {new Date().toLocaleDateString("he-IL")} • שעה: {new Date().toLocaleTimeString("he-IL",{hour:"2-digit",minute:"2-digit"})}
        {activeFilterLabel?` • סינון: ${activeFilterLabel}`:""}
        {" • "}סה״כ שורות: {filtered.length}
      </div>
    </div>
    <div className="alut-actions-bar" style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <h1 style={{fontSize:22,fontWeight:800,margin:0,color:"var(--text)"}}>🗓️ {projectName}</h1>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        <button type="button" className="alut-btn-print" onClick={handlePrintDashboard}>🖨️ הדפס</button>
        <button type="button" onClick={()=>setShowPricing(true)} style={{padding:"10px 16px",borderRadius:10,border:"1px solid #99f6e4",background:"#fff",color:"#0d9488",fontWeight:600,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>⚙️ הגדרות מחירים</button>
        <button type="button" onClick={()=>setShowSeasonalQuote(true)} style={{padding:"10px 16px",borderRadius:10,border:"1px solid #99f6e4",background:"#fff",color:"#0d9488",fontWeight:600,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>💰 הצעה עונתית</button>
        <button type="button" onClick={()=>{setNewOrderOpen(false);setNewOrderInitial(null);setPasteEmailOpen(true);}} style={{padding:"10px 16px",borderRadius:10,border:"1px solid #99f6e4",background:"#fff",color:"#0d9488",fontWeight:600,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>📧 הדבק מייל של קארין</button>
        <button type="button" onClick={()=>{setNewOrderInitial(null);setNewOrderOpen(true);}} style={{padding:"10px 16px",borderRadius:10,border:"none",background:"#0d9488",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>➕ הזמנה חדשה</button>
      </div>
    </div>
    {!loading&&<AlutSeasonSummary items={allItems} projectName={projectName}/>}
    <div className="kg4 alut-kpi-grid" style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:12,marginBottom:20}}>
      {kpis.map((k,i)=><Card key={i} style={{padding:16,background:k.bg,border:`1px solid ${k.color}30`,borderRight:`4px solid ${k.color}`}}>
        <div style={{fontSize:12,color:"var(--text3)",fontWeight:600,marginBottom:4}}>{k.label}</div>
        <div style={{fontSize:28,fontWeight:800,color:k.color,lineHeight:1.1}}>{k.count}</div>
        <div style={{fontSize:12,color:"var(--text2)",marginTop:6}}>{alutFmtMoney(k.sum)} ללא מע״מ{k.isOrders?"":" · פריטים"}</div>
      </Card>)}
    </div>
    <div className="alut-filters" style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      <input type="search" placeholder="🔍 חיפוש..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:160,padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13}}/>
      <select value={filterType} onChange={e=>setFilterType(e.target.value)} style={{padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13}}>
        <option value="all">סוג לוח: הכל</option>
        <option value="hard">🔷 קשיח</option>
        <option value="duplex">📗 דופלקס</option>
        <option value="wall">🖼️ קיר</option>
      </select>
      <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{padding:"10px 16px",borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13}}>
        <option value="all">סטטוס: הכל</option>
        {ALUT_STATUS_ORDER.map(s=><option key={s} value={s}>{ALUT_STATUS_CONFIG[s].label}</option>)}
      </select>
      <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer",padding:"8px 12px",borderRadius:10,border:urgentOnly?"2px solid #dc2626":"1px solid var(--border)",background:urgentOnly?"#fef2f2":"#fff"}}>
        <input type="checkbox" checked={urgentOnly} onChange={e=>setUrgentOnly(e.target.checked)}/> 🔴 דחוף
      </label>
      <button type="button" onClick={()=>setSortByDeadline(v=>!v)} style={{padding:"8px 12px",borderRadius:10,border:sortByDeadline?"2px solid #0d9488":"1px solid var(--border)",background:sortByDeadline?"#f0fdfa":"#fff",color:sortByDeadline?"#0d9488":"var(--text)",fontWeight:600,fontSize:13,cursor:"pointer",fontFamily:"inherit",minHeight:44}}>
        📅 הצג הזמנות לפי תאריך אספקה{sortByDeadline?" ✓":""}
      </button>
    </div>
    <div className="alut-region-filters">
      <div className="alut-region-label">🗺️ אזור:</div>
      <button type="button" className={"alut-region-tab"+(selectedRegion===null?" active":"")} onClick={()=>setSelectedRegion(null)}>הכל ({orders.length})</button>
      {ALUT_REGIONS.map(region=>(
        <button type="button" key={region} className={"alut-region-tab"+(selectedRegion===region?" active":"")} onClick={()=>setSelectedRegion(region)}>🗺️ {region} ({regionCounts[region]||0})</button>
      ))}
      <button type="button" className={"alut-region-tab alut-region-pickup"+(selectedRegion==="pickup"?" active":"")} onClick={()=>setSelectedRegion("pickup")}>🎒 איסוף עצמי ({regionCounts.pickup||0})</button>
      <button type="button" className={"alut-region-tab alut-region-unknown"+(selectedRegion==="unknown"?" active":"")} onClick={()=>setSelectedRegion("unknown")}>❓ לא ידוע ({regionCounts.unknown||0})</button>
    </div>
    {loading?<div style={{padding:40,textAlign:"center"}}><Spinner sz={28} color="#0d9488"/> טוען...</div>:
    filtered.length===0?<div style={{textAlign:"center",padding:48,color:"var(--text3)"}}>אין הזמנות להצגה</div>:
    <>
      <div className="alut-table-wrap" style={{background:"#fff",border:"1px solid var(--border)",borderRadius:12,overflow:"auto",boxShadow:"var(--shadow)"}}>
        <table className="alut-table" style={{width:"100%",borderCollapse:"collapse",minWidth:960}}>
          <thead><tr style={{background:"#f8fafa"}}>
            <th style={thStyle}>#</th><th style={thStyle}>חברה</th><th style={thStyle}>פריטים</th><th style={thStyle}>סה״כ יחידות</th><th style={thStyle}>סטטוסים</th><th style={thStyle}>דדליין קרוב</th><th className="alut-col-price" style={thStyle}>₪</th><th className="alut-col-actions" style={thStyle}>פעולות</th>
          </tr></thead>
          <tbody>
            {filtered.map(o=>{
              const items=o.items||[];
              const stSum=alutFormatStatusSummary(items);
              const dl=alutGetOrderDeadlineInfo(items);
              const isUrgent=alutOrderIsUrgent(o);
              return<tr key={o.id} onClick={()=>openDetail(o)} className={isUrgent?"alut-item-urgent item-urgent":""} style={{background:isUrgent?"#fef3c7":"#fff",cursor:"pointer"}}>
                <td style={{...tdStyle,fontWeight:700}}>#{o.order_number}</td>
                <td style={tdStyle}>
                  <div>{o.company_name}</div>
                  {alutRenderRegionBadge(o,loadData)}
                </td>
                <td style={tdStyle}>{alutFormatItemsSummary(items)}</td>
                <td style={tdStyle}>{alutTotalQuantity(items)}</td>
                <td style={tdStyle}>{alutRenderStatusCell(stSum)}</td>
                <td style={tdStyle}>{alutRenderDeadlineCell(dl)}</td>
                <td className="alut-col-price" style={{...tdStyle,fontWeight:700}}>{alutFmtMoney(o.total_price,true)}</td>
                <td className="alut-col-actions" style={tdStyle}><AlutOrderRowActions order={o} onDelete={handleDelete}/></td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
      <div className="alut-cards-wrap">
        {filtered.map(o=>{
          const items=o.items||[];
          const stSum=alutFormatStatusSummary(items);
          const dl=alutGetOrderDeadlineInfo(items);
          const isUrgent=alutOrderIsUrgent(o);
          return<Card key={o.id} role="button" tabIndex={0} onClick={()=>openDetail(o)} onKeyDown={e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openDetail(o);}}} style={{padding:16,cursor:"pointer",background:isUrgent?"#fef3c7":"#fff",border:isUrgent?"1px solid #fbbf24":undefined,WebkitTapHighlightColor:"rgba(13,148,136,0.15)"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
              <div>
                <div style={{fontWeight:800,fontSize:16}}>#{o.order_number} — {o.company_name}</div>
                <div style={{marginTop:4}}>{alutRenderRegionBadge(o,loadData)}</div>
                <div style={{fontSize:13,color:"var(--text3)",marginTop:4}}>{alutFormatItemsSummary(items)} · {alutTotalQuantity(items)} יח׳</div>
              </div>
              <AlutOrderRowActions order={o} onDelete={handleDelete}/>
            </div>
            <div style={{marginBottom:8}}>{alutRenderStatusCell(stSum)}</div>
            <div style={{marginBottom:8}}>{alutRenderDeadlineCell(dl)}</div>
            <div style={{fontSize:16,fontWeight:800,color:"#0d9488"}}>{alutFmtMoney(o.total_price,true)} כולל מע״מ</div>
          </Card>;
        })}
      </div>
    </>}
    <div className="alut-print-footer">נטלי פרינט © {new Date().getFullYear()} • דוח פנימי</div>
    {showPricing&&<AlutPricingModal pricingRows={pricingRows} onClose={()=>setShowPricing(false)} onSaved={loadData}/>}
    {showSeasonalQuote&&project&&<AlutSeasonalQuoteScreen project={project} pricingRows={pricingRows} onClose={()=>setShowSeasonalQuote(false)}/>}
    {pasteEmailOpen&&<AlutPasteEmailModal onClose={()=>setPasteEmailOpen(false)} onParsed={data=>{setPasteEmailOpen(false);setNewOrderInitial(data);setNewOrderKey(k=>k+1);setNewOrderOpen(true);}} onManualFill={text=>{setPasteEmailOpen(false);setNewOrderInitial({original_email:text});setNewOrderKey(k=>k+1);setNewOrderOpen(true);}}/>}
    {newOrderOpen&&project&&<AlutNewOrderModal key={newOrderKey} projectId={project.id} pricingRows={pricingRows} initialData={newOrderInitial} onClose={()=>{setNewOrderOpen(false);setNewOrderInitial(null);}} onSaved={loadData}/>}
    {detailOrder&&<AlutOrderDetailModal order={detailOrder} pricingRows={pricingRows} onClose={()=>setDetailOrder(null)} onSaved={loadData}/>}
  </div>;
}

  useEffect(()=>{
    let cancelled=false;
    sb(`vacation_form_config?form_slug=eq.${encodeURIComponent(slug)}&is_active=eq.true&limit=1`).then(r=>{
      if(cancelled)return;
      if(!r?.length){setError("הטופס לא נמצא");setLoading(false);return;}
      setLoading(false);
    }).catch(()=>{if(!cancelled){setError("שגיאה בטעינה");setLoading(false);}});
    return()=>{cancelled=true};
  },[slug]);
  const initPad=()=>{
    if(!canvasRef.current||!window.SignaturePad)return;
    const canvas=canvasRef.current;
    const rect=canvas.parentElement?.getBoundingClientRect();
    canvas.width=rect?Math.max(300,rect.width-4):550;
    canvas.height=180;
    padRef.current=new window.SignaturePad(canvas,{backgroundColor:"rgb(255,255,255)",penColor:"rgb(0,0,0)"});
  };
  useEffect(()=>{
    if(step!=="form")return;
    ensureSignaturePadLoaded(initPad);
    return()=>{padRef.current=null;};
  },[step]);
  const lookupEmployeeEmail=async(name,last4)=>{
    try{
      const emps=await sb("employees?select=full_name,email,id_number&is_active=eq.true");
      const trimmed=(name||"").trim();
      let emp=(emps||[]).find(e=>(e.full_name||"").trim()===trimmed);
      if(!emp&&last4){
        const byId=(emps||[]).filter(e=>e.id_number&&String(e.id_number).endsWith(last4));
        if(byId.length===1)emp=byId[0];
      }
      if(!emp&&trimmed){
        const byName=(emps||[]).filter(e=>{const f=(e.full_name||"").trim();return f&&(f.includes(trimmed)||trimmed.includes(f));});
        if(byName.length===1)emp=byName[0];
      }
      if(emp?.email)setEmployeeEmail(emp.email);
    }catch(e){console.warn("employee email lookup failed",e);}
  };
  const handleIdentify=async()=>{
    if(!employeeName.trim()){alert("יש למלא שם מלא");return;}
    if(!/^\d{4}$/.test(idLast4)){alert("יש להזין 4 ספרות אחרונות של ת.ז");return;}
    try{
      const r=await sb(`vacation_requests?employee_name=eq.${encodeURIComponent(employeeName.trim())}&employee_id_last4=eq.${idLast4}&order=submitted_at.desc&limit=10`);
      setHistory(r||[]);
    }catch{setHistory([]);}
    await lookupEmployeeEmail(employeeName.trim(),idLast4);
    setStep("form");
  };
  const handleSubmit=async()=>{
    if(!startDate||!endDate){alert("יש למלא תאריכי התחלה וסיום");return;}
    if(new Date(startDate)>new Date(endDate)){alert("תאריך התחלה חייב להיות לפני תאריך סיום");return;}
    if(reasonType==="other"&&!reasonNotes.trim()){alert('יש למלא פירוט לסיבה "אחר"');return;}
    if(!padRef.current||padRef.current.isEmpty()){alert("יש לחתום בטופס");return;}
    setSubmitting(true);
    try{
      const signature=padRef.current.toDataURL("image/png");
      const days=calcVacationDays(startDate,endDate);
      const emailVal=employeeEmail.trim()||null;
      await sb("vacation_requests",{method:"POST",body:JSON.stringify({
        employee_name:employeeName.trim(),employee_id_last4:idLast4,
        employee_email:emailVal,
        start_date:startDate,end_date:endDate,total_days:days,
        reason_type:reasonType,reason_notes:reasonNotes.trim()||null,
        signature_data:signature,status:"pending",
        user_agent:typeof navigator!=="undefined"?navigator.userAgent:null
      })});
      try{
        await sendEmail({
          to:ADMIN_NOTIFY_EMAIL,
          subject:`📅 בקשת חופש חדשה - ${employeeName.trim()} (${VACATION_REASON_EMAIL[reasonType]})`,
          from:"דפוס נטלי <orders@natalie-print.com>",
          html:buildVacationManagerEmail(employeeName.trim(),idLast4,startDate,endDate,days,VACATION_REASON_EMAIL[reasonType],reasonNotes.trim(),signature)
        });
      }catch(e){console.warn("vacation email failed",e);}
      setStep("submitted");
    }catch(e){alert("שגיאה בשליחה: "+(e.message||String(e)));}
    finally{setSubmitting(false);}
  };
  if(loading)return<div style={{textAlign:"center",padding:50,direction:"rtl"}}>טוען...</div>;
  if(error)return<div style={{maxWidth:500,margin:"50px auto",padding:30,textAlign:"center",direction:"rtl"}}><h2 style={{color:"#991b1b"}}>{error}</h2></div>;
  const dayPreview=startDate&&endDate?calcVacationDays(startDate,endDate):0;
  return<div style={{minHeight:"100vh",background:"#f8fafc",padding:"20px 10px",direction:"rtl",fontFamily:"Segoe UI,Arial,sans-serif"}}>
    <div style={{maxWidth:600,margin:"0 auto",background:"white",borderRadius:12,overflow:"hidden",boxShadow:"0 4px 6px rgba(0,0,0,0.1)"}}>
      <div style={{padding:25,textAlign:"center"}}><div style={{fontSize:32,fontWeight:700,color:"#0d9488",letterSpacing:2}}>NATALIE</div><div style={{color:"#134e4a",marginTop:4}}>פתרונות הדפסה</div></div>
      <div style={{height:4,background:"linear-gradient(90deg,#2dd4bf,#0d9488)"}}/>
      <div style={{padding:30}}>
        <h1 style={{margin:"0 0 8px",color:"#0d9488",fontSize:24}}>📅 בקשת חופש / היעדרות</h1>
        {step==="identify"&&<>
          <p style={{color:"#64748b",marginBottom:20}}>אנא הזן את פרטיך כדי להתחיל</p>
          <SignupFormField label="שם מלא *" value={employeeName} onChange={setEmployeeName} placeholder="שם פרטי ושם משפחה"/>
          <label style={{display:"block",marginBottom:4,fontWeight:600,color:"#134e4a"}}>4 ספרות אחרונות של ת.ז *</label>
          <input value={idLast4} onChange={e=>setIdLast4(e.target.value.replace(/\D/g,"").slice(0,4))} maxLength={4} placeholder="1234" style={{width:"100%",padding:12,borderRadius:6,border:"1px solid #d1d5db",direction:"ltr",fontSize:18,textAlign:"center",letterSpacing:8,fontFamily:"monospace",marginBottom:16}}/>
          <button type="button" onClick={handleIdentify} style={{width:"100%",padding:14,background:"#0d9488",color:"white",border:"none",borderRadius:8,fontSize:16,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>המשך ➜</button>
        </>}
        {step==="form"&&<>
          <div style={{background:"#f0fdfa",padding:12,borderRadius:8,marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div><div style={{fontWeight:600,color:"#0d9488"}}>{employeeName}</div><div style={{fontSize:12,color:"#64748b",direction:"ltr"}}>ת.ז: ••••{idLast4}</div></div>

          </div>
          {history.length>0&&<details style={{marginBottom:20,background:"#fafafa",padding:12,borderRadius:8}}><summary style={{cursor:"pointer",fontWeight:600,color:"#0d9488"}}>📋 הבקשות הקודמות שלי ({history.length})</summary>
            <div style={{marginTop:10,display:"grid",gap:6}}>{history.map(h=><div key={h.id} style={{padding:10,background:"white",borderRadius:6,fontSize:13,border:"1px solid #e5e7eb"}}>
              <div style={{display:"flex",justifyContent:"space-between"}}><span>{new Date(h.start_date).toLocaleDateString("he-IL")} - {new Date(h.end_date).toLocaleDateString("he-IL")}</span><span style={{fontSize:11}}>{h.status==="approved"?"✅":h.status==="rejected"?"❌":"⏳"}</span></div>

// חלק 3 (F1): תיוק אוטומטי של בקשת חופשה מאושרת בתיק העובד.
// יוצר תמונת סיכום (PNG) עם פרטי הבקשה והחתימה ושומר בקטגוריית "חופשות".
function buildVacationArchiveImage(request){
  return new Promise((resolve,reject)=>{
    const w=800,h=1040;
    const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
    const ctx=canvas.getContext("2d");
    ctx.fillStyle="#ffffff";ctx.fillRect(0,0,w,h);
    ctx.fillStyle="#0d9488";ctx.fillRect(0,0,w,110);
    ctx.fillStyle="#ffffff";ctx.font="bold 28px Arial";ctx.textAlign="center";
    ctx.fillText("בקשת חופשה / היעדרות — נטלי פתרונות הדפסה",w/2,65);
    ctx.textAlign="right";
    const trunc=v=>{const s=String(v==null?"":v);return s.length>45?s.slice(0,45)+"…":s;};
    const lines=[
      ["שם העובד/ת",request.employee_name],
      ["ת.ז (4 אחרונות)","••••"+(request.employee_id_last4||"")],
      ["מתאריך",new Date(request.start_date).toLocaleDateString("he-IL")],
      ["עד תאריך",new Date(request.end_date).toLocaleDateString("he-IL")],
      ['סה"כ ימים',request.total_days||""],
      ["סיבה",(typeof VACATION_REASON_LABELS!=="undefined"&&VACATION_REASON_LABELS[request.reason_type])||request.reason_type||""],
      ["פירוט",request.reason_notes||"—"],
      ["הוגש בתאריך",request.submitted_at?new Date(request.submitted_at).toLocaleString("he-IL"):"—"],
      ["סטטוס","אושר"+(request.reviewed_by?' ע"י '+request.reviewed_by:"")],
    ];
    let y=170;
    for(const [label,value] of lines){
      ctx.fillStyle="#6b7280";ctx.font="20px Arial";ctx.fillText(label+":",w-50,y);
      ctx.fillStyle="#111827";ctx.font="bold 22px Arial";ctx.fillText(trunc(value),w-280,y);
      y+=52;
    }
    y+=20;
    ctx.fillStyle="#6b7280";ctx.font="20px Arial";ctx.fillText("חתימת העובד/ת:",w-50,y);
    const done=()=>{
      ctx.fillStyle="#9ca3af";ctx.font="14px Arial";ctx.textAlign="center";
      ctx.fillText("תויק אוטומטית ע\"י PrintOS · "+new Date().toLocaleString("he-IL"),w/2,h-30);
      canvas.toBlob(b=>b?resolve(b):reject(new Error("canvas toBlob failed")),"image/png");
    };
    if(request.signature_data){
      const img=new Image();
      img.onload=()=>{
        try{
          const maxW=420;
          const sw=Math.min(maxW,img.width);
          const sh=sw*(img.height/img.width);
          ctx.strokeStyle="#d1d5db";ctx.strokeRect(w-50-(maxW+20),y+20,maxW+20,sh+20);
          ctx.drawImage(img,w-50-(maxW+10),y+30,sw,sh);
        }catch(e){console.warn("signature draw failed",e);}
        done();
      };
      img.onerror=()=>done();
      img.src=request.signature_data;
    }else done();
  });
}

async function archiveVacationToEmployeeDocs(request){
  try{
    // לא לתייק פעמיים את אותה בקשה
    const existing=await sb(`documents?category=eq.vacation&metadata->>vacation_request_id=eq.${request.id}&select=id`);
    if(existing&&existing.length)return;
    const emps=await sb("employees?select=id,full_name,id_number&is_active=eq.true");
    const name=(request.employee_name||"").trim();
    // התאמה: שם מדויק -> 4 ספרות ת.ז -> הכלה חד-משמעית של השם
    let emp=(emps||[]).find(e=>(e.full_name||"").trim()===name);
    if(!emp&&request.employee_id_last4){
      const byId=(emps||[]).filter(e=>e.id_number&&e.id_number.endsWith(request.employee_id_last4));
      if(byId.length===1)emp=byId[0];
    }
    if(!emp&&name){
      const byName=(emps||[]).filter(e=>{const f=(e.full_name||"").trim();return f&&(f.includes(name)||name.includes(f));});
      if(byName.length===1)emp=byName[0];
    }
    if(!emp){console.warn("archiveVacation: לא נמצא עובד תואם לבקשה של",name);return;}
    const blob=await buildVacationArchiveImage(request);
    const path=`employees/${emp.id}/vacation/${Date.now()}_vacation_${request.start_date}_${request.end_date}.png`;
    const {error:upErr}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,blob,{contentType:"image/png",upsert:false});
    if(upErr)throw upErr;
    await sb("documents",{method:"POST",body:JSON.stringify({
      employee_id:emp.id,
      category:"vacation",
      title:`בקשת חופשה ${new Date(request.start_date).toLocaleDateString("he-IL")} - ${new Date(request.end_date).toLocaleDateString("he-IL")}`,
      file_path:path,
      file_name:`vacation_${request.start_date}_${request.end_date}.png`,
      file_size:blob.size,
      file_type:"image/png",
      document_date:request.start_date,
      tags:["חופשה",request.start_date,request.end_date],
      metadata:{source:"vacation_request",vacation_request_id:request.id,days:request.total_days,reason_type:request.reason_type},
    })});
    console.log("✅ בקשת החופשה תויקה בתיק העובד");
  }catch(e){console.warn("archiveVacation failed (non-blocking):",e);}
}

async function sendVacationDecisionEmail(vacationRequest,decision){
  if(!vacationRequest?.employee_email){
    console.log("No email for employee - skipping notification");
    return;
  }
  const isApproved=decision==="approved";
  const startDate=new Date(vacationRequest.start_date).toLocaleDateString("he-IL");
  const endDate=new Date(vacationRequest.end_date).toLocaleDateString("he-IL");
  const subject=isApproved
    ?`✅ בקשת החופשה שלך אושרה - ${startDate} עד ${endDate}`
    :`❌ בקשת החופשה שלך נדחתה - ${startDate} עד ${endDate}`;
  try{
    await sendEmail({

const GS_GROUPS_META=[
  {key:"clients",icon:"👥",title:"לקוחות",type:"client"},
  {key:"tasks",icon:"✅",title:"משימות",type:"task"},
  {key:"orders",icon:"📦",title:"הזמנות בינה",type:"order"},
  {key:"quotes",icon:"💰",title:"הצעות מחיר",type:"quote"},
  {key:"deliveryNotes",icon:"🚚",title:"תעודות משלוח",type:"deliveryNote"},
  {key:"alutOrders",icon:"🗓️",title:"אלוט",type:"alut"},
];
function gsMatch(value,q){
  if(value===null||value===undefined)return false;
  return String(value).toLowerCase().includes(q);
}
function gsSearch(query,data){
  if(!query||query.trim().length<2)return{total:0,groups:[]};
  const q=query.trim().toLowerCase();
  const clientMatches=(data.clients||[]).filter(c=>gsMatch(c.name,q)||gsMatch(c.contact_name,q)||gsMatch(c.phone,q)||gsMatch(c.email,q)||gsMatch(c.bina_customer_id,q)).slice(0,5);
  const taskMatches=(data.tasks||[]).filter(t=>gsMatch(t.title,q)||gsMatch(t.client_name,q)||gsMatch(t.assignee,q)).slice(0,5);
  const orderMatches=(data.orders||[]).filter(o=>gsMatch(o.bina_doc_id,q)||gsMatch(o.title,q)||gsMatch(o.bina_cust_name,q)).slice(0,5);
  const quoteMatches=(data.quotes||[]).filter(o=>gsMatch(o.bina_doc_id,q)||gsMatch(o.title,q)||gsMatch(o.bina_cust_name,q)).slice(0,5);
  const dnMatches=(data.deliveryNotes||[]).filter(s=>gsMatch(s.delivery_number,q)||gsMatch(s.customer_name,q)||gsMatch(s.customer_address,q)||gsMatch(s.customer_phone,q)).slice(0,5);
  const alutMatches=(data.alutOrders||[]).filter(a=>gsMatch(a.order_number,q)||gsMatch(a.company_name,q)||gsMatch(a.contact_name,q)).slice(0,5);
  const byKey={clients:clientMatches,tasks:taskMatches,orders:orderMatches,quotes:quoteMatches,deliveryNotes:dnMatches,alutOrders:alutMatches};
  const groups=GS_GROUPS_META.map(g=>({...g,items:byKey[g.key]||[]})).filter(g=>g.items.length>0);
  const total=groups.reduce((s,g)=>s+g.items.length,0);
  return{total,groups};
}
function gsResultText(item,type){
  let mainText="",subText="";
  if(type==="client"){mainText=item.name||"לקוח ללא שם";subText=[item.contact_name,item.phone,item.email].filter(Boolean).join(" • ");}
  else if(type==="task"){mainText=item.title||"משימה";subText=[item.client_name,item.dept,item.assignee].filter(Boolean).join(" • ");}
  else if(type==="order"){mainText=`${item.bina_doc_id?`#${item.bina_doc_id} · `:""}${item.title||"הזמנה"}`;subText=item.bina_cust_name||"";}
  else if(type==="quote"){mainText=`${item.bina_doc_id?`#${item.bina_doc_id} · `:""}${item.title||"הצעה"}`;subText=item.bina_cust_name||"";}
  else if(type==="deliveryNote"){mainText=`תעודה #${item.delivery_number}`;subText=[item.customer_name,item.customer_address].filter(Boolean).join(" • ");}
  else if(type==="alut"){mainText=`הזמנה #${item.order_number}`;subText=item.company_name||"";}
  return{mainText,subText};
}
function GlobalSearch({onClose,onNavigate}){
  const [query,setQuery]=useState("");
  const [loading,setLoading]=useState(true);
  const [data,setData]=useState({clients:[],tasks:[],orders:[],quotes:[],deliveryNotes:[],alutOrders:[]});
  const [selectedIndex,setSelectedIndex]=useState(0);
  const inputRef=useRef(null);
  useEffect(()=>{
    let alive=true;
    (async()=>{
      setLoading(true);
      try{
        const [c,t,o,q,dn,al]=await Promise.all([
          supabaseClient.from("clients").select("id,name,contact_name,phone,email,bina_customer_id").limit(2000),
          supabaseClient.from("tasks").select("id,title,client_name,assignee,dept,status").is("archived_at",null).limit(2000),
          supabaseClient.from("orders").select("id,bina_doc_id,title,bina_cust_name,task_id").limit(1000),
          supabaseClient.from("quotes").select("id,bina_doc_id,title,bina_cust_name").limit(1000),
          supabaseClient.from("delivery_notes").select("id,delivery_number,customer_name,customer_address,customer_phone,task_id").limit(1000),
          supabaseClient.from("alut_orders").select("id,order_number,company_name,contact_name").limit(1000),
        ]);
        if(!alive)return;
        setData({
          clients:c.data||[],tasks:t.data||[],orders:o.data||[],
          quotes:q.data||[],deliveryNotes:dn.data||[],alutOrders:al.data||[],
        });
      }catch(err){console.error("Global search load error:",err);}
      finally{if(alive)setLoading(false);}
    })();
    setTimeout(()=>inputRef.current?.focus(),50);
    return()=>{alive=false;};
  },[]);
  const {total,groups}=useMemo(()=>gsSearch(query,data),[query,data]);
  const flatResults=useMemo(()=>groups.flatMap(g=>g.items.map(item=>({item,type:g.type}))),[groups]);
  useEffect(()=>{setSelectedIndex(0);},[query]);
  useEffect(()=>{
    const h=(e)=>{
      if(e.key==="Escape"){e.preventDefault();onClose();return;}
      if(e.key==="ArrowDown"){e.preventDefault();setSelectedIndex(p=>Math.min(p+1,Math.max(flatResults.length-1,0)));}
      else if(e.key==="ArrowUp"){e.preventDefault();setSelectedIndex(p=>Math.max(p-1,0));}
      else if(e.key==="Enter"){e.preventDefault();const r=flatResults[selectedIndex];if(r){onNavigate(r.type,r.item);onClose();}}
    };
    window.addEventListener("keydown",h);
    return()=>window.removeEventListener("keydown",h);
  },[flatResults,selectedIndex,onClose,onNavigate]);
  let flatIdx=-1;
  return<div className="global-search-backdrop" onClick={onClose}>
    <div className="global-search-modal" onClick={e=>e.stopPropagation()}>
      <div className="global-search-input-wrap">
        <span style={{fontSize:18}}>🔍</span>
        <input ref={inputRef} className="global-search-input" value={query} onChange={e=>setQuery(e.target.value)} placeholder="הקלד לחיפוש לקוחות, משימות, הזמנות, תעודות, הצעות, אלוט..."/>
        <span className="global-search-esc" onClick={onClose}>ESC</span>
      </div>
      <div className="global-search-results">
        {loading&&<div className="gs-loading">🔄 טוען נתונים...</div>}
        {!loading&&query.trim().length<2&&<div className="gs-empty">
          <div style={{fontSize:32,marginBottom:8}}>🔍</div>
          <div>הקלד לפחות 2 תווים לחיפוש</div>
          <div style={{fontSize:12,marginTop:12,color:"#9ca3af"}}>מחפש בלקוחות, משימות, הזמנות, תעודות, הצעות ואלוט</div>
        </div>}
        {!loading&&query.trim().length>=2&&total===0&&<div className="gs-empty">
          <div style={{fontSize:32,marginBottom:8}}>😔</div>
          <div>לא נמצאו תוצאות עבור "{query}"</div>
        </div>}
        {!loading&&groups.map(group=><div key={group.key} className="gs-group">
          <div className="gs-group-title">{group.icon} {group.title} ({group.items.length})</div>
          {group.items.map(item=>{
            flatIdx++;
            const idx=flatIdx;
            const {mainText,subText}=gsResultText(item,group.type);
            return<div key={group.type+"-"+item.id} className={"gs-result"+(idx===selectedIndex?" selected":"")}
              onClick={()=>{onNavigate(group.type,item);onClose();}}
              onMouseEnter={()=>setSelectedIndex(idx)}>
              <div className="gs-result-main">{mainText}</div>
              {subText&&<div className="gs-result-sub">{subText}</div>}
            </div>;
          })}
        </div>)}
      </div>
      <div className="global-search-footer">💡 חצים ↑↓ לניווט · Enter לפתיחה · ESC לסגירה</div>
    </div>
  </div>;
}

    if(!t(bcf.custGroup))er.custGroup="שדה חובה";
    const tel=bcfDigits(bcf.custTel);
    if(tel.length<9||tel.length>10)er.custTel="9–10 ספרות";
    const cel=bcfDigits(bcf.custCel);
    if(cel.length<9||cel.length>10)er.custCel="9–10 ספרות";

        custCity:bcf.custCity.trim(),
        custAddress:bcf.custAddress.trim(),

        custCel:bcfDigits(bcf.custCel),

        termsofPayment:bcf.termsofPayment.trim()
      };
      const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-customer",{body});
      if(invE){
        notify(`❌ שגיאה ביצירת הלקוח: ${invE.message||"לא ידוע"}`,"#DC2626");
        setBinaClientSaving(false);return;
      }
      let resRow=data;
      if(typeof data==="string"){try{resRow=JSON.parse(data)}catch{resRow=null}}
      resRow=Array.isArray(resRow)?resRow[0]:resRow;

      const rc=resRow.ResCode;
      if(rc===0||rc==="0"){
        const code=resRow.kuponId??resRow.requestId??resRow.KuponId??resRow.custId??resRow.docId??"—";
        const addrLine=`${bcf.custCity.trim()}, ${bcf.custAddress.trim()}`;
        const phoneLine=`${bcfDigits(bcf.custTel)} · ${bcfDigits(bcf.custCel)}`;
        const notesParts=[bcf.notes?.trim(),`ת.ז./ח.פ.: ${bcfDigits(bcf.custTz)}`].filter(Boolean);
        const notesVal=notesParts.length?notesParts.join("\n"):null;
        const binaId=code!=="—"&&code!=null&&String(code).trim()!==""?String(code):null;
        await sb("clients",{method:"POST",body:JSON.stringify({
          name:savedName,
          phone:phoneLine,
          email:bcf.custEmail.trim(),
          address:addrLine,
          payment_terms:bcf.termsofPayment.trim(),
          notes:notesVal,
          bina_customer_id:binaId,
        })});
        setBinaClientOpen(false);
        setBcf(BCF_DEFAULT());
        await refreshAll();
        notify(`✅ הלקוח ${savedName} נוצר בהצלחה!\nקוד לקוח: ${code}`,"#16A34A");
      }else if(rc===-5||rc==="-5"){
        notify("❌ ת.ז./ח.פ. כבר קיים במערכת","#DC2626");
      }else{
        const det=resRow.ResMsg||resRow.ResMsgHe||JSON.stringify(resRow).slice(0,120);
        notify(`❌ שגיאה ביצירת הלקוח: ${det}`,"#DC2626");
      }

    const match = notes.match(/פירוט:\s*([^\n]*?)(?:\n|סוכן:|כתובת:|$)/);
    if (match && match[1]) return match[1].trim();
    // אחרת להחזיר את ה-notes המלאים (חתוך אם ארוך)
    return notes.length > 200 ? notes.slice(0, 200) + '...' : notes;
