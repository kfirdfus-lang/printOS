/** רענון משימה מבינה — מעדכן רק title, task_items, total_amount, last_bina_sync */
async function refreshTaskFromBina(task){
  if(!task?.bina_order_id)return{success:false,error:"אין מספר הזמנת בינה"};
  try{
    const {data,error}=await supabaseClient.functions.invoke("refresh-task-from-bina",{body:{task_id:task.id}});
    if(error)throw error;
    if(data&&data.success===false)throw new Error(data.error||"שגיאה ברענון");
    return data||{success:false,error:"תשובה ריקה"};
  }catch(e){
    console.error("refresh from bina failed:",e);
    return{success:false,error:e.message||String(e)};
  }
}

const STORAGE_BUCKET="printos-files";
async function uploadFileToStorage(file,folder="misc"){
  const timestamp=Date.now();
  const ext=file.name.includes(".")?"."+file.name.split(".").pop():"";
  const baseName=file.name.replace(ext,"").replace(/[^a-zA-Z0-9._-]/g,"_").substring(0,50);
  const safeFilename=baseName+ext;
  const path=`${folder}/${timestamp}_${safeFilename}`;
  const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false});
  if(error)throw error;
  return{path,name:file.name,size:file.size,type:file.type};
}
async function getSignedUrl(filePath,expiresIn=3600){
  try{
    const {data,error}=await supabaseClient.storage.from(STORAGE_BUCKET).createSignedUrl(filePath,expiresIn);
    if(error)throw error;
    return data?.signedUrl||null;
  }catch(e){console.error("Sign URL error:",e);return null;}
}
async function deleteFileFromStorage(filePath){
  try{
    const {error}=await supabaseClient.storage.from(STORAGE_BUCKET).remove([filePath]);
    return !error;
  }catch(e){console.error("Delete error:",e);return false;}
}
function formatFileSize(bytes){
  if(!bytes)return "";
  if(bytes<1024)return bytes+" B";
  if(bytes<1024*1024)return(bytes/1024).toFixed(1)+" KB";
  if(bytes<1024*1024*1024)return(bytes/1024/1024).toFixed(1)+" MB";
  return(bytes/1024/1024/1024).toFixed(1)+" GB";
}
function getFileIcon(fileType,fileName){
  if(!fileType&&fileName){
    const ext=fileName.split(".").pop().toLowerCase();
    if(["pdf"].includes(ext))return "📄";
    if(["doc","docx"].includes(ext))return "📝";
    if(["xls","xlsx","csv"].includes(ext))return "📊";
    if(["ppt","pptx"].includes(ext))return "📊";
    if(["jpg","jpeg","png","gif","webp","svg"].includes(ext))return "🖼️";
    if(["zip","rar","7z"].includes(ext))return "🗜️";
    if(["mp4","avi","mov"].includes(ext))return "🎥";
    if(["mp3","wav"].includes(ext))return "🎵";
    return "📎";
  }
  if(fileType?.startsWith("image/"))return "🖼️";
  if(fileType==="application/pdf")return "📄";
  if(fileType?.includes("word"))return "📝";
  if(fileType?.includes("excel")||fileType?.includes("spreadsheet"))return "📊";
  if(fileType?.includes("zip"))return "🗜️";
  if(fileType?.startsWith("video/"))return "🎥";
  if(fileType?.startsWith("audio/"))return "🎵";
  return "📎";
}

function calculateAge(birthDate){
  if(!birthDate)return null;
  const today=new Date();
  const birth=new Date(birthDate);
  let age=today.getFullYear()-birth.getFullYear();
  const monthDiff=today.getMonth()-birth.getMonth();
  if(monthDiff<0||(monthDiff===0&&today.getDate()<birth.getDate()))age--;
  return age;
}
function daysUntilBirthday(birthDate){
  if(!birthDate)return null;
  const today=new Date();today.setHours(0,0,0,0);
  const birth=new Date(birthDate);
  const nextBirthday=new Date(today.getFullYear(),birth.getMonth(),birth.getDate());
  if(nextBirthday<today)nextBirthday.setFullYear(today.getFullYear()+1);
  return Math.floor((nextBirthday-today)/(1000*60*60*24));
}

const TASK_DONE_STATUSES=["הושלם","הושלמה"];
const RECENTLY_COMPLETED_MS=3*24*60*60*1000;
const threeDaysAgoIso=()=>new Date(Date.now()-RECENTLY_COMPLETED_MS).toISOString();
const isTaskActive=t=>!t.archived_at&&!TASK_DONE_STATUSES.includes(t.status);
const isTaskRecentlyCompleted=t=>{
  if(t.archived_at||!TASK_DONE_STATUSES.includes(t.status)||!t.completed_at)return false;
  return new Date(t.completed_at).getTime()>=Date.now()-RECENTLY_COMPLETED_MS;
};

const taskSchedDateKey=t=>t.scheduled_for_date?String(t.scheduled_for_date).split("T")[0]:null;
const taskPriorityBorderColor=p=>p==="דחוף"?"#ef4444":p==="גבוהה"?"#f59e0b":"#6b7280";
const parseYmdDate=s=>{const [y,m,d]=String(s).split("T")[0].split("-").map(Number);return new Date(y,m-1,d);};
function groupTasksByScheduledDate(tasks){
  const groups={past:[],byDate:{},unscheduled:[]};
  const today=new Date();today.setHours(0,0,0,0);
  const todayStr=toLocalDateStr(today);
  (tasks||[]).forEach(task=>{
    const key=taskSchedDateKey(task);
    if(!key){groups.unscheduled.push(task);return;}
    if(key<todayStr)groups.past.push(task);
    else{(groups.byDate[key]=groups.byDate[key]||[]).push(task);}
  });
  const result=[];
  if(groups.past.length)result.push({key:"past",label:"⚠️ משימות מהעבר",tasks:groups.past,isHighlight:false,isPast:true});
  Object.keys(groups.byDate).sort().forEach(dateStr=>{
    const d=parseYmdDate(dateStr);
    const isToday=dateStr===todayStr;
    const diffDays=Math.floor((d-today)/(86400000));
    let prefix="";
    if(diffDays===0)prefix="היום · ";
    else if(diffDays===1)prefix="מחר · ";
    const dayName=d.toLocaleDateString("he-IL",{weekday:"long"});
    const dateLabel=d.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"});
    result.push({key:dateStr,label:`📅 ${prefix}${dayName}, ${dateLabel}`,tasks:groups.byDate[dateStr],isHighlight:isToday,isPast:false});
  });
  if(groups.unscheduled.length)result.push({key:"unscheduled",label:"📋 לא מתוזמן",tasks:groups.unscheduled,isHighlight:false,isPast:false});
  return result;
}

  <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,padding:28,width:"100%",maxWidth:maxWidth,maxHeight:"90vh",overflowY:"auto",boxShadow:"var(--shadow-lg)"}}>
      {title&&<div style={{fontWeight:800,fontSize:17,color:"var(--text)",marginBottom:20,paddingBottom:16,borderBottom:"1px solid var(--border)",display:"flex",justifyContent:"space-between",alignItems:"center",gap:12}}>
        <span style={{flex:1}}>{title}</span>
        <button type="button" onClick={onClose} aria-label="סגור" style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,width:36,height:36,cursor:"pointer",color:"var(--text2)",fontSize:18,lineHeight:1,fontFamily:"inherit",flexShrink:0}}>×</button>
      </div>}
      {children}
    </div>
  </div>;

function buildClientNotificationEmail({task,itemsList,clientData,notificationType}){
  const items=itemsList;
  const type=notificationType;
  const orderNum=task.bina_order_id||String(task.id||"").substring(0,8)||"---";
  const contactName=task.delivery_contact_snapshot||clientData?.delivery_contact_name||clientData?.contact_name||task.contact||task.client_name||"לקוח יקר";
  const agent=task.sales_agent||"";
  const address=task.delivery_address_snapshot||"";
  const fullTitle=(task.title||"").trim();
  const shortTitle=fullTitle.length>50?fullTitle.substring(0,47)+"...":fullTitle;
  const e=(s)=>String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  const logoSvg=`<svg width="120" height="60" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;"><text x="100" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="36" font-weight="bold" fill="#0d9488" letter-spacing="2">NATALIE</text><text x="100" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#134e4a">פתרונות הדפסה</text></svg>`;
  const itemsHtml=(items&&items.length>0)?items.map(i=>`<li style="padding:6px 0;border-bottom:1px solid #e2e8f0;"><span style="color:#134e4a;">${e(i.description||"—")}</span><span style="float:left;color:#0d9488;font-weight:600;direction:ltr;">×${e(i.quantity??0)}</span></li>`).join(""):`<li style="padding:6px 0;color:#134e4a;">${e(task.title||"פריט")}</li>`;
  let title,emoji,mainMessage,locationBlock="";
  if(type==="ready"){
    title="ההזמנה שלך מוכנה לאיסוף";emoji="📦";
    mainMessage="אנחנו שמחים לעדכן שההזמנה שלך מוכנה לאיסוף עצמי בדפוס נטלי.";
    locationBlock=`<div style="background:#f0fdfa;border-radius:8px;padding:16px;margin:20px 0;border-right:4px solid #2dd4bf;"><div style="color:#0d9488;font-weight:600;margin-bottom:8px;font-size:15px;">🏢 פרטי איסוף</div><div style="color:#134e4a;line-height:1.8;">שד׳ הר ציון 104, תל אביב<br/>☎️ <span style="direction:ltr;display:inline-block;">03-6815703</span><br/>🕒 ימים א׳-ה׳, 09:00-17:00</div></div>`;
  }else if(type==="shipped"){
    title="ההזמנה שלך בדרך אליך";emoji="🚚";
    mainMessage="שמחים לעדכן שההזמנה שלך יצאה לדרך והיא בדרך אליך.";
    locationBlock=address?`<div style="background:#f0fdfa;border-radius:8px;padding:16px;margin:20px 0;border-right:4px solid #2dd4bf;"><div style="color:#0d9488;font-weight:600;margin-bottom:8px;font-size:15px;">📍 כתובת משלוח</div><div style="color:#134e4a;line-height:1.6;">${e(address)}</div></div>`:"";
  }else{
    title="ההזמנה שלך סופקה בהצלחה";emoji="✅";
    mainMessage="ההזמנה שלך נמסרה בהצלחה. אנו מקווים שאתה מרוצה מהשירות שלנו!";
    locationBlock=address?`<div style="background:#f0fdfa;border-radius:8px;padding:16px;margin:20px 0;border-right:4px solid #2dd4bf;"><div style="color:#0d9488;font-weight:600;margin-bottom:8px;font-size:15px;">📍 נמסר ל</div><div style="color:#134e4a;line-height:1.6;">${e(address)}</div></div>`:"";
  }
  const subject=shortTitle?`${emoji} הזמנה #${orderNum} - ${shortTitle} - ${title}`:`${emoji} הזמנה #${orderNum} - ${title} - דפוס נטלי`;
  const htmlOut=`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${e(title)}</title></head><body style="margin:0;padding:0;background:#f8fafc;font-family:'Segoe UI',Arial,sans-serif;direction:rtl;"><div style="max-width:600px;margin:0 auto;background:#ffffff;"><div style="background:#ffffff;padding:30px 20px;text-align:center;">${logoSvg}</div><div style="height:4px;background:linear-gradient(90deg,#2dd4bf 0%,#0d9488 100%);"></div><div style="padding:30px 28px;"><h1 style="margin:0 0 8px 0;color:#0d9488;font-size:24px;font-weight:700;text-align:right;">${emoji} ${e(title)}</h1>${shortTitle?`<div style="margin:0 0 20px 0;color:#64748b;font-size:15px;text-align:right;font-weight:500;">${e(shortTitle)}</div>`:'<div style="margin-bottom:20px;"></div>'}<p style="margin:0 0 16px 0;color:#134e4a;font-size:16px;line-height:1.6;text-align:right;">שלום ${e(contactName)},</p><p style="margin:0 0 24px 0;color:#475569;font-size:15px;line-height:1.7;text-align:right;">${e(mainMessage)}</p><div style="background:#f8fafc;border-radius:8px;padding:20px;margin:0 0 20px 0;"><div style="color:#64748b;font-size:13px;margin-bottom:6px;text-align:right;">מספר הזמנה</div><div style="color:#0d9488;font-size:22px;font-weight:700;direction:ltr;text-align:right;">#${e(orderNum)}</div><div style="margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0;"><div style="color:#64748b;font-size:13px;margin-bottom:10px;text-align:right;">📦 פריטים</div><ul style="list-style:none;padding:0;margin:0;text-align:right;">${itemsHtml}</ul></div></div>${locationBlock}<div style="margin-top:30px;padding-top:20px;border-top:2px solid #f0fdfa;"><p style="margin:0 0 4px 0;color:#475569;font-size:14px;text-align:right;">בברכה,</p>${agent?`<p style="margin:0 0 4px 0;color:#134e4a;font-size:16px;font-weight:600;text-align:right;">${e(agent)}</p>`:""}<p style="margin:0;color:#0d9488;font-size:14px;font-weight:600;text-align:right;">דפוס נטלי</p></div></div><div style="height:3px;background:linear-gradient(90deg,#0d9488 0%,#2dd4bf 100%);"></div><div style="background:#f8fafc;padding:18px 20px;text-align:center;"><p style="margin:0 0 4px 0;color:#64748b;font-size:13px;"><a href="https://natalie-print.com" style="color:#0d9488;text-decoration:none;font-weight:600;">natalie-print.com</a> &nbsp;•&nbsp; <span style="direction:ltr;display:inline-block;">03-6815703</span></p><p style="margin:6px 0 0 0;color:#94a3b8;font-size:11px;">שד׳ הר ציון 104, תל אביב</p></div></div></body></html>`;
  const itemsText=(items&&items.length>0)?items.map(i=>`• ${i.description||"—"} (כמות: ${i.quantity??0})`).join("\n"):`• ${task.title||"פריט"}`;
  const text=`שלום ${contactName},\n\n${mainMessage}\n\nמספר הזמנה: #${orderNum}\n\nפריטים:\n${itemsText}\n\n${address?`כתובת: ${address}\n`:""}\nבברכה,\n${agent?agent+"\n":""}דפוס נטלי\n03-6815703\nnatalie-print.com`;
  return{subject,html:htmlOut,text};
}

async function loadClientForNotification(task,clients){
  let c=clients?resolveClientForTask(task,clients):null;
  if(!c&&task.client_id){try{const r=await sb(`clients?id=eq.${task.client_id}&limit=1`);if(r?.[0])c=r[0];}catch(e){}}
  if(!c&&task.bina_cust_id){try{const r=await sb(`clients?bina_customer_id=eq.${task.bina_cust_id}&limit=1`);if(r?.[0])c=r[0];}catch(e){}}
  if(!c&&task.client_name){try{const r=await sb(`clients?name=eq.${encodeURIComponent(task.client_name)}&limit=1`);if(r?.[0])c=r[0];}catch(e){}}
  return c;
}
async function loadClientNotificationEmailPool(clientId){
  if(!clientId)return [];
  const data=await sb(`client_notification_emails?client_id=eq.${clientId}&order=is_default.desc,usage_count.desc`);
  return Array.isArray(data)?data:[];
}
async function loadClientBillingEmailPool(clientId){
  if(!clientId)return [];
  const data=await sb(`client_billing_emails?client_id=eq.${clientId}&order=is_default.desc,usage_count.desc,last_used_at.desc`);
  return Array.isArray(data)?data:[];
}
function ClientNotificationEmailsList({clientId,user,onUpdate}){
  const [emails,setEmails]=useState([]);
  const [showAdd,setShowAdd]=useState(false);
  const [newEmail,setNewEmail]=useState("");
  const [newLabel,setNewLabel]=useState("");
  const [loading,setLoading]=useState(true);
  const load=async()=>{setLoading(true);try{setEmails(await loadClientNotificationEmailPool(clientId));}catch(e){setEmails([]);}setLoading(false);};
  useEffect(()=>{load();},[clientId]);
  const handleAdd=async()=>{
    if(!newEmail.trim()||!newEmail.includes("@")){window.alert("יש להזין כתובת מייל תקינה");return;}
    try{
      await sb("client_notification_emails",{method:"POST",body:JSON.stringify({client_id:clientId,email:newEmail.trim(),label:newLabel.trim()||null,is_default:emails.length===0,created_by:user?.name||"unknown"})});
      setNewEmail("");setNewLabel("");setShowAdd(false);load();onUpdate?.();
    }catch(e){window.alert("שגיאה בהוספת מייל: "+(e.message||String(e)));}
  };
  const setDefault=async emailId=>{
    try{
      await sb(`client_notification_emails?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      await sb(`client_notification_emails?id=eq.${emailId}`,{method:"PATCH",body:JSON.stringify({is_default:true})});
      load();onUpdate?.();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const deleteEmail=async emailId=>{
    if(!window.confirm("למחוק את המייל מהמאגר?"))return;
    try{await sb(`client_notification_emails?id=eq.${emailId}`,{method:"DELETE"});load();onUpdate?.();}catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const inp={width:"100%",padding:8,borderRadius:6,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13};
  if(loading)return<div style={{padding:12,color:"var(--text3)",fontSize:13}}><Spinner sz={16}/> טוען מיילים…</div>;
  if(emails.length===0&&!showAdd)return<div>
    <div style={{padding:12,background:"#fef3c7",borderRadius:6,fontSize:13,color:"#78350f",marginBottom:10}}>⚠️ אין מיילי התראה. הוסף כתובת מייל ראשונה.</div>
    <button type="button" onClick={()=>setShowAdd(true)} style={{width:"100%",padding:10,background:"#ec4899",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>➕ הוסף מייל ראשון</button>
  </div>;
  return<div>
    {emails.map(em=><div key={em.id} style={{padding:10,background:"#fff",border:"1px solid #e5e7eb",borderRadius:6,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:em.is_default?600:400,direction:"ltr",textAlign:"right",fontSize:13}}>{em.is_default?"⭐ ":""}{em.email}</div>
        {em.label&&<div style={{fontSize:12,color:"#6b7280",marginTop:2}}>🏷️ {em.label}</div>}
        <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>נשלח {em.usage_count||0} פעמים{em.last_used_at?` · אחרון: ${new Date(em.last_used_at).toLocaleDateString("he-IL")}`:""}</div>
      </div>
      <div style={{display:"flex",gap:4,flexShrink:0}}>
        {!em.is_default&&<button type="button" onClick={()=>setDefault(em.id)} title="קבע כברירת מחדל" style={{fontSize:11,padding:"2px 8px",cursor:"pointer",fontFamily:"inherit",border:"1px solid var(--border)",borderRadius:4,background:"#fff"}}>⭐</button>}
        <button type="button" onClick={()=>deleteEmail(em.id)} style={{fontSize:11,padding:"2px 8px",cursor:"pointer",color:"#ef4444",fontFamily:"inherit",border:"1px solid #fecaca",borderRadius:4,background:"#fef2f2"}}>🗑️</button>
      </div>
    </div>)}
    {!showAdd?<button type="button" onClick={()=>setShowAdd(true)} style={{width:"100%",padding:8,background:"transparent",border:"2px dashed #d1d5db",borderRadius:6,cursor:"pointer",color:"#6b7280",fontSize:13,marginTop:6,fontFamily:"inherit"}}>➕ הוסף מייל</button>:
    <div style={{padding:12,background:"#f9fafb",borderRadius:6,marginTop:6}}>
      <input type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="email@example.com" style={{...inp,direction:"ltr",marginBottom:6}} autoFocus/>
      <input type="text" value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="תווית (אופציונלי)" style={{...inp,marginBottom:6}}/>
      <div style={{display:"flex",gap:6}}>
        <button type="button" onClick={()=>{setShowAdd(false);setNewEmail("");setNewLabel("");}} style={{flex:1,padding:6,fontSize:13,cursor:"pointer",fontFamily:"inherit",border:"1px solid var(--border)",borderRadius:4,background:"#fff"}}>ביטול</button>
        <button type="button" onClick={handleAdd} style={{flex:2,padding:6,background:"#0e7490",color:"#fff",border:"none",borderRadius:4,fontSize:13,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>הוסף</button>
      </div>
    </div>}
  </div>;
}
function ClientNotificationModal({task,notificationType,clients,user,onClose,onSent}){
  const [step,setStep]=useState("loading");
  const [client,setClient]=useState(null);
  const [savedEmails,setSavedEmails]=useState([]);
  const [showAddEmail,setShowAddEmail]=useState(false);
  const [newEmail,setNewEmail]=useState("");
  const [newLabel,setNewLabel]=useState("");
  const [selectedEmail,setSelectedEmail]=useState("");
  const [items,setItems]=useState([]);
  const [subject,setSubject]=useState("");
  const [emailHtml,setEmailHtml]=useState("");
  const [emailText,setEmailText]=useState("");
  const [ccEmails,setCcEmails]=useState([]);
  const [error,setError]=useState(null);
  const fld={width:"100%",padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13};
  const typeLabels={ready:"📦 הזמנה מוכנה לאיסוף",shipped:"🚛 הזמנה בדרך",delivered:"✅ הזמנה סופקה"};
  const applyPreview=(email,taskItems,clientData)=>{
    const {subject:subj,html:htmlOut,text:textOut}=buildClientNotificationEmail({task,itemsList:taskItems,clientData,notificationType});
    setSubject(subj);setEmailHtml(htmlOut);setEmailText(textOut);setSelectedEmail(email);setStep("preview");
  };
  const refreshPool=async clientId=>{const list=await loadClientNotificationEmailPool(clientId);setSavedEmails(list);return list;};
  const handleAddEmail=async()=>{
    if(!newEmail.trim()||!newEmail.includes("@")){window.alert("יש להזין כתובת מייל תקינה");return;}
    if(!client?.id){window.alert("לא ניתן להוסיף מייל - אין לקוח מקושר");return;}
    try{
      const isFirst=savedEmails.length===0;
      await sb("client_notification_emails",{method:"POST",body:JSON.stringify({client_id:client.id,email:newEmail.trim(),label:newLabel.trim()||null,is_default:isFirst,created_by:user?.name||"unknown"})});
      const email=newEmail.trim();
      setNewEmail("");setNewLabel("");setShowAddEmail(false);
      await refreshPool(client.id);
      applyPreview(email,items,client);
    }catch(e){window.alert("שגיאה בהוספת מייל: "+(e.message||String(e)));}
  };
  const handleEmailPick=async email=>{
    const emailRecord=savedEmails.find(e=>e.email===email);
    if(emailRecord){try{await sb(`client_notification_emails?id=eq.${emailRecord.id}`,{method:"PATCH",body:JSON.stringify({usage_count:(emailRecord.usage_count||0)+1,last_used_at:new Date().toISOString()})});await refreshPool(client?.id);}catch(_){}}
    applyPreview(email,items,client);
  };
  useEffect(()=>{
    let cancelled=false;
    (async()=>{
      setStep("loading");setError(null);setShowAddEmail(false);
      try{
        const clientData=await loadClientForNotification(task,clients);
        if(cancelled)return;
        setClient(clientData);
        let pool=[];
        if(clientData?.id){pool=await loadClientNotificationEmailPool(clientData.id);if(cancelled)return;setSavedEmails(pool);}
        const taskItems=await sb(`task_items?task_id=eq.${task.id}&order=id.asc`);
        const itemsList=Array.isArray(taskItems)?taskItems:[];
        if(cancelled)return;
        setItems(itemsList);
        const cc=[];
        if(task.sales_agent){const ae=AGENT_EMAIL_BY_NAME[String(task.sales_agent).trim()];if(ae)cc.push(ae);}
        if(!cc.includes(ADMIN_NOTIFY_EMAIL))cc.push(ADMIN_NOTIFY_EMAIL);
        setCcEmails(cc);
        if(pool.length===0){
          if(!clientData){setError("לא נמצא לקוח מקושר למשימה זו. יש להגדיר לקוח קודם.");setStep("error");}
          else setStep("addFirstEmail");
        }else setStep("pickEmail");
      }catch(e){if(!cancelled){setError("שגיאה בטעינה: "+(e.message||String(e)));setStep("error");}}
    })();
    return()=>{cancelled=true};
  },[task.id,notificationType]);
  const handleSend=async()=>{
    setStep("sending");setError(null);
    try{
      await sendEmail({to:selectedEmail,cc:ccEmails,subject,html:emailHtml,text:emailText});
      const fn=notificationType==="ready"?"notif_ready_sent_at":notificationType==="shipped"?"notif_shipped_sent_at":"notif_delivered_sent_at";
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({[fn]:new Date().toISOString(),notification_email:selectedEmail})});
      await sb("client_notifications_log",{method:"POST",body:JSON.stringify({task_id:task.id,notification_type:notificationType,recipient_email:selectedEmail,cc_emails:ccEmails,subject,body:emailText,sent_by:user?.name||"unknown",status:"sent"})});
      window.alert("✅ ההודעה נשלחה בהצלחה!");onSent?.();
    }catch(e){
      try{await sb("client_notifications_log",{method:"POST",body:JSON.stringify({task_id:task.id,notification_type:notificationType,recipient_email:selectedEmail,cc_emails:ccEmails,subject,body:emailText,sent_by:user?.name||"unknown",status:"failed",error_message:e.message||String(e)})});}catch(_){}
      setError("שגיאה בשליחה: "+(e.message||String(e)));setStep("preview");
    }
  };
  return<Modal open={true} onClose={onClose} title={typeLabels[notificationType]||"התראת לקוח"} maxWidth={700}>
    <div style={{direction:"rtl"}}>
      {step==="loading"&&<div style={{textAlign:"center",padding:30}}><Spinner sz={28}/><div style={{marginTop:8,color:"var(--text3)"}}>טוען...</div></div>}
      {step==="error"&&<div><div style={{padding:15,background:"#fee2e2",color:"#991b1b",borderRadius:6,marginBottom:15}}>❌ {error}</div><button type="button" onClick={onClose} style={{width:"100%",padding:10,borderRadius:8,border:"1px solid var(--border)",background:"var(--bg2)",cursor:"pointer",fontFamily:"inherit"}}>סגור</button></div>}
      {step==="addFirstEmail"&&<div>
        <div style={{padding:15,background:"#fef3c7",color:"#78350f",borderRadius:8,marginBottom:15,fontSize:14}}>ℹ️ אין מיילי התראה ללקוח <strong>{client?.name||task.client_name}</strong>.<br/><span style={{fontSize:13}}>הוסף כתובת מייל אחת ויותר כדי לאפשר שליחת התראות בעתיד.</span></div>
        <div style={{marginBottom:12}}><label style={{display:"block",marginBottom:4,fontWeight:600}}>📧 כתובת מייל:</label><input type="email" value={newEmail} onChange={e=>setNewEmail(e.target.value)} placeholder="example@company.com" style={{...fld,direction:"ltr"}} autoFocus/></div>
        <div style={{marginBottom:15}}><label style={{display:"block",marginBottom:4,fontWeight:600}}>🏷️ תווית (אופציונלי):</label><input type="text" value={newLabel} onChange={e=>setNewLabel(e.target.value)} placeholder="למשל: רחל מכירות" style={fld}/></div>
        <div style={{display:"flex",gap:10}}><button type="button" onClick={onClose} style={{flex:1,padding:10,borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button><button type="button" onClick={handleAddEmail} style={{flex:2,padding:12,borderRadius:8,border:"none",background:"#0e7490",color:"#fff",fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור והמשך</button></div>
      </div>}

function BinaChangesModal({changes,task,onClose}){

    </div>;

      <div style={{fontWeight:600,color:"#78350f",fontSize:13}}>🔢 שינוי כמות</div>
      <div style={{fontSize:13,marginTop:4}}><strong>{c.description}</strong>:<span style={{marginRight:8,color:"#ef4444",textDecoration:"line-through"}}>{c.old}</span><span style={{marginRight:6}}>→</span><span style={{color:"#10b981",fontWeight:600}}>{c.new}</span></div>
    </div>;
    if(c.field==="total_price")return<div key={i} style={{padding:10,background:"#dbeafe",borderRadius:6,borderRight:"3px solid #3b82f6"}}>
      <div style={{fontWeight:600,color:"#1e3a8a",fontSize:13}}>💰 מחיר השתנה</div>

function RefreshFromBinaButton({task,compact,onUpdate}){
  const [refreshing,setRefreshing]=useState(false);
  const [result,setResult]=useState(null);
  if(!task?.bina_order_id)return null;
  const handleRefresh=async e=>{
    e?.stopPropagation();
    setRefreshing(true);
    setResult(null);
    const r=await refreshTaskFromBina(task);
    setResult(r);
    setRefreshing(false);
    if(r.success&&r.changes&&r.changes.length>0)onUpdate?.();
    else if(r.success&&(!r.changes||r.changes.length===0))setTimeout(()=>setResult(null),2000);
  };
  return<>
    <button type="button" onClick={handleRefresh} disabled={refreshing} style={{padding:compact?"3px 6px":"4px 8px",fontSize:compact?10:11,background:"white",color:"#0d9488",border:"1px solid #0d9488",borderRadius:6,cursor:refreshing?"wait":"pointer",fontFamily:"inherit",whiteSpace:"nowrap"}} title="רענן מבינה - בדוק שינויים בהזמנה">{refreshing?"⏳":compact?"🔄":"🔄 רענן"}</button>
    {result&&!refreshing&&result.success&&(!result.changes||result.changes.length===0)&&<div style={{position:"fixed",bottom:20,right:20,background:"#10b981",color:"white",padding:"10px 14px",borderRadius:8,zIndex:9999,fontSize:13,fontWeight:600}}>✓ אין שינויים בבינה</div>}
    {result&&!refreshing&&!result.success&&<div style={{position:"fixed",bottom:20,right:20,background:"#ef4444",color:"white",padding:"10px 14px",borderRadius:8,zIndex:9999,fontSize:13,fontWeight:600}}>❌ שגיאה: {result.error}</div>}
    {result&&result.success&&result.changes&&result.changes.length>0&&<BinaChangesModal changes={result.changes} task={task} onClose={()=>setResult(null)}/>}
  </>;
}

function TaskScheduleMenu({task,x,y,onClose,onUpdate,allTasks}){
  const upcomingDays=useMemo(()=>{
    const days=[];
    const today=new Date();today.setHours(0,0,0,0);
    const dayNames=["יום ראשון","יום שני","יום שלישי","יום רביעי","יום חמישי","יום שישי","שבת"];
    for(let i=0;i<14&&days.length<5;i++){
      const d=new Date(today);d.setDate(today.getDate()+i);
      const dow=d.getDay();
      if(dow===5||dow===6)continue;
      let label;
      if(i===0)label="היום";
      else if(i===1)label="מחר";
      else label=dayNames[dow];
      days.push({date:toLocalDateStr(d),label,dayNumber:d.getDate(),monthName:d.toLocaleDateString("he-IL",{month:"short"})});
    }
    return days;
  },[]);
  const handleSchedule=async dateStr=>{
    try{
      const dayCount=(allTasks||[]).filter(t=>taskSchedDateKey(t)===dateStr).length;
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({scheduled_for_date:dateStr,scheduled_order:dayCount+1})});
      onUpdate?.();onClose();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const handleClear=async()=>{
    try{
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({scheduled_for_date:null,scheduled_order:null})});
      onUpdate?.();onClose();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const label=(task.client_name||task.title||"").substring(0,25);
  return<>
    <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:9998}}/>
    <div style={{position:"fixed",top:y,left:x,background:"#fff",border:"1px solid #d1d5db",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,0.15)",padding:8,zIndex:9999,minWidth:200,direction:"rtl"}}>
      <div style={{padding:"6px 10px",fontSize:11,color:"#6b7280",borderBottom:"1px solid #f3f4f6",marginBottom:4}}>📅 תזמן את "{label}":</div>
      {upcomingDays.map(d=>{
        const isScheduled=taskSchedDateKey(task)===d.date;
        return<button type="button" key={d.date} onClick={()=>handleSchedule(d.date)} style={{display:"block",width:"100%",padding:"8px 12px",textAlign:"right",background:isScheduled?"#f0fdfa":"transparent",color:isScheduled?"#0d9488":"#374151",border:"none",borderRadius:4,cursor:"pointer",fontWeight:isScheduled?600:400,fontSize:13,fontFamily:"inherit"}} onMouseEnter={e=>{if(!isScheduled)e.currentTarget.style.background="#f9fafb";}} onMouseLeave={e=>{if(!isScheduled)e.currentTarget.style.background="transparent";}}>
          {isScheduled&&"⭐ "}{d.label}<span style={{color:"#9ca3af",marginRight:8,fontSize:11}}>{d.dayNumber}/{d.monthName}</span>
        </button>;
      })}
      {task.scheduled_for_date&&<>
        <div style={{borderTop:"1px solid #f3f4f6",margin:"4px 0"}}/>
        <button type="button" onClick={handleClear} style={{display:"block",width:"100%",padding:"8px 12px",textAlign:"right",background:"transparent",color:"#ef4444",border:"none",borderRadius:4,cursor:"pointer",fontSize:13,fontFamily:"inherit"}} onMouseEnter={e=>e.currentTarget.style.background="#fef2f2"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>❌ הסר תזמון</button>
      </>}
    </div>
  </>;
}

function WeeklyTasksView({allTasks,onUpdate,onScheduleMenu}){
  const [weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;});
  const [draggedTask,setDraggedTask]=useState(null);
  const weekDays=useMemo(()=>{
    const days=[];
    for(let i=0;i<5;i++){const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);days.push(d);}
    return days;
  },[weekStart]);
  const tasksByDate=useMemo(()=>{
    const groups={_unscheduled:[]};
    weekDays.forEach(d=>{groups[toLocalDateStr(d)]=[];});
    allTasks.forEach(t=>{
      const key=taskSchedDateKey(t);
      if(!key){groups._unscheduled.push(t);return;}
      if(groups[key]!==undefined)groups[key].push(t);
    });
    Object.keys(groups).forEach(k=>{groups[k].sort((a,b)=>(a.scheduled_order||0)-(b.scheduled_order||0));});
    return groups;
  },[allTasks,weekDays]);
  const handleDrop=async targetDate=>{
    if(!draggedTask)return;
    const isUnsched=targetDate==="_unscheduled";
    const patch=isUnsched?{scheduled_for_date:null,scheduled_order:null}:{scheduled_for_date:targetDate,scheduled_order:(tasksByDate[targetDate]?.length||0)+1};
    try{
      await sb(`tasks?id=eq.${draggedTask.id}`,{method:"PATCH",body:JSON.stringify(patch)});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    setDraggedTask(null);
  };
  const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);};
  const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);};
  const goToday=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWeekStart(d);};
  const todayStr=toLocalDateStr(new Date());
  const unsched=tasksByDate._unscheduled||[];
  return<div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:15,padding:"10px 15px",background:"#f9fafb",borderRadius:8,flexWrap:"wrap",gap:8}}>
      <button type="button" onClick={prevWeek} style={{padding:"6px 12px",background:"#fff",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← שבוע קודם</button>
      <div style={{fontWeight:600,fontSize:15,textAlign:"center"}}>
        {weekStart.toLocaleDateString("he-IL",{day:"numeric",month:"long"})} – {weekDays[4].toLocaleDateString("he-IL",{day:"numeric",month:"long",year:"numeric"})}
        <button type="button" onClick={goToday} style={{display:"block",margin:"4px auto 0",fontSize:12,background:"none",border:"none",color:"#0d9488",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>היום</button>
      </div>
      <button type="button" onClick={nextWeek} style={{padding:"6px 12px",background:"#fff",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>שבוע הבא →</button>
    </div>
    {unsched.length>0&&<div onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop("_unscheduled")} style={{background:"#fef3c7",padding:15,borderRadius:8,marginBottom:15,border:"2px dashed #f59e0b"}}>
      <h3 style={{margin:"0 0 10px",color:"#78350f",fontSize:14}}>📋 לא מתוזמן ({unsched.length})</h3>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {unsched.slice(0,20).map(t=><TaskScheduleCard key={t.id} task={t} onDragStart={()=>setDraggedTask(t)} onContextMenu={e=>onScheduleMenu(e,t)}/>)}
        {unsched.length>20&&<div style={{padding:8,fontSize:12,color:"#78350f",alignSelf:"center"}}>+{unsched.length-20} נוספות</div>}
      </div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
      {weekDays.map(date=>{
        const dateKey=toLocalDateStr(date);
        const tasksForDay=tasksByDate[dateKey]||[];
        const isCurrentDay=dateKey===todayStr;
        return<div key={dateKey} onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop(dateKey)} style={{background:isCurrentDay?"#f0fdfa":"#f9fafb",border:`2px solid ${isCurrentDay?"#2dd4bf":"#e5e7eb"}`,borderRadius:8,padding:10,minHeight:360}}>
          <div style={{textAlign:"center",marginBottom:10,paddingBottom:8,borderBottom:`1px solid ${isCurrentDay?"#2dd4bf":"#e5e7eb"}`}}>
            <div style={{fontWeight:600,color:isCurrentDay?"#0d9488":"#374151"}}>{date.toLocaleDateString("he-IL",{weekday:"long"})}</div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{date.getDate()}/{date.getMonth()+1}</div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{tasksForDay.length} משימות</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {tasksForDay.map(t=><TaskScheduleCard key={t.id} task={t} onDragStart={()=>setDraggedTask(t)} onContextMenu={e=>onScheduleMenu(e,t)}/>)}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

const DAY_COLORS=[
  {bg:"#f0fdfa",border:"#a7f3d0"},
  {bg:"#faf5ff",border:"#e9d5ff"},
  {bg:"#fef3f2",border:"#fecaca"},
  {bg:"#fffbeb",border:"#fde68a"},
  {bg:"#eff6ff",border:"#bfdbfe"},
  {bg:"#f0fdf4",border:"#bbf7d0"},
  {bg:"#fdf2f8",border:"#fbcfe8"},
];
function getDayColor(group,index){
  if(group.isPast)return{bg:"#fefce8",border:"#fde68a"};
  if(group.key==="unscheduled")return{bg:"#f9fafb",border:"#e5e7eb"};
  if(group.isHighlight)return{bg:"#ccfbf1",border:"#5eead4"};
  return DAY_COLORS[index%DAY_COLORS.length];
}

function FileUploadField({folder,onUploaded,currentFile,label="העלאת קובץ",accept}){
  const [uploading,setUploading]=useState(false);
  const [dragOver,setDragOver]=useState(false);
  const fileInputRef=useRef(null);
  const handleFile=async file=>{
    if(!file)return;
    if(file.size>50*1024*1024){
      if(!window.confirm(`הקובץ גדול (${formatFileSize(file.size)}). להמשיך?`))return;
    }
    setUploading(true);
    try{
      const result=await uploadFileToStorage(file,folder);
      onUploaded?.(result);
    }catch(e){window.alert("שגיאה בהעלאה: "+(e.message||String(e)));}
    finally{setUploading(false);}
  };
  const handleDrop=e=>{
    e.preventDefault();
    setDragOver(false);
    const file=e.dataTransfer.files[0];
    handleFile(file);
  };
  return<div>
    <input ref={fileInputRef} type="file" accept={accept} style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
    {currentFile?<div style={{padding:12,background:"#f0fdfa",borderRadius:8,border:"1px solid #2dd4bf",display:"flex",alignItems:"center",gap:10}}>
      <div style={{fontSize:24}}>{getFileIcon(currentFile.type,currentFile.name)}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentFile.name}</div>
        <div style={{fontSize:11,color:"#6b7280"}}>{formatFileSize(currentFile.size)}</div>
      </div>
      <button type="button" onClick={()=>fileInputRef.current?.click()} style={{padding:"6px 10px",background:"#fff",color:"#0d9488",border:"1px solid #0d9488",borderRadius:6,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>🔄 החלף</button>
    </div>:<div onClick={()=>!uploading&&fileInputRef.current?.click()} onDragOver={e=>{e.preventDefault();setDragOver(true);}} onDragLeave={()=>setDragOver(false)} onDrop={handleDrop} style={{padding:25,textAlign:"center",background:dragOver?"#f0fdfa":"#f9fafb",border:`2px dashed ${dragOver?"#2dd4bf":"#d1d5db"}`,borderRadius:8,cursor:uploading?"wait":"pointer",transition:"all 0.2s"}}>
      {uploading?<><div style={{fontSize:32,marginBottom:8}}>⏳</div><div style={{color:"#6b7280"}}>מעלה...</div></>:<><div style={{fontSize:32,marginBottom:8}}>📤</div><div style={{fontWeight:600,color:"#374151"}}>{label}</div><div style={{fontSize:12,color:"#6b7280",marginTop:4}}>לחץ או גרור לכאן כל סוג קובץ</div></>}
    </div>}
  </div>;
}

function DocumentRow({doc,onUpdate}){
  const [showDetails,setShowDetails]=useState(false);
  let expiryStatus=null;
  if(doc.expires_at){
    const now=new Date();now.setHours(0,0,0,0);
    const exp=new Date(doc.expires_at);
    const diffDays=Math.floor((exp-now)/(1000*60*60*24));
    if(diffDays<0)expiryStatus={text:`פג לפני ${Math.abs(diffDays)} ימים`,color:"#dc2626",icon:"🔴"};
    else if(diffDays===0)expiryStatus={text:"פג היום",color:"#dc2626",icon:"🔴"};
    else if(diffDays<=7)expiryStatus={text:`יפוג בעוד ${diffDays} ימים`,color:"#ea580c",icon:"🟠"};
    else if(diffDays<=30)expiryStatus={text:`יפוג בעוד ${diffDays} ימים`,color:"#ca8a04",icon:"🟡"};
    else expiryStatus={text:`תוקף עד ${new Date(doc.expires_at).toLocaleDateString("he-IL")}`,color:"#10b981",icon:"🟢"};
  }
  return<>
    <div style={{background:"white",padding:12,borderRadius:8,border:"1px solid #e5e7eb",display:"flex",alignItems:"center",gap:12,cursor:"pointer"}} onClick={()=>setShowDetails(true)}>
      <div style={{fontSize:28}}>{getFileIcon(doc.file_type,doc.file_name)}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:14}}>{doc.title}</div>
        {doc.description&&<div style={{fontSize:12,color:"#6b7280",marginTop:2}}>{doc.description}</div>}
        <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>הועלה {new Date(doc.uploaded_at).toLocaleDateString("he-IL")}{doc.file_size&&` · ${formatFileSize(doc.file_size)}`}</div>
      </div>
      {expiryStatus&&<div style={{fontSize:12,color:expiryStatus.color,fontWeight:600,whiteSpace:"nowrap"}}>{expiryStatus.icon} {expiryStatus.text}</div>}
    </div>
    {showDetails&&<DocumentDetailsModal doc={doc} onClose={()=>setShowDetails(false)} onUpdate={()=>{onUpdate?.();setShowDetails(false);}}/>}
  </>;
}

function DocumentsDashboard({user}){
  const [view,setView]=useState("categories");
  const [selectedCategory,setSelectedCategory]=useState(null);
  const [searchQuery,setSearchQuery]=useState("");
  const [allDocs,setAllDocs]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showUpload,setShowUpload]=useState(false);
  const loadDocs=async()=>{
    try{
      const data=await sb("documents?employee_id=is.null&order=uploaded_at.desc&limit=500");
      setAllDocs(data||[]);
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };
  useEffect(()=>{
    loadDocs();
    const interval=setInterval(loadDocs,60000);
    return()=>clearInterval(interval);
  },[]);
  const expiringDocs=useMemo(()=>{
    const now=new Date();now.setHours(0,0,0,0);
    return allDocs.filter(d=>d.expires_at).map(d=>{
      const exp=new Date(d.expires_at);
      const diffDays=Math.floor((exp-now)/(1000*60*60*24));
      return{...d,diffDays};
    }).filter(d=>d.diffDays<=30).sort((a,b)=>a.diffDays-b.diffDays);
  },[allDocs]);
  const countsByCategory=useMemo(()=>{
    const counts={};
    DOCUMENT_CATEGORIES.forEach(c=>{counts[c.id]=0;});
    allDocs.forEach(d=>{if(d.category&&counts[d.category]!==undefined)counts[d.category]++;});
    return counts;
  },[allDocs]);
  const searchResults=useMemo(()=>{
    if(!searchQuery.trim())return [];
    const q=searchQuery.trim().toLowerCase();
    return allDocs.filter(d=>(d.title||"").toLowerCase().includes(q)||(d.description||"").toLowerCase().includes(q)||(d.file_name||"").toLowerCase().includes(q)||(d.tags||[]).some(t=>String(t).toLowerCase().includes(q)));
  },[allDocs,searchQuery]);
  if(loading)return<div style={{padding:30,textAlign:"center"}}>טוען...</div>;
  return<div style={{padding:20}}>
    <h2 style={{margin:"0 0 5px"}}>📁 מסמכי החברה</h2>
    <p style={{margin:"0 0 20px",color:"#6b7280",fontSize:14}}>כל המסמכים החשובים במקום אחד - עם תזכורות לתפוגה</p>
    {expiringDocs.length>0&&<ExpiringDocsBanner docs={expiringDocs} onClickDoc={doc=>{const cat=DOCUMENT_CATEGORIES.find(c=>c.id===doc.category);if(cat){setSelectedCategory(cat);setView("category");}}}/>}
    <div style={{display:"flex",gap:10,marginBottom:20}}>
      <input type="text" value={searchQuery} onChange={e=>{setSearchQuery(e.target.value);setView(e.target.value?"search":"categories");}} placeholder="🔍 חיפוש מסמכים..." style={{flex:1,padding:12,borderRadius:8,border:"1px solid #d1d5db",fontSize:14,fontFamily:"inherit"}}/>
      <button type="button" onClick={()=>setShowUpload(true)} style={{padding:"12px 20px",background:"#0d9488",color:"white",border:"none",borderRadius:8,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>➕ העלה מסמך</button>
    </div>
    {view==="categories"&&<CategoriesGrid counts={countsByCategory} onSelect={cat=>{setSelectedCategory(cat);setView("category");}}/>}
    {view==="category"&&selectedCategory&&<CategoryView category={selectedCategory} docs={allDocs.filter(d=>d.category===selectedCategory.id)} onBack={()=>{setSelectedCategory(null);setView("categories");}} onUpdate={loadDocs}/>}
    {view==="search"&&<SearchResults query={searchQuery} results={searchResults} onUpdate={loadDocs}/>}
    {showUpload&&<UploadDocumentModal user={user} onClose={()=>setShowUpload(false)} onUploaded={()=>{loadDocs();setShowUpload(false);}} defaultCategory={selectedCategory?.id}/>}
  </div>;
}

function BirthdayBanner({birthdays,onSelect}){

    <div style={{fontWeight:700,fontSize:15,color:"#581c87",marginBottom:10}}>🎂 ימי הולדת קרובים</div>
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {birthdays.map(emp=>{
        const birth=new Date(emp.birth_date);
        const age=calculateAge(emp.birth_date);
        const nextAge=age+(emp.daysUntil===0?0:1);
        let timeText,emoji;
        if(emp.daysUntil===0){timeText="🎉 היום!!! זמן לחגוג!";emoji="🎂";}
        else if(emp.daysUntil===1){timeText="מחר! יש לסדר מתנה";emoji="🎁";}
        else if(emp.daysUntil<=4){timeText=`בעוד ${emp.daysUntil} ימים - זמן לתכנן מתנה`;emoji="🎁";}
        else{timeText=`בעוד ${emp.daysUntil} ימים`;emoji="🎈";}
        const birthdayStr=birth.toLocaleDateString("he-IL",{day:"2-digit",month:"2-digit"});
        return<button type="button" key={emp.id} onClick={()=>onSelect?.(emp)} style={{background:"white",padding:12,borderRadius:8,border:emp.daysUntil<=4?"2px solid #c084fc":"1px solid #e9d5ff",cursor:"pointer",textAlign:"right",display:"flex",alignItems:"center",gap:12,fontFamily:"inherit",width:"100%"}}>
          <div style={{fontSize:28}}>{emoji}</div>

            <div style={{fontWeight:600,fontSize:15}}>{emp.full_name}</div>
            <div style={{fontSize:12,color:"#6b7280",marginTop:2}}>📅 {birthdayStr} · גיל {nextAge}</div>
          </div>
          <div style={{fontSize:13,fontWeight:600,color:"#581c87",whiteSpace:"nowrap",maxWidth:160,textAlign:"left"}}>{timeText}</div>
        </button>;
      })}
    </div>
  </div>;
}

function EmployeeDetailsTab({employee,editing,setEditing,onUpdate,onDelete}){
  const [fullName,setFullName]=useState(employee.full_name);
  const [phone,setPhone]=useState(employee.phone||"");
  const [birthDate,setBirthDate]=useState(employee.birth_date||"");
  const [notes,setNotes]=useState(employee.notes||"");
  const age=calculateAge(employee.birth_date);
  const daysUntil=employee.birth_date?daysUntilBirthday(employee.birth_date):null;
  const handleSave=async()=>{
    if(!fullName.trim()){window.alert("יש למלא שם");return;}
    try{
      await sb(`employees?id=eq.${employee.id}`,{method:"PATCH",body:JSON.stringify({full_name:fullName.trim(),phone:phone.trim()||null,birth_date:birthDate||null,notes:notes.trim()||null,updated_at:new Date().toISOString()})});
      onUpdate?.();
      setEditing(false);
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  const handleDelete=async()=>{
    if(!window.confirm(`למחוק את העובד "${employee.full_name}" וכל המסמכים שלו? פעולה זו לא ניתנת לביטול.`))return;
    try{
      const empDocs=await sb(`documents?employee_id=eq.${employee.id}`);
      for(const d of (empDocs||[]))await deleteFileFromStorage(d.file_path);
      await sb(`documents?employee_id=eq.${employee.id}`,{method:"DELETE"});
      await sb(`employees?id=eq.${employee.id}`,{method:"DELETE"});
      onUpdate?.();
      onDelete?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  if(editing)return<div>
    <div style={{marginBottom:10}}><label style={{fontWeight:600,fontSize:13}}>שם מלא *:</label><input value={fullName} onChange={e=>setFullName(e.target.value)} style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/></div>
    <div style={{marginBottom:10}}><label style={{fontWeight:600,fontSize:13}}>טלפון:</label><input value={phone} onChange={e=>setPhone(e.target.value)} placeholder="050-1234567" style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",direction:"ltr",fontFamily:"inherit"}}/></div>
    <div style={{marginBottom:10}}><label style={{fontWeight:600,fontSize:13}}>תאריך לידה:</label><input type="date" value={birthDate} onChange={e=>setBirthDate(e.target.value)} style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/></div>
    <div style={{marginBottom:15}}><label style={{fontWeight:600,fontSize:13}}>הערות:</label><textarea value={notes} onChange={e=>setNotes(e.target.value)} style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",minHeight:60,fontFamily:"inherit"}}/></div>
    <div style={{display:"flex",gap:10}}>
      <button type="button" onClick={()=>setEditing(false)} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
      <button type="button" onClick={handleSave} style={{flex:2,padding:10,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור</button>
    </div>
  </div>;
  return<div>
    <div style={{display:"grid",gap:12,marginBottom:20}}>
      <DetailItem icon="📞" label="טלפון" value={employee.phone||"—"} ltr={!!employee.phone}/>
      <DetailItem icon="🎂" label="תאריך לידה" value={employee.birth_date?`${new Date(employee.birth_date).toLocaleDateString("he-IL")} (גיל ${age})`:"—"}/>
      {daysUntil!==null&&<DetailItem icon="⭐" label="ימים עד יום הולדת הבא" value={daysUntil===0?"🎉 היום!":`${daysUntil} ימים`} highlight={daysUntil<=7}/>}
      {employee.notes&&<DetailItem icon="📝" label="הערות" value={employee.notes}/>}
    </div>
    <div style={{display:"flex",gap:10}}>
      <button type="button" onClick={handleDelete} style={{padding:10,background:"white",color:"#ef4444",border:"1px solid #ef4444",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ מחק עובד</button>
      <button type="button" onClick={()=>setEditing(true)} style={{flex:1,padding:10,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>✏️ ערוך פרטים</button>
    </div>
  </div>;
}

function UploadEmployeeDocModal({employee,category,isPayslip,onClose,onUploaded,user}){
  const [step,setStep]=useState("upload");
  const [uploadedFile,setUploadedFile]=useState(null);
  const [title,setTitle]=useState("");
  const [docDate,setDocDate]=useState(isPayslip?new Date().toISOString().substring(0,10):"");
  const [saving,setSaving]=useState(false);
  const cat=getEmployeeCatById(category);
  const handleFileUploaded=fileResult=>{
    setUploadedFile(fileResult);
    if(isPayslip){
      const now=new Date();
      const monthName=now.toLocaleDateString("he-IL",{month:"long",year:"numeric"});
      setTitle(`תלוש שכר ${monthName}`);
    }else setTitle(fileResult.name.replace(/\.[^.]+$/,""));
    setStep("details");
  };
  const handleSave=async()=>{
    if(!title.trim()){window.alert("יש למלא שם");return;}
    setSaving(true);
    try{
      await sb("documents",{method:"POST",body:JSON.stringify({employee_id:employee.id,category,title:title.trim(),file_path:uploadedFile.path,file_name:uploadedFile.name,file_size:uploadedFile.size,file_type:uploadedFile.type,document_date:docDate||null,uploaded_by:user?.name||"unknown"})});

  return<Modal open onClose={onClose} title={`➕ העלה ${cat.name} - ${employee.full_name}`} maxWidth={500}>
    {step==="upload"?<>
      <FileUploadField folder={`employees/${employee.id}/${category}`} onUploaded={handleFileUploaded} label={`בחר/גרור קובץ ${cat.name}`}/>
      <button type="button" onClick={onClose} style={{width:"100%",padding:10,marginTop:15,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
    </>:<>
      <div style={{padding:10,background:cat.color+"15",borderRadius:6,marginBottom:15}}>
        <div style={{fontSize:12,color:cat.color,marginBottom:4}}>{cat.icon} {cat.name}</div>

      <div style={{marginBottom:15}}>
        <label style={{fontWeight:600,fontSize:13}}>{isPayslip?"חודש התלוש *:":"תאריך המסמך:"}</label>

        {isPayslip&&<div style={{fontSize:11,color:"#6b7280",marginTop:4}}>💡 התלושים יסודרו לפי תאריך זה</div>}

        <button type="button" onClick={onClose} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" onClick={handleSave} disabled={saving} style={{flex:2,padding:12,background:"#0d9488",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:saving?"wait":"pointer",fontFamily:"inherit"}}>{saving?"⏳ שומר...":"💾 שמור"}</button>

function PayslipsTab({employee,docs,onUpdate,user}){
  const [showUpload,setShowUpload]=useState(false);
  const docsByYear=useMemo(()=>{
    const groups={};
    docs.forEach(d=>{
      const date=d.document_date||d.uploaded_at;
      const year=new Date(date).getFullYear();
      if(!groups[year])groups[year]=[];
      groups[year].push(d);
    });
    Object.keys(groups).forEach(year=>{
      groups[year].sort((a,b)=>{
        const dA=new Date(a.document_date||a.uploaded_at);

      <div style={{display:"grid",gap:6}}>{docsByYear[year].map(d=><PayslipRow key={d.id} doc={d} onUpdate={onUpdate}/>)}</div>

function DesignRequestCard({request,onUpdate}){
  const [showDetails,setShowDetails]=useState(false);
  const type=getRequestTypeById(request.request_type);
  const statusInfo=STATUS_LABELS[request.status]||STATUS_LABELS.pending;
  const timeAgo=(()=>{
    const diffMins=Math.floor((Date.now()-new Date(request.created_at))/(1000*60));
    if(diffMins<1)return "עכשיו";
    if(diffMins<60)return `לפני ${diffMins} דק'`;
    const diffHours=Math.floor(diffMins/60);
    if(diffHours<24)return `לפני ${diffHours} שעות`;
    return `לפני ${Math.floor(diffHours/24)} ימים`;
  })();
  const inputCount=(request.input_files||[]).length;
  const outputCount=(request.output_files||[]).length;
  return<>
    <div onClick={()=>setShowDetails(true)} style={{background:"white",padding:14,borderRadius:10,border:`1px solid ${type.color}30`,borderLeft:`4px solid ${type.color}`,cursor:"pointer",display:"flex",alignItems:"center",gap:12}}>
      <div style={{fontSize:32}}>{type.icon}</div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:600,fontSize:15}}>{request.title}</div>
        <div style={{fontSize:12,color:"#6b7280",marginTop:3}}>{type.name} · {timeAgo}{inputCount>0&&` · 📎 ${inputCount} קלט`}{outputCount>0&&` · 📤 ${outputCount} פלט`}</div>
      </div>
      <div style={{padding:"6px 12px",borderRadius:20,background:statusInfo.color+"20",color:statusInfo.color,fontWeight:600,fontSize:12,whiteSpace:"nowrap"}}>{statusInfo.icon} {statusInfo.label}</div>
    </div>
    {showDetails&&<RequestDetailsModal request={request} onClose={()=>setShowDetails(false)} onUpdate={()=>{onUpdate?.();setShowDetails(false);}}/>}
  </>;
}

function ImpositionRequestForm({onClose,onCreated,user}){
  const [step,setStep]=useState("design");
  const [designFile,setDesignFile]=useState(null);
  const [title,setTitle]=useState("");
  const [shape,setShape]=useState("circle");
  const [productWidth,setProductWidth]=useState(50);
  const [productHeight,setProductHeight]=useState(50);
  const [quantity,setQuantity]=useState(100);
  const [plateWidth,setPlateWidth]=useState(420);
  const [plateHeight,setPlateHeight]=useState(594);
  const [bleed,setBleed]=useState(3);
  const [gutter,setGutter]=useState(5);
  const [creating,setCreating]=useState(false);
  const [processingStatus,setProcessingStatus]=useState(null);
  const previewLayout=useMemo(()=>{
    const safeMargin=23;
    const usableW=plateWidth-safeMargin*2;
    const usableH=plateHeight-safeMargin*2;
    const itemW=productWidth+bleed*2;
    const itemH=productHeight+bleed*2;
    const cellW=itemW+gutter;
    const cellH=itemH+gutter;
    const cols=Math.max(0,Math.floor((usableW+gutter)/cellW));
    const rows=Math.max(0,Math.floor((usableH+gutter)/cellH));
    const perPlate=cols*rows;
    const plates=perPlate>0?Math.ceil(quantity/perPlate):0;
    return{cols,rows,perPlate,plates};
  },[productWidth,productHeight,plateWidth,plateHeight,bleed,gutter,quantity]);
  const handleFileUploaded=fileResult=>{
    const mime=(fileResult.type||"").toLowerCase();
    const name=(fileResult.name||"").toLowerCase();
    if(!mime.includes("pdf")&&!name.endsWith(".pdf")){
      window.alert("יש להעלות קובץ PDF בלבד");
      setDesignFile(null);
      return;
    }
    setDesignFile(fileResult);
    const baseName=fileResult.name.replace(/\.[^.]+$/,"");
    setTitle(`סידור פלטה - ${baseName}`);
  };
  const handleCreate=async()=>{
    if(!designFile||!title.trim()){window.alert("יש להעלות קובץ ולמלא כותרת");return;}
    if(previewLayout.perPlate===0){window.alert("אין מקום לפריטים בפלטה עם המידות הנוכחיות");return;}
    setCreating(true);
    try{
      const result=await sb("design_requests",{method:"POST",body:JSON.stringify({
        request_type:"imposition",
        title:title.trim(),
        status:"pending",
        input_files:[designFile],
        parameters:{
          shape,
          product_width_mm:productWidth,
          product_height_mm:productHeight,
          quantity,
          plate_width_mm:plateWidth,
          plate_height_mm:plateHeight,
          bleed_mm:bleed,
          gutter_mm:gutter
        },
        created_by:user?.name||"unknown"
      })});
      const newRequest=Array.isArray(result)?result[0]:result;
      if(!newRequest?.id)throw new Error("לא נוצרה בקשה");
      setStep("processing");
      setProcessingStatus("שולח לעיבוד...");
      const {data,error}=await supabaseClient.functions.invoke("imposition-create",{body:{request_id:newRequest.id}});
      if(error)throw error;
      if(data?.error)throw new Error(data.error);
      setProcessingStatus("הושלם!");
      setTimeout(()=>{onCreated?.();},800);
    }catch(e){
      window.alert("שגיאה: "+(e.message||String(e)));
      setStep("review");
    }finally{setCreating(false);}

  const shapeLabel=shape==="circle"?"עיגול":shape==="square"?"ריבוע":"מלבן";
  return<div onClick={creating?undefined:onClose} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:650,maxHeight:"90vh",overflowY:"auto",boxShadow:"var(--shadow-lg)"}}>
      <div style={{background:"linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)",padding:20,color:"white",borderTopLeftRadius:20,borderTopRightRadius:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>

            <div style={{fontSize:13,opacity:0.9,marginTop:4}}>יצירת PDF להדפסה + DXF לחיתוך</div>
          </div>
          {!creating&&<button type="button" onClick={onClose} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"none",padding:"6px 12px",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>✕</button>}
        </div>
      </div>
      <div style={{padding:20}}>
        {step==="design"&&<>
          <div style={{marginBottom:15}}>
            <label style={{fontWeight:600,fontSize:14,display:"block",marginBottom:6}}>📎 קובץ העיצוב (PDF):</label>
            <div style={{fontSize:11,color:"#6b7280",marginBottom:8}}>העלה PDF של יחידה אחת. המערכת תשכפל אותה לפלטה.</div>
