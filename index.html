  const [title,setTitle]=useState("");
  const [agent,setAgent]=useState("");
  const [contactName,setContactName]=useState("");
  useEffect(()=>{
    if(open){
      setStep(1);
      setClientSearch("");
      setSelectedClient(null);
      setItems([{description:"",quantity:1,unitPrice:0,discount:0}]);
      setTitle("");
      setAgent("");
      setContactName("");
      setError(null);
      setSubmitting(false);
    }
  },[open]);
  if(!open)return null;
  const filteredClients=(clients||[]).filter(c=>{
    if(!clientSearch.trim())return true;
    const q=clientSearch.toLowerCase().trim();
    return (c.name||"").toLowerCase().includes(q)||(c.phone||"").includes(q)||String(c.bina_customer_id||"").includes(q);
  }).slice(0,50);
  const itemsTotal=items.reduce((sum,it)=>{
    const qty=Number(it.quantity)||0;
    const price=Number(it.unitPrice)||0;
    const disc=Number(it.discount)||0;
    return sum+qty*price*(1-disc/100);
  },0);
  const addItem=()=>setItems([...items,{description:"",quantity:1,unitPrice:0,discount:0}]);
  const removeItem=(idx)=>{if(items.length===1)return;setItems(items.filter((_,i)=>i!==idx));};
  const updateItem=(idx,field,value)=>{const ni=[...items];ni[idx]={...ni[idx],[field]:value};setItems(ni);};
  const handleSubmit=async()=>{
    setSubmitting(true);
    setError(null);
    try{
      const quoteTitle=title||`הצעה ל${selectedClient.name||"לקוח"}`;
      const binaCustNum=parseInt(String(selectedClient.bina_customer_id),10);
      if(!binaCustNum||Number.isNaN(binaCustNum))throw new Error("קוד לקוח בינה לא תקין");

      const quoteData={
        title:quoteTitle,
        bina_cust_id:binaCustNum,
        bina_cust_name:selectedClient.name||"ללא שם",
        bina_cust_city:(selectedClient.address||"").split(",")[0]?.trim()||selectedClient.address||"",
        bina_cust_address:selectedClient.address||"",
        bina_cust_phone:selectedClient.phone||"",
        contact_person:(contactName||"").trim(),
        sales_agent:agent||null,
        status:"טיוטה",
      };

      const quoteResponse=await sb("quotes",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(quoteData)});
      const quoteResult=Array.isArray(quoteResponse)?quoteResponse[0]:quoteResponse;
      if(!quoteResult?.id)throw new Error("שגיאה ביצירת הצעה ב-DB");
      const quoteId=quoteResult.id;

      const itemsToInsert=items.map((it,idx)=>({
        quote_id:quoteId,
        item_name:`LINE-${idx+1}`,
        description:it.description||`פריט ${idx+1}`,
        quantity:Number(it.quantity)||1,
        unit_price:Number(it.unitPrice)||0,
        discount_pct:Number(it.discount)||0,
        line_number:idx+1,
      }));

      await sb("quote_items",{method:"POST",body:JSON.stringify(itemsToInsert)});

      const {data:fnData,error:invE}=await supabaseClient.functions.invoke("bina-create-quote",{body:{quote_id:quoteId}});
      if(invE)throw new Error(invE.message);
      let result=fnData;
      if(typeof fnData==="string"){try{result=JSON.parse(fnData)}catch{result=null}}
      if(!result||result.success!==true)throw new Error(result?.error||result?.binaMessage||"שגיאה בשליחה לבינה");

      if(onSuccess)onSuccess(result);
      const quoteTitleUi=quoteTitle;
      const showPDF=window.confirm(`✅ נוצרה הצעת מחיר #${result.binaDocId} בבינה!\n\nלפתוח PDF לתצוגה/הדפסה?`);
      if(showPDF&&typeof window.openDocumentPDF==="function"){
        window.openDocumentPDF({
          docType:"quote",
          binaDocId:result.binaDocId,
          title:quoteTitleUi,
          client:{
            name:selectedClient.name,
            address:selectedClient.address,
            phone:selectedClient.phone,
            email:selectedClient.email||"",
            contactPerson:(contactName||"").trim()||selectedClient.name,
          },
          items:items.map(it=>({description:it.description,quantity:Number(it.quantity)||1,unitPrice:Number(it.unitPrice)||0,discount:Number(it.discount)||0})),
          agent:(agent||"").trim(),
          createdAt:new Date().toISOString(),
          remark:"",
        });
      }
      onClose();
    }catch(err){
      setError(err.message||String(err));
    }finally{
      setSubmitting(false);
    }
  };

  const purple="#7C3AED";
  const purpleLight="#F5F3FF";
  const overlayStyle={position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:0};
  const modalStyle={width:"100%",maxWidth:600,maxHeight:"95vh",background:"#fff",borderRadius:"16px 16px 0 0",display:"flex",flexDirection:"column",boxShadow:"0 -4px 24px rgba(0,0,0,0.2)",overflow:"hidden"};
  const headerStyle={padding:"16px 20px",borderBottom:"1px solid #eee",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg2)"};
  const bodyStyle={flex:1,overflowY:"auto",padding:20,direction:"rtl"};
  const footerStyle={padding:16,borderTop:"1px solid #eee",background:"var(--bg2)",display:"flex",gap:8};
  const labelStyle={display:"block",fontSize:14,fontWeight:600,marginBottom:6,color:"var(--text)"};
  const inputStyle={width:"100%",padding:"12px 14px",fontSize:16,border:"1px solid var(--border)",borderRadius:10,boxSizing:"border-box",fontFamily:"inherit",direction:"rtl",background:"var(--bg2)",color:"var(--text)"};
  const btnPrimary={flex:1,padding:"14px 20px",fontSize:16,fontWeight:600,background:purple,color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnSecondary={flex:1,padding:"14px 20px",fontSize:16,background:"#fff",color:"var(--text2)",border:"1px solid var(--border)",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnDanger={padding:"8px 12px",fontSize:14,background:"var(--red)",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"};

  const renderStep1=()=><div>
    <h3 style={{marginTop:0,marginBottom:16}}>👤 בחירת לקוח להצעה</h3>
    <input type="text" placeholder="🔍 חיפוש לפי שם, טלפון, או קוד בינה..." value={clientSearch} onChange={e=>setClientSearch(e.target.value)} style={inputStyle}/>
    <div style={{marginTop:12,maxHeight:"calc(95vh - 280px)",overflowY:"auto"}}>
      {filteredClients.length===0?<div style={{padding:20,textAlign:"center",color:"var(--text3)"}}>{clientSearch?"לא נמצאו לקוחות":"אין לקוחות ברשימה"}</div>:
      filteredClients.map(c=><div
        key={c.id}
        onClick={()=>{
          if(c.bina_customer_id){setSelectedClient(c);setStep(2);}
          else{
            const ok=window.confirm(`הלקוח "${c.name||"ללא שם"}" לא מקושר לבינה.\n\nכדי ליצור הצעה צריך קודם ליצור אותו בבינה.\n\nלפתוח את מסך יצירת לקוח חדש?`);
            if(ok){onClose();if(window.openBinaClient)window.openBinaClient();}
          }
        }}
        style={{
          padding:14,marginBottom:8,border:"1px solid #eee",borderRadius:8,cursor:"pointer",
          background:c.bina_customer_id?"#f0fdf4":"#fefce8",
          borderRight:c.bina_customer_id?"4px solid #22c55e":"4px solid #eab308",
        }}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:600,fontSize:15}}>{c.name||"ללא שם"}</div>
          <span style={{fontSize:11,padding:"2px 8px",borderRadius:12,background:c.bina_customer_id?"#22c55e":"#eab308",color:"#fff",fontWeight:600}}>
            {c.bina_customer_id?"✓ בבינה":"⚠ לא בבינה"}
          </span>
        </div>
        <div style={{fontSize:13,color:"#666",marginTop:4}}>📞 {c.phone||"—"} {c.bina_customer_id?`· 🆔 ${c.bina_customer_id}`:""}</div>
      </div>)}
    </div>
  </div>;

  const renderStep2=()=><div>
    <h3 style={{marginTop:0,marginBottom:4}}>📦 פריטים בהצעה</h3>
    <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>לקוח: {selectedClient?.name}</div>
    {items.map((it,idx)=><div key={idx} style={{padding:12,marginBottom:12,background:"var(--bg2)",borderRadius:10,border:"1px solid var(--border)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <strong style={{fontSize:14}}>פריט {idx+1}</strong>
        {items.length>1&&<button type="button" onClick={()=>removeItem(idx)} style={btnDanger}>🗑️</button>}
      </div>
      <label style={labelStyle}>תיאור</label>
      <input type="text" placeholder="לדוגמה: כרטיסי ביקור 350 גרם..." value={it.description} onChange={e=>updateItem(idx,"description",e.target.value)} style={{...inputStyle,marginBottom:10}}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div><label style={labelStyle}>כמות</label><input type="number" inputMode="numeric" value={it.quantity} onChange={e=>updateItem(idx,"quantity",e.target.value)} style={inputStyle}/></div>
        <div><label style={labelStyle}>מחיר ₪</label><input type="number" inputMode="decimal" step="0.01" value={it.unitPrice} onChange={e=>updateItem(idx,"unitPrice",e.target.value)} style={inputStyle}/></div>
        <div><label style={labelStyle}>הנחה %</label><input type="number" inputMode="numeric" value={it.discount} onChange={e=>updateItem(idx,"discount",e.target.value)} style={inputStyle}/></div>
      </div>
      <div style={{marginTop:8,fontSize:14,textAlign:"left",color:purple,fontWeight:600}}>₪{((Number(it.quantity)||0)*(Number(it.unitPrice)||0)*(1-(Number(it.discount)||0)/100)).toFixed(2)}</div>
    </div>)}
    <button type="button" onClick={addItem} style={{width:"100%",padding:14,fontSize:15,background:"#fff",border:`2px dashed ${purple}`,color:purple,borderRadius:10,cursor:"pointer",fontFamily:"inherit"}}>➕ הוסף פריט</button>
    <div style={{marginTop:16,padding:14,background:purpleLight,borderRadius:10,fontSize:16,fontWeight:600,textAlign:"center",color:purple}}>{`סה"כ הצעה (לפני מע"מ): ₪${itemsTotal.toFixed(2)}`}</div>
  </div>;

  const renderStep3=()=><div>
    <h3 style={{marginTop:0,marginBottom:16}}>📝 פרטים אחרונים</h3>
    <label style={labelStyle}>סוכן</label>
    <select value={agent} onChange={e=>setAgent(e.target.value)} style={{...inputStyle,marginBottom:14}}>
      <option value="">בחר סוכן...</option>
      <option value="כפיר">כפיר</option>
      <option value="נטלי">נטלי</option>
      <option value="ברק">ברק</option>
    </select>
    <label style={labelStyle}>לידי (שם איש קשר)</label>
    <input type="text" placeholder="שם איש הקשר" value={contactName} onChange={e=>setContactName(e.target.value)} style={{...inputStyle,marginBottom:14}}/>
    <label style={{...labelStyle,fontSize:15,color:"var(--text)"}}>כותרת ההצעה</label>
    <input type="text" placeholder="לדוגמה: כרטיסי ביקור 350 גרם, 2 צדדים, 100 יחידות" value={title} onChange={e=>setTitle(e.target.value)} style={{...inputStyle,marginBottom:14,fontWeight:600,fontSize:16}}/>
    <div style={{marginTop:16,padding:14,background:purpleLight,borderRadius:10,fontSize:14,color:"var(--text)"}}>
      <div><strong>📋 סיכום הצעה:</strong></div>
      <div style={{marginTop:6}}>👤 {selectedClient?.name}</div>
      <div>📦 {items.length} פריטים</div>
      <div style={{fontSize:16,fontWeight:600,marginTop:6,color:purple}}>{`💰 ₪${itemsTotal.toFixed(2)} (לפני מע"מ)`}</div>
    </div>
    {error&&<div style={{marginTop:12,padding:12,background:"var(--red-light)",color:"var(--red)",borderRadius:10,fontSize:14}}>❌ {error}</div>}
  </div>;

  return<div style={overlayStyle} onClick={onClose}>
    <div style={modalStyle} onClick={e=>e.stopPropagation()}>
      <div style={headerStyle}>
        <strong style={{fontSize:17}}>💼 הצעת מחיר חדשה ({step}/3)</strong>
        <button type="button" onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:"var(--text2)",fontFamily:"inherit"}}>✕</button>
      </div>
      <div style={bodyStyle}>{step===1&&renderStep1()}{step===2&&renderStep2()}{step===3&&renderStep3()}</div>
      <div style={footerStyle}>
        {step>1&&<button type="button" onClick={()=>setStep(step-1)} disabled={submitting} style={btnSecondary}>← חזור</button>}
        {step===1&&<button type="button" onClick={onClose} style={btnSecondary}>ביטול</button>}
        {step===2&&<button type="button" onClick={()=>setStep(3)} style={btnPrimary}>המשך ←</button>}
        {step===3&&<button type="button" onClick={handleSubmit} disabled={submitting||!selectedClient} style={{...btnPrimary,opacity:submitting?0.6:1}}>{submitting?"⏳ שולח...":"📤 שלח הצעה לבינה"}</button>}
      </div>
    </div>
  </div>;
}

function DepartmentDashboard({user,allTasks,taskItems,isA,deptFilter}){
  const targetDept=isA?(deptFilter==="all"?null:deptFilter):(user?.dept??null);
  const tasks=tasksForDepartment(allTasks||[],taskItems||[],targetDept);
  const today=new Date();
  today.setHours(0,0,0,0);
  const todayMs=today.getTime();
  const yesterdayMs=todayMs-86400000;
  const weekStartMs=todayMs-(today.getDay()*86400000);
  const openTasks=tasks.filter(t=>!t.archived_at&&t.status!=="הושלם"&&t.status!=="הושלמה");
  const urgentTasks=openTasks.filter(t=>{
    if(t.priority==="גבוהה"||t.priority==="דחוף")return true;
    if(t.due_date){
      const due=new Date(t.due_date).getTime();
      return due<=todayMs+86400000;
    }
    return false;
  });
  const completedToday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=todayMs;
  });
  const completedYesterday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=yesterdayMs&&c<todayMs;
  });
  const completedThisWeek=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=weekStartMs;
  });
  const todayChange=completedYesterday.length===0?null:Math.round(((completedToday.length-completedYesterday.length)/completedYesterday.length)*100);
  const dailyTarget=Math.max(5,Math.ceil(openTasks.length*0.6));
  const progressPct=Math.min(100,Math.round((completedToday.length/dailyTarget)*100));
  const hour=new Date().getHours();
  let greeting="שלום";
  let greetingEmoji="👋";
  if(hour<12){greeting="בוקר טוב";greetingEmoji="☀️";}
  else if(hour<17){greeting="צהריים טובים";greetingEmoji="🌤️";}
  else if(hour<21){greeting="ערב טוב";greetingEmoji="🌆";}
  else{greeting="לילה טוב";greetingEmoji="🌙";}
  const deptColor=targetDept?(DEPT_COLORS[targetDept]||"#3DB5B1"):"#3DB5B1";
  const displayName=isA?(targetDept?`מחלקת ${targetDept}`:"כל המחלקות"):`מחלקת ${user?.dept||"—"}`;
  const cardStyle={background:"linear-gradient(135deg, #fff 0%, #fafbfc 100%)",border:"1px solid var(--border)",borderRadius:16,padding:20,marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,0.04)",direction:"rtl"};
  const headerStyle={display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,paddingBottom:12,borderBottom:"1px solid var(--border)"};
  const greetingStyle={fontSize:18,fontWeight:700,color:"var(--text)"};
  const subtitleStyle={fontSize:13,color:deptColor,fontWeight:600,marginTop:2};
  const metricsGrid={display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(110px, 1fr))",gap:8,marginBottom:16};
  const metricBox=(color,bg)=>({padding:"14px 12px",borderRadius:12,background:bg,border:`1px solid ${color}30`,textAlign:"center"});
  const metricValue=(color)=>({fontSize:24,fontWeight:800,color:color,lineHeight:1.1});
  const metricLabel={fontSize:11,color:"var(--text3)",marginTop:4,fontWeight:600};
  const progressBarOuter={width:"100%",height:10,background:"#f1f5f9",borderRadius:999,overflow:"hidden",marginTop:6};
  const progressBarInner={width:`${progressPct}%`,height:"100%",background:`linear-gradient(90deg, ${deptColor}, ${deptColor}dd)`,transition:"width 0.5s ease",borderRadius:999};
  return<div style={cardStyle}>
    <div style={headerStyle}>
      <div>
        <div style={greetingStyle}>{greetingEmoji} {greeting}, {user.name}!</div>
        <div style={subtitleStyle}>📍 {displayName}</div>
      </div>
      <div style={{width:48,height:48,borderRadius:"50%",background:deptColor,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:18}}>{user.initials||user.name?.[0]}</div>
    </div>
    <div style={metricsGrid}>
      <div style={metricBox("#3b82f6","#eff6ff")}>
        <div style={metricValue("#3b82f6")}>{openTasks.length}</div>
        <div style={metricLabel}>פתוחות</div>
      </div>
      <div style={metricBox("#ef4444","#fef2f2")}>
        <div style={metricValue("#ef4444")}>{urgentTasks.length}</div>
        <div style={metricLabel}>דחופות 🚨</div>
      </div>
      <div style={metricBox("#22c55e","#f0fdf4")}>
        <div style={metricValue("#22c55e")}>{completedToday.length}</div>
        <div style={metricLabel}>הושלמו היום</div>
      </div>
      <div style={metricBox(todayChange===null?"#6b7280":(todayChange>=0?"#22c55e":"#f59e0b"),todayChange===null?"#f9fafb":(todayChange>=0?"#f0fdf4":"#fffbeb"))}>
        <div style={metricValue(todayChange===null?"#6b7280":(todayChange>=0?"#22c55e":"#f59e0b"))}>{todayChange===null?"—":`${todayChange>=0?"+":""}${todayChange}%`}</div>
        <div style={metricLabel}>מאתמול</div>
      </div>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
        <span style={{fontWeight:600,color:"var(--text)"}}>📊 התקדמות יומית</span>
        <span style={{color:deptColor,fontWeight:700}}>{completedToday.length} / {dailyTarget} ({progressPct}%)</span>
      </div>
      <div style={progressBarOuter}>
        <div style={progressBarInner}/>
      </div>
    </div>
    <div style={{marginTop:12,padding:12,background:`${deptColor}10`,borderRadius:10,fontSize:13,color:"var(--text)",display:"flex",alignItems:"center",gap:8}}>
      <span style={{fontSize:18}}>🏆</span>
      <span>השבוע סיימתם <strong style={{color:deptColor}}>{completedThisWeek.length}</strong> משימות</span>
      {completedThisWeek.length>=30&&<span style={{marginInlineStart:"auto",fontSize:12,fontWeight:700,color:deptColor}}>🔥 שיא מצוין!</span>}
    </div>
  </div>;
}

function categorizeOrder(task) {
  const text = ((task.title || '') + ' ' + (task.notes || '')).toLowerCase();
  for (const cat of PRODUCT_CATEGORIES) {
    for (const kw of cat.keywords) {
      if (text.includes(kw.toLowerCase())) return cat;
    }
  }
  return { name: 'אחר', emoji: '❓', keywords: [] };
}

function normalizeAgentName(name) {
  if (!name) return null;
  const trimmed = String(name).trim();
  if (/^כפיר/.test(trimmed)) return 'כפיר';
  return trimmed;
}

function AgentOrdersModal({ agent, orders, period, onClose }) {
  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0 })}`;
  const formatDate = (d) => {
    if (!d) return '';
    const date = d instanceof Date ? d : new Date(d);
    if (isNaN(date.getTime())) return '';
    return date.toLocaleDateString('he-IL') + ' ' +
           String(date.getHours()).padStart(2, '0') + ':' +
           String(date.getMinutes()).padStart(2, '0');
  };

  const totalAmount = orders.reduce((s, o) => s + Number(o.total_amount || 0), 0);

      if (!stats.has(agent)) {

      s.count += 1;

function calculateRollingTargets(allTasks, targetConfig) {
  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth();
  const currentDay = today.getDate();
  const openingEnd = new Date(targetConfig.opening_date);
  openingEnd.setHours(23, 59, 59, 999);

  const yearTasksRaw = (allTasks || []).filter((t) => {
    if (!t.created_at || t.total_amount == null || Number(t.total_amount) <= 0) return false;
    const d = new Date(t.created_at);
    return d.getFullYear() === currentYear && new Date(t.created_at) > openingEnd;
  });

  const soldThisYear = yearTasksRaw.reduce(
    (sum, t) => sum + Number(t.total_amount) / 1.18,
    0,
  );

  const openingAmt = Number(targetConfig.opening_amount) || 0;
  const annualTarget = Number(targetConfig.annual_target) || 0;
  const totalYTD = openingAmt + soldThisYear;
  const remainingYearly = annualTarget - totalYTD;
  const monthsLeft = 12 - currentMonth;
  const monthlyTarget = monthsLeft > 0 ? remainingYearly / monthsLeft : 0;

  const monthTasks = yearTasksRaw.filter((t) => {
    const d = new Date(t.created_at);
    return d.getMonth() === currentMonth;
  });
  const soldThisMonth = monthTasks.reduce(
    (sum, t) => sum + Number(t.total_amount) / 1.18,
    0,
  );

  const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
  let workDaysLeft = 0;
  for (let day = currentDay; day <= lastDay; day++) {
    const d = new Date(currentYear, currentMonth, day);
    const dow = d.getDay();
    if (dow >= 0 && dow <= 4) workDaysLeft++;
  }

  const remainingMonthly = monthlyTarget - soldThisMonth;
  const dailyTarget = workDaysLeft > 0 ? remainingMonthly / workDaysLeft : 0;

  const todayStart = new Date(currentYear, currentMonth, currentDay);
  const tomorrowStart = new Date(currentYear, currentMonth, currentDay + 1);
  const soldToday = (allTasks || [])
    .filter((t) => {
      if (!t.created_at || t.total_amount == null || Number(t.total_amount) <= 0) return false;
      const d = new Date(t.created_at);
      return d >= todayStart && d < tomorrowStart;
    })
    .reduce((sum, t) => sum + Number(t.total_amount) / 1.18, 0);

  return {
    daily: { target: dailyTarget, actual: soldToday, workDaysLeft },
    monthly: { target: monthlyTarget, actual: soldThisMonth },
    yearly: {
      target: annualTarget,
      actual: totalYTD,
      remaining: remainingYearly,
    },
  };
}

function SalesDashboard({allTasks,isA,DEPT_COLORS,onClose}) {
  const [period, setPeriod] = useState('month');
  const [showOtherDetails, setShowOtherDetails] = useState(false);
  const [agentOrdersModal, setAgentOrdersModal] = useState(null);

  if (!isA) return null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayMs = today.getTime();
  const tomorrowMs = todayMs + 86400000;
  const yesterdayMs = todayMs - 86400000;

  // ====================================================================
  // 🔥 תחרות היום
  // ====================================================================
  const getDailyAgentsData = (dayStartMs, dayEndMs) => {
    const agentMap = new Map();
    for (const t of (allTasks || [])) {
      if (!t.total_amount || t.total_amount <= 0) continue;
      const taskDate = t.bina_order_date 
        ? new Date(t.bina_order_date).getTime() 
        : new Date(t.created_at).getTime();
      if (taskDate < dayStartMs || taskDate >= dayEndMs) continue;
      
      const agent = normalizeAgentName(t.sales_agent || t.assignee);
      if (!agent) continue;
      
      const existing = agentMap.get(agent);
      if (existing) {
        existing.revenue += Number(t.total_amount || 0);
        existing.orders += 1;
        if (t.created_at > existing.lastOrderTime) {
          existing.lastOrderTime = t.created_at;
        }
      } else {
        agentMap.set(agent, {
          name: agent,
          revenue: Number(t.total_amount || 0),
          orders: 1,
          lastOrderTime: t.created_at,
        });
      }
    }
    return Array.from(agentMap.values()).sort((a, b) => b.revenue - a.revenue);
  };

  const getTodayCompetitionOrdersForAgent = (agentName) =>
    (allTasks || []).filter((t) => {
      if (!t.total_amount || t.total_amount <= 0) return false;
      const taskDate = t.bina_order_date
        ? new Date(t.bina_order_date).getTime()
        : new Date(t.created_at).getTime();
      if (taskDate < todayMs || taskDate >= tomorrowMs) return false;
      return normalizeAgentName(t.sales_agent || t.assignee) === agentName;
    });

  const todayAgents = getDailyAgentsData(todayMs, tomorrowMs);
  const yesterdayAgents = getDailyAgentsData(yesterdayMs, todayMs);
  
  const todayTotal = todayAgents.reduce((s, a) => s + a.revenue, 0);
  const todayOrdersTotal = todayAgents.reduce((s, a) => s + a.orders, 0);
  const yesterdayTotal = yesterdayAgents.reduce((s, a) => s + a.revenue, 0);
  
  const dayChangePct = yesterdayTotal > 0 
    ? Math.round(((todayTotal - yesterdayTotal) / yesterdayTotal) * 100)
    : null;

  const maxTodayRevenue = Math.max(...todayAgents.map(a => a.revenue), 1);

  // חישוב streak לסוכן מוביל - כמה ימים ברציפות הוא ראשון
  const calcLeaderStreak = () => {
    if (todayAgents.length === 0) return null;
    const leaderName = todayAgents[0].name;
    let streak = 1;
    for (let daysAgo = 1; daysAgo <= 30; daysAgo++) {
      const dayStart = todayMs - (daysAgo * 86400000);
      const dayEnd = dayStart + 86400000;
      const dayData = getDailyAgentsData(dayStart, dayEnd);
      if (dayData.length === 0) break;
      if (dayData[0].name === leaderName) {
        streak++;
      } else {
        break;
      }
    }
    return { leader: leaderName, days: streak };
  };
  const streak = calcLeaderStreak();

  // זמן יחסי מאז הזמנה אחרונה
  const formatTimeAgo = (isoTime) => {
    const t = new Date(isoTime).getTime();
    const diff = Date.now() - t;
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'עכשיו';
    if (mins < 60) return `לפני ${mins} ${mins === 1 ? 'דקה' : 'דקות'}`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `לפני ${hours} ${hours === 1 ? 'שעה' : 'שעות'}`;
    return null;
  };

  // ====================================================================
  // שאר הגרפים (לפי טווח התקופה הנבחר)
  // ====================================================================
  const ranges = {
    month: new Date(today.getFullYear(), today.getMonth(), 1),
    quarter: new Date(today.getFullYear(), today.getMonth() - 3, 1),
    year: new Date(today.getFullYear(), 0, 1),
  };
  const fromDate = ranges[period];

  const tasksInRange = (allTasks || []).filter(t => {
    if (!t.total_amount || t.total_amount <= 0) return false;
    const taskDate = t.bina_order_date 
      ? new Date(t.bina_order_date)
      : new Date(t.created_at);
    return taskDate >= fromDate;
  });

  const totalRevenue = tasksInRange.reduce((sum, t) => sum + Number(t.total_amount || 0), 0);
  const totalOrders = tasksInRange.length;
  const avgOrder = totalOrders > 0 ? totalRevenue / totalOrders : 0;
  const uniqueClients = new Set(tasksInRange.map(t => t.bina_cust_id || t.client_name)).size;

  // מכירות חודשיות
  const monthlyData = (() => {
    const months = [];

      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const next = new Date(today.getFullYear(), today.getMonth() - i + 1, 1);
      const monthTasks = (allTasks || []).filter(t => {
        if (!t.total_amount || t.total_amount <= 0) return false;
        const td = t.bina_order_date ? new Date(t.bina_order_date) : new Date(t.created_at);
        return td >= d && td < next;
      });
      const revenue = monthTasks.reduce((s, t) => s + Number(t.total_amount || 0), 0);
      months.push({
        label: d.toLocaleDateString('he-IL', { month: 'short', year: '2-digit' }),
        revenue: Math.round(revenue),
        orders: monthTasks.length,
        isCurrent: i === 0,
      });
    }
    return months;
  })();
  const maxMonthRevenue = Math.max(...monthlyData.map(m => m.revenue), 1);

  const topClients = (() => {
    const clientMap = new Map();
    for (const t of tasksInRange) {
      const key = t.bina_cust_id || t.client_name || 'לא ידוע';
      const name = t.client_name || `לקוח ${key}`;
      const existing = clientMap.get(String(key));
      if (existing) {
        existing.revenue += Number(t.total_amount || 0);
        existing.orders += 1;
      } else {
        clientMap.set(String(key), { id: key, name, revenue: Number(t.total_amount || 0), orders: 1 });
      }
    }
    return Array.from(clientMap.values()).sort((a, b) => b.revenue - a.revenue).slice(0, 5);
  })();
  const maxClientRevenue = Math.max(...topClients.map(c => c.revenue), 1);

  const agentsData = (() => {
    const agentMap = new Map();
    for (const t of tasksInRange) {
      const agent = normalizeAgentName(t.sales_agent || t.assignee);
      if (!agent) continue;
      const existing = agentMap.get(agent);
      if (existing) {
        existing.revenue += Number(t.total_amount || 0);
        existing.orders += 1;

function QuotesDashboard({allQuotes,allTasks,isA,sb,onQuotesReload}) {
  const [period, setPeriod] = useState('month');
  const [refreshing, setRefreshing] = useState(false);

  if (!isA) return null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // ---------- איחוד שמות סוכנים ----------
  const normalizeAgent = (name) => {
    if (!name) return null;
    const trimmed = String(name).trim();
    if (/^כפיר/.test(trimmed)) return 'כפיר';
    return trimmed;
  };

  // ---------- סינון: רק הצעות "חדשות" (לא קודמות) ----------
  const trackedQuotes = (allQuotes || []).filter(q => 
    q.auto_status && q.auto_status !== 'קודמת'
  );

  // ---------- סינון לפי תקופה ----------
  const ranges = {
    month: new Date(today.getFullYear(), today.getMonth(), 1),
    quarter: new Date(today.getFullYear(), today.getMonth() - 3, 1),
    year: new Date(today.getFullYear(), 0, 1),
  };
  const fromDate = ranges[period];

  const quotesInRange = trackedQuotes.filter(q => {
    const created = new Date(q.created_at);
    return created >= fromDate;
  });

  // ---------- חלוקה לפי סטטוסים ----------
  const byStatus = {
    waiting: quotesInRange.filter(q => q.auto_status === 'ממתינה'),
    stuck: quotesInRange.filter(q => q.auto_status === 'תקועה'),
    closed: quotesInRange.filter(q => q.auto_status === 'נסגרה'),
    expired: quotesInRange.filter(q => q.auto_status === 'פגת תוקף'),
  };

  // ---------- חישובים פיננסיים ----------
  const sumAmount = (arr) => arr.reduce((s, q) => s + Number(q.total_amount || 0), 0);

  const moneyClosed = sumAmount(byStatus.closed);
  const moneyActive = sumAmount(byStatus.waiting) + sumAmount(byStatus.stuck);
  const moneyLost = sumAmount(byStatus.expired);
  const moneyTotal = moneyClosed + moneyActive + moneyLost;

  // ---------- שיעור סגירה ----------
  const totalQuotes = quotesInRange.length;
  const closedQuotes = byStatus.closed.length;
  const closingRate = totalQuotes > 0 ? Math.round((closedQuotes / totalQuotes) * 100) : 0;

  // ---------- "דורש פעולה" - הצעות תקועות + ממתינות 3+ ימים ----------
  const needsAction = [...byStatus.stuck, ...byStatus.waiting.filter(q => {
    const days = (Date.now() - new Date(q.created_at).getTime()) / 86400000;
    return days >= 3;
  })].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  // ---------- ביצועי סוכנים ----------
  const agentsData = (() => {
    const map = new Map();
    for (const q of quotesInRange) {
      const agent = normalizeAgent(q.sales_agent);
      if (!agent) continue;
      if (!map.has(agent)) {
        map.set(agent, {
          name: agent,
          total: 0,
          closed: 0,
          revenueClosed: 0,
          revenueLost: 0,
        });
      }
      const data = map.get(agent);
      data.total += 1;
      if (q.auto_status === 'נסגרה') {
        data.closed += 1;
        data.revenueClosed += Number(q.total_amount || 0);
      } else if (q.auto_status === 'פגת תוקף') {
        data.revenueLost += Number(q.total_amount || 0);
      }
    }
    return Array.from(map.values()).map(a => ({
      ...a,
      closingRate: a.total > 0 ? Math.round((a.closed / a.total) * 100) : 0,
    })).sort((a, b) => b.closingRate - a.closingRate);
  })();

  // ---------- ביצועי לקוחות ----------
  const clientsData = (() => {
    const map = new Map();
    for (const q of quotesInRange) {
      const key = q.bina_cust_id || q.bina_cust_name || 'unknown';
      const name = q.bina_cust_name || `לקוח ${key}`;
      if (!map.has(String(key))) {
        map.set(String(key), { id: key, name, total: 0, closed: 0, revenue: 0 });
      }
      const data = map.get(String(key));
      data.total += 1;
      if (q.auto_status === 'נסגרה') {
        data.closed += 1;
        data.revenue += Number(q.total_amount || 0);
      }
    }
    return Array.from(map.values())
      .filter(c => c.total >= 1)
      .map(c => ({ ...c, closingRate: Math.round((c.closed / c.total) * 100) }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);
  })();

  // ---------- מגמה חודשית ----------

    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const next = new Date(today.getFullYear(), today.getMonth() - i + 1, 1);
      const monthQuotes = trackedQuotes.filter(q => {
        const c = new Date(q.created_at);
        return c >= d && c < next;
      });
      const closedCount = monthQuotes.filter(q => q.auto_status === 'נסגרה').length;
      const totalCount = monthQuotes.length;
      months.push({
        label: d.toLocaleDateString('he-IL', { month: 'short', year: '2-digit' }),
        total: totalCount,
        closed: closedCount,
        rate: totalCount > 0 ? Math.round((closedCount / totalCount) * 100) : 0,

    }
    return months;
  })();

// פונקציות עזר (זהות ל-V3)
// ============================================================
function endOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth() + 1, 0);
}

function calculateDueDate(invoiceDate, paymentTerms) {
  if (!invoiceDate || !paymentTerms) return null;
  const invDate = invoiceDate instanceof Date ? invoiceDate : new Date(invoiceDate);
  if (isNaN(invDate.getTime())) return null;
  
  const pt = String(paymentTerms).replace(/\s/g, '').replace('שוטף+', '').trim();
  const immediateTerms = ['אשראי', 'מיידי', 'תשלוםמידבהוצאתהחשבונית', 'העברהבהוצאתהחשבונית', "צ'קבהוצאתהחשבונית", 'תשלוםבהוצאתהחשבונית'];
  if (immediateTerms.includes(pt)) return new Date(invDate);
  
  const n = parseInt(pt, 10);
  if (isNaN(n)) return null;
  
  const endInvMonth = endOfMonth(invDate);
  const fullMonths = Math.floor(n / 30);
  const remainder = n % 30;
  
  if (remainder === 0) {
    const year = endInvMonth.getFullYear();
    let month = endInvMonth.getMonth() + fullMonths;
    let yearAdj = year;
    while (month > 11) { month -= 12; yearAdj += 1; }
    return endOfMonth(new Date(yearAdj, month, 1));
  } else {
    const rawDate = new Date(endInvMonth);
    rawDate.setDate(rawDate.getDate() + n);
    const rightDigit = n % 10;
    let day;
    if (rightDigit === 5) day = 15;
    else if (rightDigit === 0) day = remainder;
    else day = rightDigit;
    const result = new Date(rawDate.getFullYear(), rawDate.getMonth(), day);
    if (result.getMonth() !== rawDate.getMonth()) return endOfMonth(rawDate);
    return result;
  }
}

async function exportToExcel(data, filename, reportTitle) {
  try {
    if (typeof XLSX === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('טעינת ספריית Excel נכשלה'));
        document.head.appendChild(script);
      });
    }

    const formatDate = (d) => {
      if (!d) return '';
      const date = d instanceof Date ? d : new Date(d);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('he-IL');
    };

    const wb = XLSX.utils.book_new();

    const summaryData = [
      [reportTitle || 'דוח גבייה'],
      [`הופק: ${new Date().toLocaleDateString('he-IL')} ${new Date().toLocaleTimeString('he-IL').slice(0, 5)}`],
      [],
      ['#', 'שם לקוח', 'תנאי תשלום', 'איש קשר', 'טלפון', 'מס\' חשבוניות', 'סה"כ חוב'],
    ];

    data.clients.forEach((c, idx) => {
      summaryData.push([

function MoranMonthlyReport({ clientsWithInvoices }) {
  const [selectedMonth, setSelectedMonth] = useState('');

  const availableMonths = useMemo(() => {
    const monthsSet = new Set();
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        if (inv.calculated_due_date) {
          const m = inv.calculated_due_date;
          const key = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`;
          monthsSet.add(key);
        }
      }
    }
    return Array.from(monthsSet).sort();
  }, [clientsWithInvoices]);

  const monthReport = useMemo(() => {
    if (!selectedMonth) return null;

    const [yearStr, monthStr] = selectedMonth.split('-');
    const year = parseInt(yearStr, 10);
    const month = parseInt(monthStr, 10) - 1;

    const clientsMap = new Map();
    let totalAmount = 0;
    let totalInvoices = 0;

    for (const client of clientsWithInvoices) {
      const relevantInvoices = client.invoices.filter((inv) => {
        if (!inv.calculated_due_date) return false;
        return inv.calculated_due_date.getFullYear() === year &&
          inv.calculated_due_date.getMonth() === month;
      });

      if (relevantInvoices.length === 0) continue;

      const clientTotal = relevantInvoices.reduce((s, i) => s + Number(i.doc_balance), 0);
      clientsMap.set(client.bina_customer_id, {
        ...client,
        invoices: relevantInvoices,
        total: clientTotal,
      });
      totalAmount += clientTotal;
      totalInvoices += relevantInvoices.length;
    }

    return {
      clients: Array.from(clientsMap.values()).sort((a, b) => b.total - a.total),
      total: totalAmount,
      invoicesCount: totalInvoices,
    };
  }, [clientsWithInvoices, selectedMonth]);

  const monthLabel = useMemo(() => {
    if (!selectedMonth) return '';
    const [year, month] = selectedMonth.split('-');
    const d = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
    return d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
  }, [selectedMonth]);

  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0 })}`;

  return (
    <div style={{
      background: 'linear-gradient(135deg, #eff6ff, #fff)',
      padding: 16, borderRadius: 12, marginBottom: 20,
      border: '2px solid #3b82f680',
    }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 6 }}>
          📊 דוח תחזית גבייה למורן - בחר חודש:
        </div>
        <select
          value={selectedMonth}
          onChange={(e) => setSelectedMonth(e.target.value)}
          style={{
            padding: '8px 12px', fontSize: 14, border: '1px solid #3b82f6',
            borderRadius: 6, fontFamily: 'inherit', cursor: 'pointer', minWidth: 180,
          }}
        >
          <option value="">-- בחר חודש --</option>
          {availableMonths.map((m) => {
            const [y, mo] = m.split('-');
            const d = new Date(parseInt(y, 10), parseInt(mo, 10) - 1, 1);
            return (
              <option key={m} value={m}>
                {d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' })}
              </option>
            );
          })}
        </select>

        {monthReport && (
          <>
            <span style={{ color: '#6b7280', fontSize: 13 }}>
              ({monthReport.clients.length} לקוחות · {monthReport.invoicesCount} חשבוניות · {fmtCurrency(monthReport.total)})
            </span>
            <button
              type="button"
              onClick={() => { void exportMoranReportToExcel(monthReport, monthLabel); }}
              style={{
                padding: '6px 14px', background: '#10b981', color: '#fff',
                border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
                cursor: 'pointer', fontFamily: 'inherit',
              }}
            >
              📊 Excel למורן
            </button>
            <button
              type="button"
              onClick={() => openMoranPrintWindow(monthReport, monthLabel)}
              style={{
                padding: '6px 14px', background: '#3b82f6', color: '#fff',
                border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
                cursor: 'pointer', fontFamily: 'inherit',
              }}
            >
              🖨️ PDF למורן
            </button>
          </>
        )}
      </div>

      {monthReport && monthReport.clients.length === 0 && (
        <div style={{ fontSize: 13, color: '#6b7280', padding: 10 }}>
          אין חשבוניות לתשלום בחודש זה
        </div>
      )}
    </div>
  );
}

function isPromiseFulfilled(promise, allActions) {
  if (!promise.created_at) return false;
  const promiseTime = new Date(promise.created_at).getTime();
  return (allActions || []).some((a) =>
    a.action_type && a.action_type.startsWith('paid_') &&
    new Date(a.created_at).getTime() > promiseTime
  );
}

function BrokenPromisesAlert({ brokenPromises }) {
  if (!brokenPromises || brokenPromises.length === 0) return null;

  return (
    <div style={{
      background: 'linear-gradient(135deg, #fef2f2, #fff)',
      border: '2px solid #dc2626',
      borderRadius: 12,
      padding: 16,
      marginBottom: 20,
      boxShadow: '0 2px 8px rgba(220, 38, 38, 0.1)',
    }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
        <span style={{ fontSize: 24 }}>🔔</span>
        <div>
          <div style={{ fontSize: 16, fontWeight: 800, color: '#dc2626' }}>
            הבטחות שלא קוימו ({brokenPromises.length})
          </div>
          <div style={{ fontSize: 12, color: '#7f1d1d' }}>
            לקוחות שהתחייבו לשלם ועברו את התאריך
          </div>
        </div>
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {brokenPromises.slice(0, 5).map((bp, idx) => (
          <div key={idx} style={{
            padding: '8px 12px',
            background: '#fff',
            borderRadius: 6,
            border: '1px solid #fecaca',
            display: 'flex',
            justifyContent: 'space-between',
            alignItems: 'center',
            gap: 10,
            flexWrap: 'wrap',
          }}>
            <div style={{ flex: 1, minWidth: 200 }}>
              <div style={{ fontSize: 13, fontWeight: 700, color: '#1E3A52' }}>
                {bp.client.name}
              </div>
              <div style={{ fontSize: 11, color: '#6b7280', marginTop: 2 }}>
                הבטיח לשלם {bp.promiseDate.toLocaleDateString('he-IL')} ·
                <span style={{ color: '#dc2626', fontWeight: 700, marginInlineStart: 4 }}>
                  עברו {bp.daysLate} ימים
                </span>
              </div>
              {bp.promise.notes && (
                <div style={{ fontSize: 11, color: '#4b5563', marginTop: 2, fontStyle: 'italic' }}>
                  {`"${bp.promise.notes}"`}
                </div>
              )}
            </div>
            <div style={{ fontSize: 14, fontWeight: 700, color: '#dc2626' }}>
              {bp.promise.amount || bp.promise.promised_amount
                ? `₪${Number(bp.promise.amount || bp.promise.promised_amount).toLocaleString('he-IL')}`
                : ''}
            </div>
          </div>
        ))}
      </div>

      {brokenPromises.length > 5 && (
        <div style={{ marginTop: 8, fontSize: 12, color: '#7f1d1d', textAlign: 'center' }}>
          + עוד {brokenPromises.length - 5} הבטחות שעברו תאריך...
        </div>
      )}
    </div>
  );
}

// ============================================================
function DebtCollectionDashboard({ allClients, debtSnapshots, isA, sb, onDebtReload, collectorName }) {
  const [refreshing, setRefreshing] = useState(false);
  const [actions, setActions] = useState([]);
  const [actionModal, setActionModal] = useState(null);
  const [emailModal, setEmailModal] = useState(null);
  const [printData, setPrintData] = useState(null);
  
  // 🆕 בורר תאריך לדוח גלובלי
  const [globalReportDate, setGlobalReportDate] = useState('');
  const [showGlobalReport, setShowGlobalReport] = useState(false);

  if (!isA) return null;

  useEffect(() => {
    if (!sb) return;
    sb('debt_actions?order=created_at.desc&limit=500')
      .then(data => setActions(data || []))
      .catch(() => setActions([]));
  }, [sb]);

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayMs = today.getTime();

  // מפת לקוחות
  const clientsMap = useMemo(() => {
    const map = new Map();
    for (const c of (allClients || [])) {
      if (c.bina_customer_id) map.set(String(c.bina_customer_id), c);
    }
    return map;
  }, [allClients]);

  // בניית רשימת לקוחות עם חשבוניות + תאריכי פירעון מחושבים
  const clientsWithInvoices = useMemo(() => {
    const map = new Map();
    for (const d of (debtSnapshots || [])) {
      if (!d.bina_customer_id || !d.doc_balance || d.doc_balance <= 0) continue;
      const key = String(d.bina_customer_id);
      const client = clientsMap.get(key);
      
      if (!map.has(key)) {
        map.set(key, {
          bina_customer_id: key,
          name: client?.name || d.customer_name || `לקוח #${key}`,
          client_name: client?.name || d.customer_name || `לקוח #${key}`,
          payment_terms: client?.payment_terms || '',
          contact_name: client?.contact_name || '',
          phone: client?.phone || '',
          email: client?.email || '',
          collection_email_primary: client?.collection_email_primary || '',
          collection_email_secondary: client?.collection_email_secondary || '',
          client_id: client?.id || null,
          total_debt: 0,
          invoices: [],
        });
      }
      const c = map.get(key);
      const calculatedDueDate = c.payment_terms 
        ? calculateDueDate(d.doc_date, c.payment_terms)
        : (d.doc_payment_date ? new Date(d.doc_payment_date) : null);
      
      c.invoices.push({ ...d, calculated_due_date: calculatedDueDate });
      c.total_debt += Number(d.doc_balance);
    }
    
    for (const c of map.values()) {
      c.invoices.sort((a, b) => {
        const da = a.calculated_due_date ? a.calculated_due_date.getTime() : 0;
        const db = b.calculated_due_date ? b.calculated_due_date.getTime() : 0;
        return da - db;
      });
    }

    for (const c of map.values()) {
      c.actions = (actions || []).filter((a) =>
        String(a.bina_customer_id) === c.bina_customer_id
      ).sort((a, b) => new Date(b.created_at).getTime() - new Date(a.created_at).getTime());
    }

    return Array.from(map.values());
  }, [debtSnapshots, clientsMap, actions]);

  const brokenPromises = useMemo(() => {
    const list = [];
    for (const client of clientsWithInvoices) {
      const promises = (client.actions || []).filter((a) =>
        a.action_type === 'promised_to_pay' &&
        a.promised_date &&
        !isPromiseFulfilled(a, client.actions)
      );

      for (const promise of promises) {
        const promiseDate = new Date(promise.promised_date);
        promiseDate.setHours(0, 0, 0, 0);
        if (promiseDate.getTime() < todayMs) {
          const daysLate = Math.floor((todayMs - promiseDate.getTime()) / 86400000);
          list.push({ client, promise, daysLate, promiseDate });
        }
      }
    }
    return list.sort((a, b) => b.daysLate - a.daysLate);
  }, [clientsWithInvoices, todayMs]);

  // קטגוריזציה
  const categorizeInvoice = (inv) => {
    if (!inv.calculated_due_date) return { type: 'future', daysAway: 999 };
    const dueDate = new Date(inv.calculated_due_date);
    dueDate.setHours(0, 0, 0, 0);
    const dueMs = dueDate.getTime();
    const daysFromToday = Math.floor((dueMs - todayMs) / 86400000);
    if (daysFromToday < 0) return { type: 'overdue', month: dueDate, daysOverdue: -daysFromToday };
    if (daysFromToday <= 7) return { type: 'thisWeek', daysAway: daysFromToday };
    if (daysFromToday <= 30) return { type: 'thisMonth', daysAway: daysFromToday };
    if (daysFromToday <= 90) return { type: 'soon', daysAway: daysFromToday };
    return { type: 'future', daysAway: daysFromToday };
  };

  // 🆕 קיבוץ עבר לפי חודש - **מאוחד לפי לקוח**
  const overdueByMonth = useMemo(() => {
    const monthMap = new Map();
    
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type !== 'overdue') continue;
        
        const monthKey = `${cat.month.getFullYear()}-${String(cat.month.getMonth() + 1).padStart(2, '0')}`;
        if (!monthMap.has(monthKey)) {
          monthMap.set(monthKey, {
            key: monthKey,
            label: cat.month.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' }),
            year: cat.month.getFullYear(),
            month: cat.month.getMonth(),
            clientsMap: new Map(), // לקוח -> { ...client, invoices: [], total }
            total: 0,
            invoicesCount: 0,
            sortKey: cat.month.getTime(),
          });
        }
        const m = monthMap.get(monthKey);
        
        // איחוד תחת לקוח
        if (!m.clientsMap.has(client.bina_customer_id)) {
          m.clientsMap.set(client.bina_customer_id, {
            ...client,
            invoices: [],
            total: 0,
            maxDaysOverdue: 0,
          });
        }
        const c = m.clientsMap.get(client.bina_customer_id);
        c.invoices.push({ ...inv, daysOverdue: cat.daysOverdue });
        c.total += Number(inv.doc_balance);
        c.maxDaysOverdue = Math.max(c.maxDaysOverdue, cat.daysOverdue);
        
        m.total += Number(inv.doc_balance);
        m.invoicesCount += 1;
      }
    }
    
    // המרה למערך עם clients ממוין לפי גודל
    return Array.from(monthMap.values())
      .map(m => ({
        ...m,
        clients: Array.from(m.clientsMap.values()).sort((a, b) => b.total - a.total),
      }))
      .sort((a, b) => a.sortKey - b.sortKey);
  }, [clientsWithInvoices]);

  // 🆕 קיבוץ "השבוע" / "החודש" / "בקרוב" - גם לפי לקוח
  const groupInvoicesByClient = (invoicesWithCat) => {
    const clientMap = new Map();
    for (const item of invoicesWithCat) {
      const key = item.client.bina_customer_id;
      if (!clientMap.has(key)) {
        clientMap.set(key, {
          ...item.client,
          invoices: [],
          total: 0,
          minDaysAway: 999,
        });
      }
      const c = clientMap.get(key);
      c.invoices.push({ ...item.inv, daysAway: item.daysAway });
      c.total += Number(item.inv.doc_balance);
      c.minDaysAway = Math.min(c.minDaysAway, item.daysAway);
    }
    return Array.from(clientMap.values()).sort((a, b) => b.total - a.total);
  };

  const thisWeekClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'thisWeek') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  const thisMonthClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'thisMonth') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  const soonClients = useMemo(() => {
    const items = [];
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        const cat = categorizeInvoice(inv);
        if (cat.type === 'soon') items.push({ client, inv, daysAway: cat.daysAway });
      }
    }
    return groupInvoicesByClient(items);
  }, [clientsWithInvoices]);

  // 🆕 דוח גלובלי "עד תאריך X"
  const globalReport = useMemo(() => {
    if (!globalReportDate) return null;
    const targetDate = new Date(globalReportDate);
    targetDate.setHours(23, 59, 59, 999);
    const targetMs = targetDate.getTime();
    
    const clientMap = new Map();
    let grandTotal = 0;
    let totalInvoices = 0;
    
    for (const client of clientsWithInvoices) {
      const relevantInvoices = client.invoices.filter(inv => {
        if (!inv.calculated_due_date) return false;
        return inv.calculated_due_date.getTime() <= targetMs;
      });
      
      if (relevantInvoices.length === 0) continue;
      
      const clientTotal = relevantInvoices.reduce((s, i) => s + Number(i.doc_balance), 0);
      clientMap.set(client.bina_customer_id, {
        ...client,
        invoices: relevantInvoices.map(inv => {
          const days = Math.floor((todayMs - inv.calculated_due_date.getTime()) / 86400000);
          return { ...inv, daysOverdue: Math.max(0, days) };
        }),
        total: clientTotal,
      });
      grandTotal += clientTotal;
      totalInvoices += relevantInvoices.length;
    }
    
    return {
      targetDate: globalReportDate,
      clients: Array.from(clientMap.values()).sort((a, b) => b.total - a.total),
      grandTotal,
      totalInvoices,
      clientsCount: clientMap.size,
    };
  }, [clientsWithInvoices, globalReportDate]);

  const totalOverdue = overdueByMonth.reduce((s, m) => s + m.total, 0);
  const totalThisWeek = thisWeekClients.reduce((s, c) => s + c.total, 0);
  const totalThisMonth = thisMonthClients.reduce((s, c) => s + c.total, 0);
  const totalClients = clientsWithInvoices.length;

  // פעולות
  const handleRefresh = async () => {
    setRefreshing(true);
    try {
      const { error } = await supabaseClient.functions.invoke('bina-fetch-debt-report', { body: {} });
      if (error) throw error;
      await new Promise((r) => setTimeout(r, 1500));
      if (onDebtReload) await onDebtReload();
    } catch (e) {
      alert("שגיאה ברענון: " + (e && e.message ? e.message : String(e)));
    } finally {
      setRefreshing(false);
    }
  };

  const handleSendEmail = (client, emailType) => {
    if (!client.collection_email_primary) {
      setEmailModal({ client, mode: 'addEmail', pendingType: emailType });
      return;
    }
    setEmailModal({ client, mode: 'confirmSend', emailType });
  };

  // 🆕 שליחת מייל חכמה - לפי סוג מסננת חשבוניות
  const sendEmail = async (client, emailType) => {
    try {
      // סינון חשבוניות לפי סוג המייל:
      // reminder = רק חשבוניות עתידיות (לא באיחור)
      // inquiry = רק חשבוניות באיחור
      const filteredInvoices = client.invoices.filter(inv => {
        if (!inv.calculated_due_date) return false;
        const dueMs = inv.calculated_due_date.getTime();
        const isOverdue = dueMs < todayMs;
        return emailType === 'inquiry' ? isOverdue : !isOverdue;
      });
      
      if (filteredInvoices.length === 0) {
        alert(emailType === 'inquiry' 
          ? '✅ אין חשבוניות באיחור ללקוח זה'
          : '✅ אין חשבוניות לתשלום עתידי ללקוח זה');
        return false;
      }
      
      const invoicesForEmail = filteredInvoices.map((inv) => {
        const dueMs = inv.calculated_due_date ? inv.calculated_due_date.getTime() : 0;
        const dOver = dueMs ? Math.max(0, Math.floor((todayMs - dueMs) / 86400000)) : 0;
        return {
        doc_num: inv.doc_num,
        doc_balance: inv.doc_balance,
        doc_date: inv.doc_date,
        doc_payment_date: inv.calculated_due_date
          ? inv.calculated_due_date.toISOString().split("T")[0]
          : inv.doc_payment_date,
        days_overdue: dOver,
        };
      });
      
      const { data, error } = await supabaseClient.functions.invoke('send-collection-email', {
        body: {
          bina_customer_id: client.bina_customer_id,
          email_type: emailType,
          invoices: invoicesForEmail,
        },
      });
      
      if (error || !data?.success) {
        alert(`❌ שגיאה: ${data?.error || error?.message || 'לא ידוע'}`);
        return false;
      }
      
      alert(`✅ נשלח ל-${data.sent_to.join(', ')}\n${filteredInvoices.length} חשבוניות · סכום: ₪${Number(data.total_amount).toLocaleString('he-IL')}`);
      return true;
    } catch (e) {
      alert('שגיאה: ' + e.message);
      return false;
    }
  };

  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
  const formatDate = (d) => {
    if (!d) return '';
    const date = d instanceof Date ? d : new Date(d);
    if (isNaN(date.getTime())) return '';
    return date.toLocaleDateString('he-IL');
  };

  const wrapStyle = { direction: 'rtl', padding: 16, background: '#f8fafa', minHeight: 'calc(100vh - 56px)' };
  const titleStyle = { fontSize: 24, fontWeight: 800, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 10 };
  const headerStyle = { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 };
  const kpisRow = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12, marginBottom: 20 };
  const kpiCard = (color, bg) => ({ background: bg, padding: 16, borderRadius: 12, border: `1px solid ${color}30` });
  const kpiValue = (color) => ({ fontSize: 26, fontWeight: 800, color, lineHeight: 1.1, marginBottom: 4 });
  const kpiLabel = { fontSize: 12, color: '#6b7280', fontWeight: 600 };
  const sectionCard = { background: '#fff', padding: 0, borderRadius: 12, marginBottom: 16, border: '1px solid #e5e7eb', overflow: 'hidden' };
  const sectionHeaderStyle = (bg, color) => ({
    padding: '16px 20px', background: bg, color: color || '#1E3A52',
    display: 'flex', justifyContent: 'space-between', alignItems: 'center',
    fontSize: 15, fontWeight: 700, gap: 10, flexWrap: 'wrap',
  });
  const miniBtn = (color) => ({
    padding: '6px 10px', border: `1px solid ${color}40`,
    borderRadius: 6, background: '#fff', color, cursor: 'pointer',
    fontSize: 13, fontFamily: 'inherit', transition: 'all 0.15s',
  });

  const renderClientActions = (client) => {
    if (!client.actions || client.actions.length === 0) return null;

    const actionTypeInfo = (type) => DEBT_ACTION_TYPES[type] || { emoji: '📌', label: type, color: '#6b7280' };

    const formatDateTime = (d) => {
      if (!d) return '';
      const date = new Date(d);
      return `${String(date.getDate()).padStart(2, '0')}/${String(date.getMonth() + 1).padStart(2, '0')} ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;
    };

    return (
      <div style={{
        marginTop: 10,
        padding: '10px 14px',
        background: '#f8fafa',
        borderRadius: 6,
        border: '1px solid #e5e7eb',
      }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: '#1E3A52', marginBottom: 8 }}>
          📜 היסטוריית פעולות ({client.actions.length}):
        </div>

        {client.actions.map((action, idx) => {
          const info = actionTypeInfo(action.action_type);
          return (
            <div key={action.id || idx} style={{
              padding: '6px 8px',
              marginBottom: 4,
              background: '#fff',
              borderRadius: 4,
              borderRight: `3px solid ${info.color}`,
              fontSize: 12,
              lineHeight: 1.5,
            }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                  <span style={{ fontSize: 14 }}>{info.emoji}</span>
                  <strong style={{ color: info.color }}>{info.label}</strong>
                  {action.amount && (
                    <span style={{ color: '#1E3A52', fontWeight: 700, marginInlineStart: 4 }}>
                      ₪{Number(action.amount).toLocaleString('he-IL')}
                    </span>
                  )}
                  {action.promised_date && (
                    <span style={{ background: '#fef3c7', color: '#92400e', padding: '1px 6px', borderRadius: 4, fontSize: 11 }}>
                      📅 {new Date(action.promised_date).toLocaleDateString('he-IL')}
                    </span>
                  )}
                </div>
                <div style={{ fontSize: 11, color: '#6b7280' }}>
                  {formatDateTime(action.created_at)} · {action.created_by || 'admin'}
                </div>
              </div>
              {action.notes && (
                <div style={{ marginTop: 4, color: '#4b5563', fontSize: 12 }}>
                  {action.notes}
                </div>
              )}
            </div>
          );
        })}
      </div>
    );
  };

  // 🆕 רינדור כרטיס לקוח עם חשבוניות מאוחדות
  const renderClientCard = (client, mode) => {
    const isOverdue = mode === 'overdue' || (client.maxDaysOverdue && client.maxDaysOverdue > 0);
    
    return (
      <div key={client.bina_customer_id} style={{ padding: 14, borderBottom: '1px solid #f1f5f9' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 10, flexWrap: 'wrap', marginBottom: 10 }}>
          <div style={{ flex: 1, minWidth: 240 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: '#1E3A52' }}>
              {client.name}
              {client.payment_terms && (
                <span style={{ marginInlineStart: 8, fontSize: 11, color: '#6b7280', fontWeight: 500 }}>
                  ({client.payment_terms})
                </span>
              )}
              {client.contact_name && (
                <span style={{ marginInlineStart: 8, fontSize: 11, color: '#3b82f6', fontWeight: 500 }}>
                  · {client.contact_name}
                </span>
              )}
              {client.phone && (
                <span style={{ marginInlineStart: 6, fontSize: 11, color: '#6b7280' }}>
                  · {client.phone}
                </span>
              )}
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ fontSize: 20, fontWeight: 800, color: '#1E3A52' }}>
              {fmtCurrency(client.total)}
            </div>
            <div style={{ display: 'flex', gap: 4 }}>
              <button onClick={() => setActionModal({ customer: client, type: 'called' })} title="התקשרתי" style={miniBtn('#3b82f6')}>📞</button>
              <button onClick={() => handleSendEmail(client, isOverdue ? 'inquiry' : 'reminder')} 
                title={isOverdue ? 'בקש בירור' : 'תזכורת'} style={miniBtn(isOverdue ? '#dc2626' : '#8b5cf6')}>📧</button>
              <button onClick={() => setActionModal({ customer: client, type: 'promised_to_pay' })} title="הבטיח לשלם" style={miniBtn('#f59e0b')}>🤝</button>
              <button onClick={() => setActionModal({ customer: client, type: 'paid_transfer' })} title="שולם הכל" style={miniBtn('#10b981')}>💰</button>
            </div>
          </div>
        </div>
        
        {/* 🆕 פירוט חשבוניות בקו אחד */}
        <div style={{ fontSize: 12, color: '#4b5563', paddingInlineStart: 4, lineHeight: 1.8 }}>
          <strong style={{ color: '#1E3A52' }}>📋 {client.invoices.length} חשבוניות:</strong>{' '}
          {client.invoices.map((inv, idx) => (
            <span key={inv.doc_num} style={{ display: 'inline-block', marginInlineEnd: 8 }}>
              <button
                onClick={() => setActionModal({ customer: client, type: 'paid_transfer', specificInvoice: inv })}
                title={`סמן חשבונית ${inv.doc_num} כשולמה`}
                style={{
                  background: inv.daysOverdue > 0 ? '#fef2f2' : '#f0fdfa',
                  border: `1px solid ${inv.daysOverdue > 0 ? '#fecaca' : '#a7f3d0'}`,
                  borderRadius: 4, padding: '2px 6px', cursor: 'pointer',
                  color: '#1E3A52', fontSize: 12, fontFamily: 'inherit',
                }}
              >
                #{inv.doc_num} ({fmtCurrency(inv.doc_balance)})
                {inv.daysOverdue > 0 && <span style={{ color: '#dc2626', marginInlineStart: 4 }}>⏰{inv.daysOverdue}י'</span>}
              </button>
            </span>
          ))}
        </div>
        {(client.collection_email_primary || client.collection_email_secondary) && (
          <div style={{
            marginTop: 8, padding: '6px 10px', background: '#f0fdfa',
            borderRadius: 4, fontSize: 12, color: '#1E3A52',
            display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap',
          }}>
            <span style={{ color: '#3DB5B1' }}>📧</span>
            <span style={{ direction: 'ltr' }}>
              {client.collection_email_primary}
              {client.collection_email_secondary && (
                <span style={{ marginInlineStart: 6, color: '#6b7280' }}>
                  + {client.collection_email_secondary}
                </span>
              )}
            </span>
            <button
              type="button"
              onClick={() => setEmailModal({ client, mode: 'editEmail' })}
              style={{
                marginInlineStart: 'auto', background: 'transparent', border: '1px solid #3DB5B1',
                color: '#3DB5B1', borderRadius: 4, padding: '2px 8px', cursor: 'pointer',
                fontSize: 11, fontFamily: 'inherit',
              }}
            >
              ✏️ ערוך
            </button>
          </div>
        )}
        {renderClientActions(client)}
      </div>
    );
  };

  return (
    <div style={wrapStyle}>
      <div style={headerStyle}>
        <div style={titleStyle}>💰 דשבורד גבייה</div>
        <button onClick={handleRefresh} disabled={refreshing} style={{
          padding: '8px 14px', borderRadius: 8, fontSize: 13, fontWeight: 600,
          background: '#fff', color: '#3DB5B1', border: '1px solid #e5e7eb',
          cursor: refreshing ? 'wait' : 'pointer', fontFamily: 'inherit',
          opacity: refreshing ? 0.6 : 1,
        }}>
          {refreshing ? '⏳ מרענן...' : '🔄 רענן דוח'}
        </button>
      </div>

      {/* KPIs */}
      <div style={kpisRow}>
        <div style={kpiCard('#dc2626', '#fef2f2')}>
          <div style={kpiValue('#dc2626')}>{fmtCurrency(totalOverdue)}</div>
          <div style={kpiLabel}>🔥 חוב בעבר</div>
        </div>
        <div style={kpiCard('#f59e0b', '#fffbeb')}>
          <div style={kpiValue('#f59e0b')}>{fmtCurrency(totalThisWeek)}</div>
          <div style={kpiLabel}>📅 השבוע</div>
        </div>
        <div style={kpiCard('#3b82f6', '#eff6ff')}>
          <div style={kpiValue('#3b82f6')}>{fmtCurrency(totalThisMonth)}</div>
          <div style={kpiLabel}>📆 החודש</div>
        </div>
        <div style={kpiCard('#9333ea', '#faf5ff')}>
          <div style={kpiValue('#9333ea')}>{totalClients}</div>
          <div style={kpiLabel}>👥 לקוחות חייבים</div>
        </div>
      </div>

      <BrokenPromisesAlert brokenPromises={brokenPromises} />

      <MoranMonthlyReport clientsWithInvoices={clientsWithInvoices} />

      {/* 🆕 בורר תאריך לדוח גלובלי */}
      <div style={{
        background: 'linear-gradient(135deg, #faf5ff, #fff)',
        padding: 16, borderRadius: 12, marginBottom: 20,
        border: '2px solid #9333ea30',
        display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap',
      }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 6 }}>
          📊 דוח גבייה כולל עד תאריך:
        </div>
        <input
          type="date"
          value={globalReportDate}
          onChange={e => setGlobalReportDate(e.target.value)}
          style={{
            padding: '8px 12px', fontSize: 14, border: '1px solid #d8b4fe',
            borderRadius: 6, fontFamily: 'inherit', direction: 'ltr',
          }}
        />
        {globalReport && (
          <>
            <span style={{ color: '#6b7280', fontSize: 13 }}>
              ({globalReport.clientsCount} לקוחות · {globalReport.totalInvoices} חשבוניות · {fmtCurrency(globalReport.grandTotal)})
            </span>
            <button onClick={() => setShowGlobalReport(!showGlobalReport)} style={{
              padding: '6px 14px', background: '#9333ea', color: '#fff',
              border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              {showGlobalReport ? '🔼 הסתר' : '🔽 הצג דוח'}
            </button>
            <button onClick={() => setPrintData({ 
              type: 'global', 
              title: `דוח גבייה עד ${formatDate(globalReportDate)}`,
              data: globalReport,
            })} style={{
              padding: '6px 14px', background: '#fff', color: '#9333ea',
              border: '1px solid #9333ea', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              🖨️ הדפס
            </button>
            <button onClick={() => { void exportToExcel(globalReport, `דוח_גביה_עד_${globalReportDate}.xlsx`, `דוח גבייה עד ${formatDate(globalReportDate)}`); }} style={{
              padding: '6px 14px', background: '#fff', color: '#10b981',
              border: '1px solid #10b981', borderRadius: 6, fontWeight: 700, fontSize: 13,
              cursor: 'pointer', fontFamily: 'inherit',
            }}>
              📊 Excel
            </button>
          </>
        )}
      </div>

      {/* תצוגת דוח גלובלי */}
      {showGlobalReport && globalReport && (
        <div style={{ ...sectionCard, border: '2px solid #9333ea' }}>
          <div style={{ ...sectionHeaderStyle('linear-gradient(135deg, #faf5ff, #fff)') }}>
            <span style={{ fontSize: 16 }}>📊 דוח גבייה עד {formatDate(globalReportDate)}</span>
            <span style={{ color: '#9333ea', fontWeight: 700 }}>{fmtCurrency(globalReport.grandTotal)}</span>
          </div>
          {globalReport.clients.map(c => renderClientCard(c, 'overdue'))}
        </div>
      )}

      {/* חוב באיחור - לפי חודש */}
      {overdueByMonth.length > 0 && (
        <div>
          <h3 style={{ fontSize: 18, fontWeight: 700, color: '#dc2626', margin: '24px 0 12px' }}>
            🔥 דחוף - חוב באיחור (לפי חודש פירעון)
          </h3>
          {overdueByMonth.map((month, idx) => (
            <details key={month.key} style={sectionCard} open={idx < 2}>
              <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #fef2f2, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <span style={{ fontSize: 16 }}>📅 {month.label}</span>
                  <span style={{ background: '#dc2626', color: '#fff', padding: '2px 10px', borderRadius: 12, fontSize: 12, fontWeight: 700 }}>
                    {month.clients.length} לקוחות · {month.invoicesCount} חשבוניות
                  </span>
                  <span style={{ color: '#dc2626', fontWeight: 700 }}>{fmtCurrency(month.total)}</span>
                </div>
                <div style={{ display: 'flex', gap: 6 }}>
                  <button onClick={(e) => { 
                    e.preventDefault(); 
                    void exportToExcel({ clients: month.clients, grandTotal: month.total }, `רשימת_גביה_${month.label.replace(/\s+/g, '_')}.xlsx`, `רשימת גבייה - ${month.label}`); 
                  }} 
                    style={{ padding: '6px 12px', background: '#fff', border: '1px solid #10b981', borderRadius: 6, color: '#10b981', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
                    📊 Excel
                  </button>
                  <button onClick={(e) => { 
                    e.preventDefault(); 
                    setPrintData({ type: 'month', title: `רשימת גבייה - ${month.label}`, data: month });
                  }} 
                    style={{ padding: '6px 12px', background: '#fff', border: '1px solid #dc2626', borderRadius: 6, color: '#dc2626', fontSize: 12, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
                    🖨️ הדפס
                  </button>
                </div>
              </summary>
              <div>{month.clients.map(c => renderClientCard(c, 'overdue'))}</div>
            </details>
          ))}
        </div>
      )}

      {/* השבוע */}
      {thisWeekClients.length > 0 && (
        <div>
          <h3 style={{ fontSize: 18, fontWeight: 700, color: '#f59e0b', margin: '24px 0 12px' }}>
            📅 השבוע - 7 ימים הקרובים
          </h3>
          <div style={sectionCard}>
            <div style={sectionHeaderStyle('linear-gradient(135deg, #fffbeb, #fff)')}>
              <span>{thisWeekClients.length} לקוחות לפירעון</span>
              <span style={{ color: '#f59e0b', fontWeight: 700 }}>{fmtCurrency(totalThisWeek)}</span>
            </div>
            {thisWeekClients.map(c => renderClientCard(c, 'thisWeek'))}
          </div>
        </div>
      )}

      {/* החודש */}
      {thisMonthClients.length > 0 && (
        <details style={{ ...sectionCard, marginTop: 24 }}>
          <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #eff6ff, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>📆 החודש (8-30 ימים)</span>
            <span style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <span style={{ color: '#3b82f6' }}>{thisMonthClients.length} לקוחות</span>
              <span style={{ color: '#3b82f6', fontWeight: 700 }}>{fmtCurrency(totalThisMonth)}</span>
            </span>
          </summary>
          <div>{thisMonthClients.map(c => renderClientCard(c, 'thisMonth'))}</div>
        </details>
      )}

      {/* בקרוב */}
      {soonClients.length > 0 && (
        <details style={{ ...sectionCard, marginTop: 12 }}>
          <summary style={{ ...sectionHeaderStyle('linear-gradient(135deg, #f0fdf4, #fff)'), cursor: 'pointer', listStyle: 'none' }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>🟢 בקרוב (30-90 ימים)</span>
            <span style={{ color: '#22c55e' }}>{soonClients.length} לקוחות · {fmtCurrency(soonClients.reduce((s,c)=>s+c.total,0))}</span>
          </summary>
          <div>{soonClients.map(c => renderClientCard(c, 'soon'))}</div>
        </details>
      )}

      {clientsWithInvoices.length === 0 && (
        <div style={{ background: '#fff', padding: 40, borderRadius: 12, textAlign: 'center', color: '#9ca3af', border: '1px dashed #e5e7eb' }}>
          🎉 אין לקוחות חייבים כרגע!
        </div>
      )}

      {/* Modals */}
      {actionModal && (
        <DebtActionModal
          customer={actionModal.customer}
          actionType={actionModal.type}
          specificInvoice={actionModal.specificInvoice}
          onClose={() => setActionModal(null)}
          onSuccess={(newAction) => {
            setActions((prev) => [newAction, ...prev]);
            setActionModal(null);
            if (onDebtReload) onDebtReload();
          }}
          sb={sb}
          collectorName={collectorName}
        />
      )}

      {emailModal && (
        <EmailModal
          client={emailModal.client}
          mode={emailModal.mode}
          emailType={emailModal.emailType}
          pendingType={emailModal.pendingType}
          onClose={() => setEmailModal(null)}
          onSendEmail={sendEmail}
          onSaveAndSend={async (emails, typeToSend) => {
            await sb(`clients?id=eq.${emailModal.client.client_id}`, {
              method: 'PATCH',
              body: JSON.stringify({
                collection_email_primary: emails.primary,
                collection_email_secondary: emails.secondary || null,
              }),
            });
            emailModal.client.collection_email_primary = emails.primary;
            emailModal.client.collection_email_secondary = emails.secondary;
            if (typeToSend) {
              await sendEmail(emailModal.client, typeToSend);
            }
            setEmailModal(null);
            if (onDebtReload) onDebtReload();
          }}
          sb={sb}
        />
      )}

      {printData && (
        <PrintReport data={printData} onClose={() => setPrintData(null)} />
      )}
    </div>
  );
}

// ============================================================
// PrintReport — פותח חלון נפרד להדפסה (ללא דפים ריקים מ־@media print בדף הראשי)
// ============================================================
function PrintReport({ data, onClose }) {
  useEffect(() => {
    openPrintWindow(data);
    onClose();
  }, []);

  return null;
}

function openPrintWindow(data) {
  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0 })}`;

  const clients = data.type === 'month' ? data.data.clients : data.data.clients;
  const total = data.type === 'month' ? data.data.total : data.data.grandTotal;

  const printWindow = window.open('', '_blank', 'width=900,height=700');
  if (!printWindow) {
    alert('חוסם חלונות קופצים? אנא אפשר חלונות קופצים והנסה שוב.');
    return;
  }

  const html = `
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>${data.title || 'דוח גבייה'}</title>
<style>
  @page {
    size: A4;
    margin: 1.5cm;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    direction: rtl;

    padding: 20px;
    color: #1E3A52;

  }
  .header {

  }
  .logo {
    font-size: 28px;
    font-weight: 900;
    color: #1E3A52;
    letter-spacing: 2px;
  }
  .logo-sub {
    font-size: 13px;
    color: #3DB5B1;
    font-weight: 600;
  }
  .title-box {
    text-align: left;
  }
  .title-tag {
    font-size: 11px;
    color: #3DB5B1;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-weight: 700;
  }
  .title-main {
    font-size: 22px;
    font-weight: 800;
    color: #1E3A52;
    margin: 4px 0;
  }
  .title-date {
    font-size: 12px;
    color: #6b7280;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    page-break-inside: auto;
  }
  thead { display: table-header-group; }
  tr { page-break-inside: avoid; }
  th {
    background: #1E3A52;
    color: #fff;
    padding: 10px 8px;
    text-align: center;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  th.right { text-align: right; }
  th.left { text-align: left; }
  td {
    padding: 10px 8px;
    border-bottom: 1px solid #e5e7eb;
    vertical-align: top;
  }
  tr:nth-child(even) td { background: #f8fafa; }
  td.center { text-align: center; }
  td.left { text-align: left; }
  .client-name {
    font-weight: 700;
    color: #1E3A52;
    font-size: 13px;
  }
  .contact-info {
    font-size: 10px;
    color: #6b7280;
    margin-top: 2px;
  }
  .invoices-list {
    font-size: 11px;
    line-height: 1.7;
  }
  .invoice-item {
    display: inline-block;
    margin-inline-end: 8px;
    padding: 2px 6px;
    background: #f0fdfa;
    border: 1px solid #a7f3d0;
    border-radius: 4px;

  }
  .invoice-item.overdue {
    background: #fef2f2;
    border-color: #fecaca;
  }
  .invoice-overdue-tag {
    color: #dc2626;
    font-weight: 700;
    margin-inline-start: 4px;
  }
  .amount {
    text-align: left;
    font-weight: 700;
    color: #1E3A52;

  }

  <div class="no-print print-toolbar">
    <button onclick="window.print()">🖨️ הדפס</button>
    <button onclick="window.close()" style="background:#dc2626">✕ סגור</button>
  </div>

  <div class="header">

      <div class="logo-sub">פתרונות הדפסה</div>

        <th class="right">חשבוניות</th>
        <th class="left">סכום</th>
      </tr>
    </thead>
    <tbody>
      ${clients.map((c, idx) => `
        <tr>
          <td class="center" style="color:#6b7280;">${idx + 1}</td>
          <td>
            <div class="client-name">${c.name}</div>
            ${(c.contact_name || c.phone) ? `<div class="contact-info">${c.contact_name || '—'} ${c.phone ? '| ' + c.phone : ''}</div>` : ''}
