function resolveClientForTask(task,clients){
  const list=Array.isArray(clients)?clients:[];
  if(task.client_id!=null&&task.client_id!==""){
    const m=list.find(c=>String(c.id)===String(task.client_id));
    if(m)return m;
  }
  if(task.bina_cust_id!=null&&task.bina_cust_id!==""){
    const m=list.find(c=>String(c.bina_customer_id||"")===String(task.bina_cust_id));
    if(m)return m;
  }
  if(task.client_name)return list.find(c=>c.name===task.client_name)||null;
  return null;
}

/** צילום הזמנה מטבלאות PrintOS (נשמרו מבינה בסנכרון / יצירת הזמנה) — בלי Edge Function חדש */
async function loadOrderSnapshotFromDb(task){
  const oid=task.bina_order_id;
  if(oid==null||oid==="")return null;
  try{
    let ord=null;
    const byBina=await sb(`orders?bina_doc_id=eq.${oid}&limit=1`);
    if(Array.isArray(byBina)&&byBina[0])ord=byBina[0];
    if(!ord){
      const byTask=await sb(`orders?task_id=eq.${task.id}&limit=1`);
      if(Array.isArray(byTask)&&byTask[0])ord=byTask[0];
    }
    if(!ord)return null;
    const addrParts=[ord.bina_cust_address,ord.bina_cust_city].filter(Boolean);
    const oItems=await sb(`order_items?order_id=eq.${ord.id}&order=line_number.asc`);
    const lines=(Array.isArray(oItems)?oItems:[]).map(oi=>({
      id:oi.id,
      description:String(oi.description||"").trim()||"—",
      quantity:oi.quantity!=null?oi.quantity:1,
      bina_item_code:null,
    }));
    return{
      customerName:String(ord.bina_cust_name||"").trim()||(task.client_name||""),
      contactName:String(ord.contact_person||"").trim()||(task.contact||""),
      phone:ord.bina_cust_phone||task.bina_cust_phone||"",
      email:ord.bina_cust_email||task.bina_cust_email||"",
      address:addrParts.join(", ")||"",
      orderItems:lines.length>0?lines:null,
    };
  }catch(e){
    console.warn("[delivery-notes] order snapshot:",e);
    return null;
  }
}

function DeliveryNoteModal({task,clients,user,onClose}){
  const [client,setClient]=useState(null);
  const [items,setItems]=useState([]);
  const [allItems,setAllItems]=useState([]);
  const [deliveryAddress,setDeliveryAddress]=useState("");
  const [savedAddresses,setSavedAddresses]=useState([]);
  const [selectedAddressId,setSelectedAddressId]=useState(null);
  const [saveAddressForFuture,setSaveAddressForFuture]=useState(false);
  const [showAddNewAddress,setShowAddNewAddress]=useState(false);
  const [custName,setCustName]=useState("");
  const [custContact,setCustContact]=useState("");
  const [custPhone,setCustPhone]=useState("");
  const [custEmail,setCustEmail]=useState("");
  const [notes,setNotes]=useState("");
  const [driverName,setDriverName]=useState("");
  const [loading,setLoading]=useState(true);
  const [creating,setCreating]=useState(false);
  const [createdNote,setCreatedNote]=useState(null);
  const [copySuccess,setCopySuccess]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    const run=async()=>{
      setLoading(true);
      setSavedAddresses([]);
      setSelectedAddressId(null);
      setSaveAddressForFuture(false);
      const snap=task.bina_order_id?await loadOrderSnapshotFromDb(task):null;
      if(cancelled)return;
      if(snap)console.log("[delivery-notes] נטען צילום הזמנה מטבלת orders (הזמנה "+String(task.bina_order_id)+")");

      let c=resolveClientForTask(task,clients);
      if(!c&&task.client_id){
        try{
          const row=await sb(`clients?id=eq.${task.client_id}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!c&&task.bina_cust_id){
        try{
          const row=await sb(`clients?bina_customer_id=eq.${task.bina_cust_id}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!c&&task.client_name){
        try{
          const row=await sb(`clients?name=eq.${encodeURIComponent(task.client_name)}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!cancelled)setClient(c||null);

      let addresses=[];
      if(c?.id){
        try{
          const addrRows=await sb(`client_addresses?client_id=eq.${c.id}&order=is_default.desc,last_used_at.desc`);
          if(!cancelled)addresses=Array.isArray(addrRows)?addrRows:[];
        }catch(e){/* table may not exist yet */}
      }
      if(!cancelled)setSavedAddresses(addresses);

      const addrFromTask=[task.bina_cust_address,task.bina_cust_city].filter(Boolean).join(", ")||"";
      const snapAddr=snap?.address||"";
      const defaultAddr=addresses.find(a=>a.is_default)||addresses[0];
      const resolvedAddr=defaultAddr?.address||snapAddr||c?.address||addrFromTask||"";
      const resolvedContact=c?(c.delivery_contact_name||c.contact_name||snap?.contactName||task.contact||""):(snap?.contactName||task.contact||"");
      const resolvedPhone=c?(c.delivery_contact_phone||c.phone||snap?.phone||task.bina_cust_phone||""):(snap?.phone||task.bina_cust_phone||"");
      const resolvedEmail=c?(c.delivery_email||c.orders_email_primary||c.email||snap?.email||task.bina_cust_email||""):(snap?.email||task.bina_cust_email||"");
      const resolvedName=snap?.customerName||c?.name||task.client_name||"";

      if(!cancelled){
        setCustName(resolvedName);
        setCustContact(resolvedContact);
        setCustPhone(resolvedPhone);
        setCustEmail(resolvedEmail);
        setDeliveryAddress(resolvedAddr);
        if(defaultAddr)setSelectedAddressId(defaultAddr.id);
        else setSelectedAddressId(null);
        if(c?.delivery_notes)setNotes(c.delivery_notes);
      }

      if(snap&&!cancelled){
        if(snap.orderItems&&snap.orderItems.length>0){
          setAllItems(snap.orderItems);
          setItems(snap.orderItems.map(i=>i.id));
        }else{
          await loadTaskItemsFallback();
        }
      }else if(!cancelled){
        await loadTaskItemsFallback();
      }

      async function loadTaskItemsFallback(){
        if(cancelled)return;
        try{
          const ti=await sb(`task_items?task_id=eq.${task.id}&order=id.asc`);
          if(cancelled)return;
          if(ti&&ti.length>0){
            setAllItems(ti);
            setItems(ti.map(i=>i.id));
          }else{
            const fake={id:"task-"+task.id,description:task.title,quantity:1,bina_item_code:null,_isSingleTask:true};
            setAllItems([fake]);
            setItems([fake.id]);
          }
        }catch(e){
          if(!cancelled){
            const fake={id:"task-"+task.id,description:task.title,quantity:1,bina_item_code:null,_isSingleTask:true};
            setAllItems([fake]);
            setItems([fake.id]);
          }
        }
      }

      if(!cancelled)setLoading(false);
    };
    run();
    return()=>{cancelled=true};
  },[task.id,task.title,task.client_name,task.client_id,task.bina_cust_id,task.bina_order_id,task.contact,task.bina_cust_phone,task.bina_cust_email,task.bina_cust_address,task.bina_cust_city,clients]);

  const toggleItem=(id)=>{
    setItems(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  };

  const signUrl=createdNote?`${typeof window!=="undefined"&&window.location?window.location.origin:""}${window.location.pathname||""}${window.location.search||""}#sign/${createdNote.signature_token}`:"";

  const handleCreate=async()=>{
    if(items.length===0){window.alert("יש לבחור לפחות פריט אחד");return;}
    setCreating(true);
    try{
      const selectedItems=allItems.filter(i=>items.includes(i.id)).map(i=>({
        description:i.description||"",
        quantity:i.quantity!=null?i.quantity:1,
        bina_item_code:i.bina_item_code||null,
      }));
      const token=(crypto.randomUUID&&crypto.randomUUID())?crypto.randomUUID().replace(/-/g,""):String(Math.random()).slice(2)+Date.now().toString(36);
      const expiresAt=new Date(Date.now()+7*24*60*60*1000).toISOString();
      const nm=custName.trim()||task.client_name||"לקוח";
      const payload={
        task_id:task.id,
        bina_order_id:task.bina_order_id!=null?String(task.bina_order_id):null,
        customer_name:nm,
        contact_name:custContact.trim()||null,
        customer_address:deliveryAddress.trim()||null,
        customer_phone:custPhone.trim()||null,
        customer_email:custEmail.trim()||null,
        items:selectedItems,
        signature_token:token,
        signature_token_expires_at:expiresAt,
        driver_name:driverName.trim()||null,
        notes:notes.trim()||null,
        created_by:user?.name||"unknown",
      };
      const result=await sb("delivery_notes",{method:"POST",body:JSON.stringify(payload),headers:{Prefer:"return=representation"}});
      if(result&&result[0]){
        setCreatedNote(result[0]);
        try{
          if(saveAddressForFuture&&client&&deliveryAddress.trim()&&!selectedAddressId){

              client_id:client.id,

    }catch(e){
      window.alert("שגיאה ביצירת התעודה: "+(e.message||String(e)));
    }
    setCreating(false);
  };

  const handlePrint=()=>{
    if(!createdNote)return;
    const w=window.open("","_blank","width=800,height=900");
    if(!w)return;
    w.document.write(generateDeliveryNoteHTML(createdNote));

    setTimeout(()=>{try{w.print()}catch(e){}},500);
  };

  const handleCopyLink=async()=>{
    if(!createdNote)return;
    const u=signUrl;
    try{
      await navigator.clipboard.writeText(u);
      setCopySuccess(true);
      setTimeout(()=>setCopySuccess(false),2000);
    }catch(e){
      window.alert("שגיאה בהעתקה. נסה שוב.");
    }
  };

  const handleWhatsApp=()=>{

    const u=signUrl;
    const text=`שלום, תעודת משלוח ${createdNote.delivery_number}\nלקוח: ${createdNote.customer_name}\nכתובת: ${createdNote.customer_address||"—"}\nקישור לחתימת מקבל:\n${u}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");

  const secondaryCreatedBtn={padding:"12px 10px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",fontWeight:600,cursor:"pointer",fontFamily:"inherit",fontSize:13};

function SignaturePage({token}){
  const [note,setNote]=useState(null);
  const [signerName,setSignerName]=useState("");
  const [loading,setLoading]=useState(true);
  const [submitting,setSubmitting]=useState(false);
  const [signed,setSigned]=useState(false);
  const canvasRef=useRef(null);
  const padRef=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    const enc=encodeURIComponent(token);
    sb(`delivery_notes?signature_token=eq.${enc}&limit=1`).then(r=>{
      if(cancelled)return;
      if(r?.[0]){
        setNote(r[0]);
        if(r[0].signed_at)setSigned(true);
      }
      setLoading(false);
    }).catch(()=>{if(!cancelled)setLoading(false)});
    return()=>{cancelled=true};
  },[token]);

  const initPad=()=>{
    if(!canvasRef.current||!window.SignaturePad)return;
    const canvas=canvasRef.current;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=Math.max(300,rect.width-4);
    canvas.height=200;
    padRef.current=new window.SignaturePad(canvas,{backgroundColor:"rgba(255,255,255,0)",penColor:"#1f2937"});
  };

  useEffect(()=>{
    if(loading||signed||!note)return;
    if(note.signature_token_expires_at&&!note.signed_at&&new Date(note.signature_token_expires_at)<new Date())return;
    const ensureScript=()=>{
      if(window.SignaturePad){setTimeout(initPad,80);return;}
      if(document.querySelector('script[data-signature-pad="1"]')){setTimeout(ensureScript,100);return;}
      const script=document.createElement("script");
      script.dataset.signaturePad="1";
      script.src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js";
      script.onload=()=>setTimeout(initPad,80);
      document.head.appendChild(script);
    };
    ensureScript();
  },[loading,signed,note]);

  const handleClear=()=>padRef.current?.clear();

  const handleSubmit=async()=>{
    if(!padRef.current||padRef.current.isEmpty()){window.alert("נא לחתום");return;}
    if(!signerName.trim()){window.alert("נא למלא שם מקבל");return;}
    setSubmitting(true);
    try{
      const signatureData=padRef.current.toDataURL("image/png");
      const enc=encodeURIComponent(token);
      await sb(`delivery_notes?signature_token=eq.${enc}`,{
        method:"PATCH",
        body:JSON.stringify({
          signature_data:signatureData,
          signed_at:new Date().toISOString(),
          signed_by_name:signerName.trim(),
          status:"signed",
        }),
      });
      setSigned(true);
    }catch(e){
      window.alert("שגיאה בשמירה: "+(e.message||String(e)));
    }
    setSubmitting(false);
  };

  if(loading)return<div style={{textAlign:"center",padding:50,fontFamily:"Heebo,sans-serif"}}>טוען...</div>;
  if(!note)return<div style={{textAlign:"center",padding:50,color:"#dc2626",fontFamily:"Heebo,sans-serif"}}>תעודה לא נמצאה או פגה</div>;
  if(!note.signed_at&&note.signature_token_expires_at&&new Date(note.signature_token_expires_at)<new Date())return<div style={{textAlign:"center",padding:50,color:"#dc2626",fontFamily:"Heebo,sans-serif"}}>פג תוקף הקישור</div>;

  return<div style={{minHeight:"100vh",padding:20,background:"#f3f4f6",direction:"rtl",fontFamily:"'Heebo',sans-serif"}}>
    <div style={{maxWidth:600,margin:"0 auto",background:"#fff",borderRadius:12,padding:20,boxShadow:"0 4px 6px rgba(0,0,0,0.1)"}}>
      <h1 style={{color:"#0e7490",marginBottom:15,fontSize:22}}>📋 תעודת משלוח #{note.delivery_number}</h1>
      <div style={{background:"#f9fafb",padding:15,borderRadius:6,marginBottom:20,fontSize:14}}>
        <div><strong>לקוח:</strong> {note.customer_name}</div>
        {note.customer_address&&<div><strong>כתובת:</strong> {note.customer_address}</div>}
        <div style={{marginTop:10}}><strong>פריטים:</strong>
          <ul style={{marginRight:20,marginTop:6}}>
            {(Array.isArray(note.items)?note.items:[]).map((it,i)=><li key={i}>{it.description} (כמות: {it.quantity})</li>)}
          </ul>
        </div>
      </div>
      {signed?<div style={{background:"#d1fae5",color:"#065f46",padding:20,borderRadius:8,textAlign:"center"}}>
        <div style={{fontSize:48}}>✅</div>
        <h2 style={{margin:"8px 0"}}>החתימה התקבלה!</h2>
        <p>תודה רבה, התעודה נחתמה בהצלחה.</p>
      </div>:<>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:5,fontWeight:600}}>שם המקבל:</label>
          <input value={signerName} onChange={e=>setSignerName(e.target.value)} placeholder="שם מלא" style={{width:"100%",padding:10,border:"1px solid #d1d5db",borderRadius:6,fontSize:16,fontFamily:"inherit"}}/>
        </div>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:5,fontWeight:600}}>חתימה:</label>
          <div style={{border:"2px dashed #d1d5db",borderRadius:8,height:200,position:"relative",background:"#fff"}}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",touchAction:"none"}}/>
          </div>
          <button type="button" onClick={handleClear} style={{marginTop:8,padding:"6px 12px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ נקה</button>
        </div>
        <button type="button" onClick={handleSubmit} disabled={submitting} style={{width:"100%",padding:15,background:"#0e7490",color:"#fff",border:"none",borderRadius:8,fontSize:18,fontWeight:600,cursor:"pointer",marginTop:10,fontFamily:"inherit"}}>
          {submitting?"שולח...":"✅ אשר קבלה"}
        </button>
      </>}
      <div style={{marginTop:30,textAlign:"center",fontSize:12,color:"#9ca3af"}}>נטלי פתרונות הדפסה בע"מ</div>
    </div>
  </div>;
}

function DeliveryNotesDashboard(){
  const [notes,setNotes]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("all");
  const [search,setSearch]=useState("");
  const [selectedNote,setSelectedNote]=useState(null);

  const loadNotes=async()=>{
    setLoading(true);
    try{
      const data=await sb("delivery_notes?order=created_at.desc&limit=800");
      setNotes(Array.isArray(data)?data:[]);
    }catch(e){setNotes([]);}
    setLoading(false);
  };

  useEffect(()=>{
    loadNotes();
    const t=setInterval(loadNotes,30000);
    return()=>clearInterval(t);
  },[]);

  const filtered=useMemo(()=>{
    return notes.filter(n=>{
      if(filter==="created"&&n.signed_at)return false;
      if(filter==="signed"&&!n.signed_at)return false;
      if(search.trim()){
        const s=search.trim().toLowerCase();
        return String(n.delivery_number||"").includes(s)||(n.customer_name||"").toLowerCase().includes(s)||String(n.bina_order_id||"").toLowerCase().includes(s);
      }
      return true;
    });
  },[notes,filter,search]);

  const stats=useMemo(()=>({
    total:notes.length,
    waiting:notes.filter(n=>!n.signed_at).length,
    signed:notes.filter(n=>n.signed_at).length,
  }),[notes]);

  const fbtn=(f,label)=>{
    const active=filter===f;
    return<button type="button" key={f} onClick={()=>setFilter(f)} style={{padding:"8px 14px",borderRadius:9,border:`1px solid ${active?"#0e7490":"var(--border)"}`,background:active?"#ecfeff":"#fff",color:active?"#0e7490":"var(--text2)",fontWeight:600,fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>{label}</button>;
  };

  return<div style={{direction:"rtl"}}>
    <h1 style={{fontSize:22,fontWeight:800,margin:"0 0 16px",color:"var(--text)"}}>📋 תעודות משלוח</h1>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
      <Card style={{padding:16}}><div style={{fontSize:12,color:"var(--text3)"}}>סה״כ תעודות</div><div style={{fontSize:26,fontWeight:800,color:"#0e7490"}}>{stats.total}</div></Card>
      <Card style={{padding:16}}><div style={{fontSize:12,color:"var(--text3)"}}>ממתינות לחתימה</div><div style={{fontSize:26,fontWeight:800,color:"#f59e0b"}}>{stats.waiting}</div></Card>
      <Card style={{padding:16}}><div style={{fontSize:12,color:"var(--text3)"}}>חתומות</div><div style={{fontSize:26,fontWeight:800,color:"#10b981"}}>{stats.signed}</div></Card>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap",alignItems:"center"}}>
      {fbtn("all",`הכל (${stats.total})`)}
      {fbtn("created",`⏳ ממתינות (${stats.waiting})`)}
      {fbtn("signed",`✅ חתומות (${stats.signed})`)}
      <input type="search" placeholder="חיפוש לפי מספר, לקוח, הזמנה…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:200,padding:10,borderRadius:8,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13}}/>
    </div>
    {loading?<div style={{padding:40,textAlign:"center",color:"var(--text3)"}}><Spinner sz={28}/> טוען…</div>:
    filtered.length===0?<div style={{textAlign:"center",padding:48,color:"var(--text3)"}}>אין תעודות תואמות</div>:
    <div style={{background:"#fff",border:"1px solid var(--border)",borderRadius:12,overflow:"hidden",boxShadow:"var(--shadow)"}}>
      {filtered.map(n=>
        <button type="button" key={n.id} onClick={()=>setSelectedNote(n)} style={{display:"flex",width:"100%",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",border:"none",borderBottom:"1px solid var(--border)",cursor:"pointer",background:"#fff",fontFamily:"inherit",textAlign:"right"}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,color:"var(--text)"}}>#{n.delivery_number} — {n.customer_name}</div>
            <div style={{fontSize:12,color:"var(--text3)",marginTop:4}}>
              {n.created_at?new Date(n.created_at).toLocaleString("he-IL"):""}
              {n.bina_order_id?` · הזמנה ${n.bina_order_id}`:""}
              {n.driver_name?` · נהג: ${n.driver_name}`:""}
            </div>
          </div>
          <span style={{padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:600,background:n.signed_at?"#d1fae5":"#fef3c7",color:n.signed_at?"#065f46":"#78350f"}}>
            {n.signed_at?"✅ חתום":"⏳ ממתין"}
          </span>
        </button>
      )}
    </div>}
    {selectedNote&&<DeliveryNoteDetailsModal note={selectedNote} onClose={()=>setSelectedNote(null)}/>}
  </div>;
}

function DeliveryNoteDetailsModal({note,onClose}){
  const isSigned=!!note.signed_at;
  const signUrl=`${typeof window!=="undefined"&&window.location?window.location.origin:""}${window.location.pathname||""}${window.location.search||""}#sign/${note.signature_token}`;
  const handlePrint=()=>{
    const w=window.open("","_blank","width=800,height=900");
    if(!w)return;
    w.document.write(generateDeliveryNoteHTML(note));
    w.document.close();
    setTimeout(()=>{try{w.print()}catch(e){}},500);
  };
  const doCopy=async()=>{
    try{
      await navigator.clipboard.writeText(signUrl);
      window.alert("הקישור הועתק");
    }catch(e){window.alert("שגיאה בהעתקה");}
  };
  const doWa=()=>{
    const text=`תעודת משלוח ${note.delivery_number}\nלקוח: ${note.customer_name}\nקישור לחתימה:\n${signUrl}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  return<Modal open={true} onClose={onClose} title={`תעודה #${note.delivery_number}`} maxWidth={520}>
    <div style={{direction:"rtl",fontSize:14,color:"var(--text)",display:"flex",flexDirection:"column",gap:10}}>
      <div><strong>לקוח:</strong> {note.customer_name}</div>
      {note.contact_name?<div><strong>איש קשר:</strong> {note.contact_name}</div>:null}
      {note.customer_address?<div><strong>כתובת:</strong> {note.customer_address}</div>:null}
      {note.customer_phone?<div><strong>טלפון:</strong> {note.customer_phone}</div>:null}
      {note.customer_email?<div><strong>מייל:</strong> {note.customer_email}</div>:null}
      {note.driver_name?<div><strong>נהג:</strong> {note.driver_name}</div>:null}
      <div><strong>תאריך יצירה:</strong> {note.created_at?new Date(note.created_at).toLocaleString("he-IL"):"—"}</div>
      {isSigned?<div style={{marginTop:8,padding:12,background:"#d1fae5",borderRadius:8,color:"#065f46"}}>
        ✅ נחתם ב-{note.signed_at?new Date(note.signed_at).toLocaleString("he-IL"):""}
        {note.signed_by_name?` · ${note.signed_by_name}`:""}
      </div>:null}
      <div style={{marginTop:14}}>
        <div style={{fontWeight:700,marginBottom:8}}>פריטים</div>
        <div style={{border:"1px solid var(--border)",borderRadius:8,padding:10,maxHeight:200,overflowY:"auto",fontSize:13}}>
          {(Array.isArray(note.items)?note.items:[]).map((it,i)=><div key={i}>• {it.description} <span style={{color:"var(--text3)"}}>(כמות: {it.quantity})</span></div>)}
        </div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginTop:16}}>
        <button type="button" onClick={handlePrint} style={{flex:1,minWidth:120,padding:12,borderRadius:10,border:"none",background:"#0e7490",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>🖨️ הדפס PDF</button>
        {!isSigned&&<button type="button" onClick={doCopy} style={{flex:1,minWidth:120,padding:12,borderRadius:10,border:"1px solid var(--border)",background:"#fff",fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>🔗 העתק קישור</button>}
        {!isSigned&&<button type="button" onClick={doWa} style={{flex:1,minWidth:120,padding:12,borderRadius:10,border:"none",background:"#25D366",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>📱 WhatsApp</button>}
      </div>
      <button type="button" onClick={onClose} style={{marginTop:16,padding:12,borderRadius:10,border:"1px solid var(--border)",width:"100%",background:"var(--bg2)",cursor:"pointer",fontFamily:"inherit"}}>סגור</button>
    </div>
  </Modal>;
}

function KpiCardShipment({label,value,color,emoji}){
  return<div style={{background:"#fff",padding:16,borderRadius:10,borderRight:`4px solid ${color}`,boxShadow:"var(--shadow)"}}>
    <div style={{fontSize:13,color:"var(--text3)",marginBottom:4}}>{emoji} {label}</div>
    <div style={{fontSize:28,fontWeight:800,color}}>{value}</div>
  </div>;
}

function ShipmentCard({task,onStatusChange,onCreateDeliveryNote,onViewTask}){
  const status=task.delivery_status||"pending";
  const statusConfig={
    pending:{color:"#f59e0b",bg:"#fef3c7",label:"ממתין",emoji:"⏳"},
    ready:{color:"#0e7490",bg:"#cffafe",label:"מוכן למשלוח",emoji:"📦"},
    in_transit:{color:"#8b5cf6",bg:"#ede9fe",label:"בדרך",emoji:"🚛"},
    delivered:{color:"#10b981",bg:"#d1fae5",label:"נמסר",emoji:"✅"},
    cancelled:{color:"#64748b",bg:"#f1f5f9",label:"בוטל",emoji:"⛔"},
  };
  const cfg=statusConfig[status]||statusConfig.pending;
  return<div style={{background:"#fff",borderRadius:10,padding:16,boxShadow:"var(--shadow)",borderRight:`4px solid ${cfg.color}`}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:16,fontWeight:700,marginBottom:4,color:"var(--text)"}}>{task.client_name||"לקוח ללא שם"}</div>
        <div style={{fontSize:13,color:"var(--text2)"}}>
          {task.bina_order_id?`הזמנה #${task.bina_order_id} · `:""}
          {task.title}
        </div>
      </div>
      <span style={{background:cfg.bg,color:cfg.color,padding:"4px 12px",borderRadius:20,fontSize:12,fontWeight:600,whiteSpace:"nowrap"}}>
        {cfg.emoji} {cfg.label}
      </span>
    </div>
    {task.delivery_items&&task.delivery_items.length>0&&<div style={{background:"var(--bg2)",padding:10,borderRadius:8,fontSize:13,marginBottom:10,color:"var(--text)"}}>
      <div style={{fontWeight:600,marginBottom:6}}>📦 פריטי משלוח</div>
      {task.delivery_items.map((item,i)=><div key={item.id||i} style={{marginTop:4}}>• {item.description} ({item.quantity})</div>)}
    </div>}
    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
      <button type="button" onClick={onCreateDeliveryNote} style={{padding:"6px 12px",background:"#0e7490",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit",fontWeight:600}}>📋 תעודת משלוח</button>
      {status==="pending"&&<button type="button" onClick={()=>onStatusChange("ready")} style={{padding:"6px 12px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>📦 סמן מוכן</button>}
      {status==="ready"&&<button type="button" onClick={()=>onStatusChange("in_transit")} style={{padding:"6px 12px",background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>🚛 יצא למשלוח</button>}
      {status==="in_transit"&&<button type="button" onClick={()=>onStatusChange("delivered")} style={{padding:"6px 12px",background:"#10b981",color:"#fff",border:"none",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit",fontWeight:600}}>✅ נמסר</button>}
      {status!=="pending"&&<button type="button" onClick={()=>onStatusChange("pending")} style={{padding:"6px 12px",background:"transparent",border:"1px solid var(--border)",borderRadius:8,cursor:"pointer",fontSize:13,color:"var(--text2)",fontFamily:"inherit"}}>↩️ החזר לממתין</button>}
      <button type="button" onClick={onViewTask} style={{padding:"6px 12px",background:"transparent",border:"1px solid var(--border)",borderRadius:8,cursor:"pointer",fontSize:13,fontFamily:"inherit",marginInlineStart:"auto"}}>👁️ צפה במשימה</button>
    </div>
  </div>;
}

function ShipmentsDashboard({allTasks,clients,user,onTaskClick,refreshAll}){
  const [shipmentTasks,setShipmentTasks]=useState([]);
  const [loading,setLoading]=useState(true);
  const [filter,setFilter]=useState("pending");
  const [search,setSearch]=useState("");
  const [deliveryNoteModal,setDeliveryNoteModal]=useState(null);

  useEffect(()=>{
    let cancelled=false;
    const run=()=>{
      setLoading(true);
      const matched=(Array.isArray(allTasks)?allTasks:[]).filter(t=>{
        const st=t.delivery_status||"pending";
        return st==="ready"||st==="in_transit"||st==="delivered";
      }).map(t=>({...t,delivery_items:[]}));
      if(!cancelled){
        setShipmentTasks(matched);
        setLoading(false);
      }
    };
    run();
    return()=>{cancelled=true};
  },[allTasks]);

  const filtered=useMemo(()=>{
    return shipmentTasks.filter(t=>{
      if(filter!=="all"){
        const st=t.delivery_status||"pending";
        if(st!==filter)return false;
      }
      if(search.trim()){
        const s=search.trim().toLowerCase();
        return(String(t.title||"").toLowerCase().includes(s)||String(t.client_name||"").toLowerCase().includes(s)||String(t.bina_order_id||"").includes(s));
      }
      return true;
    });
  },[shipmentTasks,filter,search]);

  const stats=useMemo(()=>({
    total:shipmentTasks.length,
    pending:shipmentTasks.filter(t=>(t.delivery_status||"pending")==="pending").length,
    ready:shipmentTasks.filter(t=>t.delivery_status==="ready").length,
    in_transit:shipmentTasks.filter(t=>t.delivery_status==="in_transit").length,
    delivered:shipmentTasks.filter(t=>t.delivery_status==="delivered").length,
  }),[shipmentTasks]);

  const updateDeliveryStatus=async(taskId,newStatus)=>{
    const nowIso=new Date().toISOString();
    try{
      await sb(`tasks?id=eq.${taskId}`,{
        method:"PATCH",
        body:JSON.stringify({
          delivery_status:newStatus,
          delivery_marked_at:nowIso,
          delivery_marked_by:user?.name||"unknown",
        }),
      });
      setShipmentTasks(prev=>prev.map(t=>t.id===taskId?{...t,delivery_status:newStatus,delivery_marked_at:nowIso,delivery_marked_by:user?.name||"unknown"}:t));
      if(typeof refreshAll==="function")await refreshAll();
    }catch(e){
      window.alert("שגיאה בעדכון סטטוס: "+(e.message||String(e)));
    }
  };

  return<div style={{direction:"rtl",padding:4}}>
    <h1 style={{marginBottom:20,display:"flex",alignItems:"center",gap:10,fontSize:22,fontWeight:800,color:"var(--text)"}}>
      🚚 משלוחים
      <span style={{fontSize:14,color:"var(--text3)",fontWeight:500}}>({stats.total} בסה״כ)</span>
    </h1>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:12,marginBottom:20}}>
      <KpiCardShipment label="ממתינים" value={stats.pending} color="#f59e0b" emoji="⏳"/>
      <KpiCardShipment label="מוכנים למשלוח" value={stats.ready} color="#0e7490" emoji="📦"/>
      <KpiCardShipment label="בדרך" value={stats.in_transit} color="#8b5cf6" emoji="🚛"/>
      <KpiCardShipment label="נמסרו" value={stats.delivered} color="#10b981" emoji="✅"/>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:15,flexWrap:"wrap",background:"#fff",padding:12,borderRadius:10,border:"1px solid var(--border)",alignItems:"center"}}>
      {["pending","ready","in_transit","delivered","all"].map(f=>
        <button type="button" key={f} onClick={()=>setFilter(f)} style={{
          padding:"6px 14px",
          background:filter===f?"#0e7490":"var(--bg2)",
          color:filter===f?"#fff":"var(--text2)",
          border:"1px solid "+(filter===f?"#0e7490":"var(--border)"),
          borderRadius:20,
          cursor:"pointer",
          fontSize:13,
          fontWeight:filter===f?700:500,
          fontFamily:"inherit",
        }}>
          {f==="pending"&&"⏳ ממתינים"}
          {f==="ready"&&"📦 מוכנים"}
          {f==="in_transit"&&"🚛 בדרך"}
          {f==="delivered"&&"✅ נמסרו"}
          {f==="all"&&"הכל"}
        </button>
      )}
      <input type="text" placeholder="🔍 חפש לקוח, הזמנה…" value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1,minWidth:200,padding:8,border:"1px solid var(--border)",borderRadius:8,fontFamily:"inherit",fontSize:13}}/>
    </div>
    {loading?<div style={{textAlign:"center",padding:40,color:"var(--text3)"}}><Spinner sz={28}/> טוען משלוחים…</div>:
    filtered.length===0?<div style={{textAlign:"center",padding:60,color:"var(--text3)",background:"#fff",borderRadius:10,border:"1px solid var(--border)"}}>
      <div style={{fontSize:48,marginBottom:10}}>📦</div>
      <div>אין משלוחים תואמים את הסינון</div>
    </div>:
    <div style={{display:"grid",gap:12}}>
      {filtered.map(task=><ShipmentCard key={task.id} task={task} onStatusChange={st=>updateDeliveryStatus(task.id,st)} onCreateDeliveryNote={()=>setDeliveryNoteModal({task})} onViewTask={()=>onTaskClick&&onTaskClick(task)}/>)}
    </div>}
    {deliveryNoteModal&&<DeliveryNoteModal task={deliveryNoteModal.task} clients={clients} user={user} onClose={()=>setDeliveryNoteModal(null)}/>}
  </div>;
}

function AddAddressModal({clientId,user,onClose,onAdd}){
  const [address,setAddress]=useState("");
  const [label,setLabel]=useState("");
  const [isDefault,setIsDefault]=useState(false);
  const [saving,setSaving]=useState(false);
  const addrIS={width:"100%",padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13};
  const handleAdd=async()=>{
    if(!address.trim()){window.alert("יש להזין כתובת");return;}
    setSaving(true);
    try{
      if(isDefault){
        await sb(`client_addresses?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      }
      await sb("client_addresses",{method:"POST",body:JSON.stringify({
        client_id:clientId,
        address:address.trim(),
        label:label.trim()||null,
        is_default:isDefault,
        created_by:user?.name||"unknown",
      })});
      onAdd?.();
      onClose();
    }catch(e){
      window.alert("שגיאה בשמירה: "+(e.message||String(e)));
    }
    setSaving(false);
  };
  return<Modal open={true} onClose={onClose} title="➕ הוספת כתובת משלוח" maxWidth={480}>
    <div style={{display:"flex",flexDirection:"column",gap:14,direction:"rtl"}}>
      <div><label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:5}}>כתובת מלאה *</label><textarea value={address} onChange={e=>setAddress(e.target.value)} placeholder="רחוב + מספר, עיר, מיקוד" rows={4} style={addrIS}/></div>
      <div><label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:5}}>תווית (אופציונלי)</label><input value={label} onChange={e=>setLabel(e.target.value)} placeholder="למשל: אסם, משרד ראשי" style={addrIS}/></div>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
        <input type="checkbox" checked={isDefault} onChange={e=>setIsDefault(e.target.checked)}/>
        סמן ככתובת ברירת מחדל
      </label>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" disabled={saving} onClick={handleAdd} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#0e7490",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{saving?"⏳...":"➕ הוסף"}</button>
      </div>
    </div>
  </Modal>;
}

function ClientAddressesList({clientId}){
  const [addresses,setAddresses]=useState([]);
  const [loading,setLoading]=useState(true);
  const loadAddresses=async()=>{
    setLoading(true);
    try{
      const data=await sb(`client_addresses?client_id=eq.${clientId}&order=is_default.desc,last_used_at.desc`);
      setAddresses(Array.isArray(data)?data:[]);
    }catch(e){setAddresses([]);}
    setLoading(false);
  };
  useEffect(()=>{if(clientId)loadAddresses();},[clientId]);
  const setDefault=async(addressId)=>{
    try{
      await sb(`client_addresses?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      await sb(`client_addresses?id=eq.${addressId}`,{method:"PATCH",body:JSON.stringify({is_default:true})});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const deleteAddress=async(addressId)=>{
    if(!window.confirm("למחוק את הכתובת?"))return;
    try{
      await sb(`client_addresses?id=eq.${addressId}`,{method:"DELETE"});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  if(loading)return<div style={{padding:12,color:"var(--text3)",fontSize:13}}><Spinner sz={16}/> טוען כתובות…</div>;
  if(addresses.length===0)return<div style={{padding:15,background:"#fef3c7",borderRadius:8,fontSize:13,color:"#78350f",marginTop:8}}>⚠️ אין כתובות משלוח שמורות. לחץ &quot;הוסף כתובת&quot; כדי להתחיל.</div>;
  return<div style={{marginTop:8}}>
    {addresses.map(addr=><div key={addr.id} style={{padding:10,background:"#fff",border:"1px solid var(--border)",borderRadius:8,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:addr.is_default?700:400,fontSize:13}}>
          {addr.is_default&&"⭐ "}
          {addr.label&&<strong>[{addr.label}] </strong>}
          {addr.address}
        </div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>
          שימוש {addr.usage_count||0} פעמים · אחרון: {addr.last_used_at?new Date(addr.last_used_at).toLocaleDateString("he-IL"):"—"}
        </div>
      </div>
      <div style={{display:"flex",gap:6,flexShrink:0}}>
        {!addr.is_default&&<button type="button" onClick={()=>setDefault(addr.id)} style={{fontSize:11,padding:"4px 8px",cursor:"pointer",fontFamily:"inherit",border:"1px solid var(--border)",borderRadius:6,background:"#fff"}}>ברירת מחדל</button>}

// ── AI CHAT ──
function AiChat({user,tasks,clients,onRefresh,onClose}){
  const [msgs,setMsgs]=useState([{role:"ai",text:`שלום ${user.name.split(" ")[0]}! 👋\nאני עוזר ה-AI של PrintOS.\n\nתוכל לבקש ממני:\n• להוסיף משימות\n• לעדכן סטטוסים\n• לשאול על נתונים\n\nמה תרצה?`}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const txt=input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text:txt}]);
    setLoading(true);

    const system=`אתה עוזר AI לניהול בית דפוס PrintOS. עונה בעברית בלבד, קצר וברור.
משתמש: ${user.name} | ${user.role==="admin"?"מנהל":"עובד ב-"+(user?.dept||"—")}
מחלקות: ${DEPTS.join(", ")}
משימות קיימות (${tasks.length}): ${tasks.slice(0,10).map(t=>`[${t.id?.slice(0,6)}] ${t.title}|${t.dept}|${t.status}`).join(" | ")}
לקוחות: ${clients.slice(0,10).map(c=>c.name).join(", ")}

כשצריך לבצע פעולה, כלול JSON בתוך \`\`\`json ... \`\`\`:
{ "action": "add_task"|"update_status"|"none", "data": {...}, "message": "תשובה" }

add_task: data={title,dept,priority,client_name,assignee,due_date,notes}
update_status: data={task_id(6תווים),status}`;

    try{
      const res=await fetch("/api/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system,
          messages:[
            ...msgs.filter(m=>m.role!=="ai"||msgs.indexOf(m)>0).slice(-6).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text})),
            {role:"user",content:txt}
          ]
        })
      });
      const data=await res.json();
      const raw=data.content?.[0]?.text||"מצטער, לא הצלחתי להבין.";
      const match=raw.match(/```json\s*([\s\S]*?)\s*```/);
      let action=null;
      if(match){try{action=JSON.parse(match[1]);}catch{}}
      const reply=action?.message||raw.replace(/```json[\s\S]*?```/g,"").trim();
      setMsgs(p=>[...p,{role:"ai",text:reply}]);

      if(action?.action==="add_task"&&action.data?.title){
        const d=action.data;
        await sb("tasks",{method:"POST",body:JSON.stringify({title:d.title,dept:d.dept||user?.dept||DEPTS[0],priority:d.priority||"בינונית",status:"ממתין",client_name:d.client_name||"",assignee:d.assignee||"",due_date:d.due_date||null,notes:d.notes||"",created_by:user.name})});
        onRefresh();
        setMsgs(p=>[...p,{role:"ai",text:`✅ המשימה "${d.title}" נוספה!`}]);
      }
      if(action?.action==="update_status"&&action.data){
        const task=tasks.find(t=>t.id?.startsWith(action.data.task_id));
        if(task){
          await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({status:action.data.status})});
          onRefresh();
          setMsgs(p=>[...p,{role:"ai",text:`✅ סטטוס עודכן ל-"${action.data.status}"`}]);
        }
      }
    }catch(e){
      setMsgs(p=>[...p,{role:"ai",text:"מצטער, הייתה שגיאה. נסה שוב."}]);
    }
    setLoading(false);
  };

  const suggestions=["הוסף משימה למשלוחים","מה תקוע?","כמה משימות פתוחות?","עדכן סטטוס"];

  return<div style={{position:"fixed",bottom:0,left:0,width:"min(400px,100vw)",height:"min(560px,90vh)",background:"#fff",border:"1px solid var(--border)",borderRadius:"20px 20px 0 0",zIndex:500,display:"flex",flexDirection:"column",boxShadow:"0 -8px 40px rgba(0,0,0,0.12)"}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#2563EB,#7C3AED)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🤖</div>
        <div><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>עוזר AI</div><div style={{fontSize:11,color:"var(--text3)"}}>מזין משימות ועונה על שאלות</div></div>
      </div>
      <button onClick={onClose} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text2)",cursor:"pointer",width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>✕</button>
    </div>

    {/* Messages */}
    <div style={{flex:1,overflowY:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
      {msgs.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-start":"flex-end"}}>
        <div style={{maxWidth:"82%",padding:"9px 13px",borderRadius:m.role==="user"?"13px 13px 4px 13px":"13px 13px 13px 4px",background:m.role==="user"?"var(--blue-light)":"var(--bg2)",border:`1px solid ${m.role==="user"?"var(--blue-mid)":"var(--border)"}`,color:"var(--text)",fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap"}}>
          {m.text}
        </div>
      </div>)}
      {loading&&<div style={{display:"flex",justifyContent:"flex-end"}}>
        <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"13px 13px 13px 4px",padding:"11px 14px",display:"flex",gap:5}}>
          {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"var(--blue)",animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
        </div>
      </div>}
      <div ref={bottomRef}/>
    </div>

    {/* Suggestions */}
    <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",borderTop:"1px solid var(--border)",flexShrink:0}}>
      {suggestions.map(s=><button key={s} onClick={()=>setInput(s)} style={{padding:"4px 10px",borderRadius:20,border:"1px solid var(--border)",background:"#fff",color:"var(--text2)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}
    </div>

    {/* Input */}
    <div style={{padding:"10px 14px 14px",flexShrink:0,display:"flex",gap:8}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="כתוב בעברית חופשית..." style={{flex:1,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 13px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",direction:"rtl"}}/>
      <button onClick={send} disabled={loading||!input.trim()} style={{padding:"9px 16px",borderRadius:10,border:"none",background:input.trim()?"var(--blue)":"var(--bg3)",color:input.trim()?"#fff":"var(--text3)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",flexShrink:0,display:"flex",alignItems:"center"}}>
        {loading?<Spinner sz={16} color="#fff"/>:"שלח"}
      </button>
    </div>
  </div>;
}

// ── CALENDAR TAB ──
function CalendarTab({tasks,taskItems,user,isA,onTaskClick}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [deptFilter,setDeptFilter]=useState(isA?"הכל":(user?.dept||DEPTS[0]));

  const getWeekDays=()=>{
    const today=new Date();
    const monday=new Date(today);
    monday.setDate(today.getDate()-today.getDay()+1+weekOffset*7);
    return Array.from({length:7},(_,i)=>{
      const d=new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  };

  const days=getWeekDays();
  const todayStr=new Date().toISOString().split('T')[0];

  const dayNames=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  const getTasksForDay=(dateStr)=>{
    let filtered=tasks.filter(t=>t.due_date===dateStr);
    if(deptFilter!=="הכל"){
      const ids=new Set((taskItems||[]).filter(i=>i.department===deptFilter&&i.status!=="ארכיון").map(i=>i.task_id));
      filtered=filtered.filter(t=>!t.has_items?t.dept===deptFilter:ids.has(t.id));
    }
    return filtered;
  };

  const weekStart=days[0];
  const weekEnd=days[6];
  const weekLabel=`${weekStart.getDate()} ${monthNames[weekStart.getMonth()]} — ${weekEnd.getDate()} ${monthNames[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;

  return<div>
    <div style={{marginBottom:20}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",margin:0}}>לוח שנה 📅</h1>
      <p style={{color:"var(--text3)",margin:"5px 0 0",fontSize:13}}>{weekLabel}</p>
    </div>

    {/* Controls */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setWeekOffset(p=>p-1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>← שבוע קודם</button>
        <button onClick={()=>setWeekOffset(0)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:weekOffset===0?"var(--blue-light)":"#fff",color:weekOffset===0?"var(--blue)":"var(--text2)",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>היום</button>
        <button onClick={()=>setWeekOffset(p=>p+1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>שבוע הבא →</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {["הכל",...DEPTS].map(d=><button key={d} onClick={()=>setDeptFilter(d)} style={{padding:"5px 10px",borderRadius:20,border:`1px solid ${deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--border)"}`,background:deptFilter===d?`${DEPT_COLORS[d]||"#2563EB"}15`:"#fff",color:deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--text2)",fontWeight:600,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{d}</button>)}
      </div>
    </div>

    {/* Week grid */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
      {days.map((day,i)=>{
        const dateStr=day.toISOString().split('T')[0];
        const dayTasks=getTasksForDay(dateStr);
        const isToday=dateStr===todayStr;
        const isWeekend=day.getDay()===5||day.getDay()===6;

        return<div key={dateStr} style={{background:isToday?"var(--blue-light)":isWeekend?"var(--bg2)":"#fff",border:`1px solid ${isToday?"var(--blue-mid)":"var(--border)"}`,borderRadius:12,padding:10,minHeight:140}}>
          <div style={{marginBottom:8,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:600,color:isToday?"var(--blue)":"var(--text3)"}}>{dayNames[day.getDay()]}</div>
            <div style={{width:28,height:28,borderRadius:"50%",background:isToday?"var(--blue)":"transparent",color:isToday?"#fff":"var(--text)",fontWeight:isToday?800:600,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"2px auto 0"}}>{day.getDate()}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {dayTasks.map(t=>{
              const sc=SC[t.status]||{c:"#475569",bg:"#F1F5F9"};
              return<div key={t.id} style={{display:"flex",alignItems:"center",gap:4}}>
                <div onClick={()=>onTaskClick(t)} style={{flex:1,minWidth:0,padding:"4px 7px",borderRadius:6,background:sc.bg,borderRight:`3px solid ${DEPT_COLORS[t.dept]||sc.c}`,cursor:"pointer",fontSize:10,fontWeight:600,color:sc.c,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={t.title}>
                  {t.title}
                </div>
                <button type="button" onClick={e=>openLabelPrintTask(e,t)} title="הדפס מדבקת אריזה" style={{...LABEL_PRINT_BTN_STYLE,padding:"2px 6px",flexShrink:0}}>🏷️</button>
                <button type="button" onClick={e=>openDeliveryNoteFromTask(e,t)} title="תעודת משלוח" style={{...DELIVERY_NOTE_BTN_STYLE,padding:"2px 4px",fontSize:8,whiteSpace:"normal",lineHeight:1.15,textAlign:"center",maxWidth:72}}>📋 תעודת משלוח</button>
              </div>;
            })}
            {dayTasks.length===0&&<div style={{fontSize:10,color:"var(--text3)",textAlign:"center",paddingTop:8}}>—</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

function DeliveryTab({tasks}){
  const DRIVERS=["חיים","ניסן/ברק","טייגר","עומרי"];
  const today=new Date();
  const days=[];
  for(let i=0;i<4;i++){
    const d=new Date(today);
    d.setDate(d.getDate()+i);
    days.push(d.toISOString().split('T')[0]);
  }

  const deliveries=tasks.filter(t=>t.dept==="משלוחים"&&t.due_date&&days.includes(t.due_date));

  const printPDF=(driver)=>{
    const driverTasks=deliveries.filter(t=>t.driver===driver).sort((a,b)=>a.due_date.localeCompare(b.due_date));
    const win=window.open('','_blank');
    const html=`<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8">
    <style>
      body{font-family:Arial,sans-serif;padding:30px;color:#0F172A;direction:rtl}
      h1{font-size:24px;margin-bottom:4px;color:#1E3A5F}
      .date{color:#64748B;font-size:13px;margin-bottom:24px}
      .delivery{border:1px solid #E2E8F0;border-radius:8px;padding:16px;margin-bottom:14px;page-break-inside:avoid}
      .delivery-title{font-size:16px;font-weight:700;margin-bottom:8px}
      .delivery-date{display:inline-block;background:#EFF6FF;color:#2563EB;padding:2px 10px;border-radius:20px;font-size:12px;margin-bottom:10px}
      .detail{font-size:13px;color:#475569;margin:4px 0}
      .detail strong{color:#0F172A}
      .no-tasks{text-align:center;padding:40px;color:#94A3B8;font-size:16px}
      @media print{body{padding:15px}}
    </style></head><body>
    <h1>🚚 דוח משלוחים — ${driver}</h1>
    <div class="date">הופק: ${today.toLocaleDateString('he-IL')} | ${driverTasks.length} משלוחים</div>
    ${driverTasks.length===0?'<div class="no-tasks">אין משלוחים לתקופה זו</div>':
      driverTasks.map(t=>`<div class="delivery">
        <div class="delivery-title">${t.title}</div>
        <div class="delivery-date">📅 ${t.due_date}</div>
        ${t.client_name?`<div class="detail"><strong>לקוח:</strong> ${t.client_name}</div>`:''}
        ${t.notes?`<div class="detail"><strong>פרטים:</strong> ${t.notes}</div>`:''}
        ${t.notes&&t.notes.includes('📍')?`<div style="margin-top:8px"><a href="https://waze.com/ul?q=${encodeURIComponent(t.notes.match(/📍\s*([^|]+)/)?.[1]||'')}&navigate=yes" style="display:inline-flex;align-items:center;gap:6px;background:#00D4FF;color:#000;padding:6px 14px;border-radius:20px;text-decoration:none;font-size:12px;font-weight:700">🧭 פתח ב-Waze</a></div>`:''}
        <div style="margin-top:10px;padding-top:10px;border-top:1px solid #E2E8F0">
          <div style="display:flex;gap:20px">
            <div style="flex:1;font-size:12px;color:#94A3B8">חתימה: ________________</div>
            <div style="flex:1;font-size:12px;color:#94A3B8">שעת מסירה: ________________</div>
          </div>
        </div>
      </div>`).join('')}
    <script>window.print();<\/script></body></html>`;
    win.document.write(html);
    win.document.close();
  };

  return<div>
    <div style={{marginBottom:24}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",margin:0}}>דוחות נהגים 🚚</h1>
      <p style={{color:"var(--text3)",margin:"5px 0 0",fontSize:13}}>היום + 3 ימים קדימה | {deliveries.length} משלוחים</p>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:16}}>
      {DRIVERS.map(driver=>{
        const dt=deliveries.filter(t=>t.driver===driver).sort((a,b)=>a.due_date.localeCompare(b.due_date));
        return<div key={driver} style={{background:"#fff",border:"1px solid var(--border)",borderRadius:16,padding:20,boxShadow:"var(--shadow)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <div style={{fontWeight:800,fontSize:16,color:"var(--text)"}}>{driver}</div>
              <div style={{color:"var(--text3)",fontSize:12,marginTop:2}}>{dt.length} משלוחים</div>
            </div>
            <button onClick={()=>printPDF(driver)} style={{padding:"8px 16px",borderRadius:9,border:"none",background:"var(--blue)",color:"#fff",fontWeight:700,fontSize:12,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",gap:6}}>
              🖨️ הדפס
            </button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {dt.length===0&&<div style={{textAlign:"center",padding:"20px 0",color:"var(--text3)",fontSize:12}}>אין משלוחים</div>}
            {dt.map(t=><div key={t.id} style={{padding:"10px 12px",background:"var(--bg2)",borderRadius:10,borderRight:"3px solid var(--blue)"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:600,fontSize:13,color:"var(--text)",marginBottom:3}}>{t.title}</div>
                  <div style={{fontSize:11,color:"var(--text3)"}}>📅 {t.due_date} {t.client_name&&`• ${t.client_name}`}</div>
                  {t.notes&&<div style={{fontSize:11,color:"var(--text2)",marginTop:3}}>📝 {t.notes}</div>}
                </div>
                <button type="button" onClick={e=>openLabelPrintTask(e,t)} title="הדפס מדבקת אריזה" style={LABEL_PRINT_BTN_STYLE}>🏷️</button>

              </div>
            </div>)}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

function CreateOrderModal({open,onClose,onSuccess,clients,sb}){
  const [step,setStep]=useState(1);
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState(null);
  const [clientSearch,setClientSearch]=useState("");
  const [selectedClient,setSelectedClient]=useState(null);
  const [items,setItems]=useState([{description:"",quantity:1,unitPrice:0,discount:0}]);
  const [title,setTitle]=useState("");
  const [remark,setRemark]=useState("");
  const [dept,setDept]=useState("כללי");
  const [agent,setAgent]=useState("");
  const [contactName,setContactName]=useState("");
  useEffect(()=>{
    if(open){
      setStep(1);
      setClientSearch("");
      setSelectedClient(null);
      setItems([{description:"",quantity:1,unitPrice:0,discount:0}]);
      setTitle("");
      setRemark("");
      setDept("כללי");
      setAgent("");
      setContactName("");
      setError(null);
      setSubmitting(false);
    }
  },[open]);
  if(!open)return null;
  const filteredClients=(clients||[]).filter(c=>{
    if(!clientSearch.trim())return true;
    const q=clientSearch.toLowerCase().trim();
    return (
      (c.name||"").toLowerCase().includes(q)||
      (c.phone||"").includes(q)||
      String(c.bina_customer_id||"").includes(q)
    );
  }).slice(0,50);
  const itemsTotal=items.reduce((sum,it)=>{
    const qty=Number(it.quantity)||0;
    const price=Number(it.unitPrice)||0;
    const disc=Number(it.discount)||0;
    return sum+qty*price*(1-disc/100);
  },0);
  const addItem=()=>{setItems([...items,{description:"",quantity:1,unitPrice:0,discount:0}]);};
  const removeItem=(idx)=>{if(items.length===1)return;setItems(items.filter((_,i)=>i!==idx));};
  const updateItem=(idx,field,value)=>{const ni=[...items];ni[idx]={...ni[idx],[field]:value};setItems(ni);};
  const handleSubmit=async()=>{
    setSubmitting(true);
    setError(null);
    try{
      const payload={
        client:{
          binaCustomerId:String(selectedClient.bina_customer_id),
          name:selectedClient.name||"ללא שם",
          city:selectedClient.address||"ללא",
          address:selectedClient.address||"ללא",
          contactPerson:(contactName||"").trim()||selectedClient.name||"ללא",
          phone:selectedClient.phone||"",
          email:selectedClient.email||"",
        },
        items:items.map((it,idx)=>({
          itemId:`LINE-${idx+1}`,
          description:it.description||`פריט ${idx+1}`,
          quantity:Number(it.quantity)||1,
          unitPrice:Number(it.unitPrice)||0,
          discount:Number(it.discount)||0,
        })),
        title:title||`הזמנה ל${selectedClient.name||"לקוח"}`,
        remark:remark||"",
      };
      const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-order",{body:payload});
      if(invE)throw new Error(invE.message);
      let result=data;
      if(typeof data==="string"){try{result=JSON.parse(data)}catch{result=null}}
      if(!result||result.success!==true)throw new Error(result?.error||"שגיאה לא ידועה");
      if(result.taskId){
        const taskPatch={};
        if(dept!=="כללי")taskPatch.dept=dept;
        const ag=(agent||"").trim();
        if(ag)taskPatch.assignee=ag;
        taskPatch.sales_agent=ag||null;
        try{
          await sb(`tasks?id=eq.${result.taskId}`,{method:"PATCH",body:JSON.stringify(taskPatch)});
        }catch(e){console.warn("Failed to update task (dept/assignee/sales_agent):",e)}
      }
      try{
        const addrStr=selectedClient.address||"";
        const cityPart=(addrStr.split(",")[0]||"").trim();
        const orderRow={
          bina_doc_id:Number(result.binaOrderId),
          title:title||`הזמנה ל${selectedClient.name||"לקוח"}`,
          bina_cust_id:parseInt(String(selectedClient.bina_customer_id),10),
          bina_cust_name:selectedClient.name||"",
          bina_cust_address:addrStr||null,
          bina_cust_city:cityPart||null,
          bina_cust_phone:selectedClient.phone||null,
          bina_cust_email:selectedClient.email||null,
          contact_person:(contactName||"").trim()||null,
          sales_agent:(agent||"").trim()||null,
          remark:remark||"",
          status:"נשלחה",
          task_id:result.taskId||null,
        };
        const ordRes=await sb("orders",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(orderRow)});
        const ord=Array.isArray(ordRes)?ordRes[0]:ordRes;
        if(ord?.id){
          const oItems=items.map((it,idx)=>({
            order_id:ord.id,
            line_number:idx+1,
            description:it.description||`פריט ${idx+1}`,
            quantity:Number(it.quantity)||1,
            unit_price:Number(it.unitPrice)||0,
            discount_pct:Number(it.discount)||0,
          }));
          await sb("order_items",{method:"POST",body:JSON.stringify(oItems)});
        }
      }catch(e){console.warn("[CreateOrderModal] orders DB save failed:",e);}
      if(onSuccess)onSuccess(result);
      const orderTitleUi=title||`הזמנה ל${selectedClient.name||"לקוח"}`;
      const showPDF=window.confirm(`✅ נוצרה הזמנה #${result.binaOrderId} בבינה!\n\nלפתוח PDF לתצוגה/הדפסה?`);
      if(showPDF&&typeof window.openDocumentPDF==="function"){
        window.openDocumentPDF({
          docType:"order",
          binaDocId:result.binaOrderId,
          title:orderTitleUi,
          client:{
            name:selectedClient.name,
            address:selectedClient.address,
            phone:selectedClient.phone,
            email:selectedClient.email||"",
            contactPerson:(contactName||"").trim()||selectedClient.name,
          },
          items:items.map(it=>({description:it.description,quantity:Number(it.quantity)||1,unitPrice:Number(it.unitPrice)||0,discount:Number(it.discount)||0})),
          agent:(agent||"").trim(),
          createdAt:new Date().toISOString(),
          remark:remark||"",
        });
      }
      onClose();
    }catch(err){
      setError(err.message||String(err));
    }finally{
      setSubmitting(false);
    }
  };
  const overlayStyle={position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:9999,display:"flex",alignItems:"flex-end",justifyContent:"center",padding:0};
  const modalStyle={width:"100%",maxWidth:600,maxHeight:"95vh",background:"#fff",borderRadius:"16px 16px 0 0",display:"flex",flexDirection:"column",boxShadow:"0 -4px 24px rgba(0,0,0,0.2)",overflow:"hidden"};
  const headerStyle={padding:"16px 20px",borderBottom:"1px solid #eee",display:"flex",alignItems:"center",justifyContent:"space-between",background:"var(--bg2)"};
  const bodyStyle={flex:1,overflowY:"auto",padding:20,direction:"rtl"};
  const footerStyle={padding:16,borderTop:"1px solid #eee",background:"var(--bg2)",display:"flex",gap:8};
  const labelStyle={display:"block",fontSize:14,fontWeight:600,marginBottom:6,color:"var(--text)"};
  const inputStyle={width:"100%",padding:"12px 14px",fontSize:16,border:"1px solid var(--border)",borderRadius:10,boxSizing:"border-box",fontFamily:"inherit",direction:"rtl",background:"var(--bg2)",color:"var(--text)"};
  const btnPrimary={flex:1,padding:"14px 20px",fontSize:16,fontWeight:600,background:"var(--blue)",color:"#fff",border:"none",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnSecondary={flex:1,padding:"14px 20px",fontSize:16,background:"#fff",color:"var(--text2)",border:"1px solid var(--border)",borderRadius:10,cursor:"pointer",fontFamily:"inherit"};
  const btnDanger={padding:"8px 12px",fontSize:14,background:"var(--red)",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"};
  const renderStep1=()=><div>
    <h3 style={{marginTop:0,marginBottom:16}}>👤 בחירת לקוח</h3>
    <input type="text" placeholder="🔍 חיפוש לפי שם, טלפון, או קוד בינה..." value={clientSearch} onChange={e=>setClientSearch(e.target.value)} style={inputStyle}/>
    <div style={{marginTop:12,maxHeight:"calc(95vh - 280px)",overflowY:"auto"}}>
      {filteredClients.length===0?<div style={{padding:20,textAlign:"center",color:"var(--text3)"}}>{clientSearch?"לא נמצאו לקוחות":"אין לקוחות ברשימה"}</div>:
      filteredClients.map(c=><div
        key={c.id}
        onClick={()=>{
          if(c.bina_customer_id){
            setSelectedClient(c);
            setStep(2);
          }else{
            const confirm=window.confirm(`הלקוח "${c.name||"ללא שם"}" לא מקושר לבינה.\n\nכדי ליצור הזמנה צריך קודם ליצור אותו בבינה.\n\nלפתוח את מסך יצירת לקוח חדש?`);
            if(confirm){
              onClose();
              if(window.openBinaClient)window.openBinaClient();
            }
          }
        }}
        style={{
          padding:14,marginBottom:8,border:"1px solid #eee",borderRadius:8,cursor:"pointer",
          background:c.bina_customer_id?"#f0fdf4":"#fefce8",
          borderRight:c.bina_customer_id?"4px solid #22c55e":"4px solid #eab308",
        }}
      >
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{fontWeight:600,fontSize:15}}>{c.name||"ללא שם"}</div>
          <span style={{
            fontSize:11,padding:"2px 8px",borderRadius:12,
            background:c.bina_customer_id?"#22c55e":"#eab308",
            color:"#fff",fontWeight:600,
          }}>
            {c.bina_customer_id?"✓ בבינה":"⚠ לא בבינה"}
          </span>
        </div>
        <div style={{fontSize:13,color:"#666",marginTop:4}}>
          📞 {c.phone||"—"} {c.bina_customer_id?`· 🆔 ${c.bina_customer_id}`:""}
        </div>
      </div>)}
    </div>
  </div>;
  const renderStep2=()=><div>
    <h3 style={{marginTop:0,marginBottom:4}}>📦 פריטים</h3>
    <div style={{fontSize:13,color:"var(--text2)",marginBottom:16}}>לקוח: {selectedClient?.name}</div>
    {items.map((it,idx)=><div key={idx} style={{padding:12,marginBottom:12,background:"var(--bg2)",borderRadius:10,border:"1px solid var(--border)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <strong style={{fontSize:14}}>פריט {idx+1}</strong>
        {items.length>1&&<button type="button" onClick={()=>removeItem(idx)} style={btnDanger}>🗑️</button>}
      </div>
      <label style={labelStyle}>תיאור</label>
      <input type="text" placeholder="לדוגמה: כרטיסי ביקור 350 גרם..." value={it.description} onChange={e=>updateItem(idx,"description",e.target.value)} style={{...inputStyle,marginBottom:10}}/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <div><label style={labelStyle}>כמות</label><input type="number" inputMode="numeric" value={it.quantity} onChange={e=>updateItem(idx,"quantity",e.target.value)} style={inputStyle}/></div>
        <div><label style={labelStyle}>מחיר ₪</label><input type="number" inputMode="decimal" step="0.01" value={it.unitPrice} onChange={e=>updateItem(idx,"unitPrice",e.target.value)} style={inputStyle}/></div>
        <div><label style={labelStyle}>הנחה %</label><input type="number" inputMode="numeric" value={it.discount} onChange={e=>updateItem(idx,"discount",e.target.value)} style={inputStyle}/></div>
      </div>
      <div style={{marginTop:8,fontSize:14,textAlign:"left",color:"var(--blue)",fontWeight:600}}>₪{((Number(it.quantity)||0)*(Number(it.unitPrice)||0)*(1-(Number(it.discount)||0)/100)).toFixed(2)}</div>
    </div>)}
    <button type="button" onClick={addItem} style={{width:"100%",padding:14,fontSize:15,background:"#fff",border:"2px dashed var(--blue)",color:"var(--blue)",borderRadius:10,cursor:"pointer",fontFamily:"inherit"}}>➕ הוסף פריט</button>
    <div style={{marginTop:16,padding:14,background:"var(--blue-light)",borderRadius:10,fontSize:16,fontWeight:600,textAlign:"center",color:"var(--blue)"}}>{`סה"כ (לפני מע"מ): ₪${itemsTotal.toFixed(2)}`}</div>
  </div>;
  const renderStep3=()=><div>
    <h3 style={{marginTop:0,marginBottom:16}}>📝 פרטים נוספים</h3>
    <label style={labelStyle}>סוכן</label>
    <select value={agent} onChange={e=>setAgent(e.target.value)} style={{...inputStyle,marginBottom:14}}>
      <option value="">בחר סוכן...</option>
      <option value="כפיר">כפיר</option>
      <option value="נטלי">נטלי</option>
      <option value="ברק">ברק</option>
    </select>
    <label style={labelStyle}>לידי (שם איש קשר)</label>
    <input type="text" placeholder="שם איש הקשר" value={contactName} onChange={e=>setContactName(e.target.value)} style={{...inputStyle,marginBottom:14}}/>
    <label style={{...labelStyle,fontSize:15,color:"var(--text)"}}>כותרת ההזמנה</label>
    <input type="text" placeholder="לדוגמה: כרטיסי ביקור 350 גרם, 2 צדדים, 100 יחידות" value={title} onChange={e=>setTitle(e.target.value)} style={{...inputStyle,marginBottom:14,fontWeight:600,fontSize:16}}/>
    <label style={labelStyle}>מחלקה</label>
    <select value={dept} onChange={e=>setDept(e.target.value)} style={{...inputStyle,marginBottom:14}}>
      <option value="כללי">כללי</option>
      {DEPTS.map(d=><option key={d} value={d}>{d}</option>)}
    </select>
    <label style={labelStyle}>הערות (לא חובה)</label>
    <textarea placeholder="הערות נוספות, הוראות מיוחדות..." value={remark} onChange={e=>setRemark(e.target.value)} rows={3} style={{...inputStyle,fontFamily:"inherit",resize:"vertical"}}/>
    <div style={{marginTop:16,padding:14,background:"var(--amber-light)",borderRadius:10,fontSize:14,color:"var(--text)"}}>
      <div><strong>📋 סיכום:</strong></div>
      <div>👤 {selectedClient?.name}</div>
      <div>📦 {items.length} פריטים</div>
      <div>{`💰 ₪${itemsTotal.toFixed(2)} (לפני מע"מ)`}</div>
    </div>
    {error&&<div style={{marginTop:12,padding:12,background:"var(--red-light)",color:"var(--red)",borderRadius:10,fontSize:14}}>❌ {error}</div>}
  </div>;
  return<div style={overlayStyle} onClick={onClose}>
    <div style={modalStyle} onClick={e=>e.stopPropagation()}>
      <div style={headerStyle}>
        <strong style={{fontSize:17}}>➕ הזמנה חדשה ({step}/3)</strong>
        <button type="button" onClick={onClose} style={{background:"none",border:"none",fontSize:24,cursor:"pointer",color:"var(--text2)",fontFamily:"inherit"}}>✕</button>
      </div>
      <div style={bodyStyle}>{step===1&&renderStep1()}{step===2&&renderStep2()}{step===3&&renderStep3()}</div>
      <div style={footerStyle}>
        {step>1&&<button type="button" onClick={()=>setStep(step-1)} disabled={submitting} style={btnSecondary}>← חזור</button>}
        {step===1&&<button type="button" onClick={onClose} style={btnSecondary}>ביטול</button>}
        {step===2&&<button type="button" onClick={()=>setStep(3)} style={btnPrimary}>המשך ←</button>}
        {step===3&&<button type="button" onClick={handleSubmit} disabled={submitting||!selectedClient} style={{...btnPrimary,opacity:submitting?0.6:1}}>{submitting?"⏳ שולח...":"🚀 שלח לבינה"}</button>}
      </div>
    </div>
  </div>;
}

function CreateQuoteModal({open,onClose,onSuccess,clients,sb}){
