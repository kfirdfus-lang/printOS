              <button type="button" onClick={()=>{setPlateWidth(210);setPlateHeight(297);}} style={{padding:6,fontSize:11,background:plateWidth===210&&plateHeight===297?"#3b82f6":"white",color:plateWidth===210&&plateHeight===297?"white":"#374151",border:"1px solid #d1d5db",borderRadius:4,cursor:"pointer",fontFamily:"inherit"}}>A4 (210×297)</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <input type="number" value={plateWidth} onChange={e=>setPlateWidth(parseFloat(e.target.value)||0)} placeholder="רוחב" style={{padding:6,fontSize:13,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/>
              <input type="number" value={plateHeight} onChange={e=>setPlateHeight(parseFloat(e.target.value)||0)} placeholder="גובה" style={{padding:6,fontSize:13,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/>
            </div>
          </div>
          <div style={{marginBottom:15}}>
            <label style={{fontWeight:600,fontSize:13}}>כיוון פלטה:</label>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:6}}>
              <button type="button" onClick={()=>{if(plateWidth>plateHeight){const t=plateWidth;setPlateWidth(plateHeight);setPlateHeight(t);}}} style={{padding:10,background:plateWidth<plateHeight?"#3b82f6":"white",color:plateWidth<plateHeight?"white":"#374151",border:"2px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>📄 עומד (Portrait)</button>
              <button type="button" onClick={()=>{if(plateHeight>plateWidth){const t=plateWidth;setPlateWidth(plateHeight);setPlateHeight(t);}}} style={{padding:10,background:plateWidth>plateHeight?"#3b82f6":"white",color:plateWidth>plateHeight?"white":"#374151",border:"2px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>📃 שכוב (Landscape)</button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:15}}>
            <div>
              <label style={{fontSize:12,color:"#6b7280"}}>Bleed (מ"מ):</label>
              <input type="number" value={bleed} onChange={e=>setBleed(parseFloat(e.target.value)||0)} step="0.5" style={{width:"100%",padding:6,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/>
            </div>
            <div>
              <label style={{fontSize:12,color:"#6b7280"}}>Gutter (מ"מ):</label>
              <input type="number" value={gutter} onChange={e=>setGutter(parseFloat(e.target.value)||0)} step="0.5" style={{width:"100%",padding:6,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}}/>
            </div>
          </div>
          <div style={{background:"linear-gradient(135deg, #dbeafe 0%, #e0e7ff 100%)",padding:15,borderRadius:8,marginBottom:15}}>
            <div style={{fontWeight:700,marginBottom:8,color:"#1e3a8a"}}>📊 תצוגה מקדימה:</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,fontSize:13}}>
              <div>גריד: <strong>{previewLayout.cols}×{previewLayout.rows}</strong></div>
              <div>בפלטה: <strong>{previewLayout.perPlate}</strong> יחידות</div>
              <div>סה"כ פלטות: <strong>{previewLayout.plates}</strong></div>
              <div>בפלטה זו: <strong>{Math.min(previewLayout.perPlate,quantity)}</strong> יח'</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button type="button" onClick={()=>setStep("design")} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← חזור</button>
            <button type="button" onClick={()=>setStep("review")} style={{flex:2,padding:10,background:"#3b82f6",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>סקירה אחרונה →</button>
          </div>
        </>}
        {step==="review"&&<>
          <div style={{background:"#f0fdfa",padding:15,borderRadius:8,marginBottom:15,border:"1px solid #2dd4bf"}}>
            <div style={{fontWeight:700,color:"#0d9488",marginBottom:10}}>📋 סיכום הבקשה</div>
            <div style={{display:"grid",gap:6,fontSize:13}}>
              <div>📎 קובץ: <strong>{designFile?.name}</strong></div>
              <div>🎨 צורה: <strong>{shapeLabel}</strong></div>
              <div>📐 מידות: <strong>{productWidth} × {productHeight} מ"מ</strong></div>
              <div>🔢 כמות: <strong>{quantity}</strong></div>
              <div>📏 פלטה: <strong>{plateWidth} × {plateHeight} מ"מ</strong></div>
              <div>🪟 Bleed: <strong>{bleed} מ"מ</strong> · Gutter: <strong>{gutter} מ"מ</strong></div>
              <div style={{marginTop:8,padding:8,background:"white",borderRadius:6}}>📊 <strong>{previewLayout.cols}×{previewLayout.rows} = {previewLayout.perPlate}</strong> בפלטה · <strong>{previewLayout.plates}</strong> פלטות סה"כ</div>
            </div>
          </div>
          <div style={{background:"#fef3c7",padding:10,borderRadius:6,marginBottom:15,fontSize:12,color:"#78350f"}}>⚠️ <strong>שים לב:</strong> בגרסה הנוכחית תקבל <strong>פלטה אחת</strong> בלבד (עד {Math.min(previewLayout.perPlate,quantity)} יחידות). ריבוי פלטות יתווסף בגרסה הבאה.</div>
          <div style={{display:"flex",gap:10}}>
            <button type="button" onClick={()=>setStep("params")} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← חזור</button>
            <button type="button" onClick={handleCreate} disabled={creating} style={{flex:2,padding:12,background:"linear-gradient(135deg, #3b82f6 0%, #1e40af 100%)",color:"white",border:"none",borderRadius:6,fontWeight:700,fontSize:14,cursor:creating?"wait":"pointer",fontFamily:"inherit"}}>{creating?"⏳ יוצר...":"✨ צור פלטה!"}</button>
          </div>
        </>}
        {step==="processing"&&<div style={{textAlign:"center",padding:30}}>
          <div style={{fontSize:48,marginBottom:15}}>⏳</div>
          <div style={{fontSize:18,fontWeight:600,marginBottom:8}}>יוצר פלטה...</div>
          <div style={{fontSize:13,color:"#6b7280"}}>{processingStatus||"מעבד..."}</div>
        </div>}
      </div>
    </div>
  </div>;
}

const MOCKUP_CATEGORY_LABELS={
  clothing:"👕 ביגוד",
  accessories:"🎒 אביזרים",
  drinkware:"☕ כלי שתייה",
  marketing:"📋 פרסום ושיווק",
  stickers:"🏷️ מדבקות",
  office:"📝 משרד",
  gifts:"🎁 מזכרות",
  special:"🏭 דפוס מיוחד",
  displays:"🏗️ מתקני תצוגה"
};

function MockupRequestForm({onClose,onCreated,user}){
  const [step,setStep]=useState("product");
  const [products,setProducts]=useState([]);
  const [loadingProducts,setLoadingProducts]=useState(true);
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [selectedColor,setSelectedColor]=useState("");
  const [selectedLocations,setSelectedLocations]=useState([]);
  const [locationFiles,setLocationFiles]=useState({});
  const [brief,setBrief]=useState("");
  const [creating,setCreating]=useState(false);
  const [processingStatus,setProcessingStatus]=useState(null);
  useEffect(()=>{(async()=>{
    try{
      const data=await sb("mockup_products?is_active=eq.true&order=sort_order");
      setProducts(data||[]);
    }catch(e){console.error(e);}
    finally{setLoadingProducts(false);}
  })();},[]);
  const productsByCategory=useMemo(()=>{
    const groups={};
    products.forEach(p=>{
      if(!groups[p.category])groups[p.category]=[];
      groups[p.category].push(p);
    });
    return groups;
  },[products]);
  const productLocations=selectedProduct?asJsonArray(selectedProduct.print_locations):[];
  const productColors=selectedProduct?asJsonArray(selectedProduct.colors):[];
  const allFilesReady=selectedLocations.length>0&&selectedLocations.every(n=>locationFiles[n]);
  const pickProduct=p=>{
    setSelectedProduct(p);
    const colors=asJsonArray(p.colors);
    setSelectedColor(colors[0]||"");
    setSelectedLocations([]);
    setLocationFiles({});
    setStep("configure");
  };
  const toggleLocation=locName=>{
    setSelectedLocations(prev=>prev.includes(locName)?prev.filter(l=>l!==locName):[...prev,locName]);
  };
  const handleCreate=async()=>{
    if(!selectedProduct||!selectedColor||selectedLocations.length===0||!allFilesReady)return;
    const allLocations=selectedLocations.map(locName=>{
      const loc=productLocations.find(l=>l.name===locName);
      const file=locationFiles[locName];
      return{name:locName,view:loc?.view||"",width_cm:loc?.max_width_cm||0,height_cm:loc?.max_height_cm||0,file_path:file?.path,file_url:file?.path};
    });
    setCreating(true);
    setStep("processing");
    setProcessingStatus("יוצר בקשה...");
    try{
      const result=await sb("design_requests",{method:"POST",body:JSON.stringify({
        request_type:"mockup",
        title:`הדמיה - ${selectedProduct.name} (${selectedColor})`,
        status:"pending",
        input_files:Object.values(locationFiles).filter(Boolean),
        parameters:{product_id:selectedProduct.id,product_name:selectedProduct.name,color:selectedColor,locations:allLocations,brief:brief.trim()||null},
        created_by:user?.name||"unknown"
      })});
      const newRequest=Array.isArray(result)?result[0]:result;
      if(!newRequest?.id)throw new Error("לא נוצרה בקשה");
      setProcessingStatus("⏳ AI יוצר הדמיה - זה ייקח 60-90 שניות...");
      const {data,error}=await supabaseClient.functions.invoke("mockup-generate",{body:{
        request_id:newRequest.id,
        product_id:selectedProduct.id,
        product_name_en:selectedProduct.name_en,
        product_ai_description:selectedProduct.ai_description||selectedProduct.name_en,
        color:selectedColor,
        views:asJsonArray(selectedProduct.views),
        print_locations:allLocations,
        brief:brief.trim()||undefined
      }});
      if(error)throw error;
      if(data?.error)throw new Error(data.error);
      setProcessingStatus("✅ הושלם!");
      setTimeout(()=>{onCreated?.();},800);
    }catch(e){
      window.alert("שגיאה: "+(e.message||String(e)));
      setStep("review");
    }finally{setCreating(false);}
  };
  if(loadingProducts)return<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,padding:30,textAlign:"center"}}>טוען מוצרים...</div>
  </div>;
  return<div onClick={creating?undefined:onClose} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:700,maxHeight:"90vh",overflowY:"auto",boxShadow:"var(--shadow-lg)"}}>
      <div style={{background:"linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)",padding:20,color:"white",borderTopLeftRadius:20,borderTopRightRadius:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <h2 style={{margin:0,fontSize:18}}>🖼️ יצירת הדמיה AI</h2>
            <div style={{fontSize:13,opacity:0.9,marginTop:4}}>הדמיה ריאליסטית של המוצר עם ההדפס</div>
          </div>
          {!creating&&<button type="button" onClick={onClose} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"none",padding:"6px 12px",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>✕</button>}
        </div>
      </div>
      <div style={{padding:20}}>
        {step==="product"&&<>
          <p style={{margin:"0 0 15px",color:"#6b7280",fontSize:14}}>בחר מוצר שתרצה להדמות:</p>
          {Object.entries(MOCKUP_CATEGORY_LABELS).map(([catId,catLabel])=>{
            const catProducts=productsByCategory[catId];
            if(!catProducts?.length)return null;
            return<div key={catId} style={{marginBottom:20}}>
              <div style={{fontWeight:700,fontSize:14,color:"#6b7280",marginBottom:8,paddingBottom:6,borderBottom:"1px solid #e5e7eb"}}>{catLabel}</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(140px, 1fr))",gap:8}}>
                {catProducts.map(p=><button type="button" key={p.id} onClick={()=>pickProduct(p)} style={{padding:12,background:"white",border:"2px solid #e5e7eb",borderRadius:8,cursor:"pointer",textAlign:"center",fontFamily:"inherit",transition:"all 0.2s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor="#8b5cf6";e.currentTarget.style.transform="translateY(-2px)";}} onMouseLeave={e=>{e.currentTarget.style.borderColor="#e5e7eb";e.currentTarget.style.transform="none";}}>
                  <div style={{fontSize:32,marginBottom:6}}>{p.emoji}</div>
                  <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
                </button>)}
              </div>
            </div>;
          })}
          <button type="button" onClick={onClose} style={{width:"100%",padding:10,marginTop:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        </>}
        {step==="configure"&&selectedProduct&&<>
          <div style={{padding:12,background:"#f3f4f6",borderRadius:8,marginBottom:15,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:32}}>{selectedProduct.emoji}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:16}}>{selectedProduct.name}</div>
              <div style={{fontSize:11,color:"#6b7280"}}>{selectedProduct.name_en}</div>
            </div>
            <button type="button" onClick={()=>setStep("product")} style={{background:"white",border:"1px solid #d1d5db",padding:"4px 10px",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>שנה מוצר</button>
          </div>
          {productColors.length>0&&<div style={{marginBottom:20}}>
            <label style={{fontWeight:600,fontSize:14,marginBottom:8,display:"block"}}>🎨 צבע המוצר:</label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {productColors.map(c=><button type="button" key={c} onClick={()=>setSelectedColor(c)} style={{padding:"8px 14px",background:selectedColor===c?"#8b5cf6":"white",color:selectedColor===c?"white":"#374151",border:`2px solid ${selectedColor===c?"#8b5cf6":"#d1d5db"}`,borderRadius:8,cursor:"pointer",fontWeight:selectedColor===c?600:400,fontSize:13,fontFamily:"inherit"}}>{c}</button>)}
            </div>
          </div>}
          <div style={{marginBottom:20}}>
            <label style={{fontWeight:600,fontSize:14,marginBottom:8,display:"block"}}>📍 מיקומי הדפסה (בחר אחד או יותר):</label>
            <div style={{display:"grid",gap:8}}>
              {productLocations.map(loc=>{
                const isSelected=selectedLocations.includes(loc.name);
                return<button type="button" key={loc.name} onClick={()=>toggleLocation(loc.name)} style={{padding:12,textAlign:"right",background:isSelected?"#f3e8ff":"white",border:`2px solid ${isSelected?"#8b5cf6":"#d1d5db"}`,borderRadius:8,cursor:"pointer",display:"flex",alignItems:"center",gap:10,fontFamily:"inherit"}}>
                  <div style={{width:20,height:20,borderRadius:4,background:isSelected?"#8b5cf6":"white",border:`2px solid ${isSelected?"#8b5cf6":"#d1d5db"}`,display:"flex",alignItems:"center",justifyContent:"center",color:"white",fontSize:12}}>{isSelected?"✓":""}</div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:600,fontSize:14}}>{loc.name}</div>
                    <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>מקסימום: {loc.max_width_cm} × {loc.max_height_cm} ס"מ · {loc.view}</div>
                  </div>
                </button>;
              })}
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button type="button" onClick={()=>setStep("product")} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← חזור</button>
            <button type="button" onClick={()=>setStep("upload")} disabled={selectedLocations.length===0} style={{flex:2,padding:10,background:selectedLocations.length===0?"#d1d5db":"#8b5cf6",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:selectedLocations.length===0?"not-allowed":"pointer",fontFamily:"inherit"}}>הבא: העלה קבצים →</button>
          </div>
        </>}
        {step==="upload"&&selectedProduct&&<>
          <p style={{margin:"0 0 15px",color:"#6b7280",fontSize:14}}>העלה לוגו/עיצוב לכל מיקום הדפסה:</p>
          {selectedLocations.map(locName=>{
            const loc=productLocations.find(l=>l.name===locName);
            const file=locationFiles[locName];
            return<div key={locName} style={{marginBottom:15,padding:12,background:"#f9fafb",borderRadius:8}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>📍 {locName} <span style={{fontWeight:400,color:"#6b7280",fontSize:11}}>({loc?.max_width_cm} × {loc?.max_height_cm} ס"מ)</span></div>
              {file?<div style={{padding:10,background:"white",borderRadius:6,border:"1px solid #2dd4bf",display:"flex",alignItems:"center",gap:10}}>
                <div style={{fontSize:20}}>{getFileIcon(file.type,file.name)}</div>
                <div style={{flex:1,fontSize:12}}>{file.name}</div>
                <button type="button" onClick={()=>{const nf={...locationFiles};delete nf[locName];setLocationFiles(nf);}} style={{background:"white",border:"1px solid #d1d5db",padding:"4px 8px",borderRadius:4,cursor:"pointer",fontSize:11,fontFamily:"inherit"}}>החלף</button>
              </div>:<FileUploadField folder="design_requests/mockup/input" onUploaded={fr=>setLocationFiles({...locationFiles,[locName]:fr})} label={`העלה קובץ ל-${locName}`}/>}
            </div>;
          })}
          <div style={{marginBottom:15}}>
            <label style={{fontWeight:600,fontSize:13,marginBottom:6,display:"block"}}>📝 הוראות נוספות ל-AI (אופציונלי):</label>
            <textarea value={brief} onChange={e=>setBrief(e.target.value)} placeholder="למשל: רקע בית קפה, אדם צעיר לובש את החולצה..." style={{width:"100%",padding:10,borderRadius:6,border:"1px solid #d1d5db",minHeight:60,fontSize:13,fontFamily:"inherit"}}/>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button type="button" onClick={()=>setStep("configure")} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← חזור</button>
            <button type="button" onClick={()=>setStep("review")} disabled={!allFilesReady} style={{flex:2,padding:10,background:!allFilesReady?"#d1d5db":"#8b5cf6",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:!allFilesReady?"not-allowed":"pointer",fontFamily:"inherit"}}>סקירה אחרונה →</button>
          </div>
        </>}
        {step==="review"&&selectedProduct&&<>
          <div style={{background:"#f3e8ff",padding:15,borderRadius:8,marginBottom:15,border:"1px solid #c084fc"}}>
            <div style={{fontWeight:700,color:"#581c87",marginBottom:10,fontSize:15}}>📋 סיכום הבקשה</div>
            <div style={{display:"grid",gap:6,fontSize:13}}>
              <div>{selectedProduct.emoji} <strong>{selectedProduct.name}</strong></div>
              <div>🎨 צבע: <strong>{selectedColor}</strong></div>
              <div>📍 מיקומי הדפסה: <strong>{selectedLocations.length}</strong></div>
              {selectedLocations.map(loc=><div key={loc} style={{fontSize:12,marginRight:10,color:"#6b7280"}}>• {loc}</div>)}
              {brief.trim()&&<div style={{marginTop:8,padding:8,background:"white",borderRadius:6,fontSize:12}}>💬 {brief}</div>}
            </div>
          </div>
          <div style={{background:"#dbeafe",padding:12,borderRadius:8,marginBottom:12,border:"1px solid #93c5fd"}}>
            <div style={{fontWeight:700,color:"#1e3a8a",marginBottom:6,fontSize:13}}>🤖 איך זה יעבוד:</div>
            <div style={{fontSize:12,color:"#1e3a8a",lineHeight:1.6}}>
              1. המערכת תזהה אוטומטית אם ללוגו יש רקע<br/>
              2. אם יש — תסיר אותו ב-Remove.bg<br/>
              3. תייצר הדמיה ריאליסטית עם OpenAI<br/>
              <strong>זמן משוער: 60-90 שניות</strong>
            </div>
          </div>
          <div style={{background:"#fef3c7",padding:10,borderRadius:6,marginBottom:15,fontSize:12,color:"#78350f"}}>💡 <strong>הערה:</strong> AI יצירתי — הלוגו עשוי להיראות דומה אבל לא מדויק 100%. מצוין לרושם כללי עם הלקוח.<br/>💰 עלות משוערת: ~$0.04–0.08 לתמונה (+ Remove.bg אם נדרש).</div>
          <div style={{display:"flex",gap:10}}>
            <button type="button" onClick={()=>setStep("upload")} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>← חזור</button>
            <button type="button" onClick={handleCreate} disabled={creating} style={{flex:2,padding:12,background:"linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)",color:"white",border:"none",borderRadius:6,fontWeight:700,fontSize:14,cursor:creating?"wait":"pointer",fontFamily:"inherit"}}>{creating?"⏳ יוצר...":"✨ צור הדמיה!"}</button>
          </div>
        </>}
        {step==="processing"&&<div style={{textAlign:"center",padding:40}}>

}

function NewRequestModal({presetType,onClose,onCreated,user}){
  const [step,setStep]=useState(presetType?"details":"selectType");
  const [selectedType,setSelectedType]=useState(presetType);
  const [title,setTitle]=useState("");
  const [description,setDescription]=useState("");
  const [inputFiles,setInputFiles]=useState([]);
  const [saving,setSaving]=useState(false);
  const handleFileUploaded=fileResult=>{setInputFiles(prev=>[...prev,fileResult]);};
  const handleRemoveFile=index=>{setInputFiles(prev=>prev.filter((_,i)=>i!==index));};
  const handleCreate=async()=>{
    if(!title.trim()){window.alert("יש למלא כותרת");return;}
    if(inputFiles.length===0&&!window.confirm("לא הועלו קבצי קלט. להמשיך בכל זאת?"))return;
    setSaving(true);
    try{
      await sb("design_requests",{method:"POST",body:JSON.stringify({request_type:selectedType.id,title:title.trim(),description:description.trim()||null,status:"pending",input_files:inputFiles,created_by:user?.name||"unknown"})});
      onCreated?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
    finally{setSaving(false);}
  };
  return<Modal open onClose={onClose} title="➕ בקשה חדשה לגרפיקאי AI" maxWidth={600}>
    {step==="selectType"?<>
      <p style={{margin:"0 0 15px",color:"#6b7280"}}>איזה סוג בקשה?</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {DESIGN_REQUEST_TYPES.map(t=><button type="button" key={t.id} onClick={()=>{setSelectedType(t);setStep("details");}} style={{padding:15,background:"white",border:`2px solid ${t.color}`,borderRadius:8,cursor:"pointer",textAlign:"right",fontFamily:"inherit"}}>
          <div style={{fontSize:28,marginBottom:6}}>{t.icon}</div>
          <div style={{fontWeight:600,color:t.color,fontSize:14}}>{t.name}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4}}>{t.description}</div>

    </>:selectedType&&<>
      <div style={{background:selectedType.color+"15",padding:10,borderRadius:6,marginBottom:15,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div style={{fontWeight:600,color:selectedType.color}}>{selectedType.icon} {selectedType.name}</div>

      </div>
      <div style={{background:"#fef3c7",padding:10,borderRadius:6,marginBottom:15,fontSize:12,color:"#78350f"}}>⚠️ <strong>בשלב פיתוח:</strong> המערכת רושמת את הבקשה אבל עדיין לא מבצעת את הפעולה אוטומטית. כפיר יטפל ידנית בשלב זה.</div>
      <div style={{marginBottom:10}}><label style={{fontWeight:600,fontSize:13}}>כותרת הבקשה *:</label><input value={title} onChange={e=>setTitle(e.target.value)} placeholder="למשל: סידור פלטה - מדבקות לוגו לקוח X" style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",fontFamily:"inherit"}} autoFocus/></div>
      <div style={{marginBottom:15}}><label style={{fontWeight:600,fontSize:13}}>תיאור / הוראות:</label><textarea value={description} onChange={e=>setDescription(e.target.value)} placeholder="פרטים נוספים, הוראות מיוחדות, פרמטרים..." style={{width:"100%",padding:8,marginTop:4,borderRadius:6,border:"1px solid #d1d5db",minHeight:80,fontFamily:"inherit"}}/></div>
      <div style={{marginBottom:15}}>
        <label style={{fontWeight:600,fontSize:13,display:"block",marginBottom:6}}>קבצי קלט ({inputFiles.length}):</label>
        {inputFiles.length>0&&<div style={{marginBottom:10,display:"flex",flexDirection:"column",gap:6}}>
          {inputFiles.map((f,i)=><div key={i} style={{padding:8,background:"#f9fafb",borderRadius:6,display:"flex",alignItems:"center",gap:8}}>
            <div style={{fontSize:18}}>{getFileIcon(f.type,f.name)}</div>
            <div style={{flex:1,fontSize:12}}>{f.name} <span style={{color:"#9ca3af"}}>({formatFileSize(f.size)})</span></div>
            <button type="button" onClick={()=>handleRemoveFile(i)} style={{background:"transparent",border:"none",color:"#ef4444",cursor:"pointer",fontFamily:"inherit"}}>✕</button>
          </div>)}
        </div>}
        <FileUploadField folder={`design_requests/${selectedType.id}`} onUploaded={handleFileUploaded} label="הוסף קובץ קלט"/>
      </div>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:10,background:"#f3f4f6",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" onClick={handleCreate} disabled={saving} style={{flex:2,padding:12,background:"linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)",color:"white",border:"none",borderRadius:6,fontWeight:600,cursor:saving?"wait":"pointer",fontFamily:"inherit"}}>{saving?"⏳ יוצר...":"✨ צור בקשה"}</button>
      </div>
    </>}
  </Modal>;

function RequestDetailsModal({request,onClose,onUpdate}){
  const type=getRequestTypeById(request.request_type);
  const statusInfo=STATUS_LABELS[request.status]||STATUS_LABELS.pending;
  const handleStatusChange=async newStatus=>{
    const updates={status:newStatus};
    if(newStatus==="processing"&&!request.started_at)updates.started_at=new Date().toISOString();
    if(newStatus==="completed"&&!request.completed_at)updates.completed_at=new Date().toISOString();
    try{
      await sb(`design_requests?id=eq.${request.id}`,{method:"PATCH",body:JSON.stringify(updates)});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  const handleAddOutput=async fileResult=>{
    const newOutputs=[...(request.output_files||[]),fileResult];
    try{
      await sb(`design_requests?id=eq.${request.id}`,{method:"PATCH",body:JSON.stringify({output_files:newOutputs})});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  const handleDelete=async()=>{
    if(!window.confirm("למחוק את הבקשה? פעולה לא ניתנת לביטול."))return;
    try{
      for(const f of [...(request.input_files||[]),...(request.output_files||[])])await deleteFileFromStorage(f.path);
      await sb(`design_requests?id=eq.${request.id}`,{method:"DELETE"});
      onUpdate?.();
    }catch(e){window.alert("שגיאה: "+e.message);}
  };
  return<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(15,23,42,0.4)",backdropFilter:"blur(4px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:20,width:"100%",maxWidth:650,maxHeight:"90vh",overflowY:"auto",boxShadow:"var(--shadow-lg)"}}>
      <div style={{background:`linear-gradient(135deg, ${type.color} 0%, ${type.color}dd 100%)`,padding:20,color:"white",borderTopLeftRadius:20,borderTopRightRadius:20}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:13,opacity:0.9,marginBottom:6}}>{type.icon} {type.name}</div>
            <h2 style={{margin:0,fontSize:18}}>{request.title}</h2>
          </div>
          <button type="button" onClick={onClose} style={{background:"rgba(255,255,255,0.2)",color:"white",border:"none",padding:"6px 12px",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>✕</button>
        </div>
      </div>
      <div style={{padding:20}}>
        <div style={{padding:12,background:statusInfo.color+"15",borderRadius:8,marginBottom:15,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
          <div style={{fontWeight:600,color:statusInfo.color}}>{statusInfo.icon} סטטוס: {statusInfo.label}</div>
          <select value={request.status} onChange={e=>handleStatusChange(e.target.value)} style={{padding:"4px 8px",borderRadius:6,border:"1px solid #d1d5db",fontSize:13,background:"white",fontFamily:"inherit"}}>
            {Object.entries(STATUS_LABELS).map(([k,v])=><option key={k} value={k}>{v.icon} {v.label}</option>)}
          </select>
        </div>
        {request.description&&<div style={{marginBottom:15}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>תיאור:</div>
          <div style={{padding:10,background:"#f9fafb",borderRadius:6,fontSize:13,color:"#374151",whiteSpace:"pre-wrap"}}>{request.description}</div>
        </div>}
        {request.error_message&&<div style={{marginBottom:15,padding:10,background:"#fef2f2",borderRadius:6,border:"1px solid #fecaca",fontSize:12,color:"#991b1b"}}>❌ {request.error_message}</div>}
        {Array.isArray(request.processing_log)&&request.processing_log.length>0&&<div style={{marginBottom:15}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>📋 לוג עיבוד:</div>
          <div style={{padding:10,background:"#f9fafb",borderRadius:6,fontSize:11,color:"#374151",maxHeight:160,overflowY:"auto",fontFamily:"monospace"}}>
            {request.processing_log.map((entry,i)=><div key={i} style={{marginBottom:4}}>{entry.step||"—"}{entry.is_transparent!=null?` · שקוף: ${entry.is_transparent}`:""}{entry.error?` · ${entry.error}`:""}</div>)}
          </div>
        </div>}
        <div style={{marginBottom:15}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>📎 קבצי קלט ({(request.input_files||[]).length}):</div>
          {(request.input_files||[]).length===0?<div style={{color:"#9ca3af",fontSize:13,padding:10,textAlign:"center"}}>אין קבצי קלט</div>:<div style={{display:"grid",gap:6}}>{request.input_files.map((f,i)=><FilePreviewLink key={i} filePath={f.path} fileName={f.name} fileType={f.type} fileSize={f.size}/>)}</div>}
        </div>
        <div style={{marginBottom:15}}>
          <div style={{fontWeight:600,fontSize:13,marginBottom:6}}>📤 קבצי פלט ({(request.output_files||[]).length}):</div>
          {(request.output_files||[]).length>0&&<div style={{display:"grid",gap:6,marginBottom:8}}>{request.output_files.map((f,i)=><FilePreviewLink key={i} filePath={f.path} fileName={f.name} fileType={f.type} fileSize={f.size}/>)}</div>}
          <FileUploadField folder={`design_requests/${request.id}/output`} onUploaded={handleAddOutput} label="הוסף קובץ פלט"/>
        </div>
        <div style={{padding:10,background:"#f9fafb",borderRadius:6,marginBottom:15,fontSize:12,color:"#6b7280",display:"grid",gap:4}}>
          <div>נוצר: {new Date(request.created_at).toLocaleString("he-IL")} · {request.created_by||"—"}</div>
          {request.started_at&&<div>התחיל: {new Date(request.started_at).toLocaleString("he-IL")}</div>}
          {request.completed_at&&<div>הושלם: {new Date(request.completed_at).toLocaleString("he-IL")}</div>}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button type="button" onClick={handleDelete} style={{padding:10,background:"white",color:"#ef4444",border:"1px solid #ef4444",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ מחק</button>
          <button type="button" onClick={onClose} style={{flex:1,padding:10,background:"#0d9488",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>סגור</button>
        </div>
      </div>
    </div>
  </div>;
}

function DesignerDashboard({user}){
  const [requests,setRequests]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showNewRequest,setShowNewRequest]=useState(false);
  const [selectedType,setSelectedType]=useState(null);
  const [filterStatus,setFilterStatus]=useState("all");
  const loadRequests=async()=>{
    try{
      const data=await sb("design_requests?order=created_at.desc&limit=100");
      setRequests(data||[]);
    }catch(e){console.error(e);}
    finally{setLoading(false);}
  };
  useEffect(()=>{
    loadRequests();
    const interval=setInterval(loadRequests,30000);
    return()=>clearInterval(interval);
  },[]);
  const filtered=useMemo(()=>{
    if(filterStatus==="all")return requests;
    if(filterStatus==="active")return requests.filter(r=>["pending","processing"].includes(r.status));
    return requests.filter(r=>r.status===filterStatus);
  },[requests,filterStatus]);
  const activeCount=requests.filter(r=>["pending","processing"].includes(r.status)).length;
  const completedCount=requests.filter(r=>r.status==="completed").length;
  const closeNewRequest=()=>{setShowNewRequest(false);setSelectedType(null);};
  const openNewRequestForType=type=>{setSelectedType(type);setShowNewRequest(true);};
  const onRequestCreated=()=>{loadRequests();closeNewRequest();};
  if(loading)return<div style={{padding:30,textAlign:"center"}}>טוען...</div>;
  return<div style={{padding:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:12}}>
      <div>
        <h2 style={{margin:"0 0 5px"}}>🎨 גרפיקאי AI</h2>
        <p style={{margin:0,color:"#6b7280",fontSize:14}}>מערכת בקשות גרפיות אוטומטית</p>
      </div>
      <button type="button" onClick={()=>{setSelectedType(null);setShowNewRequest(true);}} style={{padding:"12px 22px",background:"linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%)",color:"white",border:"none",borderRadius:8,fontWeight:600,fontSize:14,cursor:"pointer",fontFamily:"inherit",boxShadow:"0 2px 4px rgba(139,92,246,0.3)"}}>➕ בקשה חדשה</button>
    </div>
    <div style={{marginBottom:25}}>
      <h3 style={{marginBottom:12,fontSize:15,color:"#6b7280"}}>סוגי בקשות זמינות:</h3>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(220px, 1fr))",gap:10}}>
        {DESIGN_REQUEST_TYPES.map(type=><button type="button" key={type.id} onClick={()=>openNewRequestForType(type)} style={{background:"white",padding:14,borderRadius:10,border:`2px solid ${type.color}30`,cursor:"pointer",textAlign:"right",transition:"all 0.2s",position:"relative",fontFamily:"inherit"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=type.color;e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow=`0 4px 12px ${type.color}30`;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=type.color+"30";e.currentTarget.style.transform="none";e.currentTarget.style.boxShadow="none";}}>
          <div style={{fontSize:28,marginBottom:6}}>{type.icon}</div>
          <div style={{fontWeight:600,fontSize:14,color:type.color}}>{type.name}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:4,minHeight:30}}>{type.description}</div>
          {type.priority===1&&<div style={{position:"absolute",top:8,left:8,background:"#fef3c7",color:"#78350f",fontSize:10,padding:"2px 6px",borderRadius:4,fontWeight:600}}>⭐ ראשון לפיתוח</div>}
        </button>)}
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:15,background:"#f3f4f6",padding:4,borderRadius:8,width:"fit-content",flexWrap:"wrap"}}>
      {[{id:"all",label:`הכל (${requests.length})`},{id:"active",label:`פעיל (${activeCount})`,color:"#3b82f6"},{id:"completed",label:`הושלם (${completedCount})`,color:"#10b981"}].map(f=><button type="button" key={f.id} onClick={()=>setFilterStatus(f.id)} style={{padding:"6px 14px",background:filterStatus===f.id?"white":"transparent",color:filterStatus===f.id?(f.color||"#374151"):"#6b7280",border:"none",borderRadius:6,cursor:"pointer",fontWeight:filterStatus===f.id?600:400,fontSize:13,boxShadow:filterStatus===f.id?"0 1px 2px rgba(0,0,0,0.1)":"none",fontFamily:"inherit"}}>{f.label}</button>)}
    </div>
    {filtered.length===0?<div style={{textAlign:"center",padding:40,color:"#9ca3af",background:"#f9fafb",borderRadius:10}}>
      <div style={{fontSize:48,marginBottom:10}}>🎨</div>
      <div>אין בקשות {filterStatus==="all"?"":"בקטגוריה זו"}</div>
      <div style={{fontSize:13,marginTop:6}}>לחץ "➕ בקשה חדשה" כדי להתחיל</div>
    </div>:<div style={{display:"grid",gap:8}}>{filtered.map(req=><DesignRequestCard key={req.id} request={req} onUpdate={loadRequests}/>)}</div>}
    {showNewRequest&&isImpositionRequestType(selectedType)&&<ImpositionRequestForm user={user} onClose={closeNewRequest} onCreated={onRequestCreated}/>}
    {showNewRequest&&isMockupRequestType(selectedType)&&<MockupRequestForm user={user} onClose={closeNewRequest} onCreated={onRequestCreated}/>}
    {showNewRequest&&!isImpositionRequestType(selectedType)&&!isMockupRequestType(selectedType)&&<NewRequestModal presetType={selectedType} user={user} onClose={closeNewRequest} onCreated={onRequestCreated}/>}
  </div>;
}

function resolveClientForTask(task,clients){
  const list=Array.isArray(clients)?clients:[];
  if(task.client_id!=null&&task.client_id!==""){
    const m=list.find(c=>String(c.id)===String(task.client_id));
    if(m)return m;
  }
  if(task.bina_cust_id!=null&&task.bina_cust_id!==""){
    const m=list.find(c=>String(c.bina_customer_id||"")===String(task.bina_cust_id));
    if(m)return m;
  }
  if(task.client_name)return list.find(c=>c.name===task.client_name)||null;
  return null;
}

/** צילום הזמנה מטבלאות PrintOS (נשמרו מבינה בסנכרון / יצירת הזמנה) — בלי Edge Function חדש */
async function loadOrderSnapshotFromDb(task){
  const oid=task.bina_order_id;
  if(oid==null||oid==="")return null;
  try{
    let ord=null;
    const byBina=await sb(`orders?bina_doc_id=eq.${oid}&limit=1`);
    if(Array.isArray(byBina)&&byBina[0])ord=byBina[0];
    if(!ord){
      const byTask=await sb(`orders?task_id=eq.${task.id}&limit=1`);
      if(Array.isArray(byTask)&&byTask[0])ord=byTask[0];
    }
    if(!ord)return null;
    const addrParts=[ord.bina_cust_address,ord.bina_cust_city].filter(Boolean);
    const oItems=await sb(`order_items?order_id=eq.${ord.id}&order=line_number.asc`);
    const lines=(Array.isArray(oItems)?oItems:[]).map(oi=>({
      id:oi.id,
      description:String(oi.description||"").trim()||"—",
      quantity:oi.quantity!=null?oi.quantity:1,
      bina_item_code:null,
    }));
    return{
      customerName:String(ord.bina_cust_name||"").trim()||(task.client_name||""),
      contactName:String(ord.contact_person||"").trim()||(task.contact||""),
      phone:ord.bina_cust_phone||task.bina_cust_phone||"",
      email:ord.bina_cust_email||task.bina_cust_email||"",
      address:addrParts.join(", ")||"",
      orderItems:lines.length>0?lines:null,
    };
  }catch(e){
    console.warn("[delivery-notes] order snapshot:",e);
    return null;
  }
}

function DeliveryNoteModal({task,clients,user,onClose}){
  const [client,setClient]=useState(null);
  const [items,setItems]=useState([]);
  const [allItems,setAllItems]=useState([]);
  const [deliveryAddress,setDeliveryAddress]=useState("");
  const [savedAddresses,setSavedAddresses]=useState([]);
  const [selectedAddressId,setSelectedAddressId]=useState(null);
  const [saveAddressForFuture,setSaveAddressForFuture]=useState(false);
  const [showAddNewAddress,setShowAddNewAddress]=useState(false);
  const [custName,setCustName]=useState("");
  const [custContact,setCustContact]=useState("");
  const [custPhone,setCustPhone]=useState("");
  const [custEmail,setCustEmail]=useState("");
  const [notes,setNotes]=useState("");
  const [driverName,setDriverName]=useState("");
  const [loading,setLoading]=useState(true);
  const [creating,setCreating]=useState(false);
  const [createdNote,setCreatedNote]=useState(null);
  const [copySuccess,setCopySuccess]=useState(false);

  useEffect(()=>{
    let cancelled=false;
    const run=async()=>{
      setLoading(true);
      setSavedAddresses([]);
      setSelectedAddressId(null);
      setSaveAddressForFuture(false);
      const snap=task.bina_order_id?await loadOrderSnapshotFromDb(task):null;
      if(cancelled)return;
      if(snap)console.log("[delivery-notes] נטען צילום הזמנה מטבלת orders (הזמנה "+String(task.bina_order_id)+")");

      let c=resolveClientForTask(task,clients);
      if(!c&&task.client_id){
        try{
          const row=await sb(`clients?id=eq.${task.client_id}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!c&&task.bina_cust_id){
        try{
          const row=await sb(`clients?bina_customer_id=eq.${task.bina_cust_id}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!c&&task.client_name){
        try{
          const row=await sb(`clients?name=eq.${encodeURIComponent(task.client_name)}&limit=1`);
          if(!cancelled&&row?.[0])c=row[0];
        }catch(e){/* ignore */}
      }
      if(!cancelled)setClient(c||null);

      let addresses=[];
      if(c?.id){
        try{
          const addrRows=await sb(`client_addresses?client_id=eq.${c.id}&order=is_default.desc,last_used_at.desc`);
          if(!cancelled)addresses=Array.isArray(addrRows)?addrRows:[];
        }catch(e){/* table may not exist yet */}
      }
      if(!cancelled)setSavedAddresses(addresses);

      const hasDeliverySnapshot=task.delivery_status&&task.delivery_status!=="pending";
      const addrFromTask=[task.bina_cust_address,task.bina_cust_city].filter(Boolean).join(", ")||"";
      const snapAddr=snap?.address||"";
      const defaultAddr=addresses.find(a=>a.is_default)||addresses[0];
      let resolvedAddr=defaultAddr?.address||snapAddr||c?.address||addrFromTask||"";
      let resolvedContact=c?(c.delivery_contact_name||c.contact_name||snap?.contactName||task.contact||""):(snap?.contactName||task.contact||"");
      let resolvedPhone=c?(c.delivery_contact_phone||c.phone||snap?.phone||task.bina_cust_phone||""):(snap?.phone||task.bina_cust_phone||"");
      const resolvedEmail=c?(c.delivery_email||c.orders_email_primary||c.email||snap?.email||task.bina_cust_email||""):(snap?.email||task.bina_cust_email||"");
      const resolvedName=snap?.customerName||c?.name||task.client_name||"";
      if(hasDeliverySnapshot){
        if(task.delivery_address_snapshot)resolvedAddr=task.delivery_address_snapshot;
        if(task.delivery_contact_snapshot)resolvedContact=task.delivery_contact_snapshot;
        if(task.delivery_phone_snapshot)resolvedPhone=task.delivery_phone_snapshot;
      }

      if(!cancelled){
        setCustName(resolvedName);
        setCustContact(resolvedContact);
        setCustPhone(resolvedPhone);
        setCustEmail(resolvedEmail);
        setDeliveryAddress(resolvedAddr);
        if(task.delivery_address_snapshot)setSelectedAddressId(null);
        else if(defaultAddr)setSelectedAddressId(defaultAddr.id);
        else setSelectedAddressId(null);
        if(c?.delivery_notes)setNotes(c.delivery_notes);
      }

      if(snap&&!cancelled){
        if(snap.orderItems&&snap.orderItems.length>0){
          setAllItems(snap.orderItems);
          setItems(snap.orderItems.map(i=>i.id));
        }else{
          await loadTaskItemsFallback();
        }
      }else if(!cancelled){
        await loadTaskItemsFallback();
      }

      async function loadTaskItemsFallback(){
        if(cancelled)return;
        try{
          const ti=await sb(`task_items?task_id=eq.${task.id}&order=id.asc`);
          if(cancelled)return;
          if(ti&&ti.length>0){
            setAllItems(ti);
            setItems(ti.map(i=>i.id));
          }else{
            const fake={id:"task-"+task.id,description:task.title,quantity:1,bina_item_code:null,_isSingleTask:true};
            setAllItems([fake]);
            setItems([fake.id]);
          }
        }catch(e){
          if(!cancelled){
            const fake={id:"task-"+task.id,description:task.title,quantity:1,bina_item_code:null,_isSingleTask:true};
            setAllItems([fake]);
            setItems([fake.id]);
          }
        }
      }

      if(!cancelled)setLoading(false);
    };
    run();
    return()=>{cancelled=true};
  },[task.id,task.title,task.client_name,task.client_id,task.bina_cust_id,task.bina_order_id,task.contact,task.bina_cust_phone,task.bina_cust_email,task.bina_cust_address,task.bina_cust_city,task.delivery_status,task.delivery_address_snapshot,task.delivery_contact_snapshot,task.delivery_phone_snapshot,clients]);

  const toggleItem=(id)=>{
    setItems(p=>p.includes(id)?p.filter(x=>x!==id):[...p,id]);
  };

  const signUrl=createdNote?`${typeof window!=="undefined"&&window.location?window.location.origin:""}${window.location.pathname||""}${window.location.search||""}#sign/${createdNote.signature_token}`:"";

  const handleCreate=async()=>{
    if(items.length===0){window.alert("יש לבחור לפחות פריט אחד");return;}
    setCreating(true);
    try{
      const selectedItems=allItems.filter(i=>items.includes(i.id)).map(i=>({
        description:i.description||"",
        quantity:i.quantity!=null?i.quantity:1,
        bina_item_code:i.bina_item_code||null,
      }));
      const token=(crypto.randomUUID&&crypto.randomUUID())?crypto.randomUUID().replace(/-/g,""):String(Math.random()).slice(2)+Date.now().toString(36);
      const expiresAt=new Date(Date.now()+7*24*60*60*1000).toISOString();
      const nm=custName.trim()||task.client_name||"לקוח";
      const payload={
        task_id:task.id,
        bina_order_id:task.bina_order_id!=null?String(task.bina_order_id):null,
        customer_name:nm,
        contact_name:custContact.trim()||null,
        customer_address:deliveryAddress.trim()||null,
        customer_phone:custPhone.trim()||null,
        customer_email:custEmail.trim()||null,
        items:selectedItems,
        signature_token:token,
        signature_token_expires_at:expiresAt,
        driver_name:driverName.trim()||null,
        notes:notes.trim()||null,
        created_by:user?.name||"unknown",
      };
      const result=await sb("delivery_notes",{method:"POST",body:JSON.stringify(payload),headers:{Prefer:"return=representation"}});
      if(result&&result[0]){
        setCreatedNote(result[0]);
        try{
          if(saveAddressForFuture&&client&&deliveryAddress.trim()&&!selectedAddressId){
            await sb("client_addresses",{method:"POST",body:JSON.stringify({
              client_id:client.id,
              address:deliveryAddress.trim(),
              is_default:false,
              created_by:user?.name||"unknown",
            })});
          }
          if(selectedAddressId){
            const current=savedAddresses.find(a=>a.id===selectedAddressId);
            await sb(`client_addresses?id=eq.${selectedAddressId}`,{method:"PATCH",body:JSON.stringify({
              usage_count:(current?.usage_count||0)+1,
              last_used_at:new Date().toISOString(),
            })});
          }
        }catch(addrErr){console.warn("[delivery-notes] address save:",addrErr);}
      }else window.alert("שגיאה ביצירת התעודה");
    }catch(e){
      window.alert("שגיאה ביצירת התעודה: "+(e.message||String(e)));
    }
    setCreating(false);
  };

  const handlePrint=()=>{
    if(!createdNote)return;
    const w=window.open("","_blank","width=800,height=900");
    if(!w)return;
    w.document.write(generateDeliveryNoteHTML(createdNote));
    w.document.close();
    setTimeout(()=>{try{w.print()}catch(e){}},500);
  };

  const handleCopyLink=async()=>{
    if(!createdNote)return;
    const u=signUrl;
    try{
      await navigator.clipboard.writeText(u);
      setCopySuccess(true);
      setTimeout(()=>setCopySuccess(false),2000);
    }catch(e){
      window.alert("שגיאה בהעתקה. נסה שוב.");
    }
  };

  const handleWhatsApp=()=>{
    if(!createdNote)return;
    const u=signUrl;
    const text=`שלום, תעודת משלוח ${createdNote.delivery_number}\nלקוח: ${createdNote.customer_name}\nכתובת: ${createdNote.customer_address||"—"}\nקישור לחתימת מקבל:\n${u}`;
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };

  const secondaryCreatedBtn={padding:"12px 10px",borderRadius:10,border:"1px solid var(--border)",background:"#fff",fontWeight:600,cursor:"pointer",fontFamily:"inherit",fontSize:13};

  return<Modal open={true} onClose={onClose} title={createdNote?`✅ תעודה ${createdNote.delivery_number} נוצרה!`:`תעודת משלוח חדשה`} maxWidth={640}>
    {loading?<div style={{textAlign:"center",padding:40}}>
      <Spinner sz={32}/>
      {task.bina_order_id?<p style={{marginTop:16,color:"var(--text2)",fontSize:14}}>טוען נתונים מהזמנה…</p>:null}
    </div>:
    createdNote?<div style={{direction:"rtl"}}>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:48}}>✅</div>
        <h2 style={{margin:"8px 0",fontSize:20,fontWeight:800,color:"var(--text)"}}>תעודה {createdNote.delivery_number} נוצרה!</h2>
      </div>
      <button type="button" onClick={handleCopyLink} style={{width:"100%",padding:16,background:"#0e7490",color:"#fff",border:"none",borderRadius:10,fontSize:17,fontWeight:700,cursor:"pointer",marginBottom:10,fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
        {copySuccess?"✔ הועתק!":"🔗 העתק קישור חתימה לנהג"}
      </button>
      {signUrl?<div style={{background:"#f3f4f6",padding:10,borderRadius:6,fontSize:12,color:"#6b7280",wordBreak:"break-all",direction:"ltr",textAlign:"left",marginBottom:14}}>{signUrl}</div>:null}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>

          <div><label style={{fontSize:11,color:"var(--text3)",display:"block"}}>טלפון</label><input value={custPhone} onChange={e=>setCustPhone(e.target.value)} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"10px 13px",color:"var(--text)",fontSize:13,width:"100%",outline:"none",fontFamily:"inherit",direction:"ltr"}}/></div>

          setSavedAddresses(list);
          const def=list.find(a=>a.is_default)||list[0];

function SignaturePage({token}){
  const [note,setNote]=useState(null);
  const [signerName,setSignerName]=useState("");
  const [loading,setLoading]=useState(true);
  const [submitting,setSubmitting]=useState(false);
  const [signed,setSigned]=useState(false);
  const canvasRef=useRef(null);
  const padRef=useRef(null);

  useEffect(()=>{
    let cancelled=false;
    const enc=encodeURIComponent(token);
    sb(`delivery_notes?signature_token=eq.${enc}&limit=1`).then(r=>{
      if(cancelled)return;
      if(r?.[0]){
        setNote(r[0]);
        if(r[0].signed_at)setSigned(true);
      }
      setLoading(false);
    }).catch(()=>{if(!cancelled)setLoading(false)});
    return()=>{cancelled=true};
  },[token]);

  const initPad=()=>{
    if(!canvasRef.current||!window.SignaturePad)return;
    const canvas=canvasRef.current;
    const rect=canvas.parentElement.getBoundingClientRect();
    canvas.width=Math.max(300,rect.width-4);
    canvas.height=200;
    padRef.current=new window.SignaturePad(canvas,{backgroundColor:"rgba(255,255,255,0)",penColor:"#1f2937"});
  };

  useEffect(()=>{
    if(loading||signed||!note)return;
    if(note.signature_token_expires_at&&!note.signed_at&&new Date(note.signature_token_expires_at)<new Date())return;
    const ensureScript=()=>{
      if(window.SignaturePad){setTimeout(initPad,80);return;}
      if(document.querySelector('script[data-signature-pad="1"]')){setTimeout(ensureScript,100);return;}
      const script=document.createElement("script");
      script.dataset.signaturePad="1";
      script.src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js";
      script.onload=()=>setTimeout(initPad,80);
      document.head.appendChild(script);
    };
    ensureScript();
  },[loading,signed,note]);

  const handleClear=()=>padRef.current?.clear();

  const handleSubmit=async()=>{
    if(!padRef.current||padRef.current.isEmpty()){window.alert("נא לחתום");return;}
    if(!signerName.trim()){window.alert("נא למלא שם מקבל");return;}
    setSubmitting(true);
    try{
      const signatureData=padRef.current.toDataURL("image/png");
      const enc=encodeURIComponent(token);
      await sb(`delivery_notes?signature_token=eq.${enc}`,{
        method:"PATCH",
        body:JSON.stringify({
          signature_data:signatureData,
          signed_at:new Date().toISOString(),
          signed_by_name:signerName.trim(),
          status:"signed",
        }),
      });
      setSigned(true);
    }catch(e){
      window.alert("שגיאה בשמירה: "+(e.message||String(e)));
    }
    setSubmitting(false);
  };

  if(loading)return<div style={{textAlign:"center",padding:50,fontFamily:"Heebo,sans-serif"}}>טוען...</div>;
  if(!note)return<div style={{textAlign:"center",padding:50,color:"#dc2626",fontFamily:"Heebo,sans-serif"}}>תעודה לא נמצאה או פגה</div>;
  if(!note.signed_at&&note.signature_token_expires_at&&new Date(note.signature_token_expires_at)<new Date())return<div style={{textAlign:"center",padding:50,color:"#dc2626",fontFamily:"Heebo,sans-serif"}}>פג תוקף הקישור</div>;

  return<div style={{minHeight:"100vh",padding:20,background:"#f3f4f6",direction:"rtl",fontFamily:"'Heebo',sans-serif"}}>
    <div style={{maxWidth:600,margin:"0 auto",background:"#fff",borderRadius:12,padding:20,boxShadow:"0 4px 6px rgba(0,0,0,0.1)"}}>
      <h1 style={{color:"#0e7490",marginBottom:15,fontSize:22}}>📋 תעודת משלוח #{note.delivery_number}</h1>
      <div style={{background:"#f9fafb",padding:15,borderRadius:6,marginBottom:20,fontSize:14}}>
        <div><strong>לקוח:</strong> {note.customer_name}</div>
        {note.customer_address&&<div><strong>כתובת:</strong> {note.customer_address}</div>}
        <div style={{marginTop:10}}><strong>פריטים:</strong>
          <ul style={{marginRight:20,marginTop:6}}>
            {(Array.isArray(note.items)?note.items:[]).map((it,i)=><li key={i}>{it.description} (כמות: {it.quantity})</li>)}
          </ul>
        </div>
      </div>
      {signed?<div style={{background:"#d1fae5",color:"#065f46",padding:20,borderRadius:8,textAlign:"center"}}>
        <div style={{fontSize:48}}>✅</div>
        <h2 style={{margin:"8px 0"}}>החתימה התקבלה!</h2>
        <p>תודה רבה, התעודה נחתמה בהצלחה.</p>
      </div>:<>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:5,fontWeight:600}}>שם המקבל:</label>
          <input value={signerName} onChange={e=>setSignerName(e.target.value)} placeholder="שם מלא" style={{width:"100%",padding:10,border:"1px solid #d1d5db",borderRadius:6,fontSize:16,fontFamily:"inherit"}}/>
        </div>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:5,fontWeight:600}}>חתימה:</label>
          <div style={{border:"2px dashed #d1d5db",borderRadius:8,height:200,position:"relative",background:"#fff"}}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",touchAction:"none"}}/>
          </div>
          <button type="button" onClick={handleClear} style={{marginTop:8,padding:"6px 12px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>🗑️ נקה</button>
        </div>
        <button type="button" onClick={handleSubmit} disabled={submitting} style={{width:"100%",padding:15,background:"#0e7490",color:"#fff",border:"none",borderRadius:8,fontSize:18,fontWeight:600,cursor:"pointer",marginTop:10,fontFamily:"inherit"}}>
          {submitting?"שולח...":"✅ אשר קבלה"}
        </button>
      </>}
      <div style={{marginTop:30,textAlign:"center",fontSize:12,color:"#9ca3af"}}>נטלי פתרונות הדפסה בע"מ</div>
    </div>
  </div>;
}

function shipmentDateWeekday(dateStr){
  if(!dateStr)return null;
  const p=String(dateStr).split("-").map(Number);
  if(p.length<3||!p[0])return null;
  return new Date(p[0],p[1]-1,p[2]).getDay();
}
function isShipmentWeekendDate(dateStr){
  const day=shipmentDateWeekday(dateStr);
  return day===5||day===6;
}
function shipmentWeekendWarning(dateStr){
  const day=shipmentDateWeekday(dateStr);
  if(day===5)return"⚠️ תאריך זה יום שישי - לא יוצג בלוח הראשי, ניתן יהיה לערוך";
  if(day===6)return"⚠️ תאריך זה יום שבת - לא יוצג בלוח הראשי, ניתן יהיה לערוך";
  return null;
}

function formatSingleShipmentText(task){
  let text=`📦 *משלוח - ${task.client_name||"לקוח"}*\n`;
  if(task.bina_order_id)text+=`📝 הזמנה #${task.bina_order_id}\n`;
  if(task.sales_agent)text+=`👤 סוכן: ${task.sales_agent}\n`;
  text+="\n";
  if(task.delivery_address_snapshot)text+=`📍 ${task.delivery_address_snapshot}\n`;
  if(task.delivery_contact_snapshot||task.delivery_phone_snapshot){
    const contactLine=`${task.delivery_contact_snapshot||""} ${task.delivery_phone_snapshot||""}`.trim();
    if(contactLine)text+=`📞 ${contactLine}\n`;
  }
  const items=Array.isArray(task.items)?task.items:[];
  if(items.length>0){
    text+=`\n📦 פריטים למסירה:\n`;
    items.forEach(item=>{text+=`• ${item.description||"—"} (×${item.quantity??0})\n`;});
  }
  if(task.delivery_special_notes)text+=`\n💬 ${task.delivery_special_notes}\n`;
  return text.trim();
}

        if(clientData&&!cancelled){
          setClient(clientData);
          const addrs=await sb(`client_addresses?client_id=eq.${clientData.id}&order=is_default.desc,last_used_at.desc`);
          const list=Array.isArray(addrs)?addrs:[];
          if(!cancelled)setSavedAddresses(list);
          const defaultAddr=list.find(a=>a.is_default)||list[0];
          if(defaultAddr&&!cancelled){
            setSelectedAddressId(defaultAddr.id);
            setAddress(defaultAddr.address);
          }
          let contacts=[];
          try{
            const cr=await sb(`client_delivery_contacts?client_id=eq.${clientData.id}&order=is_default.desc,usage_count.desc,last_used_at.desc`);
            contacts=Array.isArray(cr)?cr:[];
          }catch(e){console.warn("[deliveries] load contacts",e);}
          if(!cancelled){
            setSavedContacts(contacts);
            if(contacts.length>0){
              setContactMode("pick");
              const defaultContact=contacts.find(c=>c.is_default)||contacts[0];
              setSelectedContactId(defaultContact.id);
              setContactName(defaultContact.contact_name);
              setPhone(defaultContact.contact_phone);
            }else{
              setContactMode("addNew");
              setContactName(clientData.delivery_contact_name||clientData.contact_name||task.contact||"");
              setPhone(clientData.delivery_contact_phone||clientData.phone||task.bina_cust_phone||"");
            }
          }
        }else if(!cancelled){
          setContactName(task.contact||"");
          setPhone(task.bina_cust_phone||"");
          const addrParts=[task.bina_cust_address,task.bina_cust_city].filter(Boolean);
          if(addrParts.length)setAddress(addrParts.join(", "));
        }
        const drs=await sb("drivers?is_active=eq.true&order=name.asc");
        if(!cancelled)setDrivers(Array.isArray(drs)?drs:[]);
        const taskItems=await sb(`task_items?task_id=eq.${task.id}&order=id.asc`);
        if(!cancelled)setMoveItems(Array.isArray(taskItems)?taskItems:[]);
        if(!cancelled)setScheduledDate(toLocalDateStr(new Date()));
      }catch(e){console.warn("[shipments]",e);}
      if(!cancelled)setLoading(false);
    };
    load();
    return()=>{cancelled=true};
  },[task.id]);
  const handleMove=async()=>{
    if(deliveryType!=="pickup"&&!address.trim()){window.alert("יש להזין כתובת");return;}
    if(deliveryType!=="pickup"&&(!contactName.trim()||!phone.trim())){window.alert("יש למלא שם וטלפון לאיש קשר");return;}
    setSaving(true);
    try{
      if(selectedContactId){
        await incrementContactUsage();
      }else if(client?.id&&contactName.trim()&&phone.trim()){
        try{
          await sb("client_delivery_contacts",{method:"POST",body:JSON.stringify({
            client_id:client.id,
            contact_name:contactName.trim(),
            contact_phone:phone.trim(),
            is_default:savedContacts.length===0,
            usage_count:1,
            last_used_at:new Date().toISOString(),
            created_by:user?.name||"unknown",
          })});
        }catch(e){console.warn("[deliveries] save contact",e);}
      }
      await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({
        delivery_status:"ready",
        scheduled_delivery_date:scheduledDate||null,
        assigned_driver_id:driverId||null,
        delivery_type:deliveryType,
        delivery_address_snapshot:deliveryType==="pickup"?null:address.trim(),
        delivery_contact_snapshot:contactName.trim()||null,
        delivery_phone_snapshot:phone.trim()||null,
        delivery_special_notes:specialNotes.trim()||null,
        delivery_marked_at:new Date().toISOString(),
        delivery_marked_by:user?.name||"unknown",
      })});
      if(selectedAddressId){
        const current=savedAddresses.find(a=>a.id===selectedAddressId);
        await sb(`client_addresses?id=eq.${selectedAddressId}`,{method:"PATCH",body:JSON.stringify({
          usage_count:(current?.usage_count||0)+1,
          last_used_at:new Date().toISOString(),
        })});
      }
      if(client&&client.id){
        const clientUpdates={};
        const cn=contactName.trim();
        const ph=phone.trim();
        if(cn&&cn!==(client.delivery_contact_name||""))clientUpdates.delivery_contact_name=cn;
        if(ph&&ph!==(client.delivery_contact_phone||""))clientUpdates.delivery_contact_phone=ph;
        if(Object.keys(clientUpdates).length>0){
          try{
            await sb(`clients?id=eq.${client.id}`,{method:"PATCH",body:JSON.stringify(clientUpdates)});
            console.log("[deliveries] עודכנו פרטי משלוח של הלקוח:",clientUpdates);
          }catch(e){console.warn("[deliveries] לא הצלחנו לעדכן את הלקוח:",e);}
        }
      }
      if(client&&client.id&&deliveryType!=="pickup"&&address.trim()&&!selectedAddressId){
        try{
          await sb("client_addresses",{method:"POST",body:JSON.stringify({
            client_id:client.id,
            address:address.trim(),
            is_default:false,
            created_by:user?.name||"unknown",
          })});
          console.log("[deliveries] נשמרה כתובת חדשה ללקוח");
        }catch(e){console.warn("[deliveries] לא הצלחנו לשמור כתובת:",e);}
      }
      onSuccess?.();
      onClose();
      window.alert(`✅ המשימה הועברה למשלוחים${client?" ופרטי הלקוח עודכנו":""}`);
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
    setSaving(false);
  };
  return<Modal open={true} onClose={onClose} title="📦 העבר משימה למשלוחים" maxWidth={600}>
    {loading?<div style={{textAlign:"center",padding:30}}><Spinner sz={28}/></div>:<div style={{direction:"rtl",display:"flex",flexDirection:"column",gap:14}}>
      <div style={{background:"#f0f9ff",padding:10,borderRadius:8,fontSize:13}}>
        <strong>הזמנה:</strong> {task.bina_order_id?`#${task.bina_order_id} — `:""}{task.title}<br/>
        <strong>לקוח:</strong> {task.client_name||"—"}
      </div>
      <div><label style={{display:"block",marginBottom:6,fontWeight:700}}>סוג משלוח:</label>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {[{v:"local",label:"🚚 משלוח מקומי",desc:"נהג שלנו"},{v:"courier",label:"📮 שליח/דואר",desc:"מסירה חיצונית"},{v:"pickup",label:"🛒 איסוף עצמי",desc:"לקוח אוסף"}].map(opt=>
            <button type="button" key={opt.v} onClick={()=>setDeliveryType(opt.v)} style={{flex:1,minWidth:120,padding:12,borderRadius:8,border:deliveryType===opt.v?"2px solid #7c3aed":"2px solid var(--border)",background:deliveryType===opt.v?"#f5f3ff":"#fff",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>
              <div style={{fontWeight:600}}>{opt.label}</div>
              <div style={{color:"var(--text3)",marginTop:4}}>{opt.desc}</div>
            </button>
          )}
        </div>
      </div>
      {deliveryType!=="pickup"&&<>
        <div><label style={{display:"block",marginBottom:6,fontWeight:600}}>📍 כתובת:</label>
          {savedAddresses.length>0&&<select value={selectedAddressId||"custom"} onChange={e=>{
            const val=e.target.value;
            if(val==="custom"){setSelectedAddressId(null);setAddress("");}
            else{const addr=savedAddresses.find(a=>a.id===val);if(addr){setSelectedAddressId(val);setAddress(addr.address);}}
          }} style={{...fld,marginBottom:6}}>
            {savedAddresses.map(a=><option key={a.id} value={a.id}>{a.is_default?"⭐ ":""}{a.label?`[${a.label}] `:""}{String(a.address||"").substring(0,60)}</option>)}
            <option value="custom">✏️ כתובת חדשה</option>
          </select>}
          <textarea value={address} onChange={e=>{setAddress(e.target.value);if(selectedAddressId)setSelectedAddressId(null);}} placeholder="רחוב, עיר" rows={3} style={fld}/>
        </div>
        <div style={{marginBottom:15}}>
          <label style={{display:"block",marginBottom:6,fontWeight:600,fontSize:14}}>👤 איש קשר למשלוח:</label>
          {contactMode==="pick"&&!showAddContact&&<>
            <div style={{background:"#f0fdfa",padding:12,borderRadius:8,border:"1px solid #2dd4bf",marginBottom:8}}>
              <div style={{fontSize:12,color:"#0d9488",marginBottom:8}}>⚡ אנשי קשר שמורים ללקוח זה ({savedContacts.length})</div>
              <div style={{display:"flex",flexDirection:"column",gap:6}}>
                {savedContacts.map(c=><button type="button" key={c.id} onClick={()=>handleSelectContact(c)} style={{padding:10,textAlign:"right",background:selectedContactId===c.id?"#0d9488":"#fff",color:selectedContactId===c.id?"#fff":"#374151",border:`1px solid ${selectedContactId===c.id?"#0d9488":"#d1d5db"}`,borderRadius:6,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"inherit"}}>
                  <div>
                    <div style={{fontWeight:600}}>{c.is_default&&"⭐ "}{c.contact_name}</div>
                    <div style={{fontSize:12,color:selectedContactId===c.id?"rgba(255,255,255,0.85)":"#6b7280",marginTop:2,direction:"ltr",textAlign:"right"}}>📞 {c.contact_phone}</div>
                  </div>
                  {c.usage_count>0&&<div style={{fontSize:11,color:selectedContactId===c.id?"rgba(255,255,255,0.7)":"#9ca3af"}}>{c.usage_count} פעמים</div>}
                </button>)}
              </div>
            </div>
            <button type="button" onClick={handleStartAddNew} style={{width:"100%",padding:10,background:"transparent",border:"2px dashed #d1d5db",borderRadius:8,cursor:"pointer",color:"#6b7280",fontSize:13,fontFamily:"inherit"}}>➕ הוסף איש קשר חדש</button>
          </>}
          {(contactMode==="addNew"||showAddContact)&&<div style={{background:"#fefce8",padding:12,borderRadius:8,border:"1px solid #fde68a"}}>
            {contactMode==="addNew"&&<div style={{fontSize:12,color:"#78350f",marginBottom:8}}>ℹ️ אין אנשי קשר שמורים ללקוח זה - הוסף את הראשון</div>}
            <div style={{marginBottom:8}}><input type="text" value={contactName} onChange={e=>setContactName(e.target.value)} placeholder="שם איש הקשר *" style={{...fld,borderRadius:6}} autoFocus={contactMode==="addNew"}/></div>
            <div style={{marginBottom:contactMode==="pick"?8:0}}><input type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="טלפון *" style={{...fld,borderRadius:6,direction:"ltr"}}/></div>
            {contactMode==="pick"&&showAddContact&&<div style={{display:"flex",gap:6,marginTop:8}}>
              <button type="button" onClick={()=>{
                setShowAddContact(false);
                const prevId=prevContactIdRef.current;
                if(prevId){
                  const prev=savedContacts.find(c=>c.id===prevId);
                  if(prev){setSelectedContactId(prev.id);setContactName(prev.contact_name);setPhone(prev.contact_phone);}
                }
              }} style={{flex:1,padding:8,fontSize:12,background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
              <button type="button" onClick={handleSaveNewContact} style={{flex:2,padding:8,fontSize:12,background:"#0d9488",color:"#fff",border:"none",borderRadius:6,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>💾 שמור והשתמש</button>
            </div>}
          </div>}
        </div>
      </>}
      {moveItems.length>0&&<div style={{marginBottom:15,padding:12,background:"#f9fafb",borderRadius:8,border:"1px solid var(--border)"}}>
        <div style={{fontWeight:600,marginBottom:8,color:"var(--text2)"}}>📦 פריטים שיועברו למשלוח:</div>
        {moveItems.map((item,i)=><div key={item.id||i} style={{display:"flex",justifyContent:"space-between",padding:"4px 0",fontSize:13,gap:8}}>
          <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>• {item.description||"—"}</span>
          <span style={{fontWeight:600,direction:"ltr",flexShrink:0}}>×{item.quantity??0}</span>
        </div>)}
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        <div><label style={{display:"block",marginBottom:4,fontSize:12}}>📅 תאריך משלוח</label><input type="date" value={scheduledDate} onChange={e=>setScheduledDate(e.target.value)} style={fld}/></div>
        {deliveryType==="local"&&<div><label style={{display:"block",marginBottom:4,fontSize:12}}>🚛 נהג</label><select value={driverId} onChange={e=>setDriverId(e.target.value)} style={fld}>
          <option value="">-- ללא שיוך --</option>
          {drivers.map(d=><option key={d.id} value={d.id}>{d.name}</option>)}
        </select></div>}
      </div>
      {dateWarning&&<div style={{marginTop:-4,marginBottom:8,padding:8,background:"#fef3c7",borderRadius:6,fontSize:12,color:"#78350f"}}>{dateWarning}</div>}
      <div><label style={{display:"block",marginBottom:4,fontSize:12}}>💬 הערות מיוחדות</label><textarea value={specialNotes} onChange={e=>setSpecialNotes(e.target.value)} rows={2} style={fld} placeholder="למשל: לתאם מראש, שביר..."/></div>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" disabled={saving} onClick={handleMove} style={{flex:2,padding:12,borderRadius:10,border:"none",background:"#7c3aed",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{saving?"⏳...":"📦 העבר למשלוחים"}</button>
      </div>
    </div>}
  </Modal>;
}

function DriverManagerModal({drivers,onClose,onUpdate}){

function SplitByDriverModal({date,tasks,drivers,onClose}){
  const tasksByDriver=useMemo(()=>{
    const groups={};
    tasks.forEach(t=>{
      const driverId=t.assigned_driver_id||"_unassigned";
      if(!groups[driverId])groups[driverId]=[];
      groups[driverId].push(t);
    });
    return groups;
  },[tasks]);
  const getDriverName=driverId=>{
    if(driverId==="_unassigned")return "⚠️ ללא נהג";
    const d=drivers.find(dr=>dr.id===driverId);
    return d?`🚛 ${d.name}`:"נהג לא ידוע";
  };
  const formatDriverText=(driverId,driverTasks)=>{
    const driverName=getDriverName(driverId);
    const dateStr=date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
    let text=`📦 *משלוחים ${driverName}*\n`;
    text+=`📅 ${dateStr}\n`;
    text+=`סה"כ: ${driverTasks.length} משלוחים\n\n`;
    text+="━━━━━━━━━━━━━━\n\n";
    driverTasks.forEach((t,i)=>{
      text+=`*${i+1}. ${t.client_name||"—"}*\n`;
      if(t.bina_order_id)text+=`📝 הזמנה #${t.bina_order_id}\n`;
      if(t.sales_agent)text+=`👤 סוכן: ${t.sales_agent}\n`;
      if(t.delivery_address_snapshot)text+=`📍 ${t.delivery_address_snapshot}\n`;
      if(t.delivery_contact_snapshot||t.delivery_phone_snapshot){
        const contactLine=`${t.delivery_contact_snapshot||""} ${t.delivery_phone_snapshot||""}`.trim();
        if(contactLine)text+=`📞 ${contactLine}\n`;
      }
      const dayItems=Array.isArray(t.items)?t.items:[];
      if(dayItems.length>0){
        text+=`\n📦 פריטים:\n`;
        dayItems.forEach(item=>{text+=`   • ${item.description||"—"} (×${item.quantity??0})\n`;});
      }
      if(t.delivery_special_notes)text+=`\n💬 ${t.delivery_special_notes}\n`;
      text+="\n━━━━━━━━━━━━━━\n\n";
    });
    return text;
  };
  const handleCopyDriver=async driverId=>{
    const driverTasks=tasksByDriver[driverId];
    const text=formatDriverText(driverId,driverTasks);
    try{
      await navigator.clipboard.writeText(text);
      window.alert(`✅ הועתק - ${driverTasks.length} משלוחים של ${getDriverName(driverId)}`);
    }catch(e){window.alert("שגיאה בהעתקה");}
  };
  const handleWhatsAppDriver=driverId=>{
    const text=formatDriverText(driverId,tasksByDriver[driverId]);
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  const driverIds=Object.keys(tasksByDriver);
  return<Modal open={true} onClose={onClose} title="🚛 פיצול משלוחים לפי נהג" maxWidth={600}>
    <div style={{direction:"rtl"}}>
      <div style={{background:"#f0f9ff",padding:12,borderRadius:8,marginBottom:15,fontSize:14}}>
        📅 {date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"})}
        <br/>
        <span style={{color:"#6b7280",fontSize:13}}>סה"כ {tasks.length} משלוחים מחולקים בין {driverIds.length} נהגים</span>
      </div>
      {driverIds.length===0?<div style={{textAlign:"center",padding:30,color:"#9ca3af"}}>אין משלוחים ביום זה</div>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {driverIds.map(driverId=>{
          const driverTasks=tasksByDriver[driverId];
          const driver=drivers.find(d=>d.id===driverId);
          const isUnassigned=driverId==="_unassigned";
          return<div key={driverId} style={{background:isUnassigned?"#fef2f2":"#fff",border:`2px solid ${isUnassigned?"#fca5a5":(driver?.color||"#d1d5db")}`,borderRadius:8,padding:12}}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:4}}>{getDriverName(driverId)}</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>{driverTasks.length} משלוחים</div>
            <div style={{fontSize:12,color:"#6b7280",marginBottom:10,maxHeight:80,overflowY:"auto"}}>
              {driverTasks.map((t,i)=><div key={t.id} style={{padding:"2px 0"}}>
                {i+1}. {t.client_name}
                {t.delivery_address_snapshot&&` - ${t.delivery_address_snapshot.substring(0,30)}${t.delivery_address_snapshot.length>30?"...":""}`}
              </div>)}
            </div>
            <div style={{display:"flex",gap:8}}>
              <button type="button" onClick={()=>handleCopyDriver(driverId)} style={{flex:1,padding:"8px 10px",background:"#f3f4f6",border:"1px solid #d1d5db",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>📋 העתק</button>
              <button type="button" onClick={()=>handleWhatsAppDriver(driverId)} style={{flex:1,padding:"8px 10px",background:"#25d366",color:"#fff",border:"none",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,fontFamily:"inherit"}}>📱 WhatsApp</button>
            </div>
          </div>;
        })}
      </div>}
    </div>
  </Modal>;
}
