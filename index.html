function ShipmentsDashboard({user,clients,onOpenDeliveryNote,refreshAll}){
  const [tasks,setTasks]=useState([]);
  const [drivers,setDrivers]=useState([]);
  const [weekStart,setWeekStart]=useState(()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);return d;});
  const [loading,setLoading]=useState(true);
  const [draggedTask,setDraggedTask]=useState(null);
  const [showDriverManager,setShowDriverManager]=useState(false);
  const [deliveryNoteModal,setDeliveryNoteModal]=useState(null);
  const [showSplitByDriverModal,setShowSplitByDriverModal]=useState(null);
  const navBtnStyle={padding:"8px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13};
  const loadData=async()=>{
    try{
      const drs=await sb("drivers?is_active=eq.true&order=name.asc");
      setDrivers(Array.isArray(drs)?drs:[]);
      const data=await sb("tasks?archived_at=is.null&delivery_status=in.(ready,in_transit,delivered)&order=scheduled_delivery_date.asc,delivery_order.asc");
      let enriched=Array.isArray(data)?data:[];
      if(enriched.length>0){
        const taskIds=enriched.map(t=>t.id);
        const idsParam=taskIds.join(",");
        const itemsRows=await sb(`task_items?task_id=in.(${idsParam})&order=id.asc`);
        const allItems=Array.isArray(itemsRows)?itemsRows:[];
        enriched=enriched.map(t=>({...t,items:allItems.filter(i=>String(i.task_id)===String(t.id))}));
      }
      setTasks(enriched);
    }catch(e){setTasks([]);setDrivers([]);}
    setLoading(false);
  };
  useEffect(()=>{
    setLoading(true);
    loadData();
    const interval=setInterval(loadData,60000);
    return()=>clearInterval(interval);
  },[weekStart]);
  const weekDays=useMemo(()=>{
    const days=[];
    for(let i=0;i<5;i++){const d=new Date(weekStart);d.setDate(d.getDate()+i);days.push(d);}
    return days;
  },[weekStart]);
  const getTasksForDay=(date)=>{
    const dateStr=toLocalDateStr(date);
    return tasks.filter(t=>t.scheduled_delivery_date===dateStr).sort((a,b)=>(a.delivery_order||999)-(b.delivery_order||999));
  };
  const unscheduledTasks=tasks.filter(t=>!t.scheduled_delivery_date);
  const weekendTasks=useMemo(()=>tasks.filter(t=>{
    if(!t.scheduled_delivery_date)return false;
    const day=shipmentDateWeekday(t.scheduled_delivery_date);
    return day===5||day===6;
  }),[tasks]);
  const weekStartStr=toLocalDateStr(weekStart);
  const pastTasks=tasks.filter(t=>t.scheduled_delivery_date&&t.scheduled_delivery_date<weekStartStr);
  const prevWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()-7);setWeekStart(d);};
  const nextWeek=()=>{const d=new Date(weekStart);d.setDate(d.getDate()+7);setWeekStart(d);};
  const goToday=()=>{const d=new Date();d.setDate(d.getDate()-d.getDay());d.setHours(0,0,0,0);setWeekStart(d);};
  const handleDragStart=task=>setDraggedTask(task);
  const handleDrop=async targetDate=>{
    if(!draggedTask)return;
    const targetDateStr=targetDate?toLocalDateStr(targetDate):null;
    const dayTasks=targetDate?getTasksForDay(targetDate):[];
    const newOrder=dayTasks.length+1;
    try{
      await sb(`tasks?id=eq.${draggedTask.id}`,{method:"PATCH",body:JSON.stringify({scheduled_delivery_date:targetDateStr,delivery_order:targetDateStr?newOrder:null})});
      setDraggedTask(null);
      await loadData();
      if(refreshAll)await refreshAll();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const formatShipmentDayText=(date,dayTasks)=>{
    const dateStr=date.toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"});
    let text=`📦 *משלוחי יום ${dateStr}*\n`;
    text+=`סה"כ: ${dayTasks.length} משלוחים\n\n`;
    text+="━━━━━━━━━━━━━━\n\n";
    dayTasks.forEach((t,i)=>{
      text+=`*${i+1}. ${t.client_name||"—"}*\n`;
      if(t.bina_order_id)text+=`📝 הזמנה #${t.bina_order_id}\n`;
      if(t.sales_agent)text+=`👤 סוכן: ${t.sales_agent}\n`;
      if(t.delivery_address_snapshot)text+=`📍 ${t.delivery_address_snapshot}\n`;
      if(t.delivery_contact_snapshot||t.delivery_phone_snapshot){
        const contactLine=`${t.delivery_contact_snapshot||""} ${t.delivery_phone_snapshot||""}`.trim();
        if(contactLine)text+=`📞 ${contactLine}\n`;
      }
      const dayItems=Array.isArray(t.items)?t.items:[];
      if(dayItems.length>0){
        text+=`\n📦 פריטים:\n`;
        dayItems.forEach(item=>{text+=`   • ${item.description||"—"} (×${item.quantity??0})\n`;});
      }
      if(t.delivery_special_notes)text+=`\n💬 ${t.delivery_special_notes}\n`;
      text+="\n━━━━━━━━━━━━━━\n\n";
    });
    return text;
  };
  const copyDayToClipboard=date=>{
    const dayTasks=getTasksForDay(date);
    if(dayTasks.length===0){window.alert("אין משלוחים ביום זה");return;}
    const text=formatShipmentDayText(date,dayTasks);
    navigator.clipboard.writeText(text).then(()=>window.alert(`✅ הועתק! ${dayTasks.length} משלוחים`)).catch(()=>window.alert("שגיאה בהעתקה"));
  };
  const sendDayWhatsApp=date=>{
    const dayTasks=getTasksForDay(date);
    if(dayTasks.length===0)return;
    const text=formatShipmentDayText(date,dayTasks);
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,"_blank");
  };
  const openNote=task=>{
    if(onOpenDeliveryNote)onOpenDeliveryNote(task);
    else setDeliveryNoteModal({task});
  };
  return<div style={{direction:"rtl",padding:4}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,flexWrap:"wrap",gap:10}}>
      <h1 style={{fontSize:22,fontWeight:800,margin:0}}>🚚 דשבורד משלוחים</h1>
      <button type="button" onClick={()=>setShowDriverManager(true)} style={{...navBtnStyle,background:"#ecfeff",borderColor:"#0e7490",color:"#0e7490",fontWeight:600}}>🚛 ניהול נהגים</button>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#fff",padding:12,borderRadius:10,marginBottom:15,border:"1px solid var(--border)"}}>
      <button type="button" onClick={prevWeek} style={navBtnStyle}>‹ שבוע קודם</button>
      <div style={{fontWeight:600,fontSize:15,textAlign:"center"}}>
        {weekStart.toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})} – {weekDays[4].toLocaleDateString("he-IL",{day:"numeric",month:"numeric"})}
        <button type="button" onClick={goToday} style={{marginRight:10,fontSize:12,background:"none",border:"none",color:"#7c3aed",cursor:"pointer",fontFamily:"inherit",fontWeight:600}}>היום</button>
      </div>
      <button type="button" onClick={nextWeek} style={navBtnStyle}>שבוע הבא ›</button>
    </div>
    {loading?<div style={{textAlign:"center",padding:40}}><Spinner sz={28}/></div>:<>
    {unscheduledTasks.length>0&&<div onDragOver={e=>e.preventDefault()} onDrop={()=>handleDrop(null)} style={{background:"#fef3c7",padding:15,borderRadius:10,marginBottom:15,border:"2px dashed #f59e0b"}}>
      <h3 style={{margin:"0 0 10px",color:"#78350f",fontSize:15}}>📦 ממתינים לתזמון ({unscheduledTasks.length})</h3>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {unscheduledTasks.map(task=><ShipmentCube key={task.id} task={task} drivers={drivers} onDragStart={()=>handleDragStart(task)} compact onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients}/>)}
      </div>
    </div>}
    {weekendTasks.length>0&&<div style={{background:"#fef2f2",padding:15,borderRadius:10,marginBottom:15,border:"2px solid #fca5a5"}}>
      <h3 style={{margin:"0 0 10px",color:"#991b1b",fontSize:15}}>⚠️ תאריכים חריגים - שישי/שבת ({weekendTasks.length})</h3>
      <div style={{fontSize:12,color:"#7f1d1d",marginBottom:10}}>המשלוחים הבאים תוזמנו לסוף השבוע. לחץ על כל אחד כדי לערוך.</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
        {weekendTasks.map(task=>{
          const p=String(task.scheduled_delivery_date).split("-").map(Number);
          const dateLabel=p.length>=3?new Date(p[0],p[1]-1,p[2]).toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"numeric"}):"";
          return<div key={task.id} style={{display:"flex",flexDirection:"column"}}>
            <ShipmentCube task={task} drivers={drivers} onDragStart={()=>handleDragStart(task)} onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients}/>
            <div style={{textAlign:"center",fontSize:10,color:"#991b1b",marginTop:2,fontWeight:600}}>{dateLabel}</div>
          </div>;
        })}
      </div>
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:10}}>
      {weekDays.map((date,i)=><DayColumn key={i} date={date} tasks={getTasksForDay(date)} drivers={drivers} onDragStart={handleDragStart} onDrop={()=>handleDrop(date)} onCopyDay={()=>copyDayToClipboard(date)} onSendWhatsApp={()=>sendDayWhatsApp(date)} onSplitDay={()=>setShowSplitByDriverModal({date,tasks:getTasksForDay(date)})} isToday={toLocalDateStr(date)===toLocalDateStr(new Date())} onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients}/>)}
    </div>
    {pastTasks.length>0&&<details style={{marginTop:20,background:"#fff",padding:15,borderRadius:10,border:"1px solid var(--border)"}}>
      <summary style={{cursor:"pointer",fontWeight:600}}>📚 משלוחים קודמים ({pastTasks.length})</summary>
      <div style={{marginTop:10,display:"flex",flexWrap:"wrap",gap:8}}>
        {pastTasks.slice(0,30).map(t=><ShipmentCube key={t.id} task={t} drivers={drivers} compact readonly onOpenDeliveryNote={openNote} onRefresh={loadData} user={user} clients={clients}/>)}
      </div>
    </details>}
    </>}
    {showDriverManager&&<DriverManagerModal drivers={drivers} onClose={()=>setShowDriverManager(false)} onUpdate={loadData}/>}
    {deliveryNoteModal&&<DeliveryNoteModal task={deliveryNoteModal.task} clients={clients} user={user} onClose={()=>setDeliveryNoteModal(null)}/>}
    {showSplitByDriverModal&&<SplitByDriverModal date={showSplitByDriverModal.date} tasks={showSplitByDriverModal.tasks} drivers={drivers} onClose={()=>setShowSplitByDriverModal(null)}/>}
  </div>;
}

function AddAddressModal({clientId,user,onClose,onAdd}){
  const [address,setAddress]=useState("");
  const [label,setLabel]=useState("");
  const [isDefault,setIsDefault]=useState(false);
  const [saving,setSaving]=useState(false);
  const addrIS={width:"100%",padding:10,borderRadius:10,border:"1px solid var(--border)",fontFamily:"inherit",fontSize:13};
  const handleAdd=async()=>{
    if(!address.trim()){window.alert("יש להזין כתובת");return;}
    setSaving(true);
    try{
      if(isDefault){
        await sb(`client_addresses?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      }
      await sb("client_addresses",{method:"POST",body:JSON.stringify({
        client_id:clientId,
        address:address.trim(),
        label:label.trim()||null,
        is_default:isDefault,
        created_by:user?.name||"unknown",
      })});
      onAdd?.();
      onClose();
    }catch(e){
      window.alert("שגיאה בשמירה: "+(e.message||String(e)));
    }
    setSaving(false);
  };
  return<Modal open={true} onClose={onClose} title="➕ הוספת כתובת משלוח" maxWidth={480}>
    <div style={{display:"flex",flexDirection:"column",gap:14,direction:"rtl"}}>
      <div><label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:5}}>כתובת מלאה *</label><textarea value={address} onChange={e=>setAddress(e.target.value)} placeholder="רחוב + מספר, עיר, מיקוד" rows={4} style={addrIS}/></div>
      <div><label style={{fontSize:11,fontWeight:700,color:"var(--text3)",display:"block",marginBottom:5}}>תווית (אופציונלי)</label><input value={label} onChange={e=>setLabel(e.target.value)} placeholder="למשל: אסם, משרד ראשי" style={addrIS}/></div>
      <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13}}>
        <input type="checkbox" checked={isDefault} onChange={e=>setIsDefault(e.target.checked)}/>
        סמן ככתובת ברירת מחדל
      </label>
      <div style={{display:"flex",gap:10}}>
        <button type="button" onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit"}}>ביטול</button>
        <button type="button" disabled={saving} onClick={handleAdd} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#0e7490",color:"#fff",fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>{saving?"⏳...":"➕ הוסף"}</button>
      </div>
    </div>
  </Modal>;
}

function ClientAddressesList({clientId}){
  const [addresses,setAddresses]=useState([]);
  const [loading,setLoading]=useState(true);
  const loadAddresses=async()=>{
    setLoading(true);
    try{
      const data=await sb(`client_addresses?client_id=eq.${clientId}&order=is_default.desc,last_used_at.desc`);
      setAddresses(Array.isArray(data)?data:[]);
    }catch(e){setAddresses([]);}
    setLoading(false);
  };
  useEffect(()=>{if(clientId)loadAddresses();},[clientId]);
  const setDefault=async(addressId)=>{
    try{
      await sb(`client_addresses?client_id=eq.${clientId}`,{method:"PATCH",body:JSON.stringify({is_default:false})});
      await sb(`client_addresses?id=eq.${addressId}`,{method:"PATCH",body:JSON.stringify({is_default:true})});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  const deleteAddress=async(addressId)=>{
    if(!window.confirm("למחוק את הכתובת?"))return;
    try{
      await sb(`client_addresses?id=eq.${addressId}`,{method:"DELETE"});
      loadAddresses();
    }catch(e){window.alert("שגיאה: "+(e.message||String(e)));}
  };
  if(loading)return<div style={{padding:12,color:"var(--text3)",fontSize:13}}><Spinner sz={16}/> טוען כתובות…</div>;
  if(addresses.length===0)return<div style={{padding:15,background:"#fef3c7",borderRadius:8,fontSize:13,color:"#78350f",marginTop:8}}>⚠️ אין כתובות משלוח שמורות. לחץ &quot;הוסף כתובת&quot; כדי להתחיל.</div>;
  return<div style={{marginTop:8}}>
    {addresses.map(addr=><div key={addr.id} style={{padding:10,background:"#fff",border:"1px solid var(--border)",borderRadius:8,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontWeight:addr.is_default?700:400,fontSize:13}}>
          {addr.is_default&&"⭐ "}
          {addr.label&&<strong>[{addr.label}] </strong>}
          {addr.address}
        </div>
        <div style={{fontSize:11,color:"var(--text3)",marginTop:2}}>
          שימוש {addr.usage_count||0} פעמים · אחרון: {addr.last_used_at?new Date(addr.last_used_at).toLocaleDateString("he-IL"):"—"}
        </div>
      </div>
      <div style={{display:"flex",gap:6,flexShrink:0}}>
        {!addr.is_default&&<button type="button" onClick={()=>setDefault(addr.id)} style={{fontSize:11,padding:"4px 8px",cursor:"pointer",fontFamily:"inherit",border:"1px solid var(--border)",borderRadius:6,background:"#fff"}}>ברירת מחדל</button>}
        <button type="button" onClick={()=>deleteAddress(addr.id)} style={{fontSize:11,padding:"4px 8px",cursor:"pointer",color:"#ef4444",border:"none",background:"transparent"}}>🗑️</button>
      </div>
    </div>)}
  </div>;
}

        {sel?`כניסה כ-${users.find(u=>u.id===sel)?.name}`:"בחר פרופיל להמשך"}
      </button>
    </div>
  </div>;
}

// ── AI CHAT ──
function AiChat({user,tasks,clients,onRefresh,onClose}){
  const [msgs,setMsgs]=useState([{role:"ai",text:`שלום ${user.name.split(" ")[0]}! 👋\nאני עוזר ה-AI של PrintOS.\n\nתוכל לבקש ממני:\n• להוסיף משימות\n• לעדכן סטטוסים\n• לשאול על נתונים\n\nמה תרצה?`}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef(null);
  useEffect(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const send=async()=>{
    if(!input.trim()||loading)return;
    const txt=input.trim();
    setInput("");
    setMsgs(p=>[...p,{role:"user",text:txt}]);
    setLoading(true);

    const system=`אתה עוזר AI לניהול בית דפוס PrintOS. עונה בעברית בלבד, קצר וברור.
משתמש: ${user.name} | ${user.role==="admin"?"מנהל":"עובד ב-"+(user?.dept||"—")}
מחלקות: ${DEPTS.join(", ")}
משימות קיימות (${tasks.length}): ${tasks.slice(0,10).map(t=>`[${t.id?.slice(0,6)}] ${t.title}|${t.dept}|${t.status}`).join(" | ")}
לקוחות: ${clients.slice(0,10).map(c=>c.name).join(", ")}

כשצריך לבצע פעולה, כלול JSON בתוך \`\`\`json ... \`\`\`:
{ "action": "add_task"|"update_status"|"none", "data": {...}, "message": "תשובה" }

add_task: data={title,dept,priority,client_name,assignee,due_date,notes}
update_status: data={task_id(6תווים),status}`;

    try{
      const res=await fetch("/api/claude",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-20250514",
          max_tokens:600,
          system,
          messages:[
            ...msgs.filter(m=>m.role!=="ai"||msgs.indexOf(m)>0).slice(-6).map(m=>({role:m.role==="user"?"user":"assistant",content:m.text})),
            {role:"user",content:txt}
          ]
        })
      });
      const data=await res.json();
      const raw=data.content?.[0]?.text||"מצטער, לא הצלחתי להבין.";
      const match=raw.match(/```json\s*([\s\S]*?)\s*```/);
      let action=null;
      if(match){try{action=JSON.parse(match[1]);}catch{}}
      const reply=action?.message||raw.replace(/```json[\s\S]*?```/g,"").trim();
      setMsgs(p=>[...p,{role:"ai",text:reply}]);

      if(action?.action==="add_task"&&action.data?.title){
        const d=action.data;
        await sb("tasks",{method:"POST",body:JSON.stringify({title:d.title,dept:d.dept||user?.dept||DEPTS[0],priority:d.priority||"בינונית",status:"ממתין",client_name:d.client_name||"",assignee:d.assignee||"",due_date:d.due_date||null,notes:d.notes||"",created_by:user.name})});
        onRefresh();
        setMsgs(p=>[...p,{role:"ai",text:`✅ המשימה "${d.title}" נוספה!`}]);
      }
      if(action?.action==="update_status"&&action.data){
        const task=tasks.find(t=>t.id?.startsWith(action.data.task_id));
        if(task){
          await sb(`tasks?id=eq.${task.id}`,{method:"PATCH",body:JSON.stringify({status:action.data.status})});
          onRefresh();
          setMsgs(p=>[...p,{role:"ai",text:`✅ סטטוס עודכן ל-"${action.data.status}"`}]);
        }
      }
    }catch(e){
      setMsgs(p=>[...p,{role:"ai",text:"מצטער, הייתה שגיאה. נסה שוב."}]);
    }
    setLoading(false);
  };

  const suggestions=["הוסף משימה למשלוחים","מה תקוע?","כמה משימות פתוחות?","עדכן סטטוס"];

  return<div style={{position:"fixed",bottom:0,left:0,width:"min(400px,100vw)",height:"min(560px,90vh)",background:"#fff",border:"1px solid var(--border)",borderRadius:"20px 20px 0 0",zIndex:500,display:"flex",flexDirection:"column",boxShadow:"0 -8px 40px rgba(0,0,0,0.12)"}}>
    {/* Header */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 18px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:32,height:32,borderRadius:"50%",background:"linear-gradient(135deg,#2563EB,#7C3AED)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>🤖</div>
        <div><div style={{fontWeight:700,fontSize:14,color:"var(--text)"}}>עוזר AI</div><div style={{fontSize:11,color:"var(--text3)"}}>מזין משימות ועונה על שאלות</div></div>
      </div>
      <button onClick={onClose} style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text2)",cursor:"pointer",width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14}}>✕</button>
    </div>

    {/* Messages */}
    <div style={{flex:1,overflowY:"auto",padding:"14px 16px",display:"flex",flexDirection:"column",gap:10}}>
      {msgs.map((m,i)=><div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-start":"flex-end"}}>
        <div style={{maxWidth:"82%",padding:"9px 13px",borderRadius:m.role==="user"?"13px 13px 4px 13px":"13px 13px 13px 4px",background:m.role==="user"?"var(--blue-light)":"var(--bg2)",border:`1px solid ${m.role==="user"?"var(--blue-mid)":"var(--border)"}`,color:"var(--text)",fontSize:13,lineHeight:1.5,whiteSpace:"pre-wrap"}}>
          {m.text}
        </div>
      </div>)}
      {loading&&<div style={{display:"flex",justifyContent:"flex-end"}}>
        <div style={{background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:"13px 13px 13px 4px",padding:"11px 14px",display:"flex",gap:5}}>
          {[0,1,2].map(i=><div key={i} style={{width:6,height:6,borderRadius:"50%",background:"var(--blue)",animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
        </div>
      </div>}
      <div ref={bottomRef}/>
    </div>

    {/* Suggestions */}
    <div style={{padding:"8px 14px",display:"flex",gap:6,flexWrap:"wrap",borderTop:"1px solid var(--border)",flexShrink:0}}>
      {suggestions.map(s=><button key={s} onClick={()=>setInput(s)} style={{padding:"4px 10px",borderRadius:20,border:"1px solid var(--border)",background:"#fff",color:"var(--text2)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}
    </div>

    {/* Input */}
    <div style={{padding:"10px 14px 14px",flexShrink:0,display:"flex",gap:8}}>
      <input value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()} placeholder="כתוב בעברית חופשית..." style={{flex:1,background:"var(--bg2)",border:"1px solid var(--border)",borderRadius:10,padding:"9px 13px",color:"var(--text)",fontSize:13,outline:"none",fontFamily:"inherit",direction:"rtl"}}/>
      <button onClick={send} disabled={loading||!input.trim()} style={{padding:"9px 16px",borderRadius:10,border:"none",background:input.trim()?"var(--blue)":"var(--bg3)",color:input.trim()?"#fff":"var(--text3)",fontWeight:700,fontSize:13,cursor:"pointer",fontFamily:"inherit",flexShrink:0,display:"flex",alignItems:"center"}}>
        {loading?<Spinner sz={16} color="#fff"/>:"שלח"}
      </button>
    </div>
  </div>;
}

// ── CALENDAR TAB ──
function CalendarTab({tasks,taskItems,user,isA,onTaskClick,clients,onTaskRefresh}){
  const [weekOffset,setWeekOffset]=useState(0);
  const [deptFilter,setDeptFilter]=useState(isA?"הכל":(user?.dept||DEPTS[0]));

  const getWeekDays=()=>{
    const today=new Date();
    const monday=new Date(today);
    monday.setDate(today.getDate()-today.getDay()+1+weekOffset*7);
    return Array.from({length:7},(_,i)=>{
      const d=new Date(monday);
      d.setDate(monday.getDate()+i);
      return d;
    });
  };

  const days=getWeekDays();
  const todayStr=new Date().toISOString().split('T')[0];

  const dayNames=["ראשון","שני","שלישי","רביעי","חמישי","שישי","שבת"];
  const monthNames=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

  const getTasksForDay=(dateStr)=>{
    let filtered=tasks.filter(t=>t.due_date===dateStr&&isTaskActive(t));
    if(deptFilter!=="הכל"){
      const ids=new Set((taskItems||[]).filter(i=>i.department===deptFilter&&i.status!=="ארכיון").map(i=>i.task_id));
      filtered=filtered.filter(t=>!t.has_items?t.dept===deptFilter:ids.has(t.id));
    }
    return filtered;
  };

  const weekStart=days[0];
  const weekEnd=days[6];
  const weekLabel=`${weekStart.getDate()} ${monthNames[weekStart.getMonth()]} — ${weekEnd.getDate()} ${monthNames[weekEnd.getMonth()]} ${weekEnd.getFullYear()}`;

  return<div>
    <div style={{marginBottom:20}}>
      <h1 style={{fontSize:22,fontWeight:800,color:"var(--text)",margin:0}}>לוח שנה 📅</h1>
      <p style={{color:"var(--text3)",margin:"5px 0 0",fontSize:13}}>{weekLabel}</p>
    </div>

    {/* Controls */}
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:12}}>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setWeekOffset(p=>p-1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>← שבוע קודם</button>
        <button onClick={()=>setWeekOffset(0)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:weekOffset===0?"var(--blue-light)":"#fff",color:weekOffset===0?"var(--blue)":"var(--text2)",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:600}}>היום</button>
        <button onClick={()=>setWeekOffset(p=>p+1)} style={{padding:"7px 14px",borderRadius:8,border:"1px solid var(--border)",background:"#fff",cursor:"pointer",fontFamily:"inherit",fontSize:13}}>שבוע הבא →</button>
      </div>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {["הכל",...DEPTS].map(d=><button key={d} onClick={()=>setDeptFilter(d)} style={{padding:"5px 10px",borderRadius:20,border:`1px solid ${deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--border)"}`,background:deptFilter===d?`${DEPT_COLORS[d]||"#2563EB"}15`:"#fff",color:deptFilter===d?DEPT_COLORS[d]||"var(--blue)":"var(--text2)",fontWeight:600,fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>{d}</button>)}
      </div>
    </div>

    {/* Week grid */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:8}}>
      {days.map((day,i)=>{
        const dateStr=day.toISOString().split('T')[0];
        const dayTasks=getTasksForDay(dateStr);
        const isToday=dateStr===todayStr;
        const isWeekend=day.getDay()===5||day.getDay()===6;

        return<div key={dateStr} style={{background:isToday?"var(--blue-light)":isWeekend?"var(--bg2)":"#fff",border:`1px solid ${isToday?"var(--blue-mid)":"var(--border)"}`,borderRadius:12,padding:10,minHeight:140}}>
          <div style={{marginBottom:8,textAlign:"center"}}>
            <div style={{fontSize:11,fontWeight:600,color:isToday?"var(--blue)":"var(--text3)"}}>{dayNames[day.getDay()]}</div>
            <div style={{width:28,height:28,borderRadius:"50%",background:isToday?"var(--blue)":"transparent",color:isToday?"#fff":"var(--text)",fontWeight:isToday?800:600,fontSize:14,display:"flex",alignItems:"center",justifyContent:"center",margin:"2px auto 0"}}>{day.getDate()}</div>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            {dayTasks.map(t=>{
              const sc=SC[t.status]||{c:"#475569",bg:"#F1F5F9"};
              return<div key={t.id} style={{display:"flex",alignItems:"center",gap:4}}>
                <div onClick={()=>onTaskClick(t)} style={{flex:1,minWidth:0,padding:"4px 7px",borderRadius:6,background:sc.bg,borderRight:`3px solid ${DEPT_COLORS[t.dept]||sc.c}`,cursor:"pointer",fontSize:10,fontWeight:600,color:sc.c,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={t.title}>
                  {t.title}
                </div>
                <button type="button" onClick={e=>openLabelPrintTask(e,t)} title="הדפס מדבקת אריזה" style={{...LABEL_PRINT_BTN_STYLE,padding:"2px 6px",flexShrink:0}}>🏷️</button>
                <button type="button" onClick={e=>openDeliveryNoteFromTask(e,t)} title="תעודת משלוח" style={{...DELIVERY_NOTE_BTN_STYLE,padding:"2px 4px",fontSize:8,whiteSpace:"normal",lineHeight:1.15,textAlign:"center",maxWidth:72}}>📋 תעודת משלוח</button>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskMoveToDeliveryBtn task={t}/></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskInquiryButton task={t} user={user} compact/></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><RefreshFromBinaButton task={t} compact onUpdate={onTaskRefresh} /></div>
                <div style={{flexShrink:0,transform:"scale(0.78)",transformOrigin:"center right"}}><TaskNotificationButtons task={t} user={user} clients={clients} onUpdate={onTaskRefresh} compact/></div>

              </div>;
            })}
            {dayTasks.length===0&&<div style={{fontSize:10,color:"var(--text3)",textAlign:"center",paddingTop:8}}>—</div>}
          </div>
        </div>;
      })}
    </div>
  </div>;
}

  </div>;
  const renderStep3=()=><div>

      <option value="נטלי">נטלי</option>
      <option value="ברק">ברק</option>
    </select>

    <input type="text" placeholder="שם איש הקשר" value={contactName} onChange={e=>setContactName(e.target.value)} style={{...inputStyle,marginBottom:14}}/>
    <label style={{...labelStyle,fontSize:15,color:"var(--text)"}}>כותרת ההזמנה</label>

function CreateQuoteModal({open,onClose,onSuccess,clients,sb}){
  const [step,setStep]=useState(1);
  const [submitting,setSubmitting]=useState(false);
  const [error,setError]=useState(null);
  const [clientSearch,setClientSearch]=useState("");
  const [selectedClient,setSelectedClient]=useState(null);
  const [items,setItems]=useState([{description:"",quantity:1,unitPrice:0,discount:0}]);
  const [title,setTitle]=useState("");
  const [agent,setAgent]=useState("");
  const [contactName,setContactName]=useState("");
  useEffect(()=>{
    if(open){
      setStep(1);
      setClientSearch("");
      setSelectedClient(null);
      setItems([{description:"",quantity:1,unitPrice:0,discount:0}]);
      setTitle("");
      setAgent("");
      setContactName("");
      setError(null);
      setSubmitting(false);
    }
  },[open]);
  if(!open)return null;
  const filteredClients=(clients||[]).filter(c=>{
    if(!clientSearch.trim())return true;
    const q=clientSearch.toLowerCase().trim();
    return (c.name||"").toLowerCase().includes(q)||(c.phone||"").includes(q)||String(c.bina_customer_id||"").includes(q);
  }).slice(0,50);
  const itemsTotal=items.reduce((sum,it)=>{
    const qty=Number(it.quantity)||0;
    const price=Number(it.unitPrice)||0;
    const disc=Number(it.discount)||0;
    return sum+qty*price*(1-disc/100);
  },0);
  const addItem=()=>setItems([...items,{description:"",quantity:1,unitPrice:0,discount:0}]);
  const removeItem=(idx)=>{if(items.length===1)return;setItems(items.filter((_,i)=>i!==idx));};
  const updateItem=(idx,field,value)=>{const ni=[...items];ni[idx]={...ni[idx],[field]:value};setItems(ni);};
  const handleSubmit=async()=>{
    setSubmitting(true);
    setError(null);
    try{
      const quoteTitle=title||`הצעה ל${selectedClient.name||"לקוח"}`;
      const binaCustNum=parseInt(String(selectedClient.bina_customer_id),10);
      if(!binaCustNum||Number.isNaN(binaCustNum))throw new Error("קוד לקוח בינה לא תקין");

      const quoteData={
        title:quoteTitle,
        bina_cust_id:binaCustNum,
        bina_cust_name:selectedClient.name||"ללא שם",
        bina_cust_city:(selectedClient.address||"").split(",")[0]?.trim()||selectedClient.address||"",
        bina_cust_address:selectedClient.address||"",
        bina_cust_phone:selectedClient.phone||"",
        contact_person:(contactName||"").trim(),
        sales_agent:agent||null,
        status:"טיוטה",
      };

      const quoteResponse=await sb("quotes",{method:"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(quoteData)});
      const quoteResult=Array.isArray(quoteResponse)?quoteResponse[0]:quoteResponse;
      if(!quoteResult?.id)throw new Error("שגיאה ביצירת הצעה ב-DB");
      const quoteId=quoteResult.id;

      const itemsToInsert=items.map((it,idx)=>({
        quote_id:quoteId,
        item_name:`LINE-${idx+1}`,
        description:it.description||`פריט ${idx+1}`,
        quantity:Number(it.quantity)||1,
        unit_price:Number(it.unitPrice)||0,
        discount_pct:Number(it.discount)||0,
        line_number:idx+1,
      }));

      await sb("quote_items",{method:"POST",body:JSON.stringify(itemsToInsert)});

      const {data:fnData,error:invE}=await supabaseClient.functions.invoke("bina-create-quote",{body:{quote_id:quoteId}});
      if(invE)throw new Error(invE.message);
      let result=fnData;
      if(typeof fnData==="string"){try{result=JSON.parse(fnData)}catch{result=null}}
      if(!result||result.success!==true)throw new Error(result?.error||result?.binaMessage||"שגיאה בשליחה לבינה");

      if(onSuccess)onSuccess(result);
      const quoteTitleUi=quoteTitle;

      if(showPDF&&typeof window.openDocumentPDF==="function"){
        window.openDocumentPDF({
          docType:"quote",

          client:{
            name:selectedClient.name,
            address:selectedClient.address,
            phone:selectedClient.phone,
            email:selectedClient.email||"",
            contactPerson:(contactName||"").trim()||selectedClient.name,
          },
          items:items.map(it=>({description:it.description,quantity:Number(it.quantity)||1,unitPrice:Number(it.unitPrice)||0,discount:Number(it.discount)||0})),
          agent:(agent||"").trim(),

          remark:"",

      setSubmitting(false);
    }

      </div>

    </div>)}

      <div style={{fontSize:16,fontWeight:600,marginTop:6,color:purple}}>{`💰 ₪${itemsTotal.toFixed(2)} (לפני מע"מ)`}</div>
    </div>
    {error&&<div style={{marginTop:12,padding:12,background:"var(--red-light)",color:"var(--red)",borderRadius:10,fontSize:14}}>❌ {error}</div>}

  return<div style={overlayStyle} onClick={onClose}>
    <div style={modalStyle} onClick={e=>e.stopPropagation()}>
      <div style={headerStyle}>
        <strong style={{fontSize:17}}>💼 הצעת מחיר חדשה ({step}/3)</strong>

      </div>
    </div>
  </div>;
}

function DepartmentDashboard({user,allTasks,taskItems,isA,deptFilter}){
  const targetDept=isA?(deptFilter==="all"?null:deptFilter):(user?.dept??null);
  const tasks=tasksForDepartment(allTasks||[],taskItems||[],targetDept);
  const today=new Date();
  today.setHours(0,0,0,0);
  const todayMs=today.getTime();
  const yesterdayMs=todayMs-86400000;
  const weekStartMs=todayMs-(today.getDay()*86400000);
  const openTasks=tasks.filter(t=>!t.archived_at&&t.status!=="הושלם"&&t.status!=="הושלמה");
  const urgentTasks=openTasks.filter(t=>{
    if(t.priority==="גבוהה"||t.priority==="דחוף")return true;
    if(t.due_date){
      const due=new Date(t.due_date).getTime();
      return due<=todayMs+86400000;
    }
    return false;
  });
  const completedToday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=todayMs;
  });
  const completedYesterday=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=yesterdayMs&&c<todayMs;
  });
  const completedThisWeek=tasks.filter(t=>{
    if(!t.completed_at)return false;
    const c=new Date(t.completed_at).getTime();
    return c>=weekStartMs;
  });
  const todayChange=completedYesterday.length===0?null:Math.round(((completedToday.length-completedYesterday.length)/completedYesterday.length)*100);
  const dailyTarget=Math.max(5,Math.ceil(openTasks.length*0.6));
  const progressPct=Math.min(100,Math.round((completedToday.length/dailyTarget)*100));
  const hour=new Date().getHours();
  let greeting="שלום";
  let greetingEmoji="👋";
  if(hour<12){greeting="בוקר טוב";greetingEmoji="☀️";}
  else if(hour<17){greeting="צהריים טובים";greetingEmoji="🌤️";}
  else if(hour<21){greeting="ערב טוב";greetingEmoji="🌆";}
  else{greeting="לילה טוב";greetingEmoji="🌙";}
  const deptColor=targetDept?(DEPT_COLORS[targetDept]||"#3DB5B1"):"#3DB5B1";
  const displayName=isA?(targetDept?`מחלקת ${targetDept}`:"כל המחלקות"):`מחלקת ${user?.dept||"—"}`;
  const cardStyle={background:"linear-gradient(135deg, #fff 0%, #fafbfc 100%)",border:"1px solid var(--border)",borderRadius:16,padding:20,marginBottom:16,boxShadow:"0 2px 12px rgba(0,0,0,0.04)",direction:"rtl"};
  const headerStyle={display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,paddingBottom:12,borderBottom:"1px solid var(--border)"};
  const greetingStyle={fontSize:18,fontWeight:700,color:"var(--text)"};
  const subtitleStyle={fontSize:13,color:deptColor,fontWeight:600,marginTop:2};
  const metricsGrid={display:"grid",gridTemplateColumns:"repeat(auto-fit, minmax(110px, 1fr))",gap:8,marginBottom:16};
  const metricBox=(color,bg)=>({padding:"14px 12px",borderRadius:12,background:bg,border:`1px solid ${color}30`,textAlign:"center"});
  const metricValue=(color)=>({fontSize:24,fontWeight:800,color:color,lineHeight:1.1});
  const metricLabel={fontSize:11,color:"var(--text3)",marginTop:4,fontWeight:600};
  const progressBarOuter={width:"100%",height:10,background:"#f1f5f9",borderRadius:999,overflow:"hidden",marginTop:6};
  const progressBarInner={width:`${progressPct}%`,height:"100%",background:`linear-gradient(90deg, ${deptColor}, ${deptColor}dd)`,transition:"width 0.5s ease",borderRadius:999};
  return<div style={cardStyle}>
    <div style={headerStyle}>
      <div>
        <div style={greetingStyle}>{greetingEmoji} {greeting}, {user.name}!</div>
        <div style={subtitleStyle}>📍 {displayName}</div>
      </div>
      <div style={{width:48,height:48,borderRadius:"50%",background:deptColor,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:18}}>{user.initials||user.name?.[0]}</div>
    </div>
    <div style={metricsGrid}>
      <div style={metricBox("#3b82f6","#eff6ff")}>
        <div style={metricValue("#3b82f6")}>{openTasks.length}</div>
        <div style={metricLabel}>פתוחות</div>
      </div>
      <div style={metricBox("#ef4444","#fef2f2")}>
        <div style={metricValue("#ef4444")}>{urgentTasks.length}</div>
        <div style={metricLabel}>דחופות 🚨</div>
      </div>
      <div style={metricBox("#22c55e","#f0fdf4")}>
        <div style={metricValue("#22c55e")}>{completedToday.length}</div>
        <div style={metricLabel}>הושלמו היום</div>
      </div>
      <div style={metricBox(todayChange===null?"#6b7280":(todayChange>=0?"#22c55e":"#f59e0b"),todayChange===null?"#f9fafb":(todayChange>=0?"#f0fdf4":"#fffbeb"))}>
        <div style={metricValue(todayChange===null?"#6b7280":(todayChange>=0?"#22c55e":"#f59e0b"))}>{todayChange===null?"—":`${todayChange>=0?"+":""}${todayChange}%`}</div>
        <div style={metricLabel}>מאתמול</div>
      </div>
    </div>
    <div style={{marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:4}}>
        <span style={{fontWeight:600,color:"var(--text)"}}>📊 התקדמות יומית</span>
        <span style={{color:deptColor,fontWeight:700}}>{completedToday.length} / {dailyTarget} ({progressPct}%)</span>
      </div>
      <div style={progressBarOuter}>
        <div style={progressBarInner}/>
      </div>
    </div>
    <div style={{marginTop:12,padding:12,background:`${deptColor}10`,borderRadius:10,fontSize:13,color:"var(--text)",display:"flex",alignItems:"center",gap:8}}>
      <span style={{fontSize:18}}>🏆</span>
      <span>השבוע סיימתם <strong style={{color:deptColor}}>{completedThisWeek.length}</strong> משימות</span>
      {completedThisWeek.length>=30&&<span style={{marginInlineStart:"auto",fontSize:12,fontWeight:700,color:deptColor}}>🔥 שיא מצוין!</span>}
    </div>
  </div>;
}

function categorizeOrder(task) {
  const text = ((task.title || '') + ' ' + (task.notes || '')).toLowerCase();
  for (const cat of PRODUCT_CATEGORIES) {
    for (const kw of cat.keywords) {
      if (text.includes(kw.toLowerCase())) return cat;
    }
  }
  return { name: 'אחר', emoji: '❓', keywords: [] };
}

function normalizeAgentName(name) {
  if (!name) return null;
  const trimmed = String(name).trim();
  if (/^כפיר/.test(trimmed)) return 'כפיר';
  return trimmed;
}

function MonthlyAgentSummary({ allTasks, onAgentClick }) {
  const today = new Date();
  const [selectedYear, setSelectedYear] = useState(today.getFullYear());
  const [selectedMonth, setSelectedMonth] = useState(today.getMonth());

  const monthlyStats = useMemo(() => {
    const stats = new Map();

    for (const task of (allTasks || [])) {
      if (!task.created_at) continue;
      if (!task.total_amount || Number(task.total_amount) <= 0) continue;
      const d = new Date(task.created_at);
      if (d.getFullYear() !== selectedYear || d.getMonth() !== selectedMonth) continue;
      const agent = normalizeAgentName(task.sales_agent || task.assignee);
      if (!agent) continue;

      if (!stats.has(agent)) {
        stats.set(agent, { agent, count: 0, total: 0, orders: [] });
      }
      const s = stats.get(agent);
      s.count += 1;
      s.total += Number(task.total_amount || 0);
      s.orders.push(task);
    }

    return Array.from(stats.values()).sort((a, b) => b.total - a.total);
  }, [allTasks, selectedYear, selectedMonth]);

  const availableMonths = useMemo(() => {
    const months = new Set();
    for (const task of (allTasks || [])) {
      if (!task.created_at) continue;
      if (!task.total_amount || Number(task.total_amount) <= 0) continue;
      const d = new Date(task.created_at);
      months.add(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`);
    }
    const arr = Array.from(months).sort().reverse();
    if (arr.length === 0) {
      arr.push(`${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}`);
    }
    return arr;
  }, [allTasks]);

  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0 })}`;

  const agentColors = {
    'כפיר': { bg: '#f0fdfa', color: '#3DB5B1', border: '#5eead4' },
    'נטלי': { bg: '#faf5ff', color: '#9333ea', border: '#c4b5fd' },
    'ברק': { bg: '#fffbeb', color: '#f59e0b', border: '#fcd34d' },
  };

  const monthLabel = new Date(selectedYear, selectedMonth, 1)
    .toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });

  const handleMonthChange = (e) => {
    const [y, m] = e.target.value.split('-');
    setSelectedYear(parseInt(y, 10));
    setSelectedMonth(parseInt(m, 10) - 1);
  };

  return (
    <div style={{
      background: '#fff', padding: 16, borderRadius: 12,
      border: '1px solid #e5e7eb', marginBottom: 16,
    }}>
      <div style={{
        display: 'flex', justifyContent: 'space-between', alignItems: 'center',
        marginBottom: 14, flexWrap: 'wrap', gap: 8,
      }}>
        <div style={{ fontSize: 15, fontWeight: 700, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 6 }}>
          📊 סיכום חודשי
        </div>
        <select
          value={`${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}`}
          onChange={handleMonthChange}
          style={{
            padding: '6px 10px', fontSize: 13, border: '1px solid #d1d5db',
            borderRadius: 6, fontFamily: 'inherit', cursor: 'pointer',
          }}
        >
          {availableMonths.map(m => {
            const [y, mo] = m.split('-');
            const d = new Date(parseInt(y, 10), parseInt(mo, 10) - 1, 1);
            return (
              <option key={m} value={m}>
                {d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' })}
              </option>
            );
          })}
        </select>
      </div>

      {monthlyStats.length === 0 ? (
        <div style={{ padding: 20, textAlign: 'center', color: '#9ca3af', fontSize: 13 }}>
          אין הזמנות בחודש זה
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {monthlyStats.map(stat => {
            const c = agentColors[stat.agent] || { bg: '#f8fafa', color: '#3b82f6', border: '#dbeafe' };
            return (
              <button
                type="button"
                key={stat.agent}
                onClick={() => onAgentClick && onAgentClick(stat.agent, stat.orders, monthLabel)}
                style={{
                  display: 'flex', justifyContent: 'space-between', alignItems: 'center',
                  padding: '12px 14px', background: c.bg, border: `1px solid ${c.border}`,
                  borderRadius: 8, cursor: 'pointer', textAlign: 'right',

function calculateRollingTargets(allTasks, targetConfig) {
  const today = new Date();
  const currentYear = today.getFullYear();
  const currentMonth = today.getMonth();
  const currentDay = today.getDate();
  const openingEnd = new Date(targetConfig.opening_date);
  openingEnd.setHours(23, 59, 59, 999);

  const yearTasksRaw = (allTasks || []).filter((t) => {
    if (!t.created_at || t.total_amount == null || Number(t.total_amount) <= 0) return false;
    const d = new Date(t.created_at);
    return d.getFullYear() === currentYear && new Date(t.created_at) > openingEnd;
  });

  const soldThisYear = yearTasksRaw.reduce(
    (sum, t) => sum + Number(t.total_amount) / 1.18,
    0,
  );

  const openingAmt = Number(targetConfig.opening_amount) || 0;
  const annualTarget = Number(targetConfig.annual_target) || 0;
  const totalYTD = openingAmt + soldThisYear;
  const remainingYearly = annualTarget - totalYTD;
  const monthsLeft = 12 - currentMonth;
  const monthlyTarget = monthsLeft > 0 ? remainingYearly / monthsLeft : 0;

  const monthTasks = yearTasksRaw.filter((t) => {
    const d = new Date(t.created_at);
    return d.getMonth() === currentMonth;
  });
  const soldThisMonth = monthTasks.reduce(
    (sum, t) => sum + Number(t.total_amount) / 1.18,
    0,
  );

  const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();
  let workDaysLeft = 0;
  for (let day = currentDay; day <= lastDay; day++) {
    const d = new Date(currentYear, currentMonth, day);
    const dow = d.getDay();
    if (dow >= 0 && dow <= 4) workDaysLeft++;
  }

  const remainingMonthly = monthlyTarget - soldThisMonth;
  const dailyTarget = workDaysLeft > 0 ? remainingMonthly / workDaysLeft : 0;

  const todayStart = new Date(currentYear, currentMonth, currentDay);
  const tomorrowStart = new Date(currentYear, currentMonth, currentDay + 1);
  const soldToday = (allTasks || [])
    .filter((t) => {
      if (!t.created_at || t.total_amount == null || Number(t.total_amount) <= 0) return false;
      const d = new Date(t.created_at);
      return d >= todayStart && d < tomorrowStart;
    })
    .reduce((sum, t) => sum + Number(t.total_amount) / 1.18, 0);

  return {
    daily: { target: dailyTarget, actual: soldToday, workDaysLeft },
    monthly: { target: monthlyTarget, actual: soldThisMonth },
    yearly: {
      target: annualTarget,
      actual: totalYTD,
      remaining: remainingYearly,
    },
  };
}

function SalesDashboard({allTasks,isA,DEPT_COLORS,onClose}) {
  const [period, setPeriod] = useState('month');
  const [showOtherDetails, setShowOtherDetails] = useState(false);
  const [agentOrdersModal, setAgentOrdersModal] = useState(null);

  if (!isA) return null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const todayMs = today.getTime();
  const tomorrowMs = todayMs + 86400000;
  const yesterdayMs = todayMs - 86400000;

  // ====================================================================
  // 🔥 תחרות היום
  // ====================================================================
  const getDailyAgentsData = (dayStartMs, dayEndMs) => {
    const agentMap = new Map();
    for (const t of (allTasks || [])) {
      if (!t.total_amount || t.total_amount <= 0) continue;
      const taskDate = t.bina_order_date 
        ? new Date(t.bina_order_date).getTime() 
        : new Date(t.created_at).getTime();
      if (taskDate < dayStartMs || taskDate >= dayEndMs) continue;
      
      const agent = normalizeAgentName(t.sales_agent || t.assignee);
      if (!agent) continue;
      
      const existing = agentMap.get(agent);
      if (existing) {
        existing.revenue += Number(t.total_amount || 0);
        existing.orders += 1;
        if (t.created_at > existing.lastOrderTime) {
          existing.lastOrderTime = t.created_at;
        }
      } else {
        agentMap.set(agent, {
          name: agent,
          revenue: Number(t.total_amount || 0),
          orders: 1,
          lastOrderTime: t.created_at,
        });
      }
    }
    return Array.from(agentMap.values()).sort((a, b) => b.revenue - a.revenue);
  };

  const getTodayCompetitionOrdersForAgent = (agentName) =>
    (allTasks || []).filter((t) => {
      if (!t.total_amount || t.total_amount <= 0) return false;
      const taskDate = t.bina_order_date
        ? new Date(t.bina_order_date).getTime()
        : new Date(t.created_at).getTime();
      if (taskDate < todayMs || taskDate >= tomorrowMs) return false;
      return normalizeAgentName(t.sales_agent || t.assignee) === agentName;
    });

  const todayAgents = getDailyAgentsData(todayMs, tomorrowMs);
  const yesterdayAgents = getDailyAgentsData(yesterdayMs, todayMs);
  
  const todayTotal = todayAgents.reduce((s, a) => s + a.revenue, 0);
  const todayOrdersTotal = todayAgents.reduce((s, a) => s + a.orders, 0);
  const yesterdayTotal = yesterdayAgents.reduce((s, a) => s + a.revenue, 0);
  
  const dayChangePct = yesterdayTotal > 0 
    ? Math.round(((todayTotal - yesterdayTotal) / yesterdayTotal) * 100)
    : null;

  const maxTodayRevenue = Math.max(...todayAgents.map(a => a.revenue), 1);

  // חישוב streak לסוכן מוביל - כמה ימים ברציפות הוא ראשון
  const calcLeaderStreak = () => {
    if (todayAgents.length === 0) return null;
    const leaderName = todayAgents[0].name;
    let streak = 1;
    for (let daysAgo = 1; daysAgo <= 30; daysAgo++) {
      const dayStart = todayMs - (daysAgo * 86400000);

      const dayData = getDailyAgentsData(dayStart, dayEnd);

      if (dayData[0].name === leaderName) {

  const streak = calcLeaderStreak();

  // זמן יחסי מאז הזמנה אחרונה
  const formatTimeAgo = (isoTime) => {
    const t = new Date(isoTime).getTime();

function QuotesDashboard({allQuotes,allTasks,isA,sb,onQuotesReload}) {
  const [period, setPeriod] = useState('month');
  const [refreshing, setRefreshing] = useState(false);

  if (!isA) return null;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // ---------- איחוד שמות סוכנים ----------
  const normalizeAgent = (name) => {
    if (!name) return null;
    const trimmed = String(name).trim();
    if (/^כפיר/.test(trimmed)) return 'כפיר';
    return trimmed;
  };

  // ---------- סינון: רק הצעות "חדשות" (לא קודמות) ----------
  const trackedQuotes = (allQuotes || []).filter(q => 
    q.auto_status && q.auto_status !== 'קודמת'
  );

  // ---------- סינון לפי תקופה ----------
  const ranges = {
    month: new Date(today.getFullYear(), today.getMonth(), 1),
    quarter: new Date(today.getFullYear(), today.getMonth() - 3, 1),
    year: new Date(today.getFullYear(), 0, 1),
  };
  const fromDate = ranges[period];

  const quotesInRange = trackedQuotes.filter(q => {
    const created = new Date(q.created_at);
    return created >= fromDate;
  });

  // ---------- חלוקה לפי סטטוסים ----------
  const byStatus = {
    waiting: quotesInRange.filter(q => q.auto_status === 'ממתינה'),
    stuck: quotesInRange.filter(q => q.auto_status === 'תקועה'),
    closed: quotesInRange.filter(q => q.auto_status === 'נסגרה'),
    expired: quotesInRange.filter(q => q.auto_status === 'פגת תוקף'),
  };

  // ---------- חישובים פיננסיים ----------
  const sumAmount = (arr) => arr.reduce((s, q) => s + Number(q.total_amount || 0), 0);

  const moneyClosed = sumAmount(byStatus.closed);
  const moneyActive = sumAmount(byStatus.waiting) + sumAmount(byStatus.stuck);
  const moneyLost = sumAmount(byStatus.expired);
  const moneyTotal = moneyClosed + moneyActive + moneyLost;

  // ---------- שיעור סגירה ----------
  const totalQuotes = quotesInRange.length;
  const closedQuotes = byStatus.closed.length;
  const closingRate = totalQuotes > 0 ? Math.round((closedQuotes / totalQuotes) * 100) : 0;

  // ---------- "דורש פעולה" - הצעות תקועות + ממתינות 3+ ימים ----------
  const needsAction = [...byStatus.stuck, ...byStatus.waiting.filter(q => {
    const days = (Date.now() - new Date(q.created_at).getTime()) / 86400000;
    return days >= 3;
  })].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

  // ---------- ביצועי סוכנים ----------
  const agentsData = (() => {
    const map = new Map();
    for (const q of quotesInRange) {
      const agent = normalizeAgent(q.sales_agent);
      if (!agent) continue;
      if (!map.has(agent)) {
        map.set(agent, {
          name: agent,
          total: 0,
          closed: 0,
          revenueClosed: 0,
          revenueLost: 0,
        });
      }
      const data = map.get(agent);
      data.total += 1;
      if (q.auto_status === 'נסגרה') {
        data.closed += 1;
        data.revenueClosed += Number(q.total_amount || 0);
      } else if (q.auto_status === 'פגת תוקף') {
        data.revenueLost += Number(q.total_amount || 0);
      }
    }
    return Array.from(map.values()).map(a => ({
      ...a,
      closingRate: a.total > 0 ? Math.round((a.closed / a.total) * 100) : 0,
    })).sort((a, b) => b.closingRate - a.closingRate);
  })();

  // ---------- ביצועי לקוחות ----------
  const clientsData = (() => {
    const map = new Map();
    for (const q of quotesInRange) {
      const key = q.bina_cust_id || q.bina_cust_name || 'unknown';
      const name = q.bina_cust_name || `לקוח ${key}`;
      if (!map.has(String(key))) {
        map.set(String(key), { id: key, name, total: 0, closed: 0, revenue: 0 });
      }
      const data = map.get(String(key));
      data.total += 1;
      if (q.auto_status === 'נסגרה') {
        data.closed += 1;
        data.revenue += Number(q.total_amount || 0);
      }
    }
    return Array.from(map.values())
      .filter(c => c.total >= 1)
      .map(c => ({ ...c, closingRate: Math.round((c.closed / c.total) * 100) }))
      .sort((a, b) => b.total - a.total)
      .slice(0, 10);
  })();

  // ---------- מגמה חודשית ----------
  const monthlyTrend = (() => {
    const months = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(today.getFullYear(), today.getMonth() - i, 1);
      const next = new Date(today.getFullYear(), today.getMonth() - i + 1, 1);
      const monthQuotes = trackedQuotes.filter(q => {
        const c = new Date(q.created_at);
        return c >= d && c < next;
      });
      const closedCount = monthQuotes.filter(q => q.auto_status === 'נסגרה').length;
      const totalCount = monthQuotes.length;
      months.push({
        label: d.toLocaleDateString('he-IL', { month: 'short', year: '2-digit' }),
        total: totalCount,
        closed: closedCount,
        rate: totalCount > 0 ? Math.round((closedCount / totalCount) * 100) : 0,
      });
    }
    return months;
  })();

  const maxMonthly = Math.max(...monthlyTrend.map(m => m.total), 1);

  // ---------- פעולות ----------
  const handleRefresh = async () => {
    setRefreshing(true);
    try {
      const { error } = await supabaseClient.functions.invoke("update-quotes-status", { body: {} });
      if (error) throw error;
      await new Promise((r) => setTimeout(r, 600));
      if (typeof onQuotesReload === "function") await onQuotesReload();
    } catch (e) {
      alert("שגיאה ברענון: " + (e?.message || String(e)));
    } finally {
      setRefreshing(false);
    }
  };

  // ---------- פורמטים ----------
  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
  const fmtPct = (n) => `${Math.round(n)}%`;
  const periodLabels = { month: 'החודש', quarter: '3 חודשים', year: 'השנה' };
  const formatDate = (d) => new Date(d).toLocaleDateString('he-IL');
  const daysAgo = (dateStr) => {
    const days = (Date.now() - new Date(dateStr).getTime()) / 86400000;
    return Math.floor(days);
  };

  // ---------- סטיילים ----------
  const wrapStyle = { direction: 'rtl', padding: 16, background: '#f8fafa', minHeight:"calc(100vh - 56px)" };
  const headerStyle = { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20, flexWrap: 'wrap', gap: 12 };
  const titleStyle = { fontSize: 24, fontWeight: 800, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 10 };
  const periodTabsStyle = { display: 'flex', gap: 6, background: '#fff', padding: 4, borderRadius: 10, border: '1px solid #e5e7eb' };
  const tabStyle = (active) => ({
    padding: '8px 16px', borderRadius: 8, fontSize: 13, fontWeight: 600, cursor: 'pointer',
    background: active ? '#9333ea' : 'transparent', color: active ? '#fff' : '#6b7280',
    border: 'none', fontFamily: 'inherit', transition: 'all 0.2s',
  });
  
  const actionCardStyle = {
    background: needsAction.length > 0 
      ? 'linear-gradient(135deg, #fef2f2 0%, #fff7ed 100%)'
      : '#f0fdf4',
    border: `1px solid ${needsAction.length > 0 ? '#fecaca' : '#bbf7d0'}`,
    padding: 20, borderRadius: 16, marginBottom: 20,
    boxShadow: '0 2px 12px rgba(0,0,0,0.04)',
  };
  
  const kpisRow = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 12, marginBottom: 20 };
  const kpiCard = (color, bg) => ({ background: bg, padding: 16, borderRadius: 12, border: `1px solid ${color}30` });
  const kpiValue = (color) => ({ fontSize: 28, fontWeight: 800, color, lineHeight: 1.1, marginBottom: 4 });
  const kpiLabel = { fontSize: 12, color: '#6b7280', fontWeight: 600 };
  
  const chartCard = { background: '#fff', padding: 20, borderRadius: 12, marginBottom: 16, border: '1px solid #e5e7eb', boxShadow: '0 1px 3px rgba(0,0,0,0.04)' };
  const chartTitle = { fontSize: 16, fontWeight: 700, color: '#1E3A52', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 };
  const chartGrid = { display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(360px, 1fr))', gap: 16 };

  return (
    <div style={wrapStyle}>
      <div style={headerStyle}>
        <div style={titleStyle}>
          📋 דשבורד הצעות מחיר
          <span style={{ fontSize: 14, color: '#9333ea', fontWeight: 600 }}>({periodLabels[period]})</span>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <button type="button" onClick={handleRefresh} disabled={refreshing} style={{
            padding: '8px 14px', borderRadius: 8, fontSize: 13, fontWeight: 600,
            background: '#fff', color: '#9333ea', border: '1px solid #e5e7eb',
            cursor: refreshing ? 'wait' : 'pointer', fontFamily: 'inherit',
            opacity: refreshing ? 0.6 : 1,
          }}>
            {refreshing ? '⏳ מרענן...' : '🔄 רענן סטטוסים'}
          </button>
          <div style={periodTabsStyle}>
            <button type="button" onClick={() => setPeriod('month')} style={tabStyle(period === 'month')}>החודש</button>
            <button type="button" onClick={() => setPeriod('quarter')} style={tabStyle(period === 'quarter')}>3 חודשים</button>
            <button type="button" onClick={() => setPeriod('year')} style={tabStyle(period === 'year')}>השנה</button>
          </div>
        </div>
      </div>

      {/* ============================================================ */}
      {/* 🔥 דורש פעולה */}
      {/* ============================================================ */}
      <div style={actionCardStyle}>
        <div style={{
          fontSize: 18, fontWeight: 800, color: '#1E3A52',
          marginBottom: needsAction.length > 0 ? 12 : 0,
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          {needsAction.length > 0 ? '🔥' : '✅'} דורש פעולה
          {needsAction.length > 0 && (
            <span style={{
              background: '#dc2626', color: '#fff',
              padding: '2px 10px', borderRadius: 12,
              fontSize: 13, fontWeight: 700,
            }}>
              {needsAction.length}
            </span>
          )}
        </div>
        
        {needsAction.length === 0 ? (
          <div style={{ fontSize: 13, color: '#16a34a' }}>
            🎉 כל ההצעות מטופלות. אין הצעות שדורשות תשומת לב כרגע.
          </div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
            {needsAction.slice(0, 8).map(q => {
              const days = daysAgo(q.created_at);
              const isStuck = q.auto_status === 'תקועה';
              return (
                <div key={q.id} style={{
                  background: '#fff', padding: 12, borderRadius: 8,
                  border: `1px solid ${isStuck ? '#fca5a5' : '#fcd34d'}`,

                  flexWrap: 'wrap', gap: 8,
                }}>
                  <div style={{ flex: 1, minWidth: 200 }}>
                    <div style={{ fontWeight: 700, color: '#1E3A52', fontSize: 14 }}>
                      {q.bina_doc_id ? `#${q.bina_doc_id} - ` : ''}{q.title || 'ללא כותרת'}
                    </div>
                    <div style={{ fontSize: 12, color: '#6b7280', marginTop: 2 }}>
                      👤 {q.bina_cust_name || 'לא ידוע'}
                      {q.sales_agent && ` · 🎯 ${normalizeAgent(q.sales_agent)}`}
                    </div>
                  </div>
                  <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                    {q.total_amount > 0 && (
                      <span style={{ fontWeight: 700, color: '#1E3A52', fontSize: 14 }}>
                        {fmtCurrency(q.total_amount)}
                      </span>

// ============================================================
// פונקציות עזר (זהות ל-V3)
// ============================================================
function endOfMonth(date) {
  return new Date(date.getFullYear(), date.getMonth() + 1, 0);
}

function calculateDueDate(invoiceDate, paymentTerms) {
  if (!invoiceDate || !paymentTerms) return null;
  const invDate = invoiceDate instanceof Date ? invoiceDate : new Date(invoiceDate);
  if (isNaN(invDate.getTime())) return null;
  
  const pt = String(paymentTerms).replace(/\s/g, '').replace('שוטף+', '').trim();
  const immediateTerms = ['אשראי', 'מיידי', 'תשלוםמידבהוצאתהחשבונית', 'העברהבהוצאתהחשבונית', "צ'קבהוצאתהחשבונית", 'תשלוםבהוצאתהחשבונית'];
  if (immediateTerms.includes(pt)) return new Date(invDate);
  
  const n = parseInt(pt, 10);
  if (isNaN(n)) return null;
  
  const endInvMonth = endOfMonth(invDate);
  const fullMonths = Math.floor(n / 30);
  const remainder = n % 30;
  
  if (remainder === 0) {
    const year = endInvMonth.getFullYear();
    let month = endInvMonth.getMonth() + fullMonths;
    let yearAdj = year;
    while (month > 11) { month -= 12; yearAdj += 1; }
    return endOfMonth(new Date(yearAdj, month, 1));
  } else {
    const rawDate = new Date(endInvMonth);
    rawDate.setDate(rawDate.getDate() + n);
    const rightDigit = n % 10;
    let day;
    if (rightDigit === 5) day = 15;
    else if (rightDigit === 0) day = remainder;
    else day = rightDigit;
    const result = new Date(rawDate.getFullYear(), rawDate.getMonth(), day);
    if (result.getMonth() !== rawDate.getMonth()) return endOfMonth(rawDate);
    return result;
  }
}

function thinBorder() {
  return {
    top: { style: 'thin', color: { rgb: 'E5E7EB' } },
    bottom: { style: 'thin', color: { rgb: 'E5E7EB' } },
    left: { style: 'thin', color: { rgb: 'E5E7EB' } },
    right: { style: 'thin', color: { rgb: 'E5E7EB' } },
  };
}

async function exportToExcel(data, filename, reportTitle) {
  try {
    if (typeof XLSX === 'undefined') {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
        script.onload = resolve;
        script.onerror = () => reject(new Error('טעינת ספריית Excel נכשלה'));
        document.head.appendChild(script);
      });
    }

    const formatDate = (d) => {
      if (!d) return '';
      const date = d instanceof Date ? d : new Date(d);
      if (isNaN(date.getTime())) return '';
      return date.toLocaleDateString('he-IL');
    };

    const wb = XLSX.utils.book_new();

    const summaryData = [
      [reportTitle || 'דוח גבייה'],
      [`הופק: ${new Date().toLocaleDateString('he-IL')} ${new Date().toLocaleTimeString('he-IL').slice(0, 5)}`],
      [],
      ['#', 'שם לקוח', 'תנאי תשלום', 'איש קשר', 'טלפון', 'מס\' חשבוניות', 'סה"כ חוב'],
    ];

    data.clients.forEach((c, idx) => {
      summaryData.push([
        idx + 1,
        c.name,
        c.payment_terms || '',
        c.contact_name || '',
        c.phone || '',
        c.invoices.length,
        Number(c.total),
      ]);
    });

    summaryData.push([]);
    summaryData.push(['', '', '', '', '', 'סה"כ:', Number(data.grandTotal || data.total || 0)]);

    const ws1 = XLSX.utils.aoa_to_sheet(summaryData);

    ws1['!cols'] = [
      { width: 6 },
      { width: 40 },
      { width: 18 },
      { width: 20 },
      { width: 16 },
      { width: 14 },
      { width: 16 },
    ];

    ws1['!views'] = [{ RTL: true }];

    ws1['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } },
    ];

    if (ws1['A1']) {
      ws1['A1'].s = {
        font: { bold: true, sz: 18, color: { rgb: 'FFFFFF' } },
        fill: { fgColor: { rgb: '1E3A52' } },
        alignment: { horizontal: 'center', vertical: 'center' },
      };
    }

    if (ws1['A2']) {
      ws1['A2'].s = {
        font: { sz: 11, color: { rgb: '6B7280' }, italic: true },
        alignment: { horizontal: 'center' },
      };
    }

    ['A4', 'B4', 'C4', 'D4', 'E4', 'F4', 'G4'].forEach((cell) => {
      if (ws1[cell]) {
        ws1[cell].s = {
          font: { bold: true, sz: 12, color: { rgb: 'FFFFFF' } },
          fill: { fgColor: { rgb: '3DB5B1' } },
          alignment: { horizontal: 'center', vertical: 'center' },
          border: {
            top: { style: 'thin', color: { rgb: '1E3A52' } },
            bottom: { style: 'thin', color: { rgb: '1E3A52' } },
            left: { style: 'thin', color: { rgb: '1E3A52' } },
            right: { style: 'thin', color: { rgb: '1E3A52' } },
          },
        };
      }
    });

    data.clients.forEach((c, idx) => {
      const row = idx + 5;
      const isAlt = idx % 2 === 0;
      const bgColor = isAlt ? 'F8FAFA' : 'FFFFFF';
      const hasOverdue = c.invoices.some((inv) => inv.daysOverdue > 0 || inv.days_overdue > 0);

      if (ws1[`A${row}`]) ws1[`A${row}`].s = {
        font: { sz: 11, color: { rgb: '6B7280' } },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'center' },
        border: thinBorder(),
      };

      if (ws1[`B${row}`]) ws1[`B${row}`].s = {
        font: { sz: 12, bold: true, color: { rgb: '1E3A52' } },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'right', vertical: 'center', wrapText: true },
        border: thinBorder(),
      };

      if (ws1[`C${row}`]) ws1[`C${row}`].s = {
        font: { sz: 11, color: { rgb: '6B7280' } },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'center' },
        border: thinBorder(),
      };

      if (ws1[`D${row}`]) ws1[`D${row}`].s = {
        font: { sz: 11 },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'right' },
        border: thinBorder(),
      };

      if (ws1[`E${row}`]) ws1[`E${row}`].s = {
        font: { sz: 11 },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'center' },
        border: thinBorder(),
      };

      if (ws1[`F${row}`]) ws1[`F${row}`].s = {
        font: { sz: 11, bold: true },
        fill: { fgColor: { rgb: bgColor } },
        alignment: { horizontal: 'center' },
        border: thinBorder(),
      };

      if (ws1[`G${row}`]) {
        ws1[`G${row}`].s = {
          font: { sz: 13, bold: true, color: { rgb: hasOverdue ? 'DC2626' : '1E3A52' } },
          fill: { fgColor: { rgb: bgColor } },
          alignment: { horizontal: 'left' },
          numFmt: '₪#,##0',
          border: thinBorder(),
        };
      }
    });

    const totalRow = data.clients.length + 6;
    ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach((col) => {
      const cell = `${col}${totalRow}`;
      if (ws1[cell]) {
        ws1[cell].s = {
          font: { sz: 14, bold: true, color: { rgb: 'FFFFFF' } },
          fill: { fgColor: { rgb: '1E3A52' } },
          alignment: { horizontal: col === 'G' ? 'left' : 'right' },
          numFmt: col === 'G' ? '₪#,##0' : undefined,
        };
      }
    });

    XLSX.utils.book_append_sheet(wb, ws1, 'סיכום לקוחות');

    const detailData = [
      [reportTitle || 'דוח גבייה'],
      ['פירוט חשבוניות לפי לקוח'],
      [],
      ['לקוח', 'תנאי תשלום', 'מס\' חשבונית', 'תאריך הוצאה', 'תאריך פירעון', 'ימי איחור', 'סכום'],
    ];

    data.clients.forEach((c) => {
      c.invoices.forEach((inv, invIdx) => {
        detailData.push([
          invIdx === 0 ? c.name : '',

          formatDate(inv.calculated_due_date || inv.doc_payment_date),
          (inv.daysOverdue || inv.days_overdue || 0),
          Number(inv.doc_balance),
        ]);

      detailData.push(['', '', '', '', '', `סה"כ ${c.name}:`, Number(c.total)]);
      detailData.push([]);
    });

    detailData.push(['', '', '', '', '', 'סה"כ דוח:', Number(data.grandTotal || data.total || 0)]);

    const ws2 = XLSX.utils.aoa_to_sheet(detailData);
    ws2['!cols'] = [
      { width: 32 },
      { width: 18 },
      { width: 14 },
      { width: 14 },
      { width: 14 },
      { width: 12 },
      { width: 16 },
    ];
    ws2['!views'] = [{ RTL: true }];
    ws2['!merges'] = [
      { s: { r: 0, c: 0 }, e: { r: 0, c: 6 } },
      { s: { r: 1, c: 0 }, e: { r: 1, c: 6 } },
    ];

    if (ws2['A1']) {
      ws2['A1'].s = {
        font: { bold: true, sz: 16, color: { rgb: 'FFFFFF' } },
        fill: { fgColor: { rgb: '1E3A52' } },
        alignment: { horizontal: 'center', vertical: 'center' },
      };
    }
    if (ws2['A2']) {
      ws2['A2'].s = {
        font: { sz: 11, italic: true, color: { rgb: '6B7280' } },
        alignment: { horizontal: 'center' },
      };
    }

    ['A4', 'B4', 'C4', 'D4', 'E4', 'F4', 'G4'].forEach((cell) => {
      if (ws2[cell]) {
        ws2[cell].s = {
          font: { bold: true, sz: 11, color: { rgb: 'FFFFFF' } },
          fill: { fgColor: { rgb: '3DB5B1' } },
          alignment: { horizontal: 'center' },
          border: thinBorder(),
        };
      }
    });

    XLSX.utils.book_append_sheet(wb, ws2, 'פירוט חשבוניות');

    XLSX.writeFile(wb, filename, {
      bookType: 'xlsx',
      cellStyles: true,
    });
  } catch (e) {
    alert('ייצוא Excel: ' + (e && e.message ? e.message : String(e)));
  }
}

    allInvoices.sort((a, b) => {
      const da = a.due_date ? a.due_date.getTime() : 0;
      const db = b.due_date ? b.due_date.getTime() : 0;

    });

    for (const inv of allInvoices) {

      { s: { r: 1, c: 0 }, e: { r: 1, c: 2 } },
    ];

    if (ws['A1']) ws['A1'].s = {
      font: { bold: true, sz: 18, color: { rgb: 'FFFFFF' } },
      fill: { fgColor: { rgb: '1E3A52' } },

    if (ws['A2']) ws['A2'].s = {
      font: { sz: 11, italic: true, color: { rgb: '6B7280' } },
      alignment: { horizontal: 'center' },
    };

    ['A4', 'B4', 'C4'].forEach((cell) => {
      if (ws[cell]) ws[cell].s = {
        font: { bold: true, sz: 13, color: { rgb: 'FFFFFF' } },
        fill: { fgColor: { rgb: '3DB5B1' } },
        alignment: { horizontal: 'center', vertical: 'center' },

function MoranMonthlyReport({ clientsWithInvoices }) {
  const [selectedMonth, setSelectedMonth] = useState('');

  const availableMonths = useMemo(() => {
    const monthsSet = new Set();
    for (const client of clientsWithInvoices) {
      for (const inv of client.invoices) {
        if (inv.calculated_due_date) {
          const m = inv.calculated_due_date;
          const key = `${m.getFullYear()}-${String(m.getMonth() + 1).padStart(2, '0')}`;
          monthsSet.add(key);
        }
      }
    }
    return Array.from(monthsSet).sort();
  }, [clientsWithInvoices]);

  const monthReport = useMemo(() => {
    if (!selectedMonth) return null;

    const [yearStr, monthStr] = selectedMonth.split('-');
    const year = parseInt(yearStr, 10);
    const month = parseInt(monthStr, 10) - 1;

    const clientsMap = new Map();
    let totalAmount = 0;
    let totalInvoices = 0;

    for (const client of clientsWithInvoices) {
      const relevantInvoices = client.invoices.filter((inv) => {
        if (!inv.calculated_due_date) return false;
        return inv.calculated_due_date.getFullYear() === year &&
          inv.calculated_due_date.getMonth() === month;
      });

      if (relevantInvoices.length === 0) continue;

      const clientTotal = relevantInvoices.reduce((s, i) => s + Number(i.doc_balance), 0);
      clientsMap.set(client.bina_customer_id, {
        ...client,
        invoices: relevantInvoices,
        total: clientTotal,
      });
      totalAmount += clientTotal;
      totalInvoices += relevantInvoices.length;
    }

    return {
      clients: Array.from(clientsMap.values()).sort((a, b) => b.total - a.total),
      total: totalAmount,
      invoicesCount: totalInvoices,
    };
  }, [clientsWithInvoices, selectedMonth]);

  const monthLabel = useMemo(() => {
    if (!selectedMonth) return '';
    const [year, month] = selectedMonth.split('-');
    const d = new Date(parseInt(year, 10), parseInt(month, 10) - 1, 1);
    return d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' });
  }, [selectedMonth]);

  const fmtCurrency = (n) => `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0 })}`;

  return (
    <div style={{
      background: 'linear-gradient(135deg, #eff6ff, #fff)',
      padding: 16, borderRadius: 12, marginBottom: 20,
      border: '2px solid #3b82f680',
    }}>
      <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap', marginBottom: 12 }}>
        <div style={{ fontSize: 14, fontWeight: 700, color: '#1E3A52', display: 'flex', alignItems: 'center', gap: 6 }}>
          📊 דוח תחזית גבייה למורן - בחר חודש:
        </div>
        <select
          value={selectedMonth}
          onChange={(e) => setSelectedMonth(e.target.value)}
          style={{
            padding: '8px 12px', fontSize: 14, border: '1px solid #3b82f6',
            borderRadius: 6, fontFamily: 'inherit', cursor: 'pointer', minWidth: 180,
          }}
        >
          <option value="">-- בחר חודש --</option>
          {availableMonths.map((m) => {
            const [y, mo] = m.split('-');
            const d = new Date(parseInt(y, 10), parseInt(mo, 10) - 1, 1);
            return (
              <option key={m} value={m}>
                {d.toLocaleDateString('he-IL', { month: 'long', year: 'numeric' })}
              </option>
            );
          })}
        </select>

        {monthReport && (
          <>
            <span style={{ color: '#6b7280', fontSize: 13 }}>
              ({monthReport.clients.length} לקוחות · {monthReport.invoicesCount} חשבוניות · {fmtCurrency(monthReport.total)})
            </span>
            <button
              type="button"
              onClick={() => { void exportMoranReportToExcel(monthReport, monthLabel); }}
              style={{
                padding: '6px 14px', background: '#10b981', color: '#fff',
                border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
                cursor: 'pointer', fontFamily: 'inherit',
              }}
            >
              📊 Excel למורן
            </button>
            <button
              type="button"
              onClick={() => openMoranPrintWindow(monthReport, monthLabel)}
              style={{
                padding: '6px 14px', background: '#3b82f6', color: '#fff',
                border: 'none', borderRadius: 6, fontWeight: 700, fontSize: 13,
                cursor: 'pointer', fontFamily: 'inherit',
              }}
            >
              🖨️ PDF למורן
            </button>
          </>
        )}
      </div>

      {monthReport && monthReport.clients.length === 0 && (
        <div style={{ fontSize: 13, color: '#6b7280', padding: 10 }}>
          אין חשבוניות לתשלום בחודש זה
        </div>
      )}
    </div>
  );
}

function isPromiseFulfilled(promise, allActions) {
  if (!promise.created_at) return false;
  const promiseTime = new Date(promise.created_at).getTime();
  return (allActions || []).some((a) =>
    a.action_type && a.action_type.startsWith('paid_') &&
    new Date(a.created_at).getTime() > promiseTime
  );
}
