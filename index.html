          <td class="center" style="font-size:11px;">${c.payment_terms || '—'}</td>
          <td>
            <div class="invoices-list">
              <strong>${c.invoices.length} חשבוניות:</strong><br/>
              ${c.invoices.map((inv) => {
                const days = inv.daysOverdue || inv.days_overdue || 0;
                return `<span class="invoice-item ${days > 0 ? 'overdue' : ''}">#${inv.doc_num} (${fmtCurrency(inv.doc_balance)})${days > 0 ? `<span class="invoice-overdue-tag">⏰${days}י׳</span>` : ''}</span>`;

        <td colspan="4" style="text-align:right;">סה״כ ${clients.length} לקוחות:</td>
        <td class="amount">${fmtCurrency(total)}</td>
      </tr>
    </tbody>
  </table>

  <div class="footer">
    <strong>נטלי פתרונות הדפסה בע״מ</strong> | ח.פ. 517205332 | שד׳ הר ציון 104, תל אביב | 03-6815703
  </div>

  <script>
    window.addEventListener('load', function() {
      setTimeout(function() {
        window.print();
      }, 500);
    });
  <\/script>
</body>
</html>`;

  printWindow.document.open();
  printWindow.document.write(html);
  printWindow.document.close();
}


// ========================================
// Modal לניהול מיילים + שליחה
// ========================================
function EmailModal({ client, mode, emailType, pendingType, onClose, onSendEmail, onSaveAndSend, sb }) {
  const [primary, setPrimary] = useState(client.collection_email_primary || '');

    border: '1px solid #e5e7eb', borderRadius: 8, fontFamily: 'inherit',

    <div style={overlayStyle} onClick={onClose}>

        <div style={{ padding: '16px 20px', borderBottom: '1px solid #e5e7eb', background: '#faf5ff' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <div style={{ fontSize: 17, fontWeight: 700, color: '#1E3A52' }}>
                {isAddMode ? '➕ הוסף מייל לגבייה' : isEditMode ? '✏️ ערוך מיילים' : '📧 אישור שליחה'}
              </div>
              <div style={{ fontSize: 13, color: '#6b7280', marginTop: 3 }}>{client.name}</div>
            </div>
            <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: 24, cursor: 'pointer', color: '#9ca3af' }}>✕</button>
          </div>
        </div>

        <div style={{ padding: 20 }}>
          {(isAddMode || isEditMode) && (
            <>
              <div style={{
                background: isAddMode ? '#fffbeb' : '#f0fdfa', padding: 12, borderRadius: 8, marginBottom: 16, fontSize: 13,
                color: isAddMode ? '#78350f' : '#1E3A52',

                  : '✏️ עדכן את כתובות המייל. שינויים יישמרו אוטומטית.'}
              </div>
              <label style={labelStyle}>📧 מייל ראשי לגבייה *</label>
              <input type="email" value={primary} onChange={e => setPrimary(e.target.value)}
                placeholder="primary@company.com" style={inputStyle} />
              
              <label style={labelStyle}>📧 מייל נוסף (אופציונלי)</label>
              <input type="email" value={secondary} onChange={e => setSecondary(e.target.value)}
                placeholder="secondary@company.com" style={inputStyle} />
              
              <div style={{ fontSize: 11, color: '#6b7280', marginTop: 4 }}>
                💾 כתובות אלה יישמרו ויהיו זמינות גם בעתיד
              </div>
            </>
          )}

          {isConfirmMode && (
            <>
              <p style={{ fontSize: 14, color: '#1E3A52', lineHeight: 1.7 }}>
                האם לשלוח <strong>{emailType === 'inquiry' ? 'בקשת בירור' : 'תזכורת תשלום'}</strong> עם <strong>{client.invoices.length} חשבוניות</strong>?
              </p>

            </>

        <div style={{ padding: 16, borderTop: '1px solid #e5e7eb', display: 'flex', gap: 8, justifyContent: 'flex-end' }}>

            padding: '10px 20px', borderRadius: 8, fontSize: 14, fontWeight: 600,
            background: '#fff', color: '#6b7280', border: '1px solid #e5e7eb',
            cursor: 'pointer', fontFamily: 'inherit',

            setSaving(true);
            if (isAddMode || isEditMode) {
              if (!primary) { alert('חובה למלא לפחות מייל ראשי'); setSaving(false); return; }

              await onSendEmail(client, emailType);
              onClose();

            setSaving(false);
          }} disabled={saving} style={{
            padding: '10px 24px', borderRadius: 8, fontSize: 14, fontWeight: 700,
            background: isConfirmMode && emailType === 'inquiry' ? '#dc2626' : '#3DB5B1', color: '#fff', border: 'none',

          </button>
        </div>
      </div>
    </div>
  );
}

function DebtActionModal({ customer, actionType, specificInvoice, onClose, onSuccess, sb, collectorName }) {
  const info = DEBT_ACTION_TYPES[actionType];
  const [notes, setNotes] = useState('');
  const [amount, setAmount] = useState(specificInvoice?.doc_balance ? String(specificInvoice.doc_balance) : '');
  const [promisedDate, setPromisedDate] = useState('');
  const [remindAt, setRemindAt] = useState('');
  const [promisedAmount, setPromisedAmount] = useState('');
  const [checkNumber, setCheckNumber] = useState('');
  const [checkDate, setCheckDate] = useState('');
  const [saving, setSaving] = useState(false);

  const isPayment = actionType.startsWith('paid_');
  const isPromise = actionType === 'promised_to_pay';
  const isCheck = actionType === 'paid_check';

  const handleSave = async () => {
    setSaving(true);
    try {
      // 🆕 אם זו חשבונית ספציפית - נציין אותה ב-notes
      let finalNotes = notes;
      if (specificInvoice) {
        const invoicePrefix = `[חשבונית #${specificInvoice.doc_num}] `;
        finalNotes = invoicePrefix + (notes || `שולם: ₪${specificInvoice.doc_balance}`);
      }
      
      const payload = {
        bina_customer_id: customer.bina_customer_id,
        client_id: customer.client_id || null,
        client_name: customer.client_name || customer.name,
        action_type: actionType,
        notes: finalNotes || null,
        amount: isPayment && amount ? Number(amount) : null,
        promised_date: isPromise && promisedDate ? promisedDate : null,
        remind_at: isPromise && remindAt ? remindAt : null,
        promised_amount: isPromise && promisedAmount ? Number(promisedAmount) : null,
        check_number: isCheck && checkNumber ? checkNumber : null,
        check_date: isCheck && checkDate ? checkDate : null,
        created_by: collectorName || 'admin',
      };

      const result = await sb('debt_actions', {
        method: 'POST',
        headers: { 'Prefer': 'return=representation' },
        body: JSON.stringify(payload),
      });

      const newAction = Array.isArray(result) ? result[0] : result;
      if (onSuccess) onSuccess(newAction);
    } catch (e) {
      alert('שגיאה בשמירה: ' + e.message);
    } finally {
      setSaving(false);
    }
  };

  const overlayStyle = {
    position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)',
    zIndex: 9999, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 16,
  };
  const modalStyle = {
    background: '#fff', borderRadius: 16, maxWidth: 500, width: '100%',
    maxHeight: '90vh', overflowY: 'auto', direction: 'rtl',
  };
  const inputStyle = {
    width: '100%', padding: '10px 12px', fontSize: 14,
    border: '1px solid #e5e7eb', borderRadius: 8, fontFamily: 'inherit',
    boxSizing: 'border-box', marginBottom: 12, direction: 'rtl',
  };
  const labelStyle = { display: 'block', fontSize: 13, fontWeight: 600, color: '#374151', marginBottom: 4 };

  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={modalStyle} onClick={e => e.stopPropagation()}>
        <div style={{ padding: '16px 20px', borderBottom: '1px solid #e5e7eb', background: `${info.color}10` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <div>
              <div style={{ fontSize: 18, fontWeight: 700, color: info.color }}>
                {info.emoji} {info.label}
              </div>
              <div style={{ fontSize: 13, color: '#6b7280', marginTop: 4 }}>
                {customer.client_name || customer.name}
                {specificInvoice && (
                  <span style={{ marginInlineStart: 8, background: '#fef3c7', color: '#92400e', padding: '2px 8px', borderRadius: 8, fontSize: 11, fontWeight: 700 }}>
                    📋 חשבונית #{specificInvoice.doc_num}
                  </span>
                )}
              </div>
            </div>
            <button onClick={onClose} style={{
              background: 'none', border: 'none', fontSize: 24, cursor: 'pointer', color: '#9ca3af',
            }}>✕</button>
          </div>
        </div>

        <div style={{ padding: 20 }}>
          {specificInvoice && (
            <div style={{ background: '#fffbeb', padding: 12, borderRadius: 8, marginBottom: 16, fontSize: 13, color: '#92400e', border: '1px solid #fcd34d' }}>
              ℹ️ פעולה זו תתועד עבור <strong>חשבונית #{specificInvoice.doc_num} בלבד</strong> ({fmtCurrencySimple(specificInvoice.doc_balance)})
            </div>
          )}

          {isPayment && (
            <>
              <label style={labelStyle}>סכום ששולם (₪)</label>
              <input type="number" value={amount} onChange={e => setAmount(e.target.value)} 
                placeholder={specificInvoice ? String(specificInvoice.doc_balance) : String(customer.total || customer.total_debt || 0)} style={inputStyle} />
            </>
          )}

          {isCheck && (
            <>
              <label style={labelStyle}>מספר צ'ק</label>
              <input type="text" value={checkNumber} onChange={e => setCheckNumber(e.target.value)} 
                placeholder="לדוגמה: 12345" style={inputStyle} />
              <label style={labelStyle}>תאריך צ'ק</label>
              <input type="date" value={checkDate} onChange={e => setCheckDate(e.target.value)} style={inputStyle} />
            </>
          )}

          {isPromise && (
            <>
              <label style={labelStyle}>📅 הבטיח לשלם בתאריך</label>
              <input type="date" value={promisedDate} onChange={e => setPromisedDate(e.target.value)} style={inputStyle} />
              <label style={labelStyle}>⏰ תזכיר לי לבדוק ב</label>
              <input type="date" value={remindAt} onChange={e => setRemindAt(e.target.value)} style={inputStyle} />
              <label style={labelStyle}>💰 סכום שהבטיח (אופציונלי)</label>
              <input type="number" value={promisedAmount} onChange={e => setPromisedAmount(e.target.value)} 
                placeholder={specificInvoice ? String(specificInvoice.doc_balance) : String(customer.total || customer.total_debt || 0)} style={inputStyle} />
            </>
          )}

          <label style={labelStyle}>📝 הערות</label>
          <textarea value={notes} onChange={e => setNotes(e.target.value)} 
            placeholder="לדוגמה: דיברתי עם מנהל הכספים..."
            style={{ ...inputStyle, minHeight: 80, resize: 'vertical' }} />
        </div>

        <div style={{ padding: 16, borderTop: '1px solid #e5e7eb', display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
          <button onClick={onClose} disabled={saving} style={{
            padding: '10px 20px', borderRadius: 8, fontSize: 14, fontWeight: 600,
            background: '#fff', color: '#6b7280', border: '1px solid #e5e7eb',
            cursor: 'pointer', fontFamily: 'inherit',
          }}>ביטול</button>
          <button onClick={handleSave} disabled={saving} style={{
            padding: '10px 24px', borderRadius: 8, fontSize: 14, fontWeight: 700,
            background: info.color, color: '#fff', border: 'none',
            cursor: saving ? 'wait' : 'pointer', fontFamily: 'inherit',
            opacity: saving ? 0.6 : 1,
          }}>
            {saving ? '⏳ שומר...' : '✓ שמור'}
          </button>
        </div>
      </div>
    </div>
  );
}

// פונקציית עזר

function fmtCurrencySimple(n) {
  return `₪${Number(n || 0).toLocaleString('he-IL', { minimumFractionDigits: 0, maximumFractionDigits: 0 })}`;
}

/** משימות לפי מחלקה: legacy לפי tasks.dept, או הזמנות עם task_items לפי department של הפריט */
function tasksForDepartment(allTasks, taskItems, targetDept) {
  const list = Array.isArray(allTasks) ? allTasks : [];
  const items = Array.isArray(taskItems) ? taskItems : [];
  if (!targetDept) return list;
  const taskIdsFromItems = new Set(
    items.filter((i) => i.department === targetDept && i.status !== "ארכיון").map((i) => i.task_id),
  );
  return list.filter((t) => {
    if (!t.has_items) return t.dept === targetDept;
    return taskIdsFromItems.has(t.id);
  });
}

  const [clients,setClients]=useState([]);

  const [debtSnapshots,setDebtSnapshots]=useState([]);
  const [quotes,setQuotes]=useState([]);
  const [mob,setMob]=useState(false);
  const [addTask,setAddTask]=useState(false);
  const [binaClientOpen,setBinaClientOpen]=useState(false);
  const [orderModalOpen,setOrderModalOpen]=useState(false);
  const [quoteModalOpen,setQuoteModalOpen]=useState(false);

  const [binaLastCheckAt,setBinaLastCheckAt]=useState(null);
  const [allUsers,setAllUsers]=useState([]);
  const [archivedTasks,setArchivedTasks]=useState([]);
  const [lastRefresh,setLastRefresh]=useState(Date.now());
  const [refreshing,setRefreshing]=useState(false);
  const loadRef=useRef(null);
  const [nt,setNt]=useState({title:"",dept:DEPTS[0],priority:"בינונית",client_name:"",assignee:"",due_date:"",notes:"",status:"ממתין",address:"",phone:""});
  const BCF_DEFAULT=()=>({custName:"",custTz:"",custCity:"",custAddress:"",custGroup:"ישראל",custTel:"",custCel:"",custEmail:"",termsofPayment:"שוטף + 30",notes:""});
  const [bcf,setBcf]=useState(BCF_DEFAULT());
  const [bcfErr,setBcfErr]=useState({});
  const [hashMode,setHashMode]=useState(()=>typeof window!=="undefined"&&window.location?window.location.hash||"":"");
  const [deliveryNoteModal,setDeliveryNoteModal]=useState(null);
  const [editClientDelivery,setEditClientDelivery]=useState(null);

  const [showReportModal,setShowReportModal]=useState(false);
  const [reportRecipients,setReportRecipients]=useState([]);

  const notify=(m,c="#16A34A")=>{setNotif({m,c});setTimeout(()=>setNotif(null),3000);};

  const bcfDigits=s=>String(s||"").replace(/\D/g,"");
  const openBinaClientModal=()=>{setBcf(BCF_DEFAULT());setBcfErr({});setBinaClientOpen(true);};
  useEffect(()=>{
    window.openBinaClient=()=>setBinaClientOpen(true);
    return()=>{delete window.openBinaClient;};
  },[]);
  useEffect(()=>{
    const fn=()=>setHashMode(window.location.hash||"");
    window.addEventListener("hashchange",fn);
    return()=>window.removeEventListener("hashchange",fn);
  },[]);
  useEffect(()=>{
    window.openDeliveryNoteTask=(t)=>setDeliveryNoteModal({task:t});
    return()=>{delete window.openDeliveryNoteTask;};
  },[]);
  const validateBcf=()=>{
    const er={};
    const t=s=>String(s||"").trim();
    if(!t(bcf.custName))er.custName="שדה חובה";
    if(bcfDigits(bcf.custTz).length!==9)er.custTz="נדרשות בדיוק 9 ספרות";
    if(!t(bcf.custCity))er.custCity="שדה חובה";
    if(!t(bcf.custAddress))er.custAddress="שדה חובה";
    if(!t(bcf.custGroup))er.custGroup="שדה חובה";
    const tel=bcfDigits(bcf.custTel);
    if(tel.length<9||tel.length>10)er.custTel="9–10 ספרות";
    const cel=bcfDigits(bcf.custCel);
    if(cel.length<9||cel.length>10)er.custCel="9–10 ספרות";
    const em=t(bcf.custEmail);
    if(!em)er.custEmail="שדה חובה";
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)||!em.includes("@")||!em.split("@")[1]?.includes("."))er.custEmail="מייל לא תקין (חייבים @ ונקודה בדומיין)";
    if(!t(bcf.termsofPayment))er.termsofPayment="שדה חובה";
    return er;
  };
  const submitBinaCustomer=async()=>{
    const er=validateBcf();
    if(Object.keys(er).length){setBcfErr(er);return;}
    setBcfErr({});
    setBinaClientSaving(true);
    const savedName=bcf.custName.trim();
    try{
      const body={
        custName:savedName,
        custTz:bcfDigits(bcf.custTz),
        custCity:bcf.custCity.trim(),
        custAddress:bcf.custAddress.trim(),
        custGroup:bcf.custGroup.trim(),
        custTel:bcfDigits(bcf.custTel),
        custCel:bcfDigits(bcf.custCel),
        custEmail:bcf.custEmail.trim(),
        termsofPayment:bcf.termsofPayment.trim()
      };
      const {data,error:invE}=await supabaseClient.functions.invoke("bina-create-customer",{body});
      if(invE){
        notify(`❌ שגיאה ביצירת הלקוח: ${invE.message||"לא ידוע"}`,"#DC2626");
        setBinaClientSaving(false);return;
      }
      let resRow=data;
      if(typeof data==="string"){try{resRow=JSON.parse(data)}catch{resRow=null}}
      resRow=Array.isArray(resRow)?resRow[0]:resRow;
      if(resRow==null){notify("❌ שגיאה ביצירת הלקוח: תשובה לא צפויה מבינה","#DC2626");setBinaClientSaving(false);return;}
      const rc=resRow.ResCode;
      if(rc===0||rc==="0"){
        const code=resRow.kuponId??resRow.requestId??resRow.KuponId??resRow.custId??resRow.docId??"—";
        const addrLine=`${bcf.custCity.trim()}, ${bcf.custAddress.trim()}`;
        const phoneLine=`${bcfDigits(bcf.custTel)} · ${bcfDigits(bcf.custCel)}`;
        const notesParts=[bcf.notes?.trim(),`ת.ז./ח.פ.: ${bcfDigits(bcf.custTz)}`].filter(Boolean);
        const notesVal=notesParts.length?notesParts.join("\n"):null;
        const binaId=code!=="—"&&code!=null&&String(code).trim()!==""?String(code):null;
        await sb("clients",{method:"POST",body:JSON.stringify({
          name:savedName,
          phone:phoneLine,
          email:bcf.custEmail.trim(),
          address:addrLine,
          payment_terms:bcf.termsofPayment.trim(),
          notes:notesVal,
          bina_customer_id:binaId,
        })});
        setBinaClientOpen(false);
        setBcf(BCF_DEFAULT());
        await refreshAll();
        notify(`✅ הלקוח ${savedName} נוצר בהצלחה!\nקוד לקוח: ${code}`,"#16A34A");
      }else if(rc===-5||rc==="-5"){
        notify("❌ ת.ז./ח.פ. כבר קיים במערכת","#DC2626");
      }else{
        const det=resRow.ResMsg||resRow.ResMsgHe||JSON.stringify(resRow).slice(0,120);
        notify(`❌ שגיאה ביצירת הלקוח: ${det}`,"#DC2626");
      }
    }catch(x){
      notify(`❌ שגיאה ביצירת הלקוח: ${x.message||String(x)}`,"#DC2626");
    }
    setBinaClientSaving(false);
  };

  const setBinaStatusGlobal=(status,lastCheckAt)=>{
    window.BINA_STATUS=status;
    window.BINA_LAST_CHECK_AT=lastCheckAt;
  };

  const checkBinaStatus=async()=>{
    setBinaStatus("checking");
    try{
      const r=await fetch(`${SU}/functions/v1/check-bina-status`,{
        method:"GET",
        headers:{apikey:SA,Authorization:`Bearer ${SA}`}
      });
      const data=await r.json();
      const nextStatus=data?.status==="online"?"online":"offline";
      const checkedAt=Date.now();
      setBinaStatus(nextStatus);
      setBinaLastCheckAt(checkedAt);
      setBinaStatusGlobal(nextStatus,checkedAt);
    }catch(e){
      const checkedAt=Date.now();
      setBinaStatus("offline");
      setBinaLastCheckAt(checkedAt);
      setBinaStatusGlobal("offline",checkedAt);
    }
  };

  const load=async(u)=>{
    const cu=u||user;if(!cu)return;
    setLoading(true);
    try{
      const isA=cu.role==="admin";
      const tp="tasks?archived_at=is.null&order=created_at.desc";
      const [t,c,q,ds,ti]=await Promise.all([sb(tp),sb("clients?select=id,name,bina_customer_id,payment_terms,contact_name,phone,email,address,collection_email_primary,collection_email_secondary,orders_email_primary,orders_email_secondary,delivery_contact_name,delivery_contact_phone,delivery_email,delivery_notes&order=name.asc"),isA?sb("quotes?order=created_at.desc&limit=500"):Promise.resolve([]),isA?sb("debt_snapshots?order=snapshot_date.desc,doc_balance.desc&limit=1000"):Promise.resolve(null),sb("task_items?select=id,task_id,bina_order_id,line_number,bina_item_code,department,description,quantity,price,total,status&order=created_at.desc")]);
      setTasks(t);setClients(c);
      if(isA){
        setQuotes(Array.isArray(q)?q:[]);
        if(Array.isArray(ds)&&ds.length>0){
          const latestDate=ds[0].snapshot_date;
          setDebtSnapshots(ds.filter(x=>x.snapshot_date===latestDate));

      setTaskItems(Array.isArray(ti)?ti:[]);

              }} style={{padding:"4px 8px",borderRadius:7,border:"1px solid var(--blue-mid)",background:"var(--blue-light)",color:"var(--blue)",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}>🔔 תזכורת</button>}
            </div>
          </div>})}
          {visTasks.length===0&&!loading&&<div style={{textAlign:"center",padding:"60px 20px",color:"var(--text3)"}}>
            <div style={{fontSize:36,marginBottom:10}}>📋</div>

    {/* MODALS */}

            </select></div>
            <div><label style={LS}>איש קשר</label>
              <select style={IS} value={nt.contact||""} onChange={e=>{

                setNt(p=>({...p,contact:e.target.value,phone:selected?.phone||p.phone}));

            <div><label style={LS}>כתובת יעד</label><input style={IS} value={nt.address} onChange={e=>setNt(p=>({...p,address:e.target.value}))} placeholder="רחוב, עיר"/></div>

        </div>}

        </div>
        <div><label style={LS}>מייל *</label><input style={IS} type="email" value={bcf.custEmail} onChange={e=>{setBcf(p=>({...p,custEmail:e.target.value}));if(bcfErr.custEmail)setBcfErr(er=>({...er,custEmail:null}));}} placeholder="name@example.com"/>
        {bcfErr.custEmail&&<div style={{color:"#DC2626",fontSize:11,marginTop:4,fontWeight:600}}>{bcfErr.custEmail}</div>}</div>
        <div><label style={LS}>תנאי תשלום *</label><select style={IS} value={bcf.termsofPayment} onChange={e=>{setBcf(p=>({...p,termsofPayment:e.target.value}));if(bcfErr.termsofPayment)setBcfErr(er=>({...er,termsofPayment:null}));}}>

        </select>
        {bcfErr.termsofPayment&&<div style={{color:"#DC2626",fontSize:11,marginTop:4,fontWeight:600}}>{bcfErr.termsofPayment}</div>}</div>
        <div><label style={LS}>הערות (אופציונלי — רק PrintOS)</label><textarea style={{...IS,minHeight:72,resize:"vertical"}} value={bcf.notes} onChange={e=>setBcf(p=>({...p,notes:e.target.value}))} placeholder="לא נשלח לבינה"/></div>

          <button type="button" disabled={binaClientSaving} onClick={submitBinaCustomer} style={{flex:1,minWidth:140,padding:"11px",borderRadius:10,border:"none",background:binaClientSaving?"var(--bg3)":"var(--green)",color:"#fff",fontWeight:700,fontSize:14,cursor:binaClientSaving?"wait":"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>

        </div>
      </div>

              <input type="checkbox" checked={isSel} onChange={()=>setReportRecipients(p=>isSel?p.filter(d=>d!==dept):[...p,dept])} style={{accentColor:"var(--blue)",flexShrink:0}}/>
              <div style={{flex:1}}>
                <div style={{fontWeight:600,fontSize:13,color:"var(--text)"}}>{dept}</div>
                <div style={{fontSize:11,color:"var(--text3)"}}>→ {info.name} • {deptCount} משימות פתוחות</div>
              </div>
              <span style={{background:deptCount>0?"var(--blue-light)":"var(--bg2)",color:deptCount>0?"var(--blue)":"var(--text3)",borderRadius:20,padding:"2px 8px",fontSize:11,fontWeight:600}}>{deptCount}</span>

          </button>

    {!showChat&&<button onClick={()=>setShowChat(true)} style={{position:"fixed",bottom:28,left:28,width:52,height:52,borderRadius:"50%",background:"linear-gradient(135deg,#2563EB,#7C3AED)",border:"none",color:"#fff",fontSize:22,cursor:"pointer",boxShadow:"0 4px 20px rgba(37,99,235,0.4)",zIndex:400,display:"flex",alignItems:"center",justifyContent:"center"}}>🤖</button>}

  }
